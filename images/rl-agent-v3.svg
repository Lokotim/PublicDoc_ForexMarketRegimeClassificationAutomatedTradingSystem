<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="850" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowCyan">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00D4FF" flood-opacity="0.3"/>
    </filter>
    <filter id="glowGreen">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4ADE80" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#00D4FF" opacity="0.7"/>
    </marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#FFD54F" opacity="0.7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#4ADE80" opacity="0.7"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#E879F9" opacity="0.7"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#F87171" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="450" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#E2E8F0">Reinforcement Learning Agent -- Q-Learning with Experience Replay</text>
  <text x="425" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">alpha=0.1 | gamma=0.95 | epsilon=0.15 | 6,832 experiences</text>

  <!-- RL Loop: 6 nodes in a circle around center -->

  <!-- Node 1: State Observation (top) -->
  <rect x="340" y="70" width="170" height="50" rx="8" fill="#1E293B" stroke="#00D4FF" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#00D4FF">State Observation</text>
  <text x="425" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">(pair, regime, conf_bucket)</text>

  <!-- Node 2: Action Selection (top-right) -->
  <rect x="590" y="140" width="170" height="60" rx="8" fill="#1E293B" stroke="#FFD54F" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="162" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#FFD54F">Action Selection</text>
  <text x="675" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">epsilon-greedy</text>
  <text x="675" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#4ADE80">85% exploit / 15% explore</text>

  <!-- Node 3: Environment (right) -->
  <rect x="610" y="260" width="150" height="50" rx="8" fill="#1E293B" stroke="#4ADE80" stroke-width="2" filter="url(#shadow)"/>
  <text x="685" y="282" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#4ADE80">Market</text>
  <text x="685" y="298" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">8 FX pairs, live PnL</text>

  <!-- Node 4: Reward (bottom) -->
  <rect x="350" y="340" width="150" height="50" rx="8" fill="#1E293B" stroke="#F87171" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="362" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#F87171">Reward Signal</text>
  <text x="425" y="378" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">hard=1.0 | soft=0.6 (PBRS)</text>

  <!-- Node 5: Experience Replay (bottom-left) -->
  <rect x="80" y="280" width="180" height="60" rx="8" fill="#1E293B" stroke="#E879F9" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="302" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#E879F9">Experience Replay</text>
  <text x="170" y="318" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">buffer: 6,832 experiences</text>
  <text x="170" y="332" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">5 iter x 32 batch = 160/cycle</text>

  <!-- Node 6: Q-Table Update (left) -->
  <rect x="80" y="140" width="170" height="60" rx="8" fill="#1E293B" stroke="#00D4FF" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="162" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#00D4FF">Q-Table Update</text>
  <text x="165" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Q(s,a) += alpha * TD</text>
  <text x="165" y="192" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">prioritized by TD-error</text>

  <!-- Connecting arrows (clockwise) -->
  <!-- State -> Action -->
  <line x1="510" y1="100" x2="588" y2="148" stroke="#00D4FF" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowGold)" opacity="0.7"/>

  <!-- Action -> Environment -->
  <line x1="690" y1="200" x2="690" y2="258" stroke="#FFD54F" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowGreen)" opacity="0.7"/>

  <!-- Environment -> Reward -->
  <line x1="610" y1="295" x2="502" y2="348" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowRed)" opacity="0.7"/>

  <!-- Reward -> Experience Replay -->
  <line x1="350" y1="365" x2="262" y2="330" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowPurple)" opacity="0.7"/>

  <!-- Experience Replay -> Q-Table -->
  <line x1="170" y1="280" x2="170" y2="202" stroke="#E879F9" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowCyan)" opacity="0.7"/>

  <!-- Q-Table -> State -->
  <line x1="250" y1="158" x2="338" y2="100" stroke="#00D4FF" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowCyan)" opacity="0.7"/>

  <!-- Center: Q-Table Visualization -->
  <rect x="320" y="175" width="210" height="140" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="425" y="195" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#E2E8F0">Q-Value Table</text>

  <!-- Mini Q-table grid -->
  <!-- Headers -->
  <text x="370" y="215" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">TF_L</text>
  <text x="400" y="215" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">TF_S</text>
  <text x="430" y="215" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">MR_L</text>
  <text x="460" y="215" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">MR_S</text>

  <!-- Row labels -->
  <text x="340" y="233" text-anchor="end" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">UJ,TF,H</text>
  <text x="340" y="249" text-anchor="end" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">EJ,TF,M</text>
  <text x="340" y="265" text-anchor="end" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">AU,TF,H</text>
  <text x="340" y="281" text-anchor="end" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">EU,MR,M</text>
  <text x="340" y="297" text-anchor="end" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">GU,MR,L</text>

  <!-- Q-value cells (colored by magnitude) -->
  <!-- Row 1 -->
  <rect x="352" y="222" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.15"/>
  <text x="365" y="233" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#4ADE80">.08</text>
  <rect x="382" y="222" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.45"/>
  <text x="395" y="233" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#4ADE80">.16</text>
  <rect x="412" y="222" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="425" y="233" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.02</text>
  <rect x="442" y="222" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="455" y="233" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.01</text>

  <!-- Row 2 -->
  <rect x="352" y="238" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.35"/>
  <text x="365" y="249" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#4ADE80">.11</text>
  <rect x="382" y="238" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.1"/>
  <text x="395" y="249" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.04</text>
  <rect x="412" y="238" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.15"/>
  <text x="425" y="249" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.06</text>
  <rect x="442" y="238" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="455" y="249" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.02</text>

  <!-- Row 3 -->
  <rect x="352" y="254" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.40"/>
  <text x="365" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#4ADE80">.13</text>
  <rect x="382" y="254" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="395" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.03</text>
  <rect x="412" y="254" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.2"/>
  <text x="425" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.07</text>
  <rect x="442" y="254" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="455" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.01</text>

  <!-- Row 4 -->
  <rect x="352" y="270" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="365" y="281" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.02</text>
  <rect x="382" y="270" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.15"/>
  <text x="395" y="281" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.05</text>
  <rect x="412" y="270" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="425" y="281" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.03</text>
  <rect x="442" y="270" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.25"/>
  <text x="455" y="281" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#4ADE80">.09</text>

  <!-- Row 5 -->
  <rect x="352" y="286" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="365" y="297" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.01</text>
  <rect x="382" y="286" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="395" y="297" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.02</text>
  <rect x="412" y="286" width="26" height="14" rx="2" fill="#4ADE80" opacity="0.2"/>
  <text x="425" y="297" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#4ADE80">.07</text>
  <rect x="442" y="286" width="26" height="14" rx="2" fill="#F87171" opacity="0.1"/>
  <text x="455" y="297" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#94A3B8">.03</text>

  <!-- Progressive Trust indicator (bottom) -->
  <rect x="230" y="405" width="390" height="35" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="245" y="425" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0">Progressive Trust:</text>
  <!-- Trust bar -->
  <rect x="370" y="413" width="200" height="12" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="372" y="415" width="12" height="8" rx="4" fill="#FFD54F" opacity="0.8"/>
  <!-- Markers -->
  <line x1="402" y1="411" x2="402" y2="429" stroke="#64748B" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="402" y="438" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#64748B">50</text>
  <line x1="472" y1="411" x2="472" y2="429" stroke="#64748B" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="472" y="438" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#64748B">100</text>
  <line x1="542" y1="411" x2="542" y2="429" stroke="#64748B" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="542" y="438" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#64748B">150</text>
  <line x1="570" y1="411" x2="570" y2="429" stroke="#4ADE80" stroke-width="1"/>
  <text x="570" y="438" text-anchor="middle" font-family="Consolas, monospace" font-size="7" fill="#4ADE80">200</text>
  <text x="590" y="425" font-family="Consolas, monospace" font-size="9" fill="#FFD54F">3.6%</text>
  <text x="615" y="425" font-family="Consolas, monospace" font-size="8" fill="#94A3B8">eff. weight</text>
</svg>