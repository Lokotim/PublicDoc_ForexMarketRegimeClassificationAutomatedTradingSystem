<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="sl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <filter id="sl-s">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="610" fill="url(#sl-bg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">8 Fire Extinguishers — Defense in Depth</text>
  <text x="400" y="48" text-anchor="middle" fill="#64748b" font-size="11">Each layer works independently — like multiple safety nets under a tightrope walker</text>

  <!-- Shield 1 -->
  <rect x="20" y="68" width="240" height="150" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#sl-s)"/>
  <text x="140" y="95" text-anchor="middle" fill="#ef4444" font-size="30">&#9889;</text>
  <text x="140" y="118" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">Black Swan Filter</text>
  <line x1="40" y1="126" x2="240" y2="126" stroke="#1e293b" stroke-width="1"/>
  <text x="140" y="144" text-anchor="middle" fill="#cbd5e1" font-size="10">Watches options market for</text>
  <text x="140" y="158" text-anchor="middle" fill="#cbd5e1" font-size="10">panic signals (implied volatility)</text>
  <text x="140" y="178" text-anchor="middle" fill="#94a3b8" font-size="9">Like checking fire insurance prices</text>
  <text x="140" y="192" text-anchor="middle" fill="#94a3b8" font-size="9">— if they triple, something's wrong</text>
  <rect x="85" y="200" width="110" height="10" rx="5" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="0.5"/>
  <text x="140" y="209" text-anchor="middle" fill="#ef4444" font-size="7" font-weight="600">REDUCES OR HALTS</text>

  <!-- Shield 2 -->
  <rect x="280" y="68" width="240" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#sl-s)"/>
  <text x="400" y="95" text-anchor="middle" fill="#f59e0b" font-size="30">&#128167;</text>
  <text x="400" y="118" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">P&amp;L Circuit Breaker</text>
  <line x1="300" y1="126" x2="500" y2="126" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="144" text-anchor="middle" fill="#cbd5e1" font-size="10">Monitors real-time profits</text>
  <text x="400" y="158" text-anchor="middle" fill="#cbd5e1" font-size="10">and losses across all accounts</text>
  <text x="400" y="178" text-anchor="middle" fill="#94a3b8" font-size="9">Like a fuse in your electrical panel</text>
  <text x="400" y="192" text-anchor="middle" fill="#94a3b8" font-size="9">— blows before damage occurs</text>
  <rect x="345" y="200" width="110" height="10" rx="5" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="400" y="209" text-anchor="middle" fill="#f59e0b" font-size="7" font-weight="600">100% / 50% / 0%</text>

  <!-- Shield 3 -->
  <rect x="540" y="68" width="240" height="150" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sl-s)"/>
  <text x="660" y="95" text-anchor="middle" fill="#8b5cf6" font-size="30">&#128694;</text>
  <text x="660" y="118" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="700">Crowding Penalty</text>
  <line x1="560" y1="126" x2="760" y2="126" stroke="#1e293b" stroke-width="1"/>
  <text x="660" y="144" text-anchor="middle" fill="#cbd5e1" font-size="10">Detects when too many</text>
  <text x="660" y="158" text-anchor="middle" fill="#cbd5e1" font-size="10">robots bet the same way</text>
  <text x="660" y="178" text-anchor="middle" fill="#94a3b8" font-size="9">Like a traffic cop preventing</text>
  <text x="660" y="192" text-anchor="middle" fill="#94a3b8" font-size="9">all lanes from merging into one</text>
  <rect x="605" y="200" width="110" height="10" rx="5" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="660" y="209" text-anchor="middle" fill="#8b5cf6" font-size="7" font-weight="600">SPREADS RISK</text>

  <!-- Shield 4 -->
  <rect x="20" y="238" width="240" height="150" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" filter="url(#sl-s)"/>
  <text x="140" y="265" text-anchor="middle" fill="#06b6d4" font-size="30">&#128269;</text>
  <text x="140" y="288" text-anchor="middle" fill="#06b6d4" font-size="13" font-weight="700">Broker Cross-Validator</text>
  <line x1="40" y1="296" x2="240" y2="296" stroke="#1e293b" stroke-width="1"/>
  <text x="140" y="314" text-anchor="middle" fill="#cbd5e1" font-size="10">Checks: does the broker</text>
  <text x="140" y="328" text-anchor="middle" fill="#cbd5e1" font-size="10">see what the system sees?</text>
  <text x="140" y="348" text-anchor="middle" fill="#94a3b8" font-size="9">Like double-checking your bank</text>
  <text x="140" y="362" text-anchor="middle" fill="#94a3b8" font-size="9">statement against your records</text>
  <rect x="85" y="370" width="110" height="10" rx="5" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="0.5"/>
  <text x="140" y="379" text-anchor="middle" fill="#06b6d4" font-size="7" font-weight="600">BLOCKS IF MISMATCH</text>

  <!-- Shield 5 -->
  <rect x="280" y="238" width="240" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" filter="url(#sl-s)"/>
  <text x="400" y="265" text-anchor="middle" fill="#22c55e" font-size="30">&#128202;</text>
  <text x="400" y="288" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">Strategy Health (CSI)</text>
  <line x1="300" y1="296" x2="500" y2="296" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="314" text-anchor="middle" fill="#cbd5e1" font-size="10">Scores each robot 0-100</text>
  <text x="400" y="328" text-anchor="middle" fill="#cbd5e1" font-size="10">on profitability, risk, confidence</text>
  <text x="400" y="348" text-anchor="middle" fill="#94a3b8" font-size="9">Like a performance review</text>
  <text x="400" y="362" text-anchor="middle" fill="#94a3b8" font-size="9">— underperformers get smaller budgets</text>
  <rect x="345" y="370" width="110" height="10" rx="5" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="0.5"/>
  <text x="400" y="379" text-anchor="middle" fill="#22c55e" font-size="7" font-weight="600">6-TIER GRADUATED</text>

  <!-- Shield 6 -->
  <rect x="540" y="238" width="240" height="150" rx="10" fill="#1e293b" stroke="#ff6b35" stroke-width="1.5" filter="url(#sl-s)"/>
  <text x="660" y="265" text-anchor="middle" fill="#ff6b35" font-size="30">&#128678;</text>
  <text x="660" y="288" text-anchor="middle" fill="#ff6b35" font-size="13" font-weight="700">Data Integrity Guard</text>
  <line x1="560" y1="296" x2="760" y2="296" stroke="#1e293b" stroke-width="1"/>
  <text x="660" y="314" text-anchor="middle" fill="#cbd5e1" font-size="10">Quarantines suspicious</text>
  <text x="660" y="328" text-anchor="middle" fill="#cbd5e1" font-size="10">data before it reaches models</text>
  <text x="660" y="348" text-anchor="middle" fill="#94a3b8" font-size="9">Like food safety inspection</text>
  <text x="660" y="362" text-anchor="middle" fill="#94a3b8" font-size="9">— bad ingredients don't make it in</text>
  <rect x="605" y="370" width="110" height="10" rx="5" fill="rgba(255,107,53,0.2)" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="660" y="379" text-anchor="middle" fill="#ff6b35" font-size="7" font-weight="600">REJECTS BAD DATA</text>

  <!-- Shield 7 -->
  <rect x="20" y="408" width="370" height="150" rx="10" fill="#1e293b" stroke="#e879f9" stroke-width="1.5" filter="url(#sl-s)"/>
  <text x="205" y="435" text-anchor="middle" fill="#e879f9" font-size="30">&#127754;</text>
  <text x="205" y="458" text-anchor="middle" fill="#e879f9" font-size="13" font-weight="700">Cross-Asset Vol Kill Switch</text>
  <line x1="40" y1="466" x2="370" y2="466" stroke="#1e293b" stroke-width="1"/>
  <text x="205" y="484" text-anchor="middle" fill="#cbd5e1" font-size="10">Monitors VIX, oil vol, rates vol, FX vol</text>
  <text x="205" y="498" text-anchor="middle" fill="#cbd5e1" font-size="10">across all asset classes simultaneously</text>
  <text x="205" y="518" text-anchor="middle" fill="#94a3b8" font-size="9">Like a tsunami warning system &#8212; one sensor</text>
  <text x="205" y="532" text-anchor="middle" fill="#94a3b8" font-size="9">anywhere triggers evacuation everywhere</text>
  <rect x="150" y="540" width="110" height="10" rx="5" fill="rgba(232,121,249,0.2)" stroke="#e879f9" stroke-width="0.5"/>
  <text x="205" y="549" text-anchor="middle" fill="#e879f9" font-size="7" font-weight="600">z&gt;2&#963; = 50% | z&gt;4&#963; = HALT</text>

  <!-- Shield 8 -->
  <rect x="410" y="408" width="370" height="150" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#sl-s)"/>
  <text x="595" y="435" text-anchor="middle" fill="#fbbf24" font-size="30">&#127758;</text>
  <text x="595" y="458" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">Macro Regime Overlay</text>
  <line x1="430" y1="466" x2="760" y2="466" stroke="#1e293b" stroke-width="1"/>
  <text x="595" y="484" text-anchor="middle" fill="#cbd5e1" font-size="10">Classifies the business cycle:</text>
  <text x="595" y="498" text-anchor="middle" fill="#cbd5e1" font-size="10">Expansion, Recession, Recovery</text>
  <text x="595" y="518" text-anchor="middle" fill="#94a3b8" font-size="9">Like seasonal staffing &#8212; hire more in</text>
  <text x="595" y="532" text-anchor="middle" fill="#94a3b8" font-size="9">summer, cut back in winter slowdowns</text>
  <rect x="540" y="540" width="110" height="10" rx="5" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="595" y="549" text-anchor="middle" fill="#fbbf24" font-size="7" font-weight="600">60% &#8212; 110% SIZING</text>

  <!-- Bottom bar -->
  <rect x="60" y="572" width="680" height="28" rx="8" fill="#3D0F0F" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="591" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">ANY SINGLE LAYER CAN REDUCE OR HALT ALL TRADING INDEPENDENTLY</text>
</svg>
