<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="moeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <filter id="moeShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="moeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00D4FF" flood-opacity="0.3"/>
    </filter>
    <marker id="moeArrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M 0 0 L 7 2.5 L 0 5 Z" fill="#475569"/>
    </marker>
    <marker id="moeArrowCyan" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M 0 0 L 7 2.5 L 0 5 Z" fill="#00D4FF"/>
    </marker>
    <pattern id="moeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.3" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#moeBg)" rx="12"/>
  <rect width="800" height="500" fill="url(#moeGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#00D4FF" letter-spacing="2">5-MODEL MIXTURE OF EXPERTS (MoE)</text>
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Gated specialist ensemble with meta-classifier arbitration</text>

  <!-- ===== INPUT LAYER ===== -->
  <g filter="url(#moeShadow)">
    <rect x="260" y="58" width="280" height="44" rx="8" fill="#16213E" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1"/>
    <text x="400" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0" font-weight="700">134 Features / Pair</text>
    <text x="400" y="93" text-anchor="middle" font-family="monospace" font-size="7" fill="#00D4FF" opacity="0.7">technical + sentiment + macro + volatility + prediction + news</text>
  </g>

  <!-- Arrows from input to 5 models -->
  <g stroke="#475569" stroke-width="1" fill="none" marker-end="url(#moeArrow)" opacity="0.4">
    <line x1="320" y1="102" x2="110" y2="145"/>
    <line x1="360" y1="102" x2="280" y2="145"/>
    <line x1="400" y1="102" x2="400" y2="145"/>
    <line x1="440" y1="102" x2="520" y2="145"/>
    <line x1="480" y1="102" x2="690" y2="145"/>
  </g>

  <!-- ===== 5 MODEL BOXES ===== -->
  <!-- Model 1: XGBoost -->
  <g filter="url(#moeShadow)">
    <rect x="40" y="148" width="130" height="90" rx="8" fill="#16213E" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="40" y="148" width="130" height="24" rx="8" fill="#4ADE80" fill-opacity="0.1"/>
    <rect x="40" y="164" width="130" height="2" fill="#4ADE80" fill-opacity="0.2"/>
    <text x="105" y="165" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#4ADE80" font-weight="700">XGBoost</text>
    <text x="105" y="190" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">Gradient boosted</text>
    <text x="105" y="204" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">decision trees</text>
    <text x="105" y="222" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80" opacity="0.7">depth=6, 300 trees</text>
  </g>

  <!-- Model 2: LightGBM -->
  <g filter="url(#moeShadow)">
    <rect x="195" y="148" width="130" height="90" rx="8" fill="#16213E" stroke="#00D4FF" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="195" y="148" width="130" height="24" rx="8" fill="#00D4FF" fill-opacity="0.1"/>
    <rect x="195" y="164" width="130" height="2" fill="#00D4FF" fill-opacity="0.2"/>
    <text x="260" y="165" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#00D4FF" font-weight="700">LightGBM</text>
    <text x="260" y="190" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">Leaf-wise growth</text>
    <text x="260" y="204" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">gradient boosting</text>
    <text x="260" y="222" text-anchor="middle" font-family="monospace" font-size="7" fill="#00D4FF" opacity="0.7">leaves=31, lr=0.05</text>
  </g>

  <!-- Model 3: Ridge -->
  <g filter="url(#moeShadow)">
    <rect x="350" y="148" width="100" height="90" rx="8" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="350" y="148" width="100" height="24" rx="8" fill="#7B68EE" fill-opacity="0.1"/>
    <rect x="350" y="164" width="100" height="2" fill="#7B68EE" fill-opacity="0.2"/>
    <text x="400" y="165" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#7B68EE" font-weight="700">Ridge</text>
    <text x="400" y="190" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">L2 regularized</text>
    <text x="400" y="204" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">linear model</text>
    <text x="400" y="222" text-anchor="middle" font-family="monospace" font-size="7" fill="#7B68EE" opacity="0.7">alpha=1.0</text>
  </g>

  <!-- Model 4: SVM -->
  <g filter="url(#moeShadow)">
    <rect x="475" y="148" width="130" height="90" rx="8" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="475" y="148" width="130" height="24" rx="8" fill="#FF6B35" fill-opacity="0.1"/>
    <rect x="475" y="164" width="130" height="2" fill="#FF6B35" fill-opacity="0.2"/>
    <text x="540" y="165" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#FF6B35" font-weight="700">SVM</text>
    <text x="540" y="190" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">Support vector</text>
    <text x="540" y="204" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">classification</text>
    <text x="540" y="222" text-anchor="middle" font-family="monospace" font-size="7" fill="#FF6B35" opacity="0.7">RBF kernel</text>
  </g>

  <!-- Model 5: Random Forest -->
  <g filter="url(#moeShadow)">
    <rect x="630" y="148" width="130" height="90" rx="8" fill="#16213E" stroke="#F87171" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="630" y="148" width="130" height="24" rx="8" fill="#F87171" fill-opacity="0.1"/>
    <rect x="630" y="164" width="130" height="2" fill="#F87171" fill-opacity="0.2"/>
    <text x="695" y="165" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#F87171" font-weight="700">Random Forest</text>
    <text x="695" y="190" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">Bagged ensemble</text>
    <text x="695" y="204" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">decision trees</text>
    <text x="695" y="222" text-anchor="middle" font-family="monospace" font-size="7" fill="#F87171" opacity="0.7">500 estimators</text>
  </g>

  <!-- Score outputs from each model -->
  <g font-family="monospace" font-size="7" fill="#94A3B8" text-anchor="middle">
    <text x="105" y="252">score_1</text>
    <text x="260" y="252">score_2</text>
    <text x="400" y="252">score_3</text>
    <text x="540" y="252">score_4</text>
    <text x="695" y="252">score_5</text>
  </g>

  <!-- Arrows from models to specialist output -->
  <g stroke="#475569" stroke-width="1" fill="none" marker-end="url(#moeArrow)" opacity="0.4">
    <line x1="105" y1="256" x2="105" y2="278"/>
    <line x1="260" y1="256" x2="260" y2="278"/>
    <line x1="400" y1="256" x2="400" y2="278"/>
    <line x1="540" y1="256" x2="540" y2="278"/>
    <line x1="695" y1="256" x2="695" y2="278"/>
  </g>

  <!-- ===== 4 SPECIALIST OUTPUTS ===== -->
  <g filter="url(#moeShadow)">
    <rect x="40" y="282" width="160" height="44" rx="7" fill="#0F3D1F" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="120" y="300" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4ADE80" font-weight="700">L_TF (Long TF)</text>
    <text x="120" y="316" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0" opacity="0.8">trend-following long</text>
  </g>
  <g filter="url(#moeShadow)">
    <rect x="220" y="282" width="160" height="44" rx="7" fill="#3D0F0F" stroke="#F87171" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="300" y="300" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F87171" font-weight="700">S_TF (Short TF)</text>
    <text x="300" y="316" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0" opacity="0.8">trend-following short</text>
  </g>
  <g filter="url(#moeShadow)">
    <rect x="420" y="282" width="160" height="44" rx="7" fill="#0F1F3D" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="500" y="300" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00D4FF" font-weight="700">L_MR (Long MR)</text>
    <text x="500" y="316" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0" opacity="0.8">mean-reversion long</text>
  </g>
  <g filter="url(#moeShadow)">
    <rect x="600" y="282" width="160" height="44" rx="7" fill="#3D2A0F" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="680" y="300" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FF6B35" font-weight="700">S_MR (Short MR)</text>
    <text x="680" y="316" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0" opacity="0.8">mean-reversion short</text>
  </g>

  <!-- Arrows from specialists to gating network -->
  <g stroke="#475569" stroke-width="1" fill="none" marker-end="url(#moeArrow)" opacity="0.4">
    <line x1="120" y1="326" x2="300" y2="370"/>
    <line x1="300" y1="326" x2="360" y2="370"/>
    <line x1="500" y1="326" x2="440" y2="370"/>
    <line x1="680" y1="326" x2="500" y2="370"/>
  </g>

  <!-- Meta-features arrow -->
  <g stroke="#7B68EE" stroke-width="1" fill="none" marker-end="url(#moeArrowCyan)" opacity="0.4" stroke-dasharray="4,3">
    <path d="M 750 100 Q 770 250 560 378"/>
  </g>
  <text x="758" y="205" font-family="monospace" font-size="7" fill="#7B68EE" opacity="0.6" transform="rotate(80 758 205)">meta-features</text>

  <!-- ===== GATING NETWORK (META-CLASSIFIER) ===== -->
  <g filter="url(#moeGlow)">
    <rect x="200" y="372" width="400" height="56" rx="10" fill="#0A1628" stroke="#7B68EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="400" y="394" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#7B68EE" font-weight="800">Gating Network (Meta-Classifier)</text>
    <text x="400" y="412" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0" opacity="0.8">4 specialist scores + confidence features + regime state</text>
    <text x="400" y="424" text-anchor="middle" font-family="monospace" font-size="7" fill="#7B68EE" opacity="0.6">softmax weighting of specialist outputs</text>
  </g>

  <!-- Arrow to output -->
  <line x1="400" y1="428" x2="400" y2="455" stroke="#00D4FF" stroke-width="1.5" fill="none" marker-end="url(#moeArrowCyan)" opacity="0.6"/>

  <!-- ===== OUTPUT ===== -->
  <g filter="url(#moeGlow)">
    <rect x="220" y="458" width="360" height="32" rx="16" fill="#0A1628" stroke="#00D4FF" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="400" y="479" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00D4FF" font-weight="700">Regime + Direction + Confidence</text>
  </g>

  <!-- Border -->
</svg>