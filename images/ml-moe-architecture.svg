<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="950" height="500">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>
    <linearGradient id="featureGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2a36"/>
      <stop offset="50%" stop-color="#1e3345"/>
      <stop offset="100%" stop-color="#1a2a36"/>
    </linearGradient>
    <marker id="arrowDown" viewBox="0 0 10 7" refX="5" refY="7" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#607D8B" opacity="0.6"/>
    </marker>
    <marker id="arrowDownGold" viewBox="0 0 10 7" refX="5" refY="7" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#FFC107" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g opacity="0.03" stroke="#ffffff">
    <line x1="0" y1="100" x2="950" y2="100"/>
    <line x1="0" y1="200" x2="950" y2="200"/>
    <line x1="0" y1="300" x2="950" y2="300"/>
    <line x1="0" y1="400" x2="950" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="475" y1="0" x2="475" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
  </g>

  <!-- Title -->
  <text x="475" y="32" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.5">THE ENSEMBLE</text>
  <text x="475" y="50" text-anchor="middle" fill="#607D8B" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.5">5-MODEL MIXTURE OF EXPERTS</text>

  <!-- ==================== INPUT LAYER: 3 Database Cylinders ==================== -->
  <text x="475" y="80" text-anchor="middle" fill="#455A64" font-family="Segoe UI, Arial, sans-serif" font-size="8" letter-spacing="2" font-weight="600">INPUT LAYER</text>

  <!-- Sentiment DB (Cyan) -->
  <g filter="url(#shadow)">
    <ellipse cx="200" cy="100" rx="55" ry="12" fill="#00838f" opacity="0.3"/>
    <rect x="145" y="100" width="110" height="40" fill="#0f1923" stroke="#00BCD4" stroke-width="1.2"/>
    <ellipse cx="200" cy="140" rx="55" ry="12" fill="#0f1923" stroke="#00BCD4" stroke-width="1.2"/>
    <ellipse cx="200" cy="100" rx="55" ry="12" fill="#0f1923" stroke="#00BCD4" stroke-width="1.2"/>
    <text x="200" y="125" text-anchor="middle" fill="#00BCD4" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">Sentiment DB</text>
  </g>

  <!-- Regime DB (Green) -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="100" rx="55" ry="12" fill="#2E7D32" opacity="0.3"/>
    <rect x="420" y="100" width="110" height="40" fill="#0f1923" stroke="#4CAF50" stroke-width="1.2"/>
    <ellipse cx="475" cy="140" rx="55" ry="12" fill="#0f1923" stroke="#4CAF50" stroke-width="1.2"/>
    <ellipse cx="475" cy="100" rx="55" ry="12" fill="#0f1923" stroke="#4CAF50" stroke-width="1.2"/>
    <text x="475" y="125" text-anchor="middle" fill="#4CAF50" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">Regime DB</text>
  </g>

  <!-- Risk DB (Orange) -->
  <g filter="url(#shadow)">
    <ellipse cx="750" cy="100" rx="55" ry="12" fill="#E65100" opacity="0.3"/>
    <rect x="695" y="100" width="110" height="40" fill="#0f1923" stroke="#FF9800" stroke-width="1.2"/>
    <ellipse cx="750" cy="140" rx="55" ry="12" fill="#0f1923" stroke="#FF9800" stroke-width="1.2"/>
    <ellipse cx="750" cy="100" rx="55" ry="12" fill="#0f1923" stroke="#FF9800" stroke-width="1.2"/>
    <text x="750" y="125" text-anchor="middle" fill="#FF9800" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">Risk DB</text>
  </g>

  <!-- Arrows from DBs to Feature Engineering -->
  <line x1="200" y1="152" x2="200" y2="185" stroke="#00BCD4" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="185" x2="370" y2="195" stroke="#00BCD4" stroke-width="1" opacity="0.3"/>
  <line x1="475" y1="152" x2="475" y2="195" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
  <line x1="750" y1="152" x2="750" y2="185" stroke="#FF9800" stroke-width="1" opacity="0.4"/>
  <line x1="750" y1="185" x2="580" y2="195" stroke="#FF9800" stroke-width="1" opacity="0.3"/>

  <!-- ==================== FEATURE ENGINEERING BOX ==================== -->
  <g filter="url(#shadow)">
    <rect x="260" y="190" width="430" height="45" rx="6" fill="url(#featureGrad)" stroke="#37474F" stroke-width="1.5"/>
    <text x="475" y="210" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">FEATURE ENGINEERING</text>
    <text x="475" y="226" text-anchor="middle" fill="#78909C" font-family="Segoe UI, Arial, sans-serif" font-size="8.5">134 features per pair x 8 pairs = 1,072 features</text>
  </g>

  <!-- Arrows from Feature Engineering to Specialists -->
  <line x1="350" y1="235" x2="175" y2="285" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
  <line x1="420" y1="235" x2="375" y2="285" stroke="#F44336" stroke-width="1" opacity="0.4"/>
  <line x1="530" y1="235" x2="575" y2="285" stroke="#2196F3" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="235" x2="775" y2="285" stroke="#9C27B0" stroke-width="1" opacity="0.4"/>

  <!-- ==================== 4 SPECIALIST BOXES ==================== -->
  <!-- L_TF (Green) - Long Trend-Following -->
  <g filter="url(#shadow)">
    <rect x="100" y="285" width="155" height="65" rx="6" fill="#0f1923" stroke="#4CAF50" stroke-width="1.5"/>
    <rect x="100" y="285" width="155" height="4" rx="2" fill="#4CAF50"/>
    <text x="177" y="310" text-anchor="middle" fill="#4CAF50" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">L_TF</text>
    <text x="177" y="326" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="8">Long Trend-Following</text>
    <text x="177" y="341" text-anchor="middle" fill="#4CAF50" font-family="Segoe UI, Arial, sans-serif" font-size="7" opacity="0.7">Momentum + Breakout</text>
  </g>

  <!-- S_TF (Red) - Short Trend-Following -->
  <g filter="url(#shadow)">
    <rect x="295" y="285" width="155" height="65" rx="6" fill="#0f1923" stroke="#F44336" stroke-width="1.5"/>
    <rect x="295" y="285" width="155" height="4" rx="2" fill="#F44336"/>
    <text x="372" y="310" text-anchor="middle" fill="#F44336" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">S_TF</text>
    <text x="372" y="326" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="8">Short Trend-Following</text>
    <text x="372" y="341" text-anchor="middle" fill="#F44336" font-family="Segoe UI, Arial, sans-serif" font-size="7" opacity="0.7">Bearish Trend + Fade</text>
  </g>

  <!-- L_MR (Blue) - Long Mean-Reversion -->
  <g filter="url(#shadow)">
    <rect x="490" y="285" width="155" height="65" rx="6" fill="#0f1923" stroke="#2196F3" stroke-width="1.5"/>
    <rect x="490" y="285" width="155" height="4" rx="2" fill="#2196F3"/>
    <text x="567" y="310" text-anchor="middle" fill="#2196F3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">L_MR</text>
    <text x="567" y="326" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="8">Long Mean-Reversion</text>
    <text x="567" y="341" text-anchor="middle" fill="#2196F3" font-family="Segoe UI, Arial, sans-serif" font-size="7" opacity="0.7">StatArb + Value</text>
  </g>

  <!-- S_MR (Purple) - Short Mean-Reversion -->
  <g filter="url(#shadow)">
    <rect x="685" y="285" width="155" height="65" rx="6" fill="#0f1923" stroke="#9C27B0" stroke-width="1.5"/>
    <rect x="685" y="285" width="155" height="4" rx="2" fill="#9C27B0"/>
    <text x="762" y="310" text-anchor="middle" fill="#9C27B0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">S_MR</text>
    <text x="762" y="326" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="8">Short Mean-Reversion</text>
    <text x="762" y="341" text-anchor="middle" fill="#9C27B0" font-family="Segoe UI, Arial, sans-serif" font-size="7" opacity="0.7">Overbought Reversal</text>
  </g>

  <!-- Arrows from Specialists to Meta-Classifier -->
  <line x1="177" y1="350" x2="390" y2="400" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
  <line x1="372" y1="350" x2="430" y2="400" stroke="#F44336" stroke-width="1" opacity="0.4"/>
  <line x1="567" y1="350" x2="520" y2="400" stroke="#2196F3" stroke-width="1" opacity="0.4"/>
  <line x1="762" y1="350" x2="560" y2="400" stroke="#9C27B0" stroke-width="1" opacity="0.4"/>

  <!-- ==================== META-CLASSIFIER (Gold) ==================== -->
  <g filter="url(#glow)">
    <rect x="310" y="395" width="330" height="55" rx="8" fill="#0f1923" stroke="#FFC107" stroke-width="2"/>
    <rect x="310" y="395" width="330" height="5" rx="2" fill="#FFC107"/>
    <text x="475" y="420" text-anchor="middle" fill="#FFC107" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">META-CLASSIFIER</text>
    <text x="475" y="438" text-anchor="middle" fill="#FFC107" font-family="Segoe UI, Arial, sans-serif" font-size="8" opacity="0.8">Gating Network</text>
  </g>

  <!-- Output text -->
  <text x="475" y="474" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5">OUTPUT: Strategy Assignment + Confidence Score</text>
  <line x1="475" y1="450" x2="475" y2="464" stroke="#FFC107" stroke-width="1" opacity="0.5" stroke-dasharray="3 2"/>

  <!-- ==================== SIDE ANNOTATION ==================== -->
  <g>
    <rect x="15" y="390" width="175" height="60" rx="5" fill="#0f1923" stroke="#455A64" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text x="102" y="408" text-anchor="middle" fill="#78909C" font-family="Segoe UI, Arial, sans-serif" font-size="7" letter-spacing="1" font-weight="600">HYPERPARAMETERS</text>
    <line x1="30" y1="414" x2="175" y2="414" stroke="#455A64" stroke-width="0.3"/>
    <text x="30" y="428" fill="#B0BEC5" font-family="Segoe UI, monospace" font-size="7.5">Lookback: 25-100 bars</text>
    <text x="30" y="442" fill="#B0BEC5" font-family="Segoe UI, monospace" font-size="7.5">Validation: 0.92-1.10</text>
  </g>

  <!-- Corner accents -->
  <path d="M 5 5 L 25 5 L 25 7 L 7 7 L 7 25 L 5 25 Z" fill="#607D8B" opacity="0.3"/>
  <path d="M 945 5 L 925 5 L 925 7 L 943 7 L 943 25 L 945 25 Z" fill="#607D8B" opacity="0.3"/>
  <path d="M 5 495 L 25 495 L 25 493 L 7 493 L 7 475 L 5 475 Z" fill="#607D8B" opacity="0.3"/>
  <path d="M 945 495 L 925 495 L 925 493 L 943 493 L 943 475 L 945 475 Z" fill="#607D8B" opacity="0.3"/>
</svg>