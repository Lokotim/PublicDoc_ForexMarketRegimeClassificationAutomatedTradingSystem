<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 18px; font-weight: bold; fill: #ffffff; letter-spacing: 2px; }
      .bar-label { font-size: 12px; font-weight: bold; fill: #ffffff; }
      .bar-count { font-size: 11px; fill: #ffffff; opacity: 0.9; }
      .pct-label { font-size: 11px; font-weight: bold; fill: #F44336; }
      .stage-id { font-size: 10px; fill: rgba(255,255,255,0.5); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" fill="#0f1923" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">ELIMINATION FUNNEL</text>
  <line x1="310" y1="45" x2="590" y2="45" stroke="#FFC107" stroke-width="1" opacity="0.5"/>

  <!-- Column headers -->
  <text x="130" y="68" text-anchor="middle" font-size="10" fill="#78909C" font-family="'Segoe UI', Arial, sans-serif">STAGE</text>
  <text x="500" y="68" text-anchor="middle" font-size="10" fill="#78909C" font-family="'Segoe UI', Arial, sans-serif">CANDIDATES REMAINING</text>
  <text x="830" y="68" text-anchor="middle" font-size="10" fill="#78909C" font-family="'Segoe UI', Arial, sans-serif">CUT</text>

  <!-- Row 1: Build (S2) - 10,000,000 - full width -->
  <text x="35" y="102" class="stage-id" font-family="'Segoe UI', Arial, sans-serif">S2</text>
  <rect x="130" y="83" width="660" height="30" rx="4" fill="#4CAF50" opacity="0.85"/>
  <text x="140" y="103" class="bar-label">Build</text>
  <text x="460" y="103" text-anchor="middle" class="bar-count">10,000,000</text>
  <text x="810" y="103" text-anchor="middle" class="pct-label">-99.5%</text>

  <!-- Row 2: Monte Carlo (S3) - 50,000 - ~70% -->
  <text x="35" y="147" class="stage-id" font-family="'Segoe UI', Arial, sans-serif">S3</text>
  <rect x="130" y="128" width="462" height="30" rx="4" fill="#FF9800" opacity="0.85"/>
  <text x="140" y="148" class="bar-label">Monte Carlo</text>
  <text x="361" y="148" text-anchor="middle" class="bar-count">50,000</text>
  <text x="810" y="148" text-anchor="middle" class="pct-label">-90.0%</text>

  <!-- Row 3: Walk-Forward (S4) - 5,000 - ~55% -->
  <text x="35" y="192" class="stage-id" font-family="'Segoe UI', Arial, sans-serif">S4</text>
  <rect x="130" y="173" width="363" height="30" rx="4" fill="#2196F3" opacity="0.85"/>
  <text x="140" y="193" class="bar-label">Walk-Forward</text>
  <text x="311" y="193" text-anchor="middle" class="bar-count">5,000</text>
  <text x="810" y="193" text-anchor="middle" class="pct-label">-90.0%</text>

  <!-- Row 4: Permutation (S6) - 500 - ~40% -->
  <text x="35" y="237" class="stage-id" font-family="'Segoe UI', Arial, sans-serif">S6</text>
  <rect x="130" y="218" width="264" height="30" rx="4" fill="#42A5F5" opacity="0.85"/>
  <text x="140" y="238" class="bar-label">Permutation</text>
  <text x="262" y="238" text-anchor="middle" class="bar-count">500</text>
  <text x="810" y="238" text-anchor="middle" class="pct-label">-70.0%</text>

  <!-- Row 5: Multi-Market (S7) - 150 - ~30% -->
  <text x="35" y="282" class="stage-id" font-family="'Segoe UI', Arial, sans-serif">S7</text>
  <rect x="130" y="263" width="198" height="30" rx="4" fill="#FFC107" opacity="0.85"/>
  <text x="140" y="283" class="bar-label" fill="#0f1923">Multi-Market</text>
  <text x="262" y="283" text-anchor="middle" class="bar-count" fill="#0f1923">150</text>
  <text x="810" y="283" text-anchor="middle" class="pct-label">-46.7%</text>

  <!-- Row 6: Slippage (S8) - 80 - ~22% -->
  <text x="35" y="327" class="stage-id" font-family="'Segoe UI', Arial, sans-serif">S8</text>
  <rect x="130" y="308" width="145" height="30" rx="4" fill="#FF9800" opacity="0.85"/>
  <text x="140" y="328" class="bar-label">Slippage</text>
  <text x="226" y="328" class="bar-count">80</text>
  <text x="810" y="328" text-anchor="middle" class="pct-label">-37.5%</text>

  <!-- Row 7: Final Verdict (S9) - 32 - ~15% -->
  <text x="35" y="365" class="stage-id" font-family="'Segoe UI', Arial, sans-serif">S9</text>
  <rect x="130" y="348" width="99" height="26" rx="4" fill="#2a9d8f" opacity="0.85"/>
  <text x="140" y="366" class="bar-label" font-size="11">Final Verdict</text>
  <text x="240" y="366" class="bar-count" font-size="12" font-weight="bold" fill="#FFC107" font-family="'Segoe UI', Arial, sans-serif">32</text>
  <text x="810" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a9d8f" font-family="'Segoe UI', Arial, sans-serif">SURVIVORS</text>

  <!-- Connecting fade lines to show funnel shape -->
  <line x1="790" y1="98" x2="592" y2="143" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>
  <line x1="592" y1="143" x2="493" y2="188" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>
  <line x1="493" y1="188" x2="394" y2="233" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>
  <line x1="394" y1="233" x2="328" y2="278" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>
  <line x1="328" y1="278" x2="275" y2="323" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>
  <line x1="275" y1="323" x2="229" y2="361" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>
</svg>