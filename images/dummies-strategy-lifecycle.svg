<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <filter id="lc-s">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="320" fill="url(#lc-bg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">The Strategy Gauntlet — From Millions to 32</text>
  <text x="400" y="48" text-anchor="middle" fill="#64748b" font-size="11">Only the strongest strategies survive a brutal 9-stage elimination process</text>

  <!-- Funnel visualization -->
  <!-- Stage 1: 10M -->
  <rect x="30" y="70" width="740" height="36" rx="6" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="50" y="93" fill="#ef4444" font-size="13" font-weight="700">10,000,000</text>
  <text x="200" y="93" fill="#94a3b8" font-size="11">candidates generated by genetic optimization</text>
  <text x="720" y="93" fill="#ef4444" font-size="10" text-anchor="end">Stage 1-3</text>

  <!-- Arrow -->
  <text x="400" y="118" text-anchor="middle" fill="#475569" font-size="14">&#9660;</text>

  <!-- Stage 2: 100K -->
  <rect x="80" y="124" width="640" height="36" rx="6" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="147" fill="#f59e0b" font-size="13" font-weight="700">100,000</text>
  <text x="220" y="147" fill="#94a3b8" font-size="11">pass initial filters (profitability, Sharpe, drawdown)</text>
  <text x="680" y="147" fill="#f59e0b" font-size="10" text-anchor="end">Stage 4-5</text>

  <!-- Arrow -->
  <text x="400" y="172" text-anchor="middle" fill="#475569" font-size="14">&#9660;</text>

  <!-- Stage 3: 1000 -->
  <rect x="160" y="178" width="480" height="36" rx="6" fill="rgba(234,179,8,0.08)" stroke="#eab308" stroke-width="1" stroke-opacity="0.3"/>
  <text x="180" y="201" fill="#eab308" font-size="13" font-weight="700">1,000</text>
  <text x="260" y="201" fill="#94a3b8" font-size="11">survive Monte Carlo stress testing</text>
  <text x="610" y="201" fill="#eab308" font-size="10" text-anchor="end">Stage 6-7</text>

  <!-- Arrow -->
  <text x="400" y="226" text-anchor="middle" fill="#475569" font-size="14">&#9660;</text>

  <!-- Stage 4: 100 -->
  <rect x="240" y="232" width="320" height="36" rx="6" fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <text x="260" y="255" fill="#22c55e" font-size="13" font-weight="700">100</text>
  <text x="310" y="255" fill="#94a3b8" font-size="11">pass walk-forward validation</text>
  <text x="530" y="255" fill="#22c55e" font-size="10" text-anchor="end">Stage 8-9</text>

  <!-- Arrow -->
  <text x="400" y="280" text-anchor="middle" fill="#475569" font-size="14">&#9660;</text>

  <!-- Final: 32 -->
  <rect x="310" y="284" width="180" height="32" rx="16" fill="#0f172a" stroke="#00ff88" stroke-width="2" filter="url(#lc-s)"/>
  <text x="400" y="305" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="700">32 SURVIVORS</text>

  <!-- Survival rate -->
  <text x="540" y="305" fill="#475569" font-size="11">Survival rate: 0.00032%</text>
  <text x="540" y="318" fill="#475569" font-size="9">(3 survivors per million candidates)</text>
</svg>
