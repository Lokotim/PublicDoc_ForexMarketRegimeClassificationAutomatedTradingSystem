<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="mkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <filter id="mkShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="mkGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#7B68EE" flood-opacity="0.3"/>
    </filter>
    <marker id="mkArrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M 0 0 L 7 2.5 L 0 5 Z" fill="#7B68EE" opacity="0.6"/>
    </marker>
    <marker id="mkArrowG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M 0 0 L 7 2.5 L 0 5 Z" fill="#475569"/>
    </marker>
    <pattern id="mkGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.3" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="800" height="350" fill="url(#mkBg)" rx="12"/>
  <rect width="800" height="350" fill="url(#mkGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#7B68EE" letter-spacing="2">4-DAY MARKOV REGIME FORECAST</text>
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Transition matrix persistence with branching path projection</text>

  <!-- ===== LEFT: Transition Matrix ===== -->
  <g filter="url(#mkShadow)">
    <rect x="30" y="60" width="220" height="180" rx="10" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.4" stroke-width="1"/>
    <text x="140" y="82" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7B68EE" font-weight="700">Transition Matrix</text>
    <line x1="40" y1="90" x2="240" y2="90" stroke="#7B68EE" stroke-opacity="0.2" stroke-width="0.5"/>

    <!-- Matrix headers -->
    <text x="100" y="108" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">To:</text>
    <text x="160" y="108" text-anchor="middle" font-family="monospace" font-size="8" fill="#4ADE80" font-weight="600">TF</text>
    <text x="215" y="108" text-anchor="middle" font-family="monospace" font-size="8" fill="#FF6B35" font-weight="600">MR</text>

    <!-- Row 1: TF → -->
    <text x="55" y="134" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">From:</text>
    <text x="100" y="134" text-anchor="middle" font-family="monospace" font-size="8" fill="#4ADE80" font-weight="600">TF</text>
    <rect x="132" y="120" width="56" height="22" rx="4" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="160" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#4ADE80" font-weight="700">0.94</text>
    <rect x="192" y="120" width="46" height="22" rx="4" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="215" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#F87171">0.06</text>

    <!-- Row 2: MR → -->
    <text x="100" y="162" text-anchor="middle" font-family="monospace" font-size="8" fill="#FF6B35" font-weight="600">MR</text>
    <rect x="132" y="148" width="56" height="22" rx="4" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="160" y="163" text-anchor="middle" font-family="monospace" font-size="11" fill="#F87171">0.06</text>
    <rect x="192" y="148" width="46" height="22" rx="4" fill="#FF6B35" fill-opacity="0.15" stroke="#FF6B35" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="215" y="163" text-anchor="middle" font-family="monospace" font-size="11" fill="#FF6B35" font-weight="700">0.94</text>

    <!-- Persistence highlight -->
    <rect x="50" y="185" width="190" height="22" rx="6" fill="#7B68EE" fill-opacity="0.08"/>
    <text x="145" y="200" text-anchor="middle" font-family="monospace" font-size="8" fill="#7B68EE">Persistence: 0.94 (strong)</text>

    <!-- Self-loop arrows for persistence -->
    <text x="140" y="225" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Diagonal = regime stickiness</text>
  </g>

  <!-- Arrow matrix → tree -->
  <line x1="250" y1="150" x2="290" y2="150" stroke="#7B68EE" stroke-width="1.5" marker-end="url(#mkArrow)" opacity="0.5"/>

  <!-- ===== MIDDLE: Branching Tree ===== -->
  <g filter="url(#mkShadow)">
    <rect x="298" y="60" width="230" height="220" rx="10" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.4" stroke-width="1"/>
    <text x="413" y="82" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7B68EE" font-weight="700">4-Day Path Projection</text>
    <line x1="308" y1="90" x2="518" y2="90" stroke="#7B68EE" stroke-opacity="0.2" stroke-width="0.5"/>

    <!-- Day labels -->
    <text x="335" y="106" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Today</text>
    <text x="385" y="106" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Day 1</text>
    <text x="435" y="106" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Day 2</text>
    <text x="485" y="106" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Day 3</text>

    <!-- Starting node (TF) -->
    <circle cx="335" cy="155" r="12" fill="#4ADE80" fill-opacity="0.2" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1"/>
    <text x="335" y="159" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80" font-weight="700">TF</text>

    <!-- Branch Day 1: TF (94%) -->
    <line x1="347" y1="148" x2="373" y2="130" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="385" cy="125" r="10" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="0.8"/>
    <text x="385" y="129" text-anchor="middle" font-family="monospace" font-size="6" fill="#4ADE80">TF</text>
    <text x="365" y="135" font-family="monospace" font-size="5" fill="#94A3B8">.94</text>

    <!-- Branch Day 1: MR (6%) -->
    <line x1="347" y1="162" x2="373" y2="185" stroke="#FF6B35" stroke-opacity="0.3" stroke-width="0.8"/>
    <circle cx="385" cy="190" r="10" fill="#FF6B35" fill-opacity="0.1" stroke="#FF6B35" stroke-opacity="0.3" stroke-width="0.6"/>
    <text x="385" y="194" text-anchor="middle" font-family="monospace" font-size="6" fill="#FF6B35" opacity="0.6">MR</text>
    <text x="365" y="180" font-family="monospace" font-size="5" fill="#94A3B8">.06</text>

    <!-- Day 2 branches from TF -->
    <line x1="395" y1="120" x2="423" y2="112" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="0.8"/>
    <circle cx="435" cy="110" r="9" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="0.6"/>
    <text x="435" y="114" text-anchor="middle" font-family="monospace" font-size="5" fill="#4ADE80">TF</text>

    <line x1="395" y1="130" x2="423" y2="145" stroke="#FF6B35" stroke-opacity="0.2" stroke-width="0.5"/>
    <circle cx="435" cy="148" r="8" fill="#FF6B35" fill-opacity="0.08" stroke="#FF6B35" stroke-opacity="0.2" stroke-width="0.4"/>
    <text x="435" y="151" text-anchor="middle" font-family="monospace" font-size="5" fill="#FF6B35" opacity="0.5">MR</text>

    <!-- Day 3 branches -->
    <line x1="444" y1="106" x2="473" y2="102" stroke="#4ADE80" stroke-opacity="0.35" stroke-width="0.6"/>
    <circle cx="485" cy="100" r="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="485" y="103" text-anchor="middle" font-family="monospace" font-size="5" fill="#4ADE80">TF</text>

    <line x1="444" y1="114" x2="473" y2="125" stroke="#FF6B35" stroke-opacity="0.15" stroke-width="0.4"/>
    <circle cx="485" cy="128" r="6" fill="#FF6B35" fill-opacity="0.05" stroke="#FF6B35" stroke-opacity="0.15" stroke-width="0.3"/>
    <text x="485" y="131" text-anchor="middle" font-family="monospace" font-size="4" fill="#FF6B35" opacity="0.4">MR</text>

    <!-- Most likely path highlight -->
    <rect x="310" y="220" width="206" height="26" rx="6" fill="#4ADE80" fill-opacity="0.08"/>
    <text x="413" y="234" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">Most likely: TF x4 (83.1%)</text>
    <text x="413" y="248" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">P(regime switch) = 22.1% over 4d</text>
  </g>

  <!-- Arrow tree → alignment -->
  <line x1="528" y1="150" x2="558" y2="150" stroke="#7B68EE" stroke-width="1.5" marker-end="url(#mkArrow)" opacity="0.5"/>

  <!-- ===== RIGHT: Alignment Check + Output ===== -->
  <g filter="url(#mkShadow)">
    <rect x="566" y="60" width="210" height="105" rx="10" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.4" stroke-width="1"/>
    <text x="671" y="82" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7B68EE" font-weight="700">Alignment Check</text>
    <line x1="576" y1="90" x2="766" y2="90" stroke="#7B68EE" stroke-opacity="0.2" stroke-width="0.5"/>

    <text x="671" y="110" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0">Forecast vs ML Ensemble</text>

    <rect x="586" y="118" width="80" height="18" rx="4" fill="#4ADE80" fill-opacity="0.1"/>
    <text x="626" y="131" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">AGREE +20%</text>
    <rect x="676" y="118" width="80" height="18" rx="4" fill="#F87171" fill-opacity="0.1"/>
    <text x="716" y="131" text-anchor="middle" font-family="monospace" font-size="7" fill="#F87171">CONFLICT -15%</text>

    <text x="671" y="155" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Concordance weighting</text>
  </g>

  <!-- Arrow alignment → output -->
  <line x1="671" y1="165" x2="671" y2="195" stroke="#7B68EE" stroke-width="1" marker-end="url(#mkArrow)" opacity="0.4"/>

  <!-- Output -->
  <g filter="url(#mkGlow)">
    <rect x="566" y="200" width="210" height="70" rx="10" fill="#0A1628" stroke="#7B68EE" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="671" y="224" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7B68EE" font-weight="700">Strategy Assignment</text>
    <text x="671" y="244" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0">8 pairs x [regime, direction]</text>
    <text x="671" y="260" text-anchor="middle" font-family="monospace" font-size="7" fill="#7B68EE" opacity="0.7">+ forecast confidence score</text>
  </g>

  <!-- Bottom summary -->
  <rect x="200" y="300" width="400" height="28" rx="14" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.2" stroke-width="0.5"/>
  <text x="400" y="319" text-anchor="middle" font-family="monospace" font-size="8" fill="#7B68EE">Weight in Meta-Resolver: 38% (Markov Forecast)</text>

  <!-- Border -->
</svg>