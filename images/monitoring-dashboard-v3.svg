<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="850" height="400" fill="url(#bg)" rx="12"/>
  <text x="425" y="28" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#E2E8F0">MONITORING, DIAGNOSTICS, AND OBSERVABILITY</text>
  <text x="425" y="46" text-anchor="middle" font-family="Consolas" font-size="10" fill="#94A3B8">4 independent monitoring systems, 14 categories, 50+ checks</text>

  <!-- System 1: Inline Probes -->
  <rect x="30" y="70" width="185" height="160" rx="8" fill="#162032" stroke="#00D4FF" stroke-width="1.5" filter="url(#sh)"/>
  <text x="122" y="92" text-anchor="middle" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#00D4FF">Inline Probes</text>
  <text x="122" y="108" text-anchor="middle" font-family="Consolas" font-size="9" fill="#94A3B8">unified_pipeline.py</text>
  <line x1="40" y1="115" x2="205" y2="115" stroke="#00D4FF" stroke-width="0.3" opacity="0.4"/>
  <text x="45" y="132" font-family="Consolas" font-size="8" fill="#E2E8F0">7 stages monitored</text>
  <text x="45" y="146" font-family="Consolas" font-size="8" fill="#E2E8F0">17 data checks</text>
  <text x="45" y="160" font-family="Consolas" font-size="8" fill="#E2E8F0">Real-time validation</text>
  <text x="45" y="180" font-family="Consolas" font-size="8" fill="#4ADE80">STAGE_1 ✓  STAGE_3 ✓</text>
  <text x="45" y="194" font-family="Consolas" font-size="8" fill="#4ADE80">STAGE_4 ✓  STAGE_5 ✓</text>
  <text x="45" y="208" font-family="Consolas" font-size="8" fill="#4ADE80">STAGE_6 ✓  STAGE_7 ✓</text>
  <text x="45" y="222" font-family="Consolas" font-size="8" fill="#4ADE80">POST    ✓</text>

  <!-- System 2: Data Truth Watchdog -->
  <rect x="225" y="70" width="185" height="160" rx="8" fill="#162032" stroke="#FFD54F" stroke-width="1.5" filter="url(#sh)"/>
  <text x="317" y="92" text-anchor="middle" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#FFD54F">Data Truth Watchdog</text>
  <text x="317" y="108" text-anchor="middle" font-family="Consolas" font-size="9" fill="#94A3B8">data_truth_watchdog.py</text>
  <line x1="235" y1="115" x2="400" y2="115" stroke="#FFD54F" stroke-width="0.3" opacity="0.4"/>
  <text x="240" y="132" font-family="Consolas" font-size="8" fill="#E2E8F0">9 verification nodes</text>
  <text x="240" y="146" font-family="Consolas" font-size="8" fill="#E2E8F0">Freshness checks</text>
  <text x="240" y="160" font-family="Consolas" font-size="8" fill="#E2E8F0">Grade: A / B / C / F</text>
  <text x="240" y="180" font-family="Consolas" font-size="8" fill="#4ADE80">NODE 1 Sentiment  ✓</text>
  <text x="240" y="194" font-family="Consolas" font-size="8" fill="#4ADE80">NODE 2 Theories   ✓</text>
  <text x="240" y="208" font-family="Consolas" font-size="8" fill="#4ADE80">NODE 3 ML         ✓</text>
  <text x="240" y="222" font-family="Consolas" font-size="8" fill="#FFD54F">NODE 9 Macro      !</text>

  <!-- System 3: Pipeline Diagnostics -->
  <rect x="420" y="70" width="185" height="160" rx="8" fill="#162032" stroke="#4ADE80" stroke-width="1.5" filter="url(#sh)"/>
  <text x="512" y="92" text-anchor="middle" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#4ADE80">Pipeline Diagnostics</text>
  <text x="512" y="108" text-anchor="middle" font-family="Consolas" font-size="9" fill="#94A3B8">pipeline_diagnostics.py</text>
  <line x1="430" y1="115" x2="595" y2="115" stroke="#4ADE80" stroke-width="0.3" opacity="0.4"/>
  <text x="435" y="132" font-family="Consolas" font-size="8" fill="#E2E8F0">14 categories</text>
  <text x="435" y="146" font-family="Consolas" font-size="8" fill="#E2E8F0">~50 individual checks</text>
  <text x="435" y="160" font-family="Consolas" font-size="8" fill="#E2E8F0">Auto diagnostic prompt</text>
  <text x="435" y="180" font-family="Consolas" font-size="8" fill="#94A3B8">Data ✓  ML ✓  Risk ✓</text>
  <text x="435" y="194" font-family="Consolas" font-size="8" fill="#94A3B8">Exec ✓  Infra ✓  IV ✓</text>
  <text x="435" y="208" font-family="Consolas" font-size="8" fill="#94A3B8">RL ✓  Macro ✓  CSI ✓</text>
  <text x="435" y="222" font-family="Consolas" font-size="8" fill="#94A3B8">Crowd ✓  PnL ✓  DB ✓</text>

  <!-- System 4: Discord Alerts -->
  <rect x="615" y="70" width="205" height="160" rx="8" fill="#1A1520" stroke="#E879F9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="717" y="92" text-anchor="middle" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#E879F9">Discord Alerts</text>
  <text x="717" y="108" text-anchor="middle" font-family="Consolas" font-size="9" fill="#94A3B8">Webhook + Fallback Log</text>
  <line x1="625" y1="115" x2="810" y2="115" stroke="#E879F9" stroke-width="0.3" opacity="0.4"/>
  <text x="630" y="132" font-family="Consolas" font-size="8" fill="#F87171">CRITICAL: @here ping</text>
  <text x="630" y="146" font-family="Consolas" font-size="8" fill="#FFD54F">WARNING: logged</text>
  <text x="630" y="160" font-family="Consolas" font-size="8" fill="#4ADE80">INFO: silent</text>
  <text x="630" y="180" font-family="Consolas" font-size="8" fill="#E2E8F0">Anti-spam: 15min cooldown</text>
  <text x="630" y="194" font-family="Consolas" font-size="8" fill="#E2E8F0">Disk fallback on failure</text>
  <text x="630" y="208" font-family="Consolas" font-size="8" fill="#E2E8F0">Pipeline failures</text>
  <text x="630" y="222" font-family="Consolas" font-size="8" fill="#E2E8F0">RME Guard alerts</text>

  <!-- Output: Grade -->
  <rect x="250" y="260" width="350" height="50" rx="8" fill="#1A2520" stroke="#4ADE80" stroke-width="2" filter="url(#sh)"/>
  <text x="425" y="282" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#4ADE80">PIPELINE GRADE: A</text>
  <text x="425" y="300" text-anchor="middle" font-family="Consolas" font-size="9" fill="#94A3B8">9/9 nodes green | 14/14 categories pass | 0 critical alerts</text>

  <!-- Arrows from systems to grade -->
  <line x1="122" y1="232" x2="300" y2="260" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="317" y1="232" x2="380" y2="260" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="512" y1="232" x2="470" y2="260" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="717" y1="232" x2="550" y2="260" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Grade < A triggers -->
  <rect x="250" y="325" width="350" height="35" rx="6" fill="#1A1520" stroke="#F87171" stroke-width="1"/>
  <text x="425" y="342" text-anchor="middle" font-family="Consolas" font-size="9" fill="#F87171">Grade &lt; A: auto-generate diagnostic_prompt_*.md</text>
  <text x="425" y="355" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">Self-diagnosing system for Claude Code analysis</text>

  <!-- 21-section report -->
  <rect x="30" y="330" width="180" height="30" rx="4" fill="#162032" stroke="#334155" stroke-width="0.5"/>
  <text x="120" y="350" text-anchor="middle" font-family="Consolas" font-size="9" fill="#00D4FF">21-section HTML report</text>

  <rect x="640" y="330" width="180" height="30" rx="4" fill="#162032" stroke="#334155" stroke-width="0.5"/>
  <text x="730" y="350" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E879F9">Live dashboard (IIS)</text>

  <text x="425" y="390" text-anchor="middle" font-family="Consolas" font-size="9" fill="#64748B">Every cycle: 17 probes + 9 nodes + 50 checks + real-time alerts = continuous observability</text>
</svg>