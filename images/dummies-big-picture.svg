      <rect x="90" y="30" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="0" y="45" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="15" y="45" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="30" y="45" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="45" y="45" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="60" y="45" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="75" y="45" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="90" y="45" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="0" y="60" width="12" height="12" rx="2" fill="#FFD54F" opacity="0.6"/>
      <rect x="15" y="60" width="12" height="12" rx="2" fill="#FFD54F" opacity="0.6"/>
