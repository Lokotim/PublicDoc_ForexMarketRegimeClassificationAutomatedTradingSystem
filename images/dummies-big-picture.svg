      <rect x="30" y="30" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="45" y="30" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
      <rect x="60" y="30" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
