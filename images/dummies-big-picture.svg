  <text x="465" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Protect</text>
  <text x="645" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Trade</text>
  <text x="795" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Broker</text>

