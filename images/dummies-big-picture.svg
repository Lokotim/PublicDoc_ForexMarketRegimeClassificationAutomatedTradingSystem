    <path d="M45,15 L75,30 L75,65 Q75,90 45,100 Q15,90 15,65 L15,30 Z" fill="none" stroke="#F87171" stroke-width="2.5" filter="url(#shadow)"/>
    <path d="M45,25 L65,36 L65,62 Q65,80 45,88 Q25,80 25,62 L25,36 Z" fill="#F87171" opacity="0.2"/>
    <text x="45" y="65" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#F87171">9</text>
    <text x="45" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#94A3B8">layers</text>
