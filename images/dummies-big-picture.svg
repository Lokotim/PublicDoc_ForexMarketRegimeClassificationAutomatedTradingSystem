      <rect x="44" y="0" width="18" height="18" rx="3" fill="#4ADE80" opacity="0.7"/>
      <rect x="66" y="0" width="18" height="18" rx="3" fill="#4ADE80" opacity="0.7"/>
      <rect x="88" y="0" width="18" height="18" rx="3" fill="#FFD54F" opacity="0.7"/>
      <rect x="0" y="22" width="18" height="18" rx="3" fill="#FFD54F" opacity="0.7"/>
      <rect x="22" y="22" width="18" height="18" rx="3" fill="#E879F9" opacity="0.7"/>
      <rect x="44" y="22" width="18" height="18" rx="3" fill="#E879F9" opacity="0.7"/>
      <rect x="66" y="22" width="18" height="18" rx="3" fill="#E879F9" opacity="0.7"/>
      <rect x="88" y="22" width="18" height="18" rx="3" fill="#E879F9" opacity="0.7"/>
      <rect x="0" y="44" width="18" height="18" rx="3" fill="#4ADE80" opacity="0.7"/>
      <rect x="22" y="44" width="18" height="18" rx="3" fill="#F87171" opacity="0.7"/>
      <rect x="44" y="44" width="18" height="18" rx="3" fill="#00D4FF" opacity="0.7"/>
      <rect x="66" y="44" width="18" height="18" rx="3" fill="#00D4FF" opacity="0.7"/>
      <rect x="88" y="44" width="18" height="18" rx="3" fill="#E879F9" opacity="0.7"/>
