<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glowGold3">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFD54F" flood-opacity="0.4"/>
    </filter>
    <filter id="nodeShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ADE80" fill-opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="500" fill="url(#bg3)" rx="8"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFD54F" filter="url(#glowGold3)">THE SENTINELS — Infrastructure Network</text>

  <!-- Connection lines (behind nodes) -->
  <!-- Center (425,235) to IB DOM (155,135) -->
  <line x1="330" y1="210" x2="230" y2="160" stroke="#4ADE80" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Center to IB VAL (695,135) -->
  <line x1="520" y1="210" x2="620" y2="160" stroke="#4ADE80" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Center to MultiCharts (120,270) -->
  <line x1="325" y1="240" x2="220" y2="270" stroke="#4ADE80" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Center to GlobalVariable.dll (730,270) -->
  <line x1="525" y1="240" x2="630" y2="270" stroke="#4ADE80" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Center to SQLite DBs (200,390) -->
  <line x1="370" y1="265" x2="270" y2="370" stroke="#4ADE80" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Center to Outputs (650,390) -->
  <line x1="480" y1="265" x2="580" y2="370" stroke="#4ADE80" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- ═══ CENTRAL NODE ═══ -->
  <rect x="325" y="195" width="200" height="70" rx="10" fill="#0F172A" stroke="#FFD54F" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="425" y="222" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFD54F">PIPELINE SERVER</text>
  <text x="425" y="242" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Python 3.14 | Windows Server</text>
  <text x="425" y="256" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">EST5EDT</text>

  <!-- Shield icon (simple path) next to center -->
  <g transform="translate(538,200)">
    <path d="M8,2 L14,5 L14,10 C14,14 8,17 8,17 C8,17 2,14 2,10 L2,5 Z" fill="none" stroke="#F7B32B" stroke-width="1" stroke-linejoin="round" opacity="0.7"/>
    <path d="M6,9 L8,11 L11,7" fill="none" stroke="#F7B32B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>
  <text x="560" y="210" font-family="Consolas, monospace" font-size="8" fill="#F7B32B" opacity="0.7">Memory Guardian</text>
  <text x="560" y="220" font-family="Consolas, monospace" font-size="8" fill="#F7B32B" opacity="0.5">3GB threshold</text>

  <!-- ═══ NODE 1: IB Gateway DOM (top-left) ═══ -->
  <rect x="55" y="100" width="175" height="60" rx="8" fill="#0F172A" stroke="#4ADE80" stroke-width="1" filter="url(#nodeShadow)"/>
  <text x="142" y="122" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#4ADE80">IB Gateway DOM</text>
  <text x="142" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Port 7496</text>
  <text x="142" y="152" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">4 accounts</text>

  <!-- ═══ NODE 2: IB Gateway VAL (top-right) ═══ -->
  <rect x="620" y="100" width="175" height="60" rx="8" fill="#0F172A" stroke="#4ADE80" stroke-width="1" filter="url(#nodeShadow)"/>
  <text x="707" y="122" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#4ADE80">IB Gateway VAL</text>
  <text x="707" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Port 7497</text>
  <text x="707" y="152" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">4 accounts</text>

  <!-- ═══ NODE 3: MultiCharts (left) ═══ -->
  <rect x="35" y="248" width="185" height="60" rx="8" fill="#0F172A" stroke="#00D4FF" stroke-width="1" filter="url(#nodeShadow)"/>
  <text x="127" y="270" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#00D4FF">MultiCharts</text>
  <text x="127" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">32 strategies | AOE control</text>
  <text x="127" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Portfolio Trader</text>

  <!-- ═══ NODE 4: GlobalVariable.dll (right) ═══ -->
  <rect x="630" y="248" width="185" height="60" rx="8" fill="#0F172A" stroke="#E879F9" stroke-width="1" filter="url(#nodeShadow)"/>
  <text x="722" y="270" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E879F9">GlobalVariable.dll</text>
  <text x="722" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Shared memory IPC</text>
  <text x="722" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">32 heartbeats</text>

  <!-- ═══ NODE 5: SQLite DBs (bottom-left) ═══ -->
  <rect x="100" y="358" width="195" height="68" rx="8" fill="#0F172A" stroke="#F7B32B" stroke-width="1" filter="url(#nodeShadow)"/>
  <text x="197" y="378" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F7B32B">3 SQLite DBs</text>
  <text x="197" y="394" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">forex_sentiment</text>
  <text x="197" y="406" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">forexregime | risk_mgmt</text>
  <text x="197" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="8" fill="#94A3B8" opacity="0.6">WAL mode | hourly snapshots</text>

  <!-- ═══ NODE 6: Outputs (bottom-right) ═══ -->
  <rect x="555" y="358" width="195" height="68" rx="8" fill="#0F172A" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.7" filter="url(#nodeShadow)"/>
  <text x="652" y="378" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#00D4FF">Outputs</text>
  <text x="652" y="394" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Discord webhooks</text>
  <text x="652" y="406" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">IIS dashboard | CSV</text>
  <text x="652" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="8" fill="#94A3B8" opacity="0.6">Reports + diagnostic prompts</text>

  <!-- Footer -->
  <text x="425" y="470" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8" opacity="0.6">Watchdog Master: 60s heartbeat | Auto-restart | 6 components monitored</text>
</svg>