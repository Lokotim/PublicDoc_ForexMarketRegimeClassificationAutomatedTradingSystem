<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="fv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <filter id="fv-s">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#fv-bg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">The 4 Voting Voices</text>
  <text x="400" y="48" text-anchor="middle" fill="#64748b" font-size="11">Four voices independently predict direction (BUY or SELL) for each currency pair</text>

  <!-- Voice 1: ML -->
  <rect x="30" y="70" width="170" height="180" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#fv-s)"/>
  <circle cx="115" cy="105" r="26" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="113" text-anchor="middle" fill="#3b82f6" font-size="24">&#129302;</text>
  <text x="115" y="150" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="700">ML Classifier</text>
  <text x="115" y="168" text-anchor="middle" fill="#94a3b8" font-size="10">The data scientist</text>
  <line x1="50" y1="178" x2="180" y2="178" stroke="#1e293b" stroke-width="1"/>
  <text x="115" y="196" text-anchor="middle" fill="#cbd5e1" font-size="10">Analyzes patterns</text>
  <text x="115" y="210" text-anchor="middle" fill="#cbd5e1" font-size="10">in 22 theories</text>
  <text x="115" y="224" text-anchor="middle" fill="#cbd5e1" font-size="10">using 5 ML models</text>
  <!-- Weight bar -->
  <rect x="55" y="235" width="120" height="8" rx="4" fill="#0f172a"/>
  <rect x="55" y="235" width="54" height="8" rx="4" fill="#3b82f6"/>
  <text x="115" y="256" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="600">~55%</text>

  <!-- Voice 2: Forecast -->
  <rect x="220" y="70" width="170" height="180" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#fv-s)"/>
  <circle cx="305" cy="105" r="26" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="305" y="113" text-anchor="middle" fill="#06b6d4" font-size="24">&#128302;</text>
  <text x="305" y="150" text-anchor="middle" fill="#06b6d4" font-size="14" font-weight="700">4-Day Forecast</text>
  <text x="305" y="168" text-anchor="middle" fill="#94a3b8" font-size="10">The fortune teller</text>
  <line x1="240" y1="178" x2="370" y2="178" stroke="#1e293b" stroke-width="1"/>
  <text x="305" y="196" text-anchor="middle" fill="#cbd5e1" font-size="10">Predicts where</text>
  <text x="305" y="210" text-anchor="middle" fill="#cbd5e1" font-size="10">the market goes</text>
  <text x="305" y="224" text-anchor="middle" fill="#cbd5e1" font-size="10">in the next 4 days</text>
  <rect x="245" y="235" width="120" height="8" rx="4" fill="#0f172a"/>
  <rect x="245" y="235" width="30" height="8" rx="4" fill="#06b6d4"/>
  <text x="305" y="256" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="600">~30%</text>

  <!-- Voice 3: RL -->
  <rect x="410" y="70" width="170" height="180" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#fv-s)"/>
  <circle cx="495" cy="105" r="26" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="495" y="113" text-anchor="middle" fill="#8b5cf6" font-size="24">&#127891;</text>
  <text x="495" y="150" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="700">RL Agent</text>
  <text x="495" y="168" text-anchor="middle" fill="#94a3b8" font-size="10">The experienced trader</text>
  <line x1="430" y1="178" x2="560" y2="178" stroke="#1e293b" stroke-width="1"/>
  <text x="495" y="196" text-anchor="middle" fill="#cbd5e1" font-size="10">Learns from every</text>
  <text x="495" y="210" text-anchor="middle" fill="#cbd5e1" font-size="10">trade outcome</text>
  <text x="495" y="224" text-anchor="middle" fill="#cbd5e1" font-size="10">and adapts strategy</text>
  <rect x="435" y="235" width="120" height="8" rx="4" fill="#0f172a"/>
  <rect x="435" y="235" width="18" height="8" rx="4" fill="#8b5cf6"/>
  <text x="495" y="256" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="600">~15%</text>


  <!-- Converge arrows -->
  <line x1="115" y1="260" x2="310" y2="295" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="305" y1="260" x2="350" y2="295" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="495" y1="260" x2="440" y2="295" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Result box -->
  <rect x="280" y="290" width="240" height="50" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2" filter="url(#fv-s)"/>
  <text x="400" y="313" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">Final Signal</text>
  <text x="400" y="330" text-anchor="middle" fill="#94a3b8" font-size="10">BUY or SELL per pair + confidence level</text>

  <!-- Agreement levels -->
  <rect x="30" y="356" width="740" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="377" fill="#94a3b8" font-size="10">Agreement:</text>
  <rect x="140" y="363" width="10" height="10" rx="2" fill="#22c55e"/>
  <text x="156" y="376" fill="#22c55e" font-size="10" font-weight="600">4/4 Unanimous (+20%)</text>
  <rect x="310" y="363" width="10" height="10" rx="2" fill="#3b82f6"/>
  <text x="326" y="376" fill="#3b82f6" font-size="10" font-weight="600">3/4 Strong (100%)</text>
  <rect x="460" y="363" width="10" height="10" rx="2" fill="#eab308"/>
  <text x="476" y="376" fill="#eab308" font-size="10" font-weight="600">2/4 Minority (75%)</text>
  <rect x="620" y="363" width="10" height="10" rx="2" fill="#ef4444"/>
  <text x="636" y="376" fill="#ef4444" font-size="10" font-weight="600">Split (50%)</text>
</svg>
