<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,6 L8,0" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="850" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#E2E8F0" filter="url(#shadow)">Walk-Forward Matrix: 10,000 Temporal Validations</text>

  <!-- Grid area: left half -->
  <!-- Column headers -->
  <text x="300" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#00D4FF">OOS Window</text>
  <text x="210" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">30d</text>
  <text x="280" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">60d</text>
  <text x="350" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">90d</text>
  <text x="420" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">120d</text>

  <!-- Row headers -->
  <text x="100" y="115" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#00D4FF" transform="rotate(-90, 48, 155)">IS Window</text>
  <text x="155" y="112" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">60d</text>
  <text x="155" y="162" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">90d</text>
  <text x="155" y="212" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">120d</text>
  <text x="155" y="262" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">180d</text>

  <!-- Row 1: IS=60d -->
  <rect x="178" y="90" width="64" height="36" rx="4" fill="#F87171" fill-opacity="0.2" stroke="#F87171" stroke-width="1"/>
  <text x="210" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#F87171">78%</text>
  <rect x="248" y="90" width="64" height="36" rx="4" fill="#F87171" fill-opacity="0.15" stroke="#F87171" stroke-width="1"/>
  <text x="280" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#F87171">79%</text>
  <rect x="318" y="90" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-width="1"/>
  <text x="350" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">82%</text>
  <rect x="388" y="90" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-width="1"/>
  <text x="420" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">81%</text>

  <!-- Row 2: IS=90d -->
  <rect x="178" y="140" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-width="1"/>
  <text x="210" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">83%</text>
  <rect x="248" y="140" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.2" stroke="#4ADE80" stroke-width="1"/>
  <text x="280" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">86%</text>
  <rect x="318" y="140" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.2" stroke="#4ADE80" stroke-width="1"/>
  <text x="350" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">88%</text>
  <rect x="388" y="140" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.2" stroke="#4ADE80" stroke-width="1"/>
  <text x="420" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">85%</text>

  <!-- Row 3: IS=120d -->
  <rect x="178" y="190" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.2" stroke="#4ADE80" stroke-width="1"/>
  <text x="210" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">87%</text>
  <rect x="248" y="190" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.25" stroke="#4ADE80" stroke-width="1"/>
  <text x="280" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">90%</text>
  <rect x="318" y="190" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.3" stroke="#4ADE80" stroke-width="1"/>
  <text x="350" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">92%</text>
  <rect x="388" y="190" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.25" stroke="#4ADE80" stroke-width="1"/>
  <text x="420" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">89%</text>

  <!-- Row 4: IS=180d -->
  <rect x="178" y="240" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.3" stroke="#4ADE80" stroke-width="1"/>
  <text x="210" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">91%</text>
  <rect x="248" y="240" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.35" stroke="#4ADE80" stroke-width="1"/>
  <text x="280" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">94%</text>
  <rect x="318" y="240" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.3" stroke="#4ADE80" stroke-width="1"/>
  <text x="350" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">93%</text>
  <rect x="388" y="240" width="64" height="36" rx="4" fill="#4ADE80" fill-opacity="0.3" stroke="#4ADE80" stroke-width="1"/>
  <text x="420" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">91%</text>

  <!-- Legend -->
  <rect x="178" y="290" width="12" height="12" rx="2" fill="#4ADE80" fill-opacity="0.2" stroke="#4ADE80" stroke-width="1"/>
  <text x="196" y="301" font-family="Segoe UI, sans-serif" font-size="10" fill="#4ADE80">Above 80%</text>
  <rect x="280" y="290" width="12" height="12" rx="2" fill="#F87171" fill-opacity="0.2" stroke="#F87171" stroke-width="1"/>
  <text x="298" y="301" font-family="Segoe UI, sans-serif" font-size="10" fill="#F87171">Below 80%</text>

  <!-- Right side: Sliding window diagram -->
  <text x="660" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#E2E8F0">Sliding Window</text>

  <!-- Timeline base -->
  <line x1="520" y1="260" x2="800" y2="260" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="278" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Jan</text>
  <text x="590" y="278" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Mar</text>
  <text x="660" y="278" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">May</text>
  <text x="730" y="278" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Jul</text>
  <text x="795" y="278" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Sep</text>

  <!-- Window 1 -->
  <rect x="520" y="95" width="140" height="22" rx="4" fill="#00D4FF" fill-opacity="0.25" stroke="#00D4FF" stroke-width="1.5"/>
  <text x="590" y="111" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#00D4FF">IN-SAMPLE</text>
  <rect x="660" y="95" width="60" height="22" rx="4" fill="#FFD54F" fill-opacity="0.25" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="690" y="111" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#FFD54F">OOS</text>

  <!-- Window 2 -->
  <rect x="555" y="135" width="140" height="22" rx="4" fill="#00D4FF" fill-opacity="0.25" stroke="#00D4FF" stroke-width="1.5"/>
  <text x="625" y="151" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#00D4FF">IN-SAMPLE</text>
  <rect x="695" y="135" width="60" height="22" rx="4" fill="#FFD54F" fill-opacity="0.25" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="725" y="151" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#FFD54F">OOS</text>

  <!-- Window 3 -->
  <rect x="590" y="175" width="140" height="22" rx="4" fill="#00D4FF" fill-opacity="0.25" stroke="#00D4FF" stroke-width="1.5"/>
  <text x="660" y="191" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#00D4FF">IN-SAMPLE</text>
  <rect x="730" y="175" width="60" height="22" rx="4" fill="#FFD54F" fill-opacity="0.25" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="760" y="191" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#FFD54F">OOS</text>

  <!-- Slide labels -->
  <text x="515" y="108" font-family="Segoe UI, sans-serif" font-size="10" fill="#94A3B8">W1</text>
  <text x="515" y="148" font-family="Segoe UI, sans-serif" font-size="10" fill="#94A3B8">W2</text>
  <text x="515" y="188" font-family="Segoe UI, sans-serif" font-size="10" fill="#94A3B8">W3</text>

  <!-- Down arrow indicating sliding -->
  <line x1="810" y1="100" x2="810" y2="190" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <text x="825" y="150" font-family="Segoe UI, sans-serif" font-size="9" fill="#94A3B8" transform="rotate(90, 825, 150)">slide</text>

  <!-- Bottom text -->
  <text x="425" y="340" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Every IS/OOS combination tested across rolling time windows</text>
  <text x="425" y="360" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">ensures strategy robustness is not an artifact of a single time period</text>
</svg>