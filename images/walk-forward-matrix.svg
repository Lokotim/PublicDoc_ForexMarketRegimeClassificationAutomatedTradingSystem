<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; }
      .header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #8899aa; }
      .row-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #8899aa; }
      .cell-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .legend-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #8899aa; }
      .note-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #667788; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="380" fill="#0f1923" rx="8"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" class="title">WALK-FORWARD ROBUSTNESS MATRIX (Example)</text>

  <!-- Column headers -->
  <text x="285" y="70" text-anchor="middle" class="header">OOS 20%</text>
  <text x="415" y="70" text-anchor="middle" class="header">OOS 25%</text>
  <text x="545" y="70" text-anchor="middle" class="header">OOS 30%</text>

  <!-- Grid layout: row-label at x=130 center, cells at x=220, x=350, x=480, each cell 120x42 -->

  <!-- Row 1: 3 Runs -->
  <text x="155" y="105" text-anchor="middle" class="row-label">3 Runs</text>
  <!-- 75% yellow -->
  <rect x="220" y="82" width="130" height="34" rx="4" fill="#F57F17"/>
  <text x="285" y="105" text-anchor="middle" class="cell-text">75%</text>
  <!-- 82% green -->
  <rect x="350" y="82" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="415" y="105" text-anchor="middle" class="cell-text">82%</text>
  <!-- 85% green -->
  <rect x="480" y="82" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="545" y="105" text-anchor="middle" class="cell-text">85%</text>

  <!-- Row 2: 5 Runs -->
  <text x="155" y="150" text-anchor="middle" class="row-label">5 Runs</text>
  <!-- 80% green -->
  <rect x="220" y="127" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="285" y="150" text-anchor="middle" class="cell-text">80%</text>
  <!-- 88% green -->
  <rect x="350" y="127" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="415" y="150" text-anchor="middle" class="cell-text">88%</text>
  <!-- 90% green -->
  <rect x="480" y="127" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="545" y="150" text-anchor="middle" class="cell-text">90%</text>

  <!-- Row 3: 7 Runs -->
  <text x="155" y="195" text-anchor="middle" class="row-label">7 Runs</text>
  <!-- 83% green -->
  <rect x="220" y="172" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="285" y="195" text-anchor="middle" class="cell-text">83%</text>
  <!-- 91% green -->
  <rect x="350" y="172" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="415" y="195" text-anchor="middle" class="cell-text">91%</text>
  <!-- 87% green -->
  <rect x="480" y="172" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="545" y="195" text-anchor="middle" class="cell-text">87%</text>

  <!-- Row 4: 9 Runs -->
  <text x="155" y="240" text-anchor="middle" class="row-label">9 Runs</text>
  <!-- 78% yellow -->
  <rect x="220" y="217" width="130" height="34" rx="4" fill="#F57F17"/>
  <text x="285" y="240" text-anchor="middle" class="cell-text">78%</text>
  <!-- 85% green -->
  <rect x="350" y="217" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="415" y="240" text-anchor="middle" class="cell-text">85%</text>
  <!-- 84% green -->
  <rect x="480" y="217" width="130" height="34" rx="4" fill="#2E7D32"/>
  <text x="545" y="240" text-anchor="middle" class="cell-text">84%</text>

  <!-- Legend -->
  <rect x="170" y="278" width="16" height="16" rx="3" fill="#2E7D32"/>
  <text x="192" y="291" class="legend-text" fill="#4CAF50">&gt;= 80% = PASS</text>

  <rect x="310" y="278" width="16" height="16" rx="3" fill="#F57F17"/>
  <text x="332" y="291" class="legend-text" fill="#FFC107">60-79% = WARN</text>

  <rect x="460" y="278" width="16" height="16" rx="3" fill="#C62828"/>
  <text x="482" y="291" class="legend-text" fill="#F44336">&lt; 60% = FAIL</text>

  <!-- Horizontal separator -->
  <line x1="100" y1="310" x2="600" y2="310" stroke="#1a2a3a" stroke-width="1"/>

  <!-- Requirement note -->
  <text x="350" y="340" text-anchor="middle" class="note-text">Requirement: 4x4 contiguous area with &gt;= 9 cells at &gt;= 80% robustness</text>
</svg>