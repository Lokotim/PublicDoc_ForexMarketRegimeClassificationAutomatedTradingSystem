  <text x="680" y="92" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#64748B" font-weight="600">VRP / Z-SCORE</text>
  <line x1="40" y1="98" x2="760" y2="98" stroke="#475569" stroke-opacity="0.2" stroke-width="0.5"/>

