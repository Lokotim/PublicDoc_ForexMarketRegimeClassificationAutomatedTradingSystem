<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="ivBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <filter id="ivShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="ivGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.3" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="800" height="350" fill="url(#ivBg)" rx="12"/>
  <rect width="800" height="350" fill="url(#ivGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#00D4FF" letter-spacing="2">IV REGIME DASHBOARD</text>
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Current implied volatility regime map for 8 FX pairs</text>

  <!-- Legend -->
  <g transform="translate(120, 56)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#00D4FF" fill-opacity="0.3" stroke="#00D4FF" stroke-opacity="0.5" stroke-width="0.5"/>
    <text x="18" y="10" font-family="monospace" font-size="8" fill="#00D4FF">COMPLACENT</text>
    <rect x="130" y="0" width="12" height="12" rx="3" fill="#FBBF24" fill-opacity="0.3" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="0.5"/>
    <text x="148" y="10" font-family="monospace" font-size="8" fill="#FBBF24">PRICED</text>
    <rect x="230" y="0" width="12" height="12" rx="3" fill="#F87171" fill-opacity="0.3" stroke="#F87171" stroke-opacity="0.5" stroke-width="0.5"/>
    <text x="248" y="10" font-family="monospace" font-size="8" fill="#F87171">FEARFUL</text>
    <rect x="340" y="0" width="12" height="12" rx="3" fill="#7B68EE" fill-opacity="0.3" stroke="#7B68EE" stroke-opacity="0.5" stroke-width="0.5"/>
    <text x="358" y="10" font-family="monospace" font-size="8" fill="#7B68EE">SURPRISE</text>
    <rect x="460" y="0" width="12" height="12" rx="3" fill="#475569"/>
    <text x="478" y="10" font-family="monospace" font-size="8" fill="#94A3B8">VRP z-score</text>
  </g>

  <!-- Column headers -->
