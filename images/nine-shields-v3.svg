  <text x="250" y="426" font-family="Consolas" font-size="9" fill="#FFD54F">z>2s: WARNING   x50%</text>
  <text x="250" y="440" font-family="Consolas" font-size="9" fill="#F87171">z>4s: CRITICAL  x0%</text>
  <text x="250" y="460" font-family="Consolas" font-size="8" fill="#94A3B8">Fired 3x in production</text>

