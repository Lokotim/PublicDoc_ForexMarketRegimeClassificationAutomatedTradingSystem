  <rect x="240" y="200" width="210" height="145" rx="8" fill="#1A2520" stroke="#4ADE80" stroke-width="1.5" filter="url(#s3)"/>
  <g fill="none" stroke="#4ADE80" stroke-width="1.3" stroke-linecap="round">
