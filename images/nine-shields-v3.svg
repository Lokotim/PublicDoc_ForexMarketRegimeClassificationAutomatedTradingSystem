  <rect x="240" y="555" width="12" height="12" rx="2" fill="#4ADE80" opacity="0.6"/>
  <text x="258" y="565" font-family="Consolas" font-size="9" fill="#94A3B8">Strategy-driven</text>
  <rect x="370" y="555" width="12" height="12" rx="2" fill="#E879F9" opacity="0.6"/>
  <text x="388" y="565" font-family="Consolas" font-size="9" fill="#94A3B8">Macro-driven</text>

  <!-- Bottom label -->
  <text x="425" y="590" text-anchor="middle" font-family="Consolas" font-size="10" fill="#94A3B8">9 shields + 9 order guards = 18 independent safety checks per pipeline cycle</text>
