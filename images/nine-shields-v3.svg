  <text x="735" y="111" font-family="Consolas" font-size="8" fill="#E2E8F0">PreSubmit >5m</text>

  <rect x="700" y="124" width="125" height="22" rx="4" fill="#1A1A20" stroke="#FFD54F" stroke-width="0.8"/>
  <text x="715" y="139" font-family="Consolas" font-size="8" font-weight="bold" fill="#FFD54F">G2</text>
  <text x="735" y="139" font-family="Consolas" font-size="8" fill="#E2E8F0">Stuck >8h</text>

  <rect x="700" y="152" width="125" height="22" rx="4" fill="#1A1520" stroke="#F87171" stroke-width="0.8"/>
  <text x="715" y="167" font-family="Consolas" font-size="8" font-weight="bold" fill="#F87171">G3</text>
  <text x="735" y="167" font-family="Consolas" font-size="8" fill="#E2E8F0">AOE cycling</text>

  <rect x="700" y="180" width="125" height="22" rx="4" fill="#1A1520" stroke="#F87171" stroke-width="0.8"/>
  <text x="715" y="195" font-family="Consolas" font-size="8" font-weight="bold" fill="#F87171">G4</text>
  <text x="735" y="195" font-family="Consolas" font-size="8" fill="#E2E8F0">Funds &lt;0</text>

  <rect x="700" y="208" width="125" height="22" rx="4" fill="#1A1A20" stroke="#FFD54F" stroke-width="0.8"/>
