  <text x="762" y="65" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#E2E8F0">RME GUARD v4</text>
  <text x="762" y="80" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">Order Execution Layer</text>
