  <text x="735" y="223" font-family="Consolas" font-size="8" fill="#E2E8F0">Order doubling</text>

  <rect x="700" y="236" width="125" height="22" rx="4" fill="#1A2520" stroke="#4ADE80" stroke-width="0.8"/>
  <text x="715" y="251" font-family="Consolas" font-size="8" font-weight="bold" fill="#4ADE80">G6</text>
  <text x="735" y="251" font-family="Consolas" font-size="8" fill="#E2E8F0">Recovery info</text>

  <rect x="700" y="264" width="125" height="22" rx="4" fill="#1A1520" stroke="#F87171" stroke-width="0.8"/>
  <text x="715" y="279" font-family="Consolas" font-size="8" font-weight="bold" fill="#F87171">G7</text>
  <text x="735" y="279" font-family="Consolas" font-size="8" fill="#E2E8F0">CSV mismatch</text>

  <rect x="700" y="292" width="125" height="22" rx="4" fill="#1A1520" stroke="#F87171" stroke-width="0.8"/>
  <text x="715" y="307" font-family="Consolas" font-size="8" font-weight="bold" fill="#F87171">G8</text>
