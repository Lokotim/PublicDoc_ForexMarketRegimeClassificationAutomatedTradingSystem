  <text x="250" y="257" font-family="Consolas" font-size="9" fill="#E2E8F0">NaN detection</text>
  <text x="250" y="271" font-family="Consolas" font-size="9" fill="#E2E8F0">Stale timestamp reject</text>
  <text x="250" y="285" font-family="Consolas" font-size="9" fill="#E2E8F0">Anomalous readings (>5s)</text>
  <text x="250" y="305" font-family="Consolas" font-size="8" fill="#94A3B8">Garbage-in-garbage-out guard</text>

