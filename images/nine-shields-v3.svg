  <text x="718" y="386" font-family="Consolas" font-size="7" fill="#94A3B8">WARNING</text>
  <rect x="705" y="393" width="8" height="8" rx="2" fill="#4ADE80" opacity="0.6"/>
  <text x="718" y="401" font-family="Consolas" font-size="7" fill="#94A3B8">INFO</text>

