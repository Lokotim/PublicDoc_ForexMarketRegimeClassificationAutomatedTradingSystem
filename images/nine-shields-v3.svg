<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 600" width="850" height="600">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="s3">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="redGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F87171" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="850" height="600" fill="url(#bg3)" rx="12"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#E2E8F0">THE NINE SHIELDS -- Independent Safety Layers</text>

  <!-- 3x3 Grid of shield cards -->
  <!-- Row 1 -->
  <!-- Shield 1: PnL Circuit Breaker (red/emergency) — lightning bolt icon -->
  <rect x="20" y="45" width="210" height="145" rx="8" fill="#1A1520" stroke="#F87171" stroke-width="1.5" filter="url(#s3)"/>
  <path d="M58,54 L52,70 L57,70 L50,86 L62,68 L56,68 L63,54 Z" fill="none" stroke="#F87171" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="80" y="62" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#F87171">S1: PnL Circuit Breaker</text>
  <text x="80" y="76" font-family="Segoe UI" font-size="9" fill="#94A3B8">EMERGENCY</text>
  <line x1="30" y1="88" x2="220" y2="88" stroke="#F87171" stroke-width="0.5" opacity="0.3"/>
  <text x="30" y="102" font-family="Consolas" font-size="9" fill="#E2E8F0">>-3%: NORMAL   100%</text>
  <text x="30" y="116" font-family="Consolas" font-size="9" fill="#FFD54F">-3%~-5%: CAUTION 50%</text>
  <text x="30" y="130" font-family="Consolas" font-size="9" fill="#F87171">&lt;-5%: HALT       0%</text>
  <text x="30" y="150" font-family="Consolas" font-size="8" fill="#94A3B8">24h rolling | all accounts</text>
  <rect x="30" y="160" width="190" height="6" rx="2" fill="#1E293B"/>
  <rect x="30" y="160" width="95" height="6" rx="2" fill="#F87171" opacity="0.6"/>
  <rect x="30" y="160" width="57" height="6" rx="2" fill="#FFD54F" opacity="0.6"/>

  <!-- Shield 2: White Swan (amber/market) — swan icon -->
  <rect x="240" y="45" width="210" height="145" rx="8" fill="#1A1A20" stroke="#FFD54F" stroke-width="1.5" filter="url(#s3)"/>
  <path d="M267,84 Q267,65 275,58 Q278,62 276,68 Q282,60 285,58 Q283,66 280,70 Q286,72 288,80 Q284,78 278,78 Q274,82 267,84 Z" fill="none" stroke="#FFD54F" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="300" y="62" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#FFD54F">S2: White Swan</text>
  <text x="300" y="76" font-family="Segoe UI" font-size="9" fill="#94A3B8">MARKET-DRIVEN</text>
  <line x1="250" y1="88" x2="440" y2="88" stroke="#FFD54F" stroke-width="0.5" opacity="0.3"/>
  <text x="250" y="102" font-family="Consolas" font-size="9" fill="#4ADE80">RECOVERY: Kelly x1.05</text>
  <text x="250" y="116" font-family="Consolas" font-size="9" fill="#F87171">SHOCK:    Kelly x0.70</text>
  <text x="250" y="136" font-family="Consolas" font-size="8" fill="#94A3B8">Detects opportunity vs threat</text>
  <text x="250" y="150" font-family="Consolas" font-size="8" fill="#94A3B8">in volatile regimes</text>

  <!-- Shield 3: Crowding Penalty (amber/market) — crowd/people icon -->
  <rect x="460" y="45" width="210" height="145" rx="8" fill="#1A1A20" stroke="#FFD54F" stroke-width="1.5" filter="url(#s3)"/>
  <g fill="none" stroke="#FFD54F" stroke-width="1.3">
    <circle cx="488" cy="60" r="4"/><path d="M481,75 Q481,68 488,68 Q495,68 495,75"/>
    <circle cx="502" cy="60" r="4"/><path d="M495,75 Q495,68 502,68 Q509,68 509,75"/>
    <line x1="498" y1="56" x2="498" y2="80" stroke-dasharray="2,2" opacity="0.5"/>
  </g>
  <text x="520" y="62" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#FFD54F">S3: Crowding Penalty</text>
  <text x="520" y="76" font-family="Segoe UI" font-size="9" fill="#94A3B8">A/B TESTED</text>
  <line x1="470" y1="88" x2="660" y2="88" stroke="#FFD54F" stroke-width="0.5" opacity="0.3"/>
  <text x="470" y="102" font-family="Consolas" font-size="9" fill="#E2E8F0">Live A/B split cohorts</text>
  <text x="470" y="116" font-family="Consolas" font-size="9" fill="#E2E8F0">Sortino comparison</text>
  <text x="470" y="130" font-family="Consolas" font-size="9" fill="#E2E8F0">Auto-adjusting threshold</text>
  <text x="470" y="150" font-family="Consolas" font-size="8" fill="#94A3B8">Only shield that tests itself</text>

