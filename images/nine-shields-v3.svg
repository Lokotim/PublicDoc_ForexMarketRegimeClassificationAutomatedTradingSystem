  <text x="470" y="257" font-family="Consolas" font-size="9" fill="#4ADE80">80+: GREEN  x1.00</text>
  <text x="470" y="271" font-family="Consolas" font-size="9" fill="#00D4FF">60+: CYAN   x0.75</text>
  <text x="470" y="285" font-family="Consolas" font-size="9" fill="#FFD54F">40+: ORANGE x0.50</text>
  <text x="470" y="299" font-family="Consolas" font-size="9" fill="#F87171">20+: RED    x0.25</text>
  <text x="470" y="313" font-family="Consolas" font-size="8" fill="#94A3B8">10+: PROB x0.10 | &lt;10: x0.00</text>

