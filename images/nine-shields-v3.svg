  <rect x="20" y="200" width="210" height="145" rx="8" fill="#1A1520" stroke="#F87171" stroke-width="1.5" filter="url(#s3)"/>
  <g fill="none" stroke="#F87171" stroke-width="1.5" stroke-linecap="round">
    <path d="M45,215 L65,235"/><path d="M60,215 L65,215 L65,220"/>
    <path d="M65,215 L45,235"/><path d="M45,230 L45,235 L50,235"/>
  </g>
  <text x="80" y="217" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#F87171">S4: IBKR Cross-Val</text>
  <text x="80" y="231" font-family="Segoe UI" font-size="9" fill="#94A3B8">EMERGENCY</text>
  <line x1="30" y1="243" x2="220" y2="243" stroke="#F87171" stroke-width="0.5" opacity="0.3"/>
  <text x="30" y="257" font-family="Consolas" font-size="9" fill="#E2E8F0">Broker vs pipeline state</text>
  <text x="30" y="271" font-family="Consolas" font-size="9" fill="#E2E8F0">Per-unit reconciliation</text>
  <text x="30" y="285" font-family="Consolas" font-size="9" fill="#F87171">Discrepancy = CRITICAL</text>
  <text x="30" y="305" font-family="Consolas" font-size="8" fill="#94A3B8">Defers to broker state</text>

