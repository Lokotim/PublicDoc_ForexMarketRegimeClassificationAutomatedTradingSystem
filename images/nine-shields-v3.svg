  <text x="470" y="454" font-family="Consolas" font-size="9" fill="#00D4FF">RECOVERY:   x110%</text>
  <text x="470" y="470" font-family="Consolas" font-size="8" fill="#94A3B8">Slowest-moving shield</text>

