<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="mrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <filter id="mrShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="mrGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00D4FF" flood-opacity="0.3"/>
    </filter>
    <marker id="mrArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#00D4FF" opacity="0.5"/>
    </marker>
    <marker id="mrArrowG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M 0 0 L 7 2.5 L 0 5 Z" fill="#475569"/>
    </marker>
    <pattern id="mrGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.3" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#mrBg)" rx="12"/>
  <rect width="800" height="400" fill="url(#mrGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#00D4FF" letter-spacing="2">META-SIGNAL RESOLVER</text>
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Weighted arbitration across 3 decision engines with agreement detection</text>

  <!-- ===== 3 INPUT SIGNALS ===== -->
  <!-- ML Ensemble (46%) -->
  <g filter="url(#mrShadow)">
    <rect x="40" y="65" width="200" height="80" rx="10" fill="#16213E" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="40" y="65" width="200" height="24" rx="10" fill="#4ADE80" fill-opacity="0.1"/>
    <text x="140" y="83" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4ADE80" font-weight="700">ML Ensemble</text>
    <line x1="50" y1="89" x2="230" y2="89" stroke="#4ADE80" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="140" y="107" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0">5-Model MoE output</text>
    <text x="140" y="121" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0">regime + direction + conf</text>
    <!-- Weight badge -->
    <rect x="162" y="128" width="68" height="14" rx="7" fill="#4ADE80" fill-opacity="0.2" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="0.5"/>
    <text x="196" y="139" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ADE80" font-weight="700">46%</text>
  </g>

  <!-- Markov Forecast (38%) -->
  <g filter="url(#mrShadow)">
    <rect x="300" y="65" width="200" height="80" rx="10" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="300" y="65" width="200" height="24" rx="10" fill="#7B68EE" fill-opacity="0.1"/>
    <text x="400" y="83" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7B68EE" font-weight="700">Markov Forecast</text>
    <line x1="310" y1="89" x2="490" y2="89" stroke="#7B68EE" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="400" y="107" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0">4-day regime projection</text>
    <text x="400" y="121" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0">strategy assignment</text>
    <rect x="422" y="128" width="68" height="14" rx="7" fill="#7B68EE" fill-opacity="0.2" stroke="#7B68EE" stroke-opacity="0.4" stroke-width="0.5"/>
    <text x="456" y="139" text-anchor="middle" font-family="monospace" font-size="9" fill="#7B68EE" font-weight="700">38%</text>
  </g>

  <!-- RL Agent (16%) -->
  <g filter="url(#mrShadow)">
    <rect x="560" y="65" width="200" height="80" rx="10" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="560" y="65" width="200" height="24" rx="10" fill="#FF6B35" fill-opacity="0.1"/>
    <text x="660" y="83" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FF6B35" font-weight="700">RL Agent</text>
    <line x1="570" y1="89" x2="750" y2="89" stroke="#FF6B35" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="660" y="107" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0">Q-learning decision</text>
    <text x="660" y="121" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0">progressive trust</text>
    <rect x="682" y="128" width="68" height="14" rx="7" fill="#FF6B35" fill-opacity="0.2" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="0.5"/>
    <text x="716" y="139" text-anchor="middle" font-family="monospace" font-size="9" fill="#FF6B35" font-weight="700">16%</text>
  </g>

  <!-- Arrows to decision box -->
  <g stroke-width="1.5" fill="none" marker-end="url(#mrArrow)">
    <line x1="140" y1="145" x2="310" y2="188" stroke="#4ADE80" opacity="0.4"/>
    <line x1="400" y1="145" x2="400" y2="188" stroke="#7B68EE" opacity="0.4"/>
    <line x1="660" y1="145" x2="490" y2="188" stroke="#FF6B35" opacity="0.4"/>
  </g>

  <!-- ===== DECISION LOGIC BOX ===== -->
  <g filter="url(#mrGlow)">
    <rect x="200" y="192" width="400" height="60" rx="12" fill="#0A1628" stroke="#00D4FF" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="400" y="216" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00D4FF" font-weight="800">Weighted Arbitration + Agreement Detection</text>
    <text x="400" y="236" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0" opacity="0.8">final_signal = 0.46*ML + 0.38*Forecast + 0.16*RL | agreement_level = concordance(3 engines)</text>
  </g>

  <!-- Arrows to output categories -->
  <g stroke="#475569" stroke-width="0.8" fill="none" marker-end="url(#mrArrowG)" opacity="0.4">
    <line x1="300" y1="252" x2="130" y2="285"/>
    <line x1="360" y1="252" x2="320" y2="285"/>
    <line x1="440" y1="252" x2="500" y2="285"/>
    <line x1="500" y1="252" x2="670" y2="285"/>
  </g>

  <!-- ===== OUTPUT CATEGORIES ===== -->
  <!-- UNANIMOUS (green) -->
  <g filter="url(#mrShadow)">
    <rect x="40" y="288" width="170" height="55" rx="8" fill="#16213E" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="40" y="288" width="170" height="20" rx="8" fill="#4ADE80" fill-opacity="0.15"/>
    <text x="125" y="303" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4ADE80" font-weight="700">UNANIMOUS</text>
    <text x="125" y="322" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">3/3 engines agree</text>
    <text x="125" y="336" text-anchor="middle" font-family="monospace" font-size="8" fill="#4ADE80">size x 1.20</text>
  </g>

  <!-- MAJORITY (yellow) -->
  <g filter="url(#mrShadow)">
    <rect x="230" y="288" width="170" height="55" rx="8" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="230" y="288" width="170" height="20" rx="8" fill="#FBBF24" fill-opacity="0.12"/>
    <text x="315" y="303" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FBBF24" font-weight="700">MAJORITY</text>
    <text x="315" y="322" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">2/3 engines agree</text>
    <text x="315" y="336" text-anchor="middle" font-family="monospace" font-size="8" fill="#FBBF24">size x 1.00</text>
  </g>

  <!-- SPLIT (orange) -->
  <g filter="url(#mrShadow)">
    <rect x="420" y="288" width="170" height="55" rx="8" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="420" y="288" width="170" height="20" rx="8" fill="#FF6B35" fill-opacity="0.12"/>
    <text x="505" y="303" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FF6B35" font-weight="700">SPLIT</text>
    <text x="505" y="322" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">No clear majority</text>
    <text x="505" y="336" text-anchor="middle" font-family="monospace" font-size="8" fill="#FF6B35">size x 0.50</text>
  </g>

  <!-- FLAT (red) -->
  <g filter="url(#mrShadow)">
    <rect x="610" y="288" width="170" height="55" rx="8" fill="#16213E" stroke="#F87171" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="610" y="288" width="170" height="20" rx="8" fill="#F87171" fill-opacity="0.12"/>
    <text x="695" y="303" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F87171" font-weight="700">FLAT</text>
    <text x="695" y="322" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">Conflicting + low conf</text>
    <text x="695" y="336" text-anchor="middle" font-family="monospace" font-size="8" fill="#F87171">NO TRADE</text>
  </g>

  <!-- Sizing multiplier formula -->
  <rect x="200" y="360" width="400" height="24" rx="12" fill="#16213E" stroke="#00D4FF" stroke-opacity="0.2" stroke-width="0.5"/>
  <text x="400" y="376" text-anchor="middle" font-family="monospace" font-size="8" fill="#00D4FF">position_size = base_size x agreement_multiplier x confidence</text>

  <!-- Border -->
</svg>