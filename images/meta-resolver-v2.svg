<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1629"/>
    </linearGradient>
    <linearGradient id="mlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="fcstGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="rlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="resolverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">Meta-Signal Resolver</text>
  <text x="400" y="52" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="11">4-Source Weighted Ensemble with Adaptive Learning</text>

  <!-- ===== SOURCE BOXES (left column) ===== -->
  <!-- ML Classifier -->
  <rect x="30" y="80" width="170" height="80" rx="8" fill="url(#mlGrad)" filter="url(#softShadow)" opacity="0.95"/>
  <text x="115" y="104" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">ML Classifier</text>
  <text x="115" y="122" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="10">MoE + 5 Sub-Models</text>
  <rect x="70" y="133" width="90" height="20" rx="10" fill="rgba(0,0,0,0.3)"/>
  <text x="115" y="147" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">40% default</text>

  <!-- 4-Day Forecast -->
  <rect x="30" y="175" width="170" height="80" rx="8" fill="url(#fcstGrad)" filter="url(#softShadow)" opacity="0.95"/>
  <text x="115" y="199" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4-Day Forecast</text>
  <text x="115" y="217" text-anchor="middle" fill="#cffafe" font-family="Segoe UI, Arial, sans-serif" font-size="10">Markov Chain Forecast</text>
  <rect x="70" y="228" width="90" height="20" rx="10" fill="rgba(0,0,0,0.3)"/>
  <text x="115" y="242" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">30% default</text>

  <!-- RL Agent -->
  <rect x="30" y="270" width="170" height="80" rx="8" fill="url(#rlGrad)" filter="url(#softShadow)" opacity="0.95"/>
  <text x="115" y="294" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">RL Agent</text>
  <text x="115" y="312" text-anchor="middle" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="10">Q-Learning Policy</text>
  <rect x="70" y="323" width="90" height="20" rx="10" fill="rgba(0,0,0,0.3)"/>
  <text x="115" y="337" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">21% default</text>

  <!-- Paper Consensus (NEW) -->
  <rect x="30" y="365" width="170" height="80" rx="8" fill="url(#paperGrad)" filter="url(#softShadow)" opacity="0.95"/>
  <rect x="148" y="367" width="46" height="16" rx="8" fill="#dc2626"/>
  <text x="171" y="378" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700">NEW</text>
  <text x="115" y="394" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Paper Consensus</text>
  <text x="115" y="412" text-anchor="middle" fill="#fef3c7" font-family="Segoe UI, Arial, sans-serif" font-size="10">32 MCPT, PnL-Weighted</text>
  <rect x="70" y="418" width="90" height="20" rx="10" fill="rgba(0,0,0,0.3)"/>
  <text x="115" y="432" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">9% default</text>

  <!-- ===== FLOW ARROWS (sources to resolver) ===== -->
  <line x1="200" y1="120" x2="278" y2="205" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.7"/>
  <polygon points="274,200 283,208 273,208" fill="#3b82f6" fill-opacity="0.7"/>

  <line x1="200" y1="215" x2="278" y2="218" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.7"/>
  <polygon points="276,213 284,218 276,223" fill="#06b6d4" fill-opacity="0.7"/>

  <line x1="200" y1="310" x2="278" y2="237" stroke="#8b5cf6" stroke-width="2.5" stroke-opacity="0.7"/>
  <polygon points="274,241 283,234 273,232" fill="#8b5cf6" fill-opacity="0.7"/>

  <line x1="200" y1="405" x2="278" y2="252" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.7"/>
  <polygon points="274,255 283,248 273,247" fill="#f59e0b" fill-opacity="0.7"/>

  <!-- ===== CENTRAL RESOLVER NODE ===== -->
  <rect x="280" y="160" width="200" height="130" rx="12" fill="url(#resolverGrad)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="380" y="185" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Weighted Resolver</text>
  <line x1="305" y1="193" x2="455" y2="193" stroke="#334155" stroke-width="1"/>
  <text x="380" y="212" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="9">Weighted Consensus</text>
  <text x="380" y="228" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="9">w_ml*ML + w_fcst*Fcst</text>
  <text x="380" y="241" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="9">+ w_rl*RL + w_paper*Paper</text>
  <text x="380" y="262" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9">Echo Detection + Agreement</text>
  <text x="380" y="278" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9">Hourly Weight Learning</text>

  <!-- ===== ARROW RESOLVER TO OUTPUT ===== -->
  <line x1="480" y1="225" x2="530" y2="225" stroke="#22c55e" stroke-width="2.5" stroke-opacity="0.8"/>
  <polygon points="528,220 536,225 528,230" fill="#22c55e" fill-opacity="0.8"/>

  <!-- ===== OUTPUT SECTION ===== -->
  <rect x="536" y="76" width="240" height="265" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#softShadow)"/>
  <text x="656" y="97" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Agreement Taxonomy</text>
  <line x1="556" y1="105" x2="756" y2="105" stroke="#1e293b" stroke-width="1"/>

  <!-- UNANIMOUS -->
  <rect x="556" y="115" width="200" height="32" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1"/>
  <circle cx="572" cy="131" r="5" fill="#22c55e"/>
  <text x="585" y="128" fill="#22c55e" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">UNANIMOUS</text>
  <text x="585" y="140" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="9">4/4 agree</text>
  <text x="745" y="134" text-anchor="end" fill="#22c55e" font-family="Consolas, monospace" font-size="11" font-weight="600">x1.20</text>

  <!-- STRONG -->
  <rect x="556" y="155" width="200" height="32" rx="6" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="572" cy="171" r="5" fill="#3b82f6"/>
  <text x="585" y="168" fill="#3b82f6" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">STRONG</text>
  <text x="585" y="180" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="9">3/4 agree</text>
  <text x="745" y="174" text-anchor="end" fill="#3b82f6" font-family="Consolas, monospace" font-size="11" font-weight="600">x1.00</text>

  <!-- MAJORITY -->
  <rect x="556" y="195" width="200" height="32" rx="6" fill="rgba(234,179,8,0.12)" stroke="#eab308" stroke-width="1"/>
  <circle cx="572" cy="211" r="5" fill="#eab308"/>
  <text x="585" y="208" fill="#eab308" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">MAJORITY</text>
  <text x="585" y="220" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="9">2/4 agree + confidence</text>
  <text x="745" y="214" text-anchor="end" fill="#eab308" font-family="Consolas, monospace" font-size="11" font-weight="600">x0.75</text>

  <!-- SPLIT -->
  <rect x="556" y="235" width="200" height="32" rx="6" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1"/>
  <circle cx="572" cy="251" r="5" fill="#ef4444"/>
  <text x="585" y="248" fill="#ef4444" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">SPLIT</text>
  <text x="585" y="260" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="9">No majority</text>
  <text x="745" y="254" text-anchor="end" fill="#ef4444" font-family="Consolas, monospace" font-size="11" font-weight="600">x0.50</text>

  <!-- TRACK PENALTY -->
  <rect x="556" y="275" width="200" height="32" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1"/>
  <circle cx="572" cy="291" r="5" fill="#64748b"/>
  <text x="585" y="288" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">TRACK PENALTY</text>
  <text x="585" y="300" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="9">WR &lt;35% over 30d</text>
  <text x="745" y="294" text-anchor="end" fill="#64748b" font-family="Consolas, monospace" font-size="11" font-weight="600">~0</text>

  <!-- ===== ECHO DETECTION BADGES ===== -->
  <rect x="280" y="310" width="200" height="60" rx="8" fill="rgba(15,23,42,0.8)" stroke="#334155" stroke-width="1"/>
  <text x="380" y="328" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Echo Detection</text>
  <rect x="293" y="337" width="82" height="18" rx="9" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="334" y="350" text-anchor="middle" fill="#06b6d4" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600">Fcst -60%</text>
  <rect x="385" y="337" width="82" height="18" rx="9" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="426" y="350" text-anchor="middle" fill="#f59e0b" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600">Paper -40%</text>

  <!-- ===== OUTPUT PER PAIR ===== -->
  <rect x="536" y="355" width="240" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="656" y="373" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Output per Pair</text>
  <text x="556" y="392" fill="#94a3b8" font-family="Consolas, monospace" font-size="9">direction(L/S) | strategy(TF/MR)</text>
  <text x="556" y="406" fill="#94a3b8" font-family="Consolas, monospace" font-size="9">confidence | agreement | sizing_mult</text>

  <!-- ===== WEIGHT LEARNING LOOP (bottom) ===== -->
  <rect x="250" y="385" width="240" height="46" rx="8" fill="rgba(15,23,42,0.7)" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="370" y="404" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Adaptive Weight Learning</text>
  <text x="370" y="420" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9">Hourly PnL attribution | Paper cap: 25% max</text>

  <!-- Curved feedback arrow -->
  <path d="M 370 431 Q 370 465 480 465 Q 590 465 620 430" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="618,434 624,428 616,426" fill="#475569"/>
  <text x="500" y="478" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="8">PnL feedback loop</text>

  <!-- ===== WEIGHT BAR (bottom-left) ===== -->
  <rect x="30" y="460" width="170" height="26" rx="6" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <rect x="34" y="464" width="66" height="18" rx="4" fill="rgba(59,130,246,0.4)"/>
  <rect x="100" y="464" width="49" height="18" rx="0" fill="rgba(6,182,212,0.4)"/>
  <rect x="149" y="464" width="34" height="18" rx="0" fill="rgba(139,92,246,0.4)"/>
  <rect x="183" y="464" width="13" height="18" rx="4" fill="rgba(245,158,11,0.4)"/>
  <text x="67" y="477" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600">40%</text>
  <text x="125" y="477" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600">30%</text>
  <text x="166" y="477" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600">21%</text>
  <text x="190" y="477" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600">9%</text>
</svg>