<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#071225"/>
    </linearGradient>
    <linearGradient id="chainGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#64ffda" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="chainGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4ADE80" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="chainGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7B32B" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#F7B32B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F7B32B" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="chainGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFD54F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bellGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="sh5">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glw5">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8892b0"/>
    </marker>
    <marker id="arr5g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64ffda"/>
    </marker>
    <marker id="arr5r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b6b"/>
    </marker>
    <marker id="arr5ok" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ADE80"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="620" fill="url(#bg5)" rx="8"/>

  <!-- Title -->
  <text x="425" y="36" text-anchor="middle" fill="#ccd6f6" font-size="18" font-weight="700">Bayesian MCMC Weight Calibration</text>
  <line x1="260" y1="46" x2="590" y2="46" stroke="#F7B32B" stroke-width="2" opacity="0.5"/>

  <!-- === LEFT SECTION: 4 Parallel MCMC Chains === -->
  <text x="140" y="75" text-anchor="middle" fill="#8892b0" font-size="11" font-weight="600" letter-spacing="1.5">4 PARALLEL MCMC CHAINS</text>

  <!-- Chain 1 -->
  <rect x="20" y="92" width="240" height="55" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.2" filter="url(#sh5)"/>
  <circle cx="42" cy="119" r="12" fill="#0d1b30" stroke="#64ffda" stroke-width="1.5"/>
  <text x="42" y="123" text-anchor="middle" fill="#64ffda" font-size="10" font-weight="700">1</text>
  <text x="70" y="112" fill="#ccd6f6" font-size="11" font-weight="600">Chain 1</text>
  <text x="70" y="128" fill="#8892b0" font-size="9">5,000 iterations</text>
  <!-- Mini trace line -->
  <rect x="160" y="100" width="90" height="38" rx="3" fill="#0d1b30"/>
  <polyline points="165,130 175,118 185,125 195,110 205,115 215,108 225,112 235,105 245,108" stroke="#64ffda" stroke-width="1.2" fill="none" opacity="0.8"/>
  <text x="205" y="97" text-anchor="middle" fill="#64ffda" font-size="7" opacity="0.7">trace</text>

  <!-- Chain 2 -->
  <rect x="20" y="155" width="240" height="55" rx="6" fill="#112240" stroke="#4ADE80" stroke-width="1.2" filter="url(#sh5)"/>
  <circle cx="42" cy="182" r="12" fill="#0d1b30" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="42" y="186" text-anchor="middle" fill="#4ADE80" font-size="10" font-weight="700">2</text>
  <text x="70" y="175" fill="#ccd6f6" font-size="11" font-weight="600">Chain 2</text>
  <text x="70" y="191" fill="#8892b0" font-size="9">5,000 iterations</text>
  <rect x="160" y="163" width="90" height="38" rx="3" fill="#0d1b30"/>
  <polyline points="165,192 175,185 185,178 195,182 205,176 215,172 225,175 235,170 245,172" stroke="#4ADE80" stroke-width="1.2" fill="none" opacity="0.8"/>
  <text x="205" y="160" text-anchor="middle" fill="#4ADE80" font-size="7" opacity="0.7">trace</text>

  <!-- Chain 3 -->
  <rect x="20" y="218" width="240" height="55" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.2" filter="url(#sh5)"/>
  <circle cx="42" cy="245" r="12" fill="#0d1b30" stroke="#F7B32B" stroke-width="1.5"/>
  <text x="42" y="249" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="700">3</text>
  <text x="70" y="238" fill="#ccd6f6" font-size="11" font-weight="600">Chain 3</text>
  <text x="70" y="254" fill="#8892b0" font-size="9">5,000 iterations</text>
  <rect x="160" y="226" width="90" height="38" rx="3" fill="#0d1b30"/>
  <polyline points="165,255 175,250 185,240 195,245 205,238 215,235 225,237 235,233 245,235" stroke="#F7B32B" stroke-width="1.2" fill="none" opacity="0.8"/>
  <text x="205" y="223" text-anchor="middle" fill="#F7B32B" font-size="7" opacity="0.7">trace</text>

  <!-- Chain 4 -->
  <rect x="20" y="281" width="240" height="55" rx="6" fill="#112240" stroke="#FFD54F" stroke-width="1.2" filter="url(#sh5)"/>
  <circle cx="42" cy="308" r="12" fill="#0d1b30" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="42" y="312" text-anchor="middle" fill="#FFD54F" font-size="10" font-weight="700">4</text>
  <text x="70" y="301" fill="#ccd6f6" font-size="11" font-weight="600">Chain 4</text>
  <text x="70" y="317" fill="#8892b0" font-size="9">5,000 iterations</text>
  <rect x="160" y="289" width="90" height="38" rx="3" fill="#0d1b30"/>
  <polyline points="165,320 175,312 185,305 195,310 205,302 215,298 225,300 235,296 245,298" stroke="#FFD54F" stroke-width="1.2" fill="none" opacity="0.8"/>
  <text x="205" y="286" text-anchor="middle" fill="#FFD54F" font-size="7" opacity="0.7">trace</text>

  <!-- Total iterations -->
  <rect x="50" y="346" width="180" height="26" rx="13" fill="#0d1b30" stroke="#233554" stroke-width="1"/>
  <text x="140" y="363" text-anchor="middle" fill="#8892b0" font-size="10">Total: <tspan fill="#64ffda" font-weight="700">20,000</tspan> samples</text>

  <!-- Arrow chains to posterior -->
  <line x1="260" y1="200" x2="310" y2="200" stroke="#8892b0" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- === CENTER: Posterior Distribution === -->
  <rect x="315" y="82" width="220" height="275" rx="8" fill="#112240" stroke="#64ffda" stroke-width="1.5" filter="url(#sh5)"/>
  <rect x="315" y="82" width="220" height="28" rx="8" fill="#0f2a1a"/>
  <rect x="315" y="102" width="220" height="8" fill="#0f2a1a"/>
  <text x="425" y="101" text-anchor="middle" fill="#64ffda" font-size="12" font-weight="700">Posterior Distribution</text>

  <!-- Bell curve -->
  <rect x="335" y="125" width="180" height="130" rx="4" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
  <!-- Axes -->
  <line x1="355" y1="240" x2="505" y2="240" stroke="#8892b0" stroke-width="0.8"/>
  <line x1="355" y1="140" x2="355" y2="240" stroke="#8892b0" stroke-width="0.8"/>
  <!-- Bell curve shape -->
  <path d="M 360,238 C 370,237 380,235 390,228 C 400,218 410,195 420,170 C 425,158 428,150 430,148 C 432,150 435,158 440,170 C 450,195 460,218 470,228 C 480,235 490,237 500,238"
        stroke="#64ffda" stroke-width="2" fill="url(#bellGrad)" opacity="0.9"/>
  <!-- Mean line -->
  <line x1="430" y1="140" x2="430" y2="240" stroke="#F7B32B" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <text x="430" y="137" text-anchor="middle" fill="#F7B32B" font-size="8">mean</text>
  <!-- Sigma markers -->
  <line x1="400" y1="235" x2="400" y2="240" stroke="#8892b0" stroke-width="0.8"/>
  <text x="400" y="250" text-anchor="middle" fill="#8892b0" font-size="7">-1s</text>
  <line x1="460" y1="235" x2="460" y2="240" stroke="#8892b0" stroke-width="0.8"/>
  <text x="460" y="250" text-anchor="middle" fill="#8892b0" font-size="7">+1s</text>
  <!-- Credible interval -->
  <line x1="393" y1="215" x2="467" y2="215" stroke="#F7B32B" stroke-width="1.5"/>
  <line x1="393" y1="210" x2="393" y2="220" stroke="#F7B32B" stroke-width="1"/>
  <line x1="467" y1="210" x2="467" y2="220" stroke="#F7B32B" stroke-width="1"/>
  <text x="430" y="212" text-anchor="middle" fill="#F7B32B" font-size="7" font-weight="600">95% CI</text>

  <text x="425" y="278" text-anchor="middle" fill="#8892b0" font-size="9">Burn-in: first 1,000 discarded</text>
  <text x="425" y="294" text-anchor="middle" fill="#8892b0" font-size="9">Thinning: every 5th sample kept</text>

  <!-- Key stats -->
  <rect x="335" y="305" width="84" height="34" rx="4" fill="#0d1b30" stroke="#233554" stroke-width="1"/>
  <text x="377" y="320" text-anchor="middle" fill="#8892b0" font-size="8">MAP estimate</text>
  <text x="377" y="334" text-anchor="middle" fill="#64ffda" font-size="10" font-weight="700">optimal w</text>

  <rect x="431" y="305" width="84" height="34" rx="4" fill="#0d1b30" stroke="#233554" stroke-width="1"/>
  <text x="473" y="320" text-anchor="middle" fill="#8892b0" font-size="8">Uncertainty</text>
  <text x="473" y="334" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="700">std(w)</text>

  <!-- Arrow posterior to convergence -->
  <line x1="535" y1="200" x2="570" y2="200" stroke="#8892b0" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- === RIGHT: Gelman-Rubin Convergence === -->
  <rect x="575" y="82" width="255" height="275" rx="8" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#sh5)"/>
  <rect x="575" y="82" width="255" height="28" rx="8" fill="#2a1f10"/>
  <rect x="575" y="102" width="255" height="8" fill="#2a1f10"/>
  <text x="702" y="101" text-anchor="middle" fill="#F7B32B" font-size="12" font-weight="700">Gelman-Rubin Check</text>

  <!-- R-hat visualization -->
  <text x="702" y="132" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">R-hat Convergence Diagnostic</text>

  <!-- R-hat gauge -->
  <rect x="600" y="145" width="205" height="80" rx="4" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
  <!-- Scale bar -->
  <rect x="620" y="185" width="165" height="12" rx="6" fill="#233554"/>
  <rect x="620" y="185" width="82" height="12" rx="6" fill="#4ADE80" opacity="0.6"/>
  <rect x="702" y="185" width="20" height="12" fill="#F7B32B" opacity="0.6"/>
  <rect x="722" y="185" width="63" height="12" rx="6" fill="#ff6b6b" opacity="0.4"/>
  <!-- Scale labels -->
  <text x="620" y="212" fill="#8892b0" font-size="8">1.0</text>
  <text x="702" y="212" text-anchor="middle" fill="#F7B32B" font-size="8" font-weight="700">1.1</text>
  <text x="785" y="212" text-anchor="end" fill="#8892b0" font-size="8">1.5</text>
  <!-- Marker arrow for current value -->
  <polygon points="665,183 670,175 675,183" fill="#64ffda"/>
  <text x="670" y="170" text-anchor="middle" fill="#64ffda" font-size="9" font-weight="700">1.02</text>
  <!-- Labels -->
  <text x="660" y="160" text-anchor="middle" fill="#4ADE80" font-size="9">Converged</text>
  <text x="750" y="160" text-anchor="middle" fill="#ff6b6b" font-size="9" opacity="0.7">Diverged</text>

  <!-- Threshold rule -->
  <rect x="600" y="232" width="205" height="40" rx="4" fill="#0d1b30" stroke="#233554" stroke-width="1"/>
  <text x="702" y="249" text-anchor="middle" fill="#ccd6f6" font-size="10">Convergence criterion:</text>
  <text x="702" y="265" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700" filter="url(#glw5)">R-hat &lt; 1.1</text>

  <!-- Chain agreement -->
  <text x="702" y="295" text-anchor="middle" fill="#8892b0" font-size="9">All 4 chains must agree</text>
  <text x="702" y="312" text-anchor="middle" fill="#8892b0" font-size="9">within-chain var ~ between-chain var</text>

  <!-- Cross-validation note -->
  <rect x="600" y="322" width="205" height="26" rx="4" fill="#0d1b30" stroke="#4ADE80" stroke-width="1" opacity="0.8"/>
  <text x="702" y="340" text-anchor="middle" fill="#4ADE80" font-size="9" font-weight="600">Effective sample size > 400</text>

  <!-- === BOTTOM: Safety Guard Decision Tree === -->
  <text x="425" y="400" text-anchor="middle" fill="#8892b0" font-size="11" font-weight="600" letter-spacing="1.5">SAFETY GUARD DECISION TREE</text>
  <line x1="280" y1="408" x2="570" y2="408" stroke="#233554" stroke-width="1"/>

  <!-- Decision node 1: n < 15? -->
  <rect x="55" y="425" width="145" height="50" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="127" y="448" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">n &lt; 15 ?</text>
  <text x="127" y="465" text-anchor="middle" fill="#8892b0" font-size="9">Sample too small</text>
  <!-- Yes arrow (down) -->
  <line x1="127" y1="475" x2="127" y2="510" stroke="#ff6b6b" stroke-width="1.2" marker-end="url(#arr5r)"/>
  <text x="115" y="498" fill="#ff6b6b" font-size="8" font-weight="700">YES</text>
  <!-- Revert box -->
  <rect x="65" y="513" width="125" height="32" rx="5" fill="#2a1015" stroke="#ff6b6b" stroke-width="1.2"/>
  <text x="127" y="534" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="700">Revert to Prior</text>
  <!-- No arrow (right) -->
  <line x1="200" y1="450" x2="250" y2="450" stroke="#4ADE80" stroke-width="1.2" marker-end="url(#arr5ok)"/>
  <text x="215" y="443" fill="#4ADE80" font-size="8" font-weight="700">NO</text>

  <!-- Decision node 2: Performance < 0? -->
  <rect x="255" y="425" width="145" height="50" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="327" y="448" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">Perf &lt; 0 ?</text>
  <text x="327" y="465" text-anchor="middle" fill="#8892b0" font-size="9">Negative returns</text>
  <!-- Yes arrow (down) -->
  <line x1="327" y1="475" x2="327" y2="510" stroke="#ff6b6b" stroke-width="1.2" marker-end="url(#arr5r)"/>
  <text x="315" y="498" fill="#ff6b6b" font-size="8" font-weight="700">YES</text>
  <!-- Revert box -->
  <rect x="265" y="513" width="125" height="32" rx="5" fill="#2a1015" stroke="#ff6b6b" stroke-width="1.2"/>
  <text x="327" y="534" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="700">Revert to Prior</text>
  <!-- No arrow (right) -->
  <line x1="400" y1="450" x2="450" y2="450" stroke="#4ADE80" stroke-width="1.2" marker-end="url(#arr5ok)"/>
  <text x="415" y="443" fill="#4ADE80" font-size="8" font-weight="700">NO</text>

  <!-- Decision node 3: R-hat >= 1.1? -->
  <rect x="455" y="425" width="145" height="50" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="527" y="448" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">R-hat >= 1.1 ?</text>
  <text x="527" y="465" text-anchor="middle" fill="#8892b0" font-size="9">Not converged</text>
  <!-- Yes arrow (down) -->
  <line x1="527" y1="475" x2="527" y2="510" stroke="#ff6b6b" stroke-width="1.2" marker-end="url(#arr5r)"/>
  <text x="515" y="498" fill="#ff6b6b" font-size="8" font-weight="700">YES</text>
  <!-- Revert box -->
  <rect x="465" y="513" width="125" height="32" rx="5" fill="#2a1015" stroke="#ff6b6b" stroke-width="1.2"/>
  <text x="527" y="534" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="700">Revert to Prior</text>
  <!-- No arrow (right) -->
  <line x1="600" y1="450" x2="650" y2="450" stroke="#4ADE80" stroke-width="1.5" marker-end="url(#arr5ok)"/>
  <text x="615" y="443" fill="#4ADE80" font-size="8" font-weight="700">NO</text>

  <!-- Final: Use Optimized Weights -->
  <rect x="655" y="420" width="175" height="60" rx="8" fill="#112240" stroke="#4ADE80" stroke-width="2.5" filter="url(#sh5)"/>
  <rect x="655" y="420" width="175" height="24" rx="8" fill="#0f2a1a"/>
  <rect x="655" y="438" width="175" height="6" fill="#0f2a1a"/>
  <text x="742" y="438" text-anchor="middle" fill="#4ADE80" font-size="10" font-weight="700">ALL CHECKS PASSED</text>
  <text x="742" y="462" text-anchor="middle" fill="#ccd6f6" font-size="12" font-weight="700">Use Optimized</text>
  <text x="742" y="476" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700" filter="url(#glw5)">Weights</text>

  <!-- Bottom summary bar -->
  <rect x="20" y="570" width="810" height="36" rx="6" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="425" y="593" text-anchor="middle" fill="#8892b0" font-size="11">
    <tspan fill="#64ffda" font-weight="600">4 chains</tspan> x <tspan fill="#ccd6f6">5,000 iter</tspan> = <tspan fill="#F7B32B" font-weight="600">20,000 samples</tspan> --> <tspan fill="#ccd6f6">posterior</tspan> --> <tspan fill="#F7B32B">R-hat check</tspan> --> <tspan fill="#4ADE80" font-weight="700">safe deployment</tspan>
  </text>
</svg>