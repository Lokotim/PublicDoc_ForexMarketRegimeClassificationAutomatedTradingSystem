<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 780" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow2" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="greenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <marker id="arr2Down" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#8892b0"/>
    </marker>
    <marker id="arr2Gold" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#F7B32B"/>
    </marker>
    <marker id="arr2Green" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#64ffda"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="780" rx="8" fill="#0a192f"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" fill="url(#goldGrad2)" font-size="20" font-weight="700" letter-spacing="0.5">Meta-Signal Resolution: Three Intelligences</text>
  <line x1="180" y1="50" x2="670" y2="50" stroke="#233554" stroke-width="1"/>

  <!-- ===== THREE INPUT SOURCES ===== -->
  <!-- ML Classifier -->
  <rect x="40" y="70" width="230" height="110" rx="6" fill="#112240" stroke="#64ffda" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="40" y="70" width="230" height="30" rx="6" fill="#64ffda"/>
  <rect x="40" y="86" width="230" height="14" fill="#64ffda"/>
  <text x="155" y="91" text-anchor="middle" fill="#0a192f" font-size="13" font-weight="700">ML CLASSIFIER</text>
  <text x="155" y="122" text-anchor="middle" fill="#ccd6f6" font-size="11">Mixture-of-Experts</text>
  <text x="155" y="139" text-anchor="middle" fill="#ccd6f6" font-size="11">Regime + Direction</text>
  <circle cx="230" cy="160" r="18" fill="#0a192f" stroke="#64ffda" stroke-width="1.5"/>
  <text x="230" y="165" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="700">55%</text>

  <!-- 4-Day Forecast -->
  <rect x="310" y="70" width="230" height="110" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="310" y="70" width="230" height="30" rx="6" fill="#F7B32B"/>
  <rect x="310" y="86" width="230" height="14" fill="#F7B32B"/>
  <text x="425" y="91" text-anchor="middle" fill="#0a192f" font-size="13" font-weight="700">4-DAY FORECAST</text>
  <text x="425" y="122" text-anchor="middle" fill="#ccd6f6" font-size="11">Bayesian MCMC</text>
  <text x="425" y="139" text-anchor="middle" fill="#ccd6f6" font-size="11">Direction + Magnitude</text>
  <circle cx="500" cy="160" r="18" fill="#0a192f" stroke="#F7B32B" stroke-width="1.5"/>
  <text x="500" y="165" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">25%</text>

  <!-- RL Agent -->
  <rect x="580" y="70" width="230" height="110" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="580" y="70" width="230" height="30" rx="6" fill="#ff6b6b"/>
  <rect x="580" y="86" width="230" height="14" fill="#ff6b6b"/>
  <text x="695" y="91" text-anchor="middle" fill="#0a192f" font-size="13" font-weight="700">RL AGENT</text>
  <text x="695" y="122" text-anchor="middle" fill="#ccd6f6" font-size="11">Q-Learning</text>
  <text x="695" y="139" text-anchor="middle" fill="#ccd6f6" font-size="11">Strategy Selection</text>
  <circle cx="770" cy="160" r="18" fill="#0a192f" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="770" y="165" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="700">20%</text>

  <!-- Connecting arrows down -->
  <line x1="155" y1="180" x2="155" y2="210" stroke="#64ffda" stroke-width="2" marker-end="url(#arr2Green)"/>
  <line x1="425" y1="180" x2="425" y2="210" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr2Gold)"/>
  <line x1="695" y1="180" x2="695" y2="210" stroke="#8892b0" stroke-width="2" marker-end="url(#arr2Down)"/>

  <!-- ===== WEIGHTED CONSENSUS ENGINE ===== -->
  <rect x="70" y="218" width="710" height="100" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="2" filter="url(#shadow2)"/>
  <text x="425" y="244" text-anchor="middle" fill="#F7B32B" font-size="15" font-weight="700">WEIGHTED CONSENSUS ENGINE</text>

  <!-- Direction voting visualization -->
  <rect x="100" y="256" width="200" height="48" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="200" y="274" text-anchor="middle" fill="#8892b0" font-size="10">Direction Voting</text>
  <text x="200" y="294" text-anchor="middle" fill="#ccd6f6" font-size="11">weighted_sum(signals) &gt; 0 ?</text>

  <rect x="325" y="256" width="200" height="48" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="425" y="274" text-anchor="middle" fill="#8892b0" font-size="10">Strategy Selection</text>
  <text x="425" y="294" text-anchor="middle" fill="#ccd6f6" font-size="11">RL agent picks TF or MR</text>

  <rect x="550" y="256" width="200" height="48" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="650" y="274" text-anchor="middle" fill="#8892b0" font-size="10">Confidence Score</text>
  <text x="650" y="294" text-anchor="middle" fill="#ccd6f6" font-size="11">agreement_level × weights</text>

  <!-- Arrow down -->
  <line x1="425" y1="318" x2="425" y2="346" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr2Gold)"/>

  <!-- ===== AGREEMENT TAXONOMY ===== -->
  <rect x="70" y="354" width="710" height="100" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="425" y="378" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="600">AGREEMENT TAXONOMY</text>

  <!-- Three agreement boxes -->
  <rect x="100" y="390" width="190" height="50" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="195" y="410" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700">UNANIMOUS</text>
  <text x="195" y="428" text-anchor="middle" fill="#ccd6f6" font-size="11">All 3 agree → <tspan fill="#4ADE80" font-weight="700">+10%</tspan> boost</text>

  <rect x="320" y="390" width="190" height="50" rx="4" fill="#1a2f50" stroke="#F7B32B" stroke-width="1.5"/>
  <text x="415" y="410" text-anchor="middle" fill="#F7B32B" font-size="12" font-weight="700">MAJORITY</text>
  <text x="415" y="428" text-anchor="middle" fill="#ccd6f6" font-size="11">2 of 3 agree → <tspan fill="#F7B32B" font-weight="700">0%</tspan> adjust</text>

  <rect x="540" y="390" width="210" height="50" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="645" y="410" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">SPLIT</text>
  <text x="645" y="428" text-anchor="middle" fill="#ccd6f6" font-size="11">No agreement → <tspan fill="#ff6b6b" font-weight="700">-30%</tspan> penalty</text>

  <!-- Arrow down -->
  <line x1="425" y1="454" x2="425" y2="478" stroke="#8892b0" stroke-width="2" marker-end="url(#arr2Down)"/>

  <!-- ===== ECHO DETECTION + LIVE P&amp;L ===== -->
  <!-- Echo Detection -->
  <rect x="70" y="486" width="340" height="100" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="240" y="510" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="600">ECHO DETECTION</text>
  <text x="240" y="532" text-anchor="middle" fill="#ccd6f6" font-size="11">If Forecast mirrors ML Classifier:</text>
  <rect x="100" y="542" width="280" height="30" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="240" y="562" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="600">Downweight forecast to avoid double-counting</text>

  <!-- Live P&amp;L Adjustment -->
  <rect x="440" y="486" width="340" height="100" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="610" y="510" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="600">LIVE P&amp;L ADJUSTMENT</text>

  <rect x="470" y="522" width="140" height="48" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="540" y="542" text-anchor="middle" fill="#4ADE80" font-size="11" font-weight="600">Profitable</text>
  <text x="540" y="560" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="700">+10%</text>

  <rect x="630" y="522" width="140" height="48" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="700" y="542" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="600">Unprofitable</text>
  <text x="700" y="560" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="700">-15%</text>

  <!-- Converging arrows -->
  <line x1="240" y1="586" x2="240" y2="610" stroke="#8892b0" stroke-width="1.5"/>
  <line x1="610" y1="586" x2="610" y2="610" stroke="#8892b0" stroke-width="1.5"/>
  <line x1="240" y1="610" x2="610" y2="610" stroke="#8892b0" stroke-width="1.5"/>
  <line x1="425" y1="610" x2="425" y2="634" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr2Gold)"/>

  <!-- ===== OUTPUT ===== -->
  <rect x="140" y="642" width="570" height="120" rx="8" fill="#112240" stroke="#F7B32B" stroke-width="2" filter="url(#shadow2)"/>
  <text x="425" y="668" text-anchor="middle" fill="#F7B32B" font-size="15" font-weight="700">OUTPUT: meta_signals</text>
  <text x="425" y="688" text-anchor="middle" fill="#8892b0" font-size="11">Per currency pair</text>

  <!-- Output fields -->
  <rect x="170" y="700" width="150" height="40" rx="4" fill="#0a192f" stroke="#64ffda" stroke-width="1"/>
  <text x="245" y="716" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="600">direction</text>
  <text x="245" y="732" text-anchor="middle" fill="#ccd6f6" font-size="11">LONG / SHORT</text>

  <rect x="350" y="700" width="150" height="40" rx="4" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="425" y="716" text-anchor="middle" fill="#F7B32B" font-size="11" font-weight="600">strategy</text>
  <text x="425" y="732" text-anchor="middle" fill="#ccd6f6" font-size="11">TF / MR</text>

  <rect x="530" y="700" width="150" height="40" rx="4" fill="#0a192f" stroke="#4ADE80" stroke-width="1"/>
  <text x="605" y="716" text-anchor="middle" fill="#4ADE80" font-size="11" font-weight="600">confidence</text>
  <text x="605" y="732" text-anchor="middle" fill="#ccd6f6" font-size="11">0.0 - 1.0</text>
</svg>