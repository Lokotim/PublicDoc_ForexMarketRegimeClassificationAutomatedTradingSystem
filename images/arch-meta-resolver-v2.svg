<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <filter id="ds">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#abg)" rx="6"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="40" fill="#0f172a" rx="6"/>
  <rect x="0" y="30" width="800" height="10" fill="#0f172a"/>
  <text x="400" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">Meta-Signal Resolver Architecture</text>

  <!-- ===== STAGE 1: INPUT SOURCES (top row) ===== -->
  <text x="28" y="62" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">INPUTS</text>

  <!-- ML Classifier box -->
  <rect x="20" y="70" width="160" height="52" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#ds)"/>
  <rect x="20" y="70" width="160" height="4" rx="2" fill="#3b82f6"/>
  <text x="100" y="91" text-anchor="middle" fill="#3b82f6" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">ML Classifier</text>
  <text x="100" y="105" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="8">w_ml = 0.50 (default)</text>
  <text x="100" y="116" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="8">MoE + 5 sub-models</text>

  <!-- 4-Day Forecast box -->
  <rect x="200" y="70" width="160" height="52" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" filter="url(#ds)"/>
  <rect x="200" y="70" width="160" height="4" rx="2" fill="#06b6d4"/>
  <text x="280" y="91" text-anchor="middle" fill="#06b6d4" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">4-Day Forecast</text>
  <text x="280" y="105" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="8">w_fcst = 0.28 (default)</text>
  <text x="280" y="116" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="8">Markov chain</text>

  <!-- RL Agent box -->
  <rect x="380" y="70" width="160" height="52" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#ds)"/>
  <rect x="380" y="70" width="160" height="4" rx="2" fill="#8b5cf6"/>
  <text x="460" y="91" text-anchor="middle" fill="#8b5cf6" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">RL Agent</text>
  <text x="460" y="105" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="8">w_rl = 0.12 (default)</text>
  <text x="460" y="116" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="8">Q-learning policy</text>


  <!-- ===== DOWN ARROWS from sources ===== -->
  <line x1="100" y1="122" x2="100" y2="148" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <polygon points="96,146 100,153 104,146" fill="#3b82f6" fill-opacity="0.6"/>
  <line x1="280" y1="122" x2="280" y2="148" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
  <polygon points="276,146 280,153 284,146" fill="#06b6d4" fill-opacity="0.6"/>
  <line x1="460" y1="122" x2="460" y2="148" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
  <polygon points="456,146 460,153 464,146" fill="#8b5cf6" fill-opacity="0.6"/>

  <!-- ===== STAGE 2: PROCESSING PIPELINE (middle row) ===== -->
  <text x="28" y="162" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">PROCESSING PIPELINE</text>

  <!-- Step A: Weighted Sum -->
  <rect x="20" y="168" width="172" height="64" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#ds)"/>
  <rect x="26" y="173" width="8" height="8" rx="2" fill="#22c55e"/>
  <text x="40" y="181" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">A. Weighted Sum</text>
  <text x="106" y="198" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="8">final = w_ml*ML</text>
  <text x="106" y="210" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="8">+ w_fcst*F + w_rl*RL</text>

  <!-- Arrow A to B -->
  <line x1="192" y1="200" x2="210" y2="200" stroke="#475569" stroke-width="1.5"/>
  <polygon points="208,196 215,200 208,204" fill="#475569"/>

  <!-- Step B: Echo Detection -->
  <rect x="216" y="168" width="172" height="64" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#ds)"/>
  <rect x="222" y="173" width="8" height="8" rx="2" fill="#22c55e"/>
  <text x="236" y="181" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">B. Echo Detection</text>
  <text x="302" y="198" text-anchor="middle" fill="#06b6d4" font-family="Segoe UI, Arial, sans-serif" font-size="9">Fcst mirrors ML</text>
  <text x="302" y="210" text-anchor="middle" fill="#06b6d4" font-family="Consolas, monospace" font-size="9">-60% discount</text>

  <!-- Arrow B to C -->
  <line x1="388" y1="200" x2="406" y2="200" stroke="#475569" stroke-width="1.5"/>
  <polygon points="404,196 411,200 404,204" fill="#475569"/>

  <!-- Step C: Agreement Check -->
  <rect x="412" y="168" width="172" height="64" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#ds)"/>
  <rect x="418" y="173" width="8" height="8" rx="2" fill="#22c55e"/>
  <text x="432" y="181" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">C. Agreement Check</text>
  <text x="498" y="196" text-anchor="middle" fill="#22c55e" font-family="Consolas, monospace" font-size="8">3/3 UNANIMOUS x1.20</text>
  <text x="498" y="207" text-anchor="middle" fill="#3b82f6" font-family="Consolas, monospace" font-size="8">2/3 STRONG    x1.00</text>
  <text x="498" y="218" text-anchor="middle" fill="#eab308" font-family="Consolas, monospace" font-size="8">1/3 MINORITY  x0.75</text>
  <text x="498" y="229" text-anchor="middle" fill="#ef4444" font-family="Consolas, monospace" font-size="8">0/3 SPLIT     x0.50</text>

  <!-- Arrow C to D -->
  <line x1="584" y1="200" x2="602" y2="200" stroke="#475569" stroke-width="1.5"/>
  <polygon points="600,196 607,200 600,204" fill="#475569"/>

  <!-- Step D: Confidence Scaling -->
  <rect x="608" y="168" width="172" height="64" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#ds)"/>
  <rect x="614" y="173" width="8" height="8" rx="2" fill="#22c55e"/>
  <text x="628" y="181" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">D. Confidence Scale</text>
  <text x="694" y="198" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="9">Track Penalty v2</text>
  <text x="694" y="210" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="8">14d WR, soft reject</text>
  <text x="694" y="224" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="9">conf≥0.20, sizing≥0.15</text>

  <!-- ===== DOWN ARROW from pipeline to output ===== -->
  <line x1="694" y1="232" x2="694" y2="260" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="690,258 694,265 698,258" fill="#22c55e"/>

  <!-- ===== STAGE 3: OUTPUT ROW ===== -->
  <text x="28" y="278" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">OUTPUT</text>

  <!-- Output box -->
  <rect x="548" y="268" width="232" height="50" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" filter="url(#ds)"/>
  <text x="664" y="288" text-anchor="middle" fill="#22c55e" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Signal per Pair</text>
  <text x="664" y="305" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9">dir(L/S) strat(TF/MR) conf agree sizing</text>

  <!-- ===== WEIGHT LEARNING LOOP (bottom section) ===== -->
  <text x="28" y="342" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">WEIGHT LEARNING LOOP</text>

  <!-- Learning loop box -->
  <rect x="20" y="350" width="760" height="82" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- PnL Attribution -->
  <rect x="36" y="360" width="150" height="42" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="111" y="378" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">PnL Attribution</text>
  <text x="111" y="394" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="8">Realized PnL per source</text>

  <!-- Arrow -->
  <line x1="186" y1="381" x2="210" y2="381" stroke="#475569" stroke-width="1.5"/>
  <polygon points="208,377 215,381 208,385" fill="#475569"/>

  <!-- Performance Evaluation -->
  <rect x="216" y="360" width="150" height="42" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="291" y="378" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Perf Evaluation</text>
  <text x="291" y="394" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="8">Hourly accuracy scoring</text>

  <!-- Arrow -->
  <line x1="366" y1="381" x2="390" y2="381" stroke="#475569" stroke-width="1.5"/>
  <polygon points="388,377 395,381 388,385" fill="#475569"/>

  <!-- Weight Update -->
  <rect x="396" y="360" width="150" height="42" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="471" y="378" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Weight Update</text>
  <text x="471" y="394" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="8">Adjust w_ml, w_fcst, w_rl</text>


  <!-- Curved feedback arrow from Weight Update back to Weighted Sum (step A) -->
  <path d="M 471 402 Q 471 430 280 434 Q 70 434 70 240" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="66,243 70,235 74,243" fill="#475569"/>
  <text x="270" y="444" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="8">Updated weights feed back to resolver (hourly)</text>

  <!-- ===== source_weights TABLE annotation ===== -->
  <rect x="20" y="268" width="220" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="130" y="285" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">source_weights table (3 rows)</text>
  <text x="36" y="300" fill="#3b82f6" font-family="Consolas, monospace" font-size="8">ml_classifier</text>
  <text x="115" y="300" fill="#06b6d4" font-family="Consolas, monospace" font-size="8">forecast</text>
  <text x="160" y="300" fill="#8b5cf6" font-family="Consolas, monospace" font-size="8">rl_agent</text>
  <text x="36" y="312" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="7">Stored in forex_sentiment.db</text>

</svg>