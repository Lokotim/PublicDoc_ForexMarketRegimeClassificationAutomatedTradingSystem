<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400" width="950" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3045"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="950" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#ffffff">
    <line x1="0" y1="80" x2="950" y2="80"/>
    <line x1="0" y1="160" x2="950" y2="160"/>
    <line x1="0" y1="240" x2="950" y2="240"/>
    <line x1="0" y1="320" x2="950" y2="320"/>
    <line x1="190" y1="0" x2="190" y2="400"/>
    <line x1="475" y1="0" x2="475" y2="400"/>
    <line x1="760" y1="0" x2="760" y2="400"/>
  </g>

  <!-- Title -->
  <text x="475" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.5">THE ARBITER</text>
  <text x="475" y="48" text-anchor="middle" fill="#607D8B" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.5">META-SIGNAL CONFLICT RESOLUTION</text>

  <!-- ==================== 3 INPUT SIGNAL SOURCES (LEFT) ==================== -->
  <text x="115" y="80" text-anchor="middle" fill="#455A64" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="2">INPUT SIGNALS</text>

  <!-- ML Classifier (Green) -->
  <g filter="url(#shadow)">
    <rect x="25" y="100" width="180" height="55" rx="6" fill="#0f1923" stroke="#4CAF50" stroke-width="1.5"/>
    <rect x="25" y="100" width="5" height="55" rx="2" fill="#4CAF50"/>
    <text x="120" y="122" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">ML Classifier</text>
    <text x="120" y="140" text-anchor="middle" fill="#4CAF50" font-family="Segoe UI, Arial, sans-serif" font-size="9" opacity="0.9">Weight: 46%</text>
    <!-- Weight bar -->
    <rect x="60" y="145" width="120" height="3" rx="1.5" fill="#1a2a36"/>
    <rect x="60" y="145" width="55" height="3" rx="1.5" fill="#4CAF50" opacity="0.7"/>
  </g>

  <!-- 4-Day Forecast (Blue) -->
  <g filter="url(#shadow)">
    <rect x="25" y="175" width="180" height="55" rx="6" fill="#0f1923" stroke="#2196F3" stroke-width="1.5"/>
    <rect x="25" y="175" width="5" height="55" rx="2" fill="#2196F3"/>
    <text x="120" y="197" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">4-Day Forecast</text>
    <text x="120" y="215" text-anchor="middle" fill="#2196F3" font-family="Segoe UI, Arial, sans-serif" font-size="9" opacity="0.9">Weight: 38%</text>
    <!-- Weight bar -->
    <rect x="60" y="220" width="120" height="3" rx="1.5" fill="#1a2a36"/>
    <rect x="60" y="220" width="46" height="3" rx="1.5" fill="#2196F3" opacity="0.7"/>
  </g>

  <!-- RL Agent (Orange) -->
  <g filter="url(#shadow)">
    <rect x="25" y="250" width="180" height="55" rx="6" fill="#0f1923" stroke="#FF9800" stroke-width="1.5"/>
    <rect x="25" y="250" width="5" height="55" rx="2" fill="#FF9800"/>
    <text x="120" y="272" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">RL Agent</text>
    <text x="120" y="290" text-anchor="middle" fill="#FF9800" font-family="Segoe UI, Arial, sans-serif" font-size="9" opacity="0.9">Weight: 16%</text>
    <!-- Weight bar -->
    <rect x="60" y="295" width="120" height="3" rx="1.5" fill="#1a2a36"/>
    <rect x="60" y="295" width="19" height="3" rx="1.5" fill="#FF9800" opacity="0.7"/>
  </g>

  <!-- ==================== CONNECTING LINES TO HEXAGON ==================== -->
  <!-- ML → Hex -->
  <line x1="205" y1="127" x2="380" y2="185" stroke="#4CAF50" stroke-width="1.5" opacity="0.4"/>
  <line x1="205" y1="127" x2="380" y2="185" stroke="#4CAF50" stroke-width="0.5" opacity="0.8"/>
  <!-- Forecast → Hex -->
  <line x1="205" y1="202" x2="380" y2="200" stroke="#2196F3" stroke-width="1.5" opacity="0.4"/>
  <line x1="205" y1="202" x2="380" y2="200" stroke="#2196F3" stroke-width="0.5" opacity="0.8"/>
  <!-- RL → Hex -->
  <line x1="205" y1="277" x2="380" y2="215" stroke="#FF9800" stroke-width="1.5" opacity="0.4"/>
  <line x1="205" y1="277" x2="380" y2="215" stroke="#FF9800" stroke-width="0.5" opacity="0.8"/>

  <!-- ==================== CENTRAL HEXAGON ==================== -->
  <g filter="url(#glowStrong)">
    <!-- Hexagon shape -->
    <polygon points="475,135 555,170 555,230 475,265 395,230 395,170" fill="url(#hexGrad)" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <!-- Inner hexagon -->
    <polygon points="475,155 535,180 535,220 475,245 415,220 415,180" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    <text x="475" y="192" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">RESOLUTION</text>
    <text x="475" y="208" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">ENGINE</text>
    <!-- Decorative inner circle -->
    <circle cx="475" cy="200" r="8" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.3"/>
  </g>

  <!-- ==================== 4 OUTPUT PATHS (RIGHT) ==================== -->
  <text x="780" y="80" text-anchor="middle" fill="#455A64" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="2">OUTPUT PATHS</text>

  <!-- Connection lines from hexagon to outputs -->
  <line x1="555" y1="175" x2="655" y2="115" stroke="#00E676" stroke-width="1" opacity="0.4"/>
  <line x1="555" y1="190" x2="655" y2="185" stroke="#FFC107" stroke-width="1" opacity="0.4"/>
  <line x1="555" y1="210" x2="655" y2="250" stroke="#FF9800" stroke-width="1" opacity="0.4"/>
  <line x1="555" y1="225" x2="655" y2="315" stroke="#F44336" stroke-width="1" opacity="0.4"/>

  <!-- UNANIMOUS (Bright Green) -->
  <g filter="url(#shadow)">
    <rect x="660" y="92" width="260" height="48" rx="6" fill="#0f1923" stroke="#00E676" stroke-width="1.5"/>
    <rect x="915" y="92" width="5" height="48" rx="2" fill="#00E676"/>
    <!-- Status indicator -->
    <circle cx="682" cy="110" r="8" fill="#00E676" opacity="0.15"/>
    <circle cx="682" cy="110" r="4" fill="#00E676"/>
    <text x="735" y="108" fill="#00E676" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">UNANIMOUS</text>
    <text x="735" y="126" fill="#B0BEC5" font-family="Segoe UI, Arial, sans-serif" font-size="8">All agree</text>
    <text x="835" y="126" fill="#00E676" font-family="Segoe UI, Arial, sans-serif" font-size="8" opacity="0.8">Full confidence</text>
  </g>

  <!-- MAJORITY (Yellow) -->
  <g filter="url(#shadow)">
    <rect x="660" y="162" width="260" height="48" rx="6" fill="#0f1923" stroke="#FFC107" stroke-width="1.5"/>
    <rect x="915" y="162" width="5" height="48" rx="2" fill="#FFC107"/>
    <circle cx="682" cy="180" r="8" fill="#FFC107" opacity="0.15"/>
    <circle cx="682" cy="180" r="4" fill="#FFC107"/>
    <text x="735" y="178" fill="#FFC107" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MAJORITY</text>
    <text x="735" y="196" fill="#B0BEC5" font-family="Segoe UI, Arial, sans-serif" font-size="8">2/3 agree</text>
    <text x="835" y="196" fill="#FFC107" font-family="Segoe UI, Arial, sans-serif" font-size="8" opacity="0.8">Weighted confidence</text>
  </g>

  <!-- SPLIT (Orange) -->
  <g filter="url(#shadow)">
    <rect x="660" y="232" width="260" height="48" rx="6" fill="#0f1923" stroke="#FF9800" stroke-width="1.5"/>
    <rect x="915" y="232" width="5" height="48" rx="2" fill="#FF9800"/>
    <circle cx="682" cy="250" r="8" fill="#FF9800" opacity="0.15"/>
    <circle cx="682" cy="250" r="4" fill="#FF9800"/>
    <text x="735" y="248" fill="#FF9800" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SPLIT</text>
    <text x="735" y="266" fill="#B0BEC5" font-family="Segoe UI, Arial, sans-serif" font-size="8">Disagree</text>
    <text x="835" y="266" fill="#FF9800" font-family="Segoe UI, Arial, sans-serif" font-size="8" opacity="0.8">Reduced sizing</text>
  </g>

  <!-- FLAT (Red) -->
  <g filter="url(#shadow)">
    <rect x="660" y="302" width="260" height="48" rx="6" fill="#0f1923" stroke="#F44336" stroke-width="1.5"/>
    <rect x="915" y="302" width="5" height="48" rx="2" fill="#F44336"/>
    <circle cx="682" cy="320" r="8" fill="#F44336" opacity="0.15"/>
    <circle cx="682" cy="320" r="4" fill="#F44336"/>
    <text x="735" y="318" fill="#F44336" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">FLAT</text>
    <text x="735" y="336" fill="#B0BEC5" font-family="Segoe UI, Arial, sans-serif" font-size="8">No signal</text>
    <text x="835" y="336" fill="#F44336" font-family="Segoe UI, Arial, sans-serif" font-size="8" opacity="0.8">Skip pair</text>
  </g>

  <!-- ==================== BOTTOM STATUS BAR ==================== -->
  <rect x="60" y="365" width="830" height="26" rx="5" fill="#0f1923" stroke="#37474F" stroke-width="0.8"/>

  <!-- Current status -->
  <circle cx="82" cy="378" r="4" fill="#00E676"/>
  <text x="95" y="382" fill="#00E676" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">Current: 8/8 UNANIMOUS</text>
  <line x1="310" y1="370" x2="310" y2="386" stroke="#37474F" stroke-width="0.5"/>
  <text x="325" y="382" fill="#FF9800" font-family="Segoe UI, Arial, sans-serif" font-size="9">Kelly adjustments for 3 SHOCK pairs</text>

  <!-- Animated pulse on UNANIMOUS indicator -->
  <circle cx="82" cy="378" r="7" fill="none" stroke="#00E676" stroke-width="0.5" opacity="0.4">
    <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner accents -->
  <path d="M 5 5 L 25 5 L 25 7 L 7 7 L 7 25 L 5 25 Z" fill="#607D8B" opacity="0.3"/>
  <path d="M 945 5 L 925 5 L 925 7 L 943 7 L 943 25 L 945 25 Z" fill="#607D8B" opacity="0.3"/>
  <path d="M 5 395 L 25 395 L 25 393 L 7 393 L 7 375 L 5 375 Z" fill="#607D8B" opacity="0.3"/>
  <path d="M 945 395 L 925 395 L 925 393 L 943 393 L 943 375 L 945 375 Z" fill="#607D8B" opacity="0.3"/>
</svg>