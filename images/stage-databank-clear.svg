<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cabinetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cleanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD54F" flood-opacity="0.4"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="redGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F87171" flood-opacity="0.3"/>
    </filter>
    <filter id="greenGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#4ADE80" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="850" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="425" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#FFD54F" filter="url(#glow)">Stage 1: Clear Databanks</text>

  <!-- LEFT: File cabinet with residuals -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Cabinet body -->
    <rect x="0" y="0" width="180" height="260" rx="8" fill="url(#cabinetGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Cabinet label -->
    <rect x="40" y="10" width="100" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="90" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">DATABANK</text>

    <!-- Drawer 1 -->
    <rect x="12" y="42" width="156" height="48" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect x="75" y="58" width="30" height="6" rx="3" fill="#475569"/>
    <text x="55" y="62" font-family="Consolas, monospace" font-size="8" fill="#64748B">cache_v2.dat</text>
    <text x="55" y="78" font-family="Consolas, monospace" font-size="8" fill="#64748B">results_old.db</text>
    <!-- Red X -->
    <g transform="translate(145, 50)" filter="url(#redGlow)">
      <line x1="0" y1="0" x2="16" y2="16" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="0" y2="16" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Drawer 2 -->
    <rect x="12" y="98" width="156" height="48" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect x="75" y="114" width="30" height="6" rx="3" fill="#475569"/>
    <text x="55" y="118" font-family="Consolas, monospace" font-size="8" fill="#64748B">opt_results.csv</text>
    <text x="55" y="134" font-family="Consolas, monospace" font-size="8" fill="#64748B">stale_signals.bin</text>
    <!-- Red X -->
    <g transform="translate(145, 106)" filter="url(#redGlow)">
      <line x1="0" y1="0" x2="16" y2="16" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="0" y2="16" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Drawer 3 -->
    <rect x="12" y="154" width="156" height="48" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect x="75" y="170" width="30" height="6" rx="3" fill="#475569"/>
    <text x="55" y="174" font-family="Consolas, monospace" font-size="8" fill="#64748B">schema_v1.lock</text>
    <text x="55" y="190" font-family="Consolas, monospace" font-size="8" fill="#64748B">temp_positions.tmp</text>
    <!-- Red X -->
    <g transform="translate(145, 162)" filter="url(#redGlow)">
      <line x1="0" y1="0" x2="16" y2="16" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="0" y2="16" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Drawer 4 -->
    <rect x="12" y="210" width="156" height="40" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect x="75" y="222" width="30" height="6" rx="3" fill="#475569"/>
    <text x="55" y="230" font-family="Consolas, monospace" font-size="8" fill="#64748B">prev_cycle.log</text>
    <!-- Red X -->
    <g transform="translate(145, 216)" filter="url(#redGlow)">
      <line x1="0" y1="0" x2="16" y2="16" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="0" y2="16" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Label left -->
  <text x="150" y="348" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#F87171">Previous cycle residuals</text>

  <!-- CENTER: Arrow -->
  <g transform="translate(280, 155)">
    <rect x="0" y="20" width="160" height="6" rx="3" fill="url(#arrowGrad)" opacity="0.7"/>
    <polygon points="160,8 190,23 160,38" fill="#4ADE80" opacity="0.7"/>
    <text x="80" y="10" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">PURGE</text>
  </g>

  <!-- RIGHT: Clean workspace -->
  <g transform="translate(500, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="260" rx="8" fill="url(#cleanGrad)" stroke="#4ADE80" stroke-width="1.5" opacity="0.8"/>

    <!-- Clean label -->
    <rect x="40" y="10" width="100" height="22" rx="4" fill="#14532D" stroke="#4ADE80" stroke-width="1" opacity="0.6"/>
    <text x="90" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">CLEAN STATE</text>

    <!-- Empty drawers (clean) -->
    <rect x="12" y="42" width="156" height="48" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="0.5" opacity="0.4"/>
    <rect x="12" y="98" width="156" height="48" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="0.5" opacity="0.4"/>
    <rect x="12" y="154" width="156" height="48" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="0.5" opacity="0.4"/>
    <rect x="12" y="210" width="156" height="40" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="0.5" opacity="0.4"/>

    <!-- Sparkle/clean indicators -->
    <g fill="#4ADE80" opacity="0.5">
      <circle cx="90" cy="66" r="2"/><circle cx="85" cy="60" r="1"/><circle cx="96" cy="62" r="1.5"/>
      <circle cx="90" cy="122" r="2"/><circle cx="85" cy="116" r="1"/><circle cx="96" cy="118" r="1.5"/>
      <circle cx="90" cy="178" r="2"/><circle cx="85" cy="172" r="1"/><circle cx="96" cy="174" r="1.5"/>
      <circle cx="90" cy="230" r="2"/><circle cx="85" cy="224" r="1"/><circle cx="96" cy="226" r="1.5"/>
    </g>
  </g>

  <!-- Label right -->
  <text x="590" y="348" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#4ADE80">Clean state</text>

  <!-- Checklist -->
  <g transform="translate(720, 80)" filter="url(#greenGlow)">
    <rect x="-10" y="-10" width="130" height="180" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>

    <text x="55" y="12" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#E2E8F0">Checklist</text>
    <line x1="5" y1="22" x2="105" y2="22" stroke="#334155" stroke-width="1"/>

    <!-- Check items -->
    <rect x="5" y="34" width="14" height="14" rx="2" fill="#14532D" stroke="#4ADE80" stroke-width="1"/>
    <polyline points="8,42 11,45 16,38" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="46" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">Cache cleared</text>

    <rect x="5" y="62" width="14" height="14" rx="2" fill="#14532D" stroke="#4ADE80" stroke-width="1"/>
    <polyline points="8,70 11,73 16,66" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="74" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">Results purged</text>

    <rect x="5" y="90" width="14" height="14" rx="2" fill="#14532D" stroke="#4ADE80" stroke-width="1"/>
    <polyline points="8,98 11,101 16,94" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="102" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">Databank reset</text>

    <rect x="5" y="118" width="14" height="14" rx="2" fill="#14532D" stroke="#4ADE80" stroke-width="1"/>
    <polyline points="8,126 11,129 16,122" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="130" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">Schema verified</text>

    <!-- All clear badge -->
    <rect x="15" y="145" width="80" height="20" rx="10" fill="#14532D" stroke="#4ADE80" stroke-width="1"/>
    <text x="55" y="159" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#4ADE80">ALL CLEAR</text>
  </g>
</svg>