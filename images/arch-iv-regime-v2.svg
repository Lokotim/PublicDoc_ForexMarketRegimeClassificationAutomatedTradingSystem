<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 680" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow5" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <marker id="arr5Right" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F7B32B"/>
    </marker>
    <marker id="arr5RightGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64ffda"/>
    </marker>
    <marker id="arr5RightGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8892b0"/>
    </marker>
    <marker id="arr5RightRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b6b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="680" rx="8" fill="#0a192f"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" fill="url(#goldGrad5)" font-size="20" font-weight="700" letter-spacing="0.5">Implied Volatility Regime Classification</text>
  <line x1="200" y1="50" x2="650" y2="50" stroke="#233554" stroke-width="1"/>

  <!-- ===== LEFT SECTION: CurrencyShares ETFs ===== -->
  <rect x="30" y="70" width="200" height="370" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.5" filter="url(#shadow5)"/>
  <text x="130" y="96" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="700">CurrencyShares ETFs</text>
  <text x="130" y="114" text-anchor="middle" fill="#8892b0" font-size="10">IBKR TWS API</text>

  <!-- ETF list -->
  <rect x="50" y="128" width="160" height="36" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="80" y="144" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">FXE</text>
  <text x="160" y="144" text-anchor="middle" fill="#ccd6f6" font-size="11">EUR/USD</text>
  <circle cx="195" cy="146" r="4" fill="#64ffda" opacity="0.8"/>

  <rect x="50" y="172" width="160" height="36" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="80" y="188" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">FXB</text>
  <text x="160" y="188" text-anchor="middle" fill="#ccd6f6" font-size="11">GBP/USD</text>
  <circle cx="195" cy="190" r="4" fill="#64ffda" opacity="0.8"/>

  <rect x="50" y="216" width="160" height="36" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="80" y="232" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">FXY</text>
  <text x="160" y="232" text-anchor="middle" fill="#ccd6f6" font-size="11">USD/JPY</text>
  <circle cx="195" cy="234" r="4" fill="#64ffda" opacity="0.8"/>

  <rect x="50" y="260" width="160" height="36" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="80" y="276" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">FXF</text>
  <text x="160" y="276" text-anchor="middle" fill="#ccd6f6" font-size="11">USD/CHF</text>
  <circle cx="195" cy="278" r="4" fill="#64ffda" opacity="0.8"/>

  <rect x="50" y="304" width="160" height="36" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="80" y="320" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">FXA</text>
  <text x="160" y="320" text-anchor="middle" fill="#ccd6f6" font-size="11">AUD/USD</text>
  <circle cx="195" cy="322" r="4" fill="#64ffda" opacity="0.8"/>

  <rect x="50" y="348" width="160" height="36" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="80" y="364" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">FXC</text>
  <text x="160" y="364" text-anchor="middle" fill="#ccd6f6" font-size="11">USD/CAD</text>
  <circle cx="195" cy="366" r="4" fill="#64ffda" opacity="0.8"/>

  <text x="130" y="420" text-anchor="middle" fill="#8892b0" font-size="9">Options chains via reqSecDefOptParams</text>

  <!-- ===== CONNECTING ARROWS LEFT to CENTER ===== -->
  <line x1="230" y1="255" x2="268" y2="255" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr5Right)"/>

  <!-- ===== CENTER SECTION: Derived Features ===== -->
  <rect x="275" y="70" width="220" height="370" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#shadow5)"/>
  <text x="385" y="96" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">Derived Features</text>
  <text x="385" y="114" text-anchor="middle" fill="#8892b0" font-size="10">Computed from option chains</text>

  <!-- Feature cards -->
  <rect x="295" y="128" width="180" height="42" rx="4" fill="#0a192f" stroke="#64ffda" stroke-width="1"/>
  <text x="385" y="147" text-anchor="middle" fill="#64ffda" font-size="12" font-weight="600">IV Percentile</text>
  <text x="385" y="163" text-anchor="middle" fill="#8892b0" font-size="9">252-day rolling rank</text>

  <rect x="295" y="180" width="180" height="42" rx="4" fill="#0a192f" stroke="#64ffda" stroke-width="1"/>
  <text x="385" y="199" text-anchor="middle" fill="#64ffda" font-size="12" font-weight="600">VRP</text>
  <text x="385" y="215" text-anchor="middle" fill="#8892b0" font-size="9">Vol Risk Premium (IV - RV)</text>

  <rect x="295" y="232" width="180" height="42" rx="4" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="385" y="251" text-anchor="middle" fill="#F7B32B" font-size="12" font-weight="600">VRP Z-Score</text>
  <text x="385" y="267" text-anchor="middle" fill="#8892b0" font-size="9">Standardized VRP deviation</text>

  <rect x="295" y="284" width="180" height="42" rx="4" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="385" y="303" text-anchor="middle" fill="#F7B32B" font-size="12" font-weight="600">Term Structure</text>
  <text x="385" y="319" text-anchor="middle" fill="#8892b0" font-size="9">Near / Far IV ratio</text>

  <rect x="295" y="336" width="180" height="42" rx="4" fill="#0a192f" stroke="#ff6b6b" stroke-width="1"/>
  <text x="385" y="355" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="600">Vol Ratio</text>
  <text x="385" y="371" text-anchor="middle" fill="#8892b0" font-size="9">IV / Realized Vol</text>

  <text x="385" y="420" text-anchor="middle" fill="#8892b0" font-size="9">Each computed per currency pair</text>

  <!-- ===== CONNECTING ARROWS CENTER to RIGHT ===== -->
  <line x1="495" y1="255" x2="533" y2="255" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr5Right)"/>

  <!-- ===== RIGHT SECTION: Binary Decision Gate ===== -->
  <rect x="540" y="70" width="280" height="370" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow5)"/>
  <text x="680" y="96" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="700">Binary Decision Gate</text>
  <text x="680" y="114" text-anchor="middle" fill="#8892b0" font-size="10">Any trigger = full rejection</text>

  <!-- REJECT conditions -->
  <rect x="560" y="128" width="240" height="32" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="630" y="149" text-anchor="middle" fill="#ccd6f6" font-size="11">IV &gt; 80%</text>
  <text x="775" y="149" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700">REJECT</text>

  <rect x="560" y="168" width="240" height="32" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="630" y="189" text-anchor="middle" fill="#ccd6f6" font-size="11">VR &lt; 0.50</text>
  <text x="775" y="189" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700">REJECT</text>

  <rect x="560" y="208" width="240" height="32" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="630" y="229" text-anchor="middle" fill="#ccd6f6" font-size="11">VRP Z &lt; -2</text>
  <text x="775" y="229" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700">REJECT</text>

  <rect x="560" y="248" width="240" height="32" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="630" y="269" text-anchor="middle" fill="#ccd6f6" font-size="11">VRP Z &gt; +3</text>
  <text x="775" y="269" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700">REJECT</text>

  <rect x="560" y="288" width="240" height="32" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="630" y="309" text-anchor="middle" fill="#ccd6f6" font-size="11">TS &gt; 1.40</text>
  <text x="775" y="309" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700">REJECT</text>

  <!-- Divider -->
  <line x1="570" y1="332" x2="790" y2="332" stroke="#233554" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- PASS condition -->
  <rect x="560" y="344" width="240" height="42" rx="6" fill="#1a3a2a" stroke="#4ADE80" stroke-width="2"/>
  <text x="625" y="370" text-anchor="middle" fill="#ccd6f6" font-size="12">Otherwise</text>
  <text x="760" y="370" text-anchor="middle" fill="#4ADE80" font-size="14" font-weight="700">PASS</text>

  <text x="680" y="420" text-anchor="middle" fill="#4ADE80" font-size="10" font-weight="600">Full size (1.0)</text>

  <!-- ===== BOTTOM: Flow summary ===== -->
  <rect x="30" y="470" width="790" height="90" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow5)"/>
  <text x="425" y="498" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="700">END-TO-END FLOW</text>

  <!-- Flow steps -->
  <rect x="55" y="510" width="130" height="32" rx="4" fill="#0a192f" stroke="#64ffda" stroke-width="1"/>
  <text x="120" y="531" text-anchor="middle" fill="#64ffda" font-size="10" font-weight="600">ETF Option Chains</text>

  <line x1="190" y1="526" x2="218" y2="526" stroke="#8892b0" stroke-width="1.5" marker-end="url(#arr5RightGray)"/>

  <rect x="225" y="510" width="120" height="32" rx="4" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="285" y="531" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">Compute Features</text>

  <line x1="350" y1="526" x2="378" y2="526" stroke="#8892b0" stroke-width="1.5" marker-end="url(#arr5RightGray)"/>

  <rect x="385" y="510" width="120" height="32" rx="4" fill="#0a192f" stroke="#ff6b6b" stroke-width="1"/>
  <text x="445" y="531" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="600">Threshold Check</text>

  <line x1="510" y1="526" x2="538" y2="526" stroke="#8892b0" stroke-width="1.5" marker-end="url(#arr5RightGray)"/>

  <rect x="545" y="510" width="100" height="32" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="595" y="531" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="700">0.0 REJECT</text>

  <text x="660" y="531" text-anchor="middle" fill="#8892b0" font-size="12">or</text>

  <rect x="680" y="510" width="100" height="32" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="730" y="531" text-anchor="middle" fill="#4ADE80" font-size="10" font-weight="700">1.0 PASS</text>

  <!-- ===== IV Regime Boxes at bottom ===== -->
  <rect x="30" y="590" width="790" height="76" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1" stroke-dasharray="6,3" filter="url(#shadow5)"/>
  <text x="425" y="614" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">DESIGN PRINCIPLE</text>
  <text x="425" y="636" text-anchor="middle" fill="#ccd6f6" font-size="12">No gradual scaling -- binary gate produces <tspan fill="#ff6b6b" font-weight="700">0.0</tspan> (reject) or <tspan fill="#4ADE80" font-weight="700">1.0</tspan> (full size)</text>
  <text x="425" y="654" text-anchor="middle" fill="#8892b0" font-size="10">When option markets signal danger, the system exits entirely rather than reducing exposure</text>
</svg>