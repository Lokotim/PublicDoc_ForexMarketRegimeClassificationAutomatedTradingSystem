<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 700" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#071225"/>
    </linearGradient>
    <linearGradient id="priceGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="extGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="sh4">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glw4">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8892b0"/>
    </marker>
    <marker id="arr4g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F7B32B"/>
    </marker>
    <marker id="arr4t" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64ffda"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="700" fill="url(#bg4)" rx="8"/>

  <!-- Title -->
  <text x="425" y="36" text-anchor="middle" fill="#ccd6f6" font-size="18" font-weight="700">5-Model Mixture of Experts</text>
  <line x1="280" y1="46" x2="570" y2="46" stroke="#F7B32B" stroke-width="2" opacity="0.5"/>

  <!-- === TOP: Input Feature Split === -->
  <!-- Main input box -->
  <rect x="280" y="60" width="290" height="42" rx="6" fill="#112240" stroke="#64ffda" stroke-width="2" filter="url(#sh4)"/>
  <text x="425" y="78" text-anchor="middle" fill="#64ffda" font-size="12" font-weight="700">INPUT: 134 Features</text>
  <text x="425" y="94" text-anchor="middle" fill="#8892b0" font-size="9">per currency pair</text>

  <!-- Split arrows -->
  <line x1="370" y1="102" x2="190" y2="130" stroke="#F7B32B" stroke-width="1.5" marker-end="url(#arr4g)"/>
  <line x1="480" y1="102" x2="660" y2="130" stroke="#64ffda" stroke-width="1.5" marker-end="url(#arr4t)"/>

  <!-- Price Features box (left) -->
  <rect x="60" y="132" width="260" height="58" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#sh4)"/>
  <rect x="60" y="132" width="260" height="22" rx="6" fill="#2a1f10"/>
  <rect x="60" y="148" width="260" height="6" fill="#2a1f10"/>
  <text x="190" y="149" text-anchor="middle" fill="#F7B32B" font-size="11" font-weight="700">Price Features (20)</text>
  <text x="190" y="172" text-anchor="middle" fill="#8892b0" font-size="10">Used for learned weights (Ridge)</text>
  <text x="190" y="184" text-anchor="middle" fill="#ccd6f6" font-size="9">OHLC, RSI, MACD, Bollinger, ATR...</text>

  <!-- External Features box (right) -->
  <rect x="530" y="132" width="260" height="58" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.5" filter="url(#sh4)"/>
  <rect x="530" y="132" width="260" height="22" rx="6" fill="#0f2a1a"/>
  <rect x="530" y="148" width="260" height="6" fill="#0f2a1a"/>
  <text x="660" y="149" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="700">External Features (114)</text>
  <text x="660" y="172" text-anchor="middle" fill="#8892b0" font-size="10">Used for prior weights (Structural)</text>
  <text x="660" y="184" text-anchor="middle" fill="#ccd6f6" font-size="9">Sentiment, COT, Theory, Calendar, RL, Vol...</text>

  <!-- Section label -->
  <text x="425" y="218" text-anchor="middle" fill="#8892b0" font-size="10" font-weight="600" letter-spacing="1.5">4 STRATEGY SPECIALISTS</text>

  <!-- === MIDDLE: 4 Strategy Specialist Boxes === -->

  <!-- L_TF: Long Trend Following -->
  <rect x="25" y="232" width="190" height="190" rx="6" fill="#112240" stroke="#4ADE80" stroke-width="1.5" filter="url(#sh4)"/>
  <rect x="25" y="232" width="190" height="30" rx="6" fill="#0f2a1a"/>
  <rect x="25" y="254" width="190" height="8" fill="#0f2a1a"/>
  <text x="120" y="252" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="700">L_TF</text>
  <text x="120" y="278" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">Long Trend-Following</text>
  <line x1="55" y1="288" x2="185" y2="288" stroke="#233554" stroke-width="0.8"/>
  <text x="120" y="306" text-anchor="middle" fill="#8892b0" font-size="10">Ridge + Prior Blending</text>
  <text x="120" y="328" text-anchor="middle" fill="#8892b0" font-size="9">Key prior weights:</text>
  <text x="120" y="345" text-anchor="middle" fill="#64ffda" font-size="9">trend_strength: +0.8</text>
  <text x="120" y="360" text-anchor="middle" fill="#64ffda" font-size="9">momentum_20d: +0.6</text>
  <text x="120" y="375" text-anchor="middle" fill="#64ffda" font-size="9">breakout_signal: +0.5</text>
  <rect x="50" y="390" width="140" height="22" rx="4" fill="#0d1b30" stroke="#233554" stroke-width="1"/>
  <text x="120" y="405" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="600">score_L_TF</text>

  <!-- S_TF: Short Trend Following -->
  <rect x="228" y="232" width="190" height="190" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#sh4)"/>
  <rect x="228" y="232" width="190" height="30" rx="6" fill="#2a1015"/>
  <rect x="228" y="254" width="190" height="8" fill="#2a1015"/>
  <text x="323" y="252" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="700">S_TF</text>
  <text x="323" y="278" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">Short Trend-Following</text>
  <line x1="258" y1="288" x2="388" y2="288" stroke="#233554" stroke-width="0.8"/>
  <text x="323" y="306" text-anchor="middle" fill="#8892b0" font-size="10">Ridge + Prior Blending</text>
  <text x="323" y="328" text-anchor="middle" fill="#8892b0" font-size="9">Key prior weights:</text>
  <text x="323" y="345" text-anchor="middle" fill="#ff6b6b" font-size="9">trend_strength: -0.8</text>
  <text x="323" y="360" text-anchor="middle" fill="#ff6b6b" font-size="9">momentum_20d: -0.6</text>
  <text x="323" y="375" text-anchor="middle" fill="#ff6b6b" font-size="9">breakdown_signal: +0.5</text>
  <rect x="253" y="390" width="140" height="22" rx="4" fill="#0d1b30" stroke="#233554" stroke-width="1"/>
  <text x="323" y="405" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="600">score_S_TF</text>

  <!-- L_MR: Long Mean Reversion -->
  <rect x="431" y="232" width="190" height="190" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.5" filter="url(#sh4)"/>
  <rect x="431" y="232" width="190" height="30" rx="6" fill="#0f2a1a"/>
  <rect x="431" y="254" width="190" height="8" fill="#0f2a1a"/>
  <text x="526" y="252" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="700">L_MR</text>
  <text x="526" y="278" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">Long Mean-Reversion</text>
  <line x1="461" y1="288" x2="591" y2="288" stroke="#233554" stroke-width="0.8"/>
  <text x="526" y="306" text-anchor="middle" fill="#8892b0" font-size="10">Ridge + Prior Blending</text>
  <text x="526" y="328" text-anchor="middle" fill="#8892b0" font-size="9">Key prior weights:</text>
  <text x="526" y="345" text-anchor="middle" fill="#64ffda" font-size="9">z_score: -0.7</text>
  <text x="526" y="360" text-anchor="middle" fill="#64ffda" font-size="9">bb_position: -0.5</text>
  <text x="526" y="375" text-anchor="middle" fill="#64ffda" font-size="9">oversold_rsi: +0.6</text>
  <rect x="456" y="390" width="140" height="22" rx="4" fill="#0d1b30" stroke="#233554" stroke-width="1"/>
  <text x="526" y="405" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="600">score_L_MR</text>

  <!-- S_MR: Short Mean Reversion -->
  <rect x="634" y="232" width="190" height="190" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#sh4)"/>
  <rect x="634" y="232" width="190" height="30" rx="6" fill="#2a1f10"/>
  <rect x="634" y="254" width="190" height="8" fill="#2a1f10"/>
  <text x="729" y="252" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">S_MR</text>
  <text x="729" y="278" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">Short Mean-Reversion</text>
  <line x1="664" y1="288" x2="794" y2="288" stroke="#233554" stroke-width="0.8"/>
  <text x="729" y="306" text-anchor="middle" fill="#8892b0" font-size="10">Ridge + Prior Blending</text>
  <text x="729" y="328" text-anchor="middle" fill="#8892b0" font-size="9">Key prior weights:</text>
  <text x="729" y="345" text-anchor="middle" fill="#F7B32B" font-size="9">z_score: +0.7</text>
  <text x="729" y="360" text-anchor="middle" fill="#F7B32B" font-size="9">bb_position: +0.5</text>
  <text x="729" y="375" text-anchor="middle" fill="#F7B32B" font-size="9">overbought_rsi: +0.6</text>
  <rect x="659" y="390" width="140" height="22" rx="4" fill="#0d1b30" stroke="#233554" stroke-width="1"/>
  <text x="729" y="405" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="600">score_S_MR</text>

  <!-- Blending formula -->
  <rect x="230" y="435" width="390" height="34" rx="17" fill="#0d1b30" stroke="#F7B32B" stroke-width="1.2"/>
  <text x="425" y="448" text-anchor="middle" fill="#8892b0" font-size="10">Blending factor:</text>
  <text x="425" y="462" text-anchor="middle" fill="#F7B32B" font-size="12" font-weight="700" font-style="italic">alpha = min(n / 200, 0.50)</text>

  <!-- Arrows from specialists down to meta-classifier -->
  <line x1="120" y1="422" x2="320" y2="500" stroke="#8892b0" stroke-width="1" opacity="0.5" marker-end="url(#arr4)"/>
  <line x1="323" y1="422" x2="380" y2="500" stroke="#8892b0" stroke-width="1" opacity="0.5" marker-end="url(#arr4)"/>
  <line x1="526" y1="422" x2="470" y2="500" stroke="#8892b0" stroke-width="1" opacity="0.5" marker-end="url(#arr4)"/>
  <line x1="729" y1="422" x2="530" y2="500" stroke="#8892b0" stroke-width="1" opacity="0.5" marker-end="url(#arr4)"/>

  <!-- === BOTTOM: Meta-Classifier === -->
  <rect x="225" y="500" width="400" height="90" rx="8" fill="#112240" stroke="#F7B32B" stroke-width="2" filter="url(#sh4)"/>
  <rect x="225" y="500" width="400" height="28" rx="8" fill="#2a1f10"/>
  <rect x="225" y="520" width="400" height="8" fill="#2a1f10"/>
  <text x="425" y="520" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">Meta-Classifier</text>

  <text x="425" y="548" text-anchor="middle" fill="#ccd6f6" font-size="11">4-Way Competition + Structural Bonus</text>
  <text x="425" y="566" text-anchor="middle" fill="#8892b0" font-size="10">Winner = argmax(scores) with confidence margin check</text>
  <text x="425" y="582" text-anchor="middle" fill="#8892b0" font-size="9">Structural bonus: +0.15 for theory-aligned regimes</text>

  <!-- Arrow to output -->
  <line x1="425" y1="590" x2="425" y2="618" stroke="#64ffda" stroke-width="2" marker-end="url(#arr4t)"/>

  <!-- === OUTPUT === -->
  <rect x="220" y="620" width="410" height="60" rx="8" fill="#112240" stroke="#64ffda" stroke-width="2" filter="url(#sh4)"/>
  <rect x="220" y="620" width="410" height="24" rx="8" fill="#0f2a1a"/>
  <rect x="220" y="638" width="410" height="6" fill="#0f2a1a"/>
  <text x="425" y="638" text-anchor="middle" fill="#64ffda" font-size="12" font-weight="700">OUTPUT</text>

  <text x="290" y="664" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">regime</text>
  <text x="290" y="676" text-anchor="middle" fill="#8892b0" font-size="9">TF / MR</text>

  <line x1="345" y1="652" x2="345" y2="678" stroke="#233554" stroke-width="1"/>

  <text x="425" y="664" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">direction</text>
  <text x="425" y="676" text-anchor="middle" fill="#8892b0" font-size="9">Long / Short</text>

  <line x1="505" y1="652" x2="505" y2="678" stroke="#233554" stroke-width="1"/>

  <text x="560" y="664" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">confidence</text>
  <text x="560" y="676" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="700">[0.30 - 0.95]</text>
</svg>