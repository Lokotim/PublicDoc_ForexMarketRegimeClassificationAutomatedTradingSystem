<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="rlShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="rlGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="shGrad1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shGrad2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F7B32B" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="8" fill="#0a192f"/>

  <!-- White Swan Philosophy Banner (top) -->
  <rect x="100" y="8" width="600" height="38" rx="8" fill="#112240" stroke="#F7B32B" stroke-width="1.5" stroke-dasharray="8,4" filter="url(#rlShadow)"/>
  <text x="400" y="26" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700" letter-spacing="1">White Swan Philosophy</text>
  <text x="400" y="40" text-anchor="middle" fill="#ccd6f6" font-size="9">Trade full size or skip entirely -- no half measures in risk management</text>

  <!-- Title -->
  <text x="400" y="65" text-anchor="middle" fill="url(#rlGoldGrad)" font-size="16" font-weight="700" letter-spacing="0.5">Nine Independent Safety Layers</text>
  <line x1="240" y1="72" x2="560" y2="72" stroke="#233554" stroke-width="1"/>

  <!-- ===== LAYER 1: IV Black Swan Filter ===== -->
  <g transform="translate(0, 80)">
    <path d="M38,10 L38,32 C38,48 55,58 55,58 C55,58 72,48 72,32 L72,10 L55,2 Z" fill="url(#shGrad1)" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="55" y="34" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="700">1</text>

    <rect x="88" y="2" width="700" height="56" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.2" filter="url(#rlShadow)"/>
    <text x="100" y="20" fill="#ff6b6b" font-size="12" font-weight="700">IV Black Swan Filter</text>
    <text x="320" y="20" fill="#8892b0" font-size="9">Binary gate: IV&gt;80th pct, VRP extreme, term structure inverted</text>
    <rect x="100" y="30" width="88" height="20" rx="4" fill="#0a192f" stroke="#ff6b6b" stroke-opacity="0.4"/>
    <text x="144" y="44" text-anchor="middle" fill="#ff6b6b" font-size="8" font-weight="600">IV &gt; 80th pct</text>
    <rect x="198" y="30" width="88" height="20" rx="4" fill="#0a192f" stroke="#ff6b6b" stroke-opacity="0.4"/>
    <text x="242" y="44" text-anchor="middle" fill="#ff6b6b" font-size="8" font-weight="600">VRP extreme</text>
    <rect x="296" y="30" width="110" height="20" rx="4" fill="#0a192f" stroke="#ff6b6b" stroke-opacity="0.4"/>
    <text x="351" y="44" text-anchor="middle" fill="#ff6b6b" font-size="8" font-weight="600">TS inverted</text>
    <rect x="620" y="16" width="150" height="28" rx="6" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
    <text x="695" y="35" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="700">REJECT</text>
  </g>

  <!-- ===== LAYER 2: Daily P&L Circuit Breaker ===== -->
  <g transform="translate(0, 142)">
    <path d="M38,10 L38,32 C38,48 55,58 55,58 C55,58 72,48 72,32 L72,10 L55,2 Z" fill="url(#shGrad2)" stroke="#F7B32B" stroke-width="1.5"/>
    <text x="55" y="34" text-anchor="middle" fill="#F7B32B" font-size="16" font-weight="700">2</text>

    <rect x="88" y="2" width="700" height="56" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.2" filter="url(#rlShadow)"/>
    <text x="100" y="20" fill="#F7B32B" font-size="12" font-weight="700">Daily P&amp;L Circuit Breaker</text>
    <text x="350" y="20" fill="#8892b0" font-size="9">Progressive drawdown response based on daily loss</text>

    <rect x="100" y="30" width="120" height="22" rx="5" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
    <text x="160" y="45" text-anchor="middle" fill="#4ADE80" font-size="9" font-weight="700">NORMAL 100%</text>

    <text x="230" y="45" fill="#8892b0" font-size="10">&#8594;</text>

    <rect x="246" y="30" width="120" height="22" rx="5" fill="#2a2a1a" stroke="#FFD54F" stroke-width="1"/>
    <text x="306" y="45" text-anchor="middle" fill="#FFD54F" font-size="9" font-weight="700">REDUCED 50%</text>

    <text x="376" y="45" fill="#8892b0" font-size="10">&#8594;</text>

    <rect x="392" y="30" width="120" height="22" rx="5" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
    <text x="452" y="45" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="700">HALT 0%</text>

    <text x="680" y="45" text-anchor="middle" fill="#8892b0" font-size="8">Daily drawdown trigger</text>
  </g>

  <!-- ===== LAYER 3: Crowding Penalty ===== -->
  <g transform="translate(0, 204)">
    <path d="M38,10 L38,32 C38,48 55,58 55,58 C55,58 72,48 72,32 L72,10 L55,2 Z" fill="url(#shGrad3)" stroke="#64ffda" stroke-width="1.5"/>
    <text x="55" y="34" text-anchor="middle" fill="#64ffda" font-size="16" font-weight="700">3</text>

    <rect x="88" y="2" width="700" height="56" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.2" filter="url(#rlShadow)"/>
    <text x="100" y="20" fill="#64ffda" font-size="12" font-weight="700">Crowding Penalty</text>
    <text x="262" y="20" fill="#8892b0" font-size="9">A/B tested, Sortino-based cohort split</text>

    <rect x="100" y="30" width="150" height="22" rx="5" fill="#0a192f" stroke="#64ffda" stroke-opacity="0.4"/>
    <text x="175" y="45" text-anchor="middle" fill="#64ffda" font-size="8" font-weight="600">Cohort A: Fade crowd</text>

    <text x="262" y="46" fill="#8892b0" font-size="10">vs</text>

    <rect x="280" y="30" width="170" height="22" rx="5" fill="#0a192f" stroke="#64ffda" stroke-opacity="0.4"/>
    <text x="365" y="45" text-anchor="middle" fill="#64ffda" font-size="8" font-weight="600">Cohort B: Ignore crowd</text>

    <rect x="620" y="16" width="150" height="28" rx="6" fill="#1a2a3a" stroke="#64ffda" stroke-width="1"/>
    <text x="695" y="35" text-anchor="middle" fill="#64ffda" font-size="9" font-weight="600">Sortino winner</text>
  </g>

  <!-- ===== LAYER 4: Data Integrity Guard ===== -->
  <g transform="translate(0, 266)">
    <path d="M38,10 L38,32 C38,48 55,58 55,58 C55,58 72,48 72,32 L72,10 L55,2 Z" fill="url(#shGrad2)" stroke="#F7B32B" stroke-width="1.5"/>
    <text x="55" y="34" text-anchor="middle" fill="#F7B32B" font-size="16" font-weight="700">4</text>

    <rect x="88" y="2" width="700" height="56" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.2" filter="url(#rlShadow)"/>
    <text x="100" y="20" fill="#F7B32B" font-size="12" font-weight="700">Data Integrity Guard</text>
    <text x="280" y="20" fill="#8892b0" font-size="9">Quarantine rows with suspicious values before models</text>

    <rect x="100" y="30" width="140" height="22" rx="5" fill="#0a192f" stroke="#F7B32B" stroke-opacity="0.4"/>
    <text x="170" y="45" text-anchor="middle" fill="#F7B32B" font-size="8" font-weight="600">|pnl_pct| &gt; 10%</text>

    <rect x="254" y="30" width="140" height="22" rx="5" fill="#0a192f" stroke="#F7B32B" stroke-opacity="0.4"/>
    <text x="324" y="45" text-anchor="middle" fill="#F7B32B" font-size="8" font-weight="600">Missing fields</text>

    <rect x="408" y="30" width="140" height="22" rx="5" fill="#0a192f" stroke="#F7B32B" stroke-opacity="0.4"/>
    <text x="478" y="45" text-anchor="middle" fill="#F7B32B" font-size="8" font-weight="600">NaN / Inf / stale</text>

    <rect x="620" y="16" width="150" height="28" rx="6" fill="#2a2a1a" stroke="#F7B32B" stroke-width="1"/>
    <text x="695" y="35" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="600">QUARANTINE</text>
  </g>

  <!-- ===== LAYER 5: Correlation Limits ===== -->
  <g transform="translate(0, 328)">
    <path d="M38,10 L38,32 C38,48 55,58 55,58 C55,58 72,48 72,32 L72,10 L55,2 Z" fill="url(#shGrad1)" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="55" y="34" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="700">5</text>

    <rect x="88" y="2" width="700" height="56" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.2" filter="url(#rlShadow)"/>
    <text x="100" y="20" fill="#ff6b6b" font-size="12" font-weight="700">Correlation Limits</text>
    <text x="260" y="20" fill="#8892b0" font-size="9">Tiered equity allocation caps prevent concentration risk</text>

    <rect x="100" y="30" width="155" height="22" rx="5" fill="#0a192f" stroke="#64ffda" stroke-width="1"/>
    <text x="177" y="45" text-anchor="middle" fill="#64ffda" font-size="9" font-weight="700">Portfolio: 6%</text>

    <rect x="270" y="30" width="175" height="22" rx="5" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
    <text x="357" y="45" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="700">Correlated: 4%</text>

    <rect x="460" y="30" width="140" height="22" rx="5" fill="#0a192f" stroke="#ff6b6b" stroke-width="1"/>
    <text x="530" y="45" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="700">Single: 2%</text>

    <text x="695" y="45" text-anchor="middle" fill="#8892b0" font-size="8">Max exposure caps</text>
  </g>

  <!-- ===== LAYER 6: Strategy Health Monitor (CSI) ===== -->
  <g transform="translate(0, 390)">
    <path d="M38,10 L38,32 C38,48 55,58 55,58 C55,58 72,48 72,32 L72,10 L55,2 Z" fill="url(#shGrad3)" stroke="#64ffda" stroke-width="1.5"/>
    <text x="55" y="34" text-anchor="middle" fill="#64ffda" font-size="16" font-weight="700">6</text>

    <rect x="88" y="2" width="700" height="52" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.2" filter="url(#rlShadow)"/>
    <text x="100" y="20" fill="#64ffda" font-size="12" font-weight="700">Strategy Health Monitor (CSI)</text>
    <text x="370" y="20" fill="#8892b0" font-size="9">Composite score from profitability + risk + confidence</text>

    <rect x="100" y="30" width="170" height="18" rx="4" fill="#0a192f" stroke="#64ffda" stroke-opacity="0.4"/>
    <text x="185" y="43" text-anchor="middle" fill="#64ffda" font-size="8">Profitability + Risk + Conf</text>

    <rect x="284" y="30" width="120" height="18" rx="4" fill="#0a192f" stroke="#64ffda" stroke-opacity="0.4"/>
    <text x="344" y="43" text-anchor="middle" fill="#64ffda" font-size="8">CSI composite</text>

    <rect x="620" y="14" width="150" height="28" rx="6" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
    <text x="695" y="33" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="600">CSI=0: ZERO-KILL</text>
  </g>
</svg>