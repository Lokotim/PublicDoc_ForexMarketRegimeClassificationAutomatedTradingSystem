<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 820" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow4" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="shieldGrad1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shieldGrad2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F7B32B" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shieldGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="820" rx="8" fill="#0a192f"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" fill="url(#goldGrad4)" font-size="20" font-weight="700" letter-spacing="0.5">Five Independent Circuit Breakers</text>
  <line x1="220" y1="50" x2="630" y2="50" stroke="#233554" stroke-width="1"/>

  <!-- ===== LAYER 1: IV Black Swan Filter ===== -->
  <g transform="translate(0, 70)">
    <!-- Shield icon -->
    <path d="M60,18 L60,50 C60,75 85,90 85,90 C85,90 110,75 110,50 L110,18 L85,6 Z" fill="url(#shieldGrad1)" stroke="#ff6b6b" stroke-width="2"/>
    <text x="85" y="52" text-anchor="middle" fill="#ff6b6b" font-size="22" font-weight="700">1</text>

    <!-- Content box -->
    <rect x="130" y="6" width="690" height="106" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="475" y="30" text-anchor="middle" fill="#ff6b6b" font-size="15" font-weight="700">IV Black Swan Filter</text>
    <text x="475" y="48" text-anchor="middle" fill="#8892b0" font-size="11">Shuts down trading when option markets signal extreme risk</text>

    <!-- Thresholds -->
    <rect x="155" y="58" width="150" height="40" rx="4" fill="#0a192f" stroke="#233554"/>
    <text x="230" y="75" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="600">IV &gt; 80%</text>
    <text x="230" y="90" text-anchor="middle" fill="#8892b0" font-size="9">Implied Vol percentile</text>

    <rect x="320" y="58" width="150" height="40" rx="4" fill="#0a192f" stroke="#233554"/>
    <text x="395" y="75" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="600">VR &lt; 0.50</text>
    <text x="395" y="90" text-anchor="middle" fill="#8892b0" font-size="9">Volatility Ratio</text>

    <rect x="485" y="58" width="160" height="40" rx="4" fill="#0a192f" stroke="#233554"/>
    <text x="565" y="75" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="600">VRP extreme</text>
    <text x="565" y="90" text-anchor="middle" fill="#8892b0" font-size="9">Vol Risk Premium</text>

    <rect x="660" y="58" width="140" height="40" rx="4" fill="#0a192f" stroke="#233554"/>
    <text x="730" y="75" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="600">TS &gt; 1.40</text>
    <text x="730" y="90" text-anchor="middle" fill="#8892b0" font-size="9">Term Structure</text>
  </g>

  <!-- ===== LAYER 2: Daily P&L Circuit Breaker ===== -->
  <g transform="translate(0, 210)">
    <!-- Shield icon -->
    <path d="M60,18 L60,50 C60,75 85,90 85,90 C85,90 110,75 110,50 L110,18 L85,6 Z" fill="url(#shieldGrad2)" stroke="#F7B32B" stroke-width="2"/>
    <text x="85" y="52" text-anchor="middle" fill="#F7B32B" font-size="22" font-weight="700">2</text>

    <!-- Content box -->
    <rect x="130" y="6" width="690" height="106" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="475" y="30" text-anchor="middle" fill="#F7B32B" font-size="15" font-weight="700">Daily P&amp;L Circuit Breaker</text>
    <text x="475" y="48" text-anchor="middle" fill="#8892b0" font-size="11">Progressively reduces exposure on losing days</text>

    <!-- State machine -->
    <rect x="180" y="58" width="140" height="42" rx="6" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1.5"/>
    <text x="250" y="76" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700">NORMAL</text>
    <text x="250" y="92" text-anchor="middle" fill="#ccd6f6" font-size="10">Full size (1.0)</text>

    <!-- Arrow -->
    <line x1="325" y1="79" x2="380" y2="79" stroke="#8892b0" stroke-width="1.5"/>
    <polygon points="378,74 388,79 378,84" fill="#8892b0"/>

    <rect x="390" y="58" width="140" height="42" rx="6" fill="#2a2a1a" stroke="#FFD54F" stroke-width="1.5"/>
    <text x="460" y="76" text-anchor="middle" fill="#FFD54F" font-size="12" font-weight="700">REDUCED</text>
    <text x="460" y="92" text-anchor="middle" fill="#ccd6f6" font-size="10">75% size (0.75)</text>

    <!-- Arrow -->
    <line x1="535" y1="79" x2="590" y2="79" stroke="#8892b0" stroke-width="1.5"/>
    <polygon points="588,74 598,79 588,84" fill="#8892b0"/>

    <rect x="600" y="58" width="140" height="42" rx="6" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="670" y="76" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">HALT</text>
    <text x="670" y="92" text-anchor="middle" fill="#ccd6f6" font-size="10">No trading (0.0)</text>
  </g>

  <!-- ===== LAYER 3: Crowding Penalty ===== -->
  <g transform="translate(0, 350)">
    <!-- Shield icon -->
    <path d="M60,18 L60,50 C60,75 85,90 85,90 C85,90 110,75 110,50 L110,18 L85,6 Z" fill="url(#shieldGrad3)" stroke="#64ffda" stroke-width="2"/>
    <text x="85" y="52" text-anchor="middle" fill="#64ffda" font-size="22" font-weight="700">3</text>

    <!-- Content box -->
    <rect x="130" y="6" width="690" height="106" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="475" y="30" text-anchor="middle" fill="#64ffda" font-size="15" font-weight="700">Crowding Penalty</text>
    <text x="475" y="48" text-anchor="middle" fill="#8892b0" font-size="11">Prevents portfolio concentration in correlated positions</text>

    <!-- Concentration meter -->
    <rect x="180" y="62" width="540" height="16" rx="8" fill="#0a192f" stroke="#233554"/>
    <rect x="180" y="62" width="378" height="16" rx="8" fill="#64ffda" opacity="0.3"/>
    <!-- 70% marker -->
    <line x1="558" y1="56" x2="558" y2="84" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="558" y="52" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="600">70%</text>

    <text x="370" y="75" text-anchor="middle" fill="#ccd6f6" font-size="9">concentration</text>

    <rect x="220" y="88" width="200" height="28" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
    <text x="320" y="107" text-anchor="middle" fill="#4ADE80" font-size="11" font-weight="600">&lt; 70% → ALLOW</text>

    <rect x="460" y="88" width="200" height="28" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
    <text x="560" y="107" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="600">&gt; 70% → REJECT</text>
  </g>

  <!-- ===== LAYER 4: Data Integrity Guard ===== -->
  <g transform="translate(0, 490)">
    <!-- Shield icon -->
    <path d="M60,18 L60,50 C60,75 85,90 85,90 C85,90 110,75 110,50 L110,18 L85,6 Z" fill="url(#shieldGrad2)" stroke="#F7B32B" stroke-width="2"/>
    <text x="85" y="52" text-anchor="middle" fill="#F7B32B" font-size="22" font-weight="700">4</text>

    <!-- Content box -->
    <rect x="130" y="6" width="690" height="86" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="475" y="30" text-anchor="middle" fill="#F7B32B" font-size="15" font-weight="700">Data Integrity Guard</text>
    <text x="475" y="48" text-anchor="middle" fill="#8892b0" font-size="11">Quarantines impossible data before it reaches any model</text>

    <rect x="200" y="58" width="240" height="26" rx="4" fill="#0a192f" stroke="#233554"/>
    <text x="320" y="76" text-anchor="middle" fill="#ccd6f6" font-size="10">NaN / Inf / stale timestamps</text>

    <rect x="460" y="58" width="240" height="26" rx="4" fill="#0a192f" stroke="#233554"/>
    <text x="580" y="76" text-anchor="middle" fill="#ccd6f6" font-size="10">Statistically impossible values</text>

    <text x="410" y="76" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="700">|</text>
  </g>

  <!-- ===== LAYER 5: Correlation Limits ===== -->
  <g transform="translate(0, 610)">
    <!-- Shield icon -->
    <path d="M60,18 L60,50 C60,75 85,90 85,90 C85,90 110,75 110,50 L110,18 L85,6 Z" fill="url(#shieldGrad1)" stroke="#ff6b6b" stroke-width="2"/>
    <text x="85" y="52" text-anchor="middle" fill="#ff6b6b" font-size="22" font-weight="700">5</text>

    <!-- Content box -->
    <rect x="130" y="6" width="690" height="106" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="475" y="30" text-anchor="middle" fill="#ff6b6b" font-size="15" font-weight="700">Correlation Limits</text>
    <text x="475" y="48" text-anchor="middle" fill="#8892b0" font-size="11">Tiered equity allocation caps prevent concentration risk</text>

    <!-- Three limit boxes -->
    <rect x="180" y="58" width="155" height="42" rx="4" fill="#0a192f" stroke="#64ffda" stroke-width="1.5"/>
    <text x="257" y="76" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="700">Portfolio: 6%</text>
    <text x="257" y="92" text-anchor="middle" fill="#8892b0" font-size="9">Max total exposure</text>

    <rect x="355" y="58" width="175" height="42" rx="4" fill="#0a192f" stroke="#F7B32B" stroke-width="1.5"/>
    <text x="442" y="76" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">Correlated: 4%</text>
    <text x="442" y="92" text-anchor="middle" fill="#8892b0" font-size="9">Correlated pair group</text>

    <rect x="550" y="58" width="155" height="42" rx="4" fill="#0a192f" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="627" y="76" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="700">Single: 2%</text>
    <text x="627" y="92" text-anchor="middle" fill="#8892b0" font-size="9">Per instrument</text>
  </g>

  <!-- ===== WHITE SWAN PHILOSOPHY BANNER ===== -->
  <rect x="100" y="746" width="650" height="56" rx="8" fill="#112240" stroke="#F7B32B" stroke-width="2" stroke-dasharray="8,4" filter="url(#shadow4)"/>
  <text x="425" y="770" text-anchor="middle" fill="#F7B32B" font-size="22">&#9888;</text>
  <text x="425" y="770" text-anchor="middle" fill="#F7B32B" font-size="15" font-weight="700">      White Swan Philosophy</text>
  <text x="425" y="790" text-anchor="middle" fill="#ccd6f6" font-size="13">Trade full size or skip entirely -- no half measures in risk management</text>
</svg>