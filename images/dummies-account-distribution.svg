<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <filter id="ad-s">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#ad-bg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">8 Accounts x 4 Strategies = 32 Robots</text>
  <text x="400" y="48" text-anchor="middle" fill="#64748b" font-size="11">Each currency pair has its own account — maximum diversification</text>

  <!-- Gateway labels -->
  <rect x="30" y="68" width="360" height="20" rx="4" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="210" y="82" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">DOM Gateway (4 accounts)</text>
  <rect x="410" y="68" width="360" height="20" rx="4" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="590" y="82" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600">VAL Gateway (4 accounts)</text>

  <!-- Account 1: AUDJPY -->
  <rect x="30" y="96" width="170" height="130" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" filter="url(#ad-s)"/>
  <text x="115" y="116" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">AUDJPY</text>
  <text x="115" y="130" text-anchor="middle" fill="#64748b" font-size="8">Account 1</text>
  <rect x="42" y="140" width="146" height="18" rx="3" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="0.5"/>
  <text x="115" y="153" text-anchor="middle" fill="#00ff88" font-size="8">L TF — Trend Long</text>
  <rect x="42" y="162" width="146" height="18" rx="3" fill="rgba(34,197,94,0.1)" stroke="#22c55e" stroke-width="0.5"/>
  <text x="115" y="175" text-anchor="middle" fill="#22c55e" font-size="8">L MR — Mean Rev Long</text>
  <rect x="42" y="184" width="146" height="18" rx="3" fill="rgba(234,179,8,0.1)" stroke="#eab308" stroke-width="0.5"/>
  <text x="115" y="197" text-anchor="middle" fill="#eab308" font-size="8">S TF — Trend Short</text>
  <rect x="42" y="206" width="146" height="18" rx="3" fill="rgba(255,107,53,0.1)" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="115" y="219" text-anchor="middle" fill="#ff6b35" font-size="8">S MR — Mean Rev Short</text>

  <!-- Account 2: AUDUSD -->
  <rect x="220" y="96" width="170" height="130" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" filter="url(#ad-s)"/>
  <text x="305" y="116" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">AUDUSD</text>
  <text x="305" y="130" text-anchor="middle" fill="#64748b" font-size="8">Account 2</text>
  <rect x="232" y="140" width="146" height="18" rx="3" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="0.5"/>
  <text x="305" y="153" text-anchor="middle" fill="#00ff88" font-size="8">L TF</text>
  <rect x="232" y="162" width="146" height="18" rx="3" fill="rgba(34,197,94,0.1)" stroke="#22c55e" stroke-width="0.5"/>
  <text x="305" y="175" text-anchor="middle" fill="#22c55e" font-size="8">L MR</text>
  <rect x="232" y="184" width="146" height="18" rx="3" fill="rgba(234,179,8,0.1)" stroke="#eab308" stroke-width="0.5"/>
  <text x="305" y="197" text-anchor="middle" fill="#eab308" font-size="8">S TF</text>
  <rect x="232" y="206" width="146" height="18" rx="3" fill="rgba(255,107,53,0.1)" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="305" y="219" text-anchor="middle" fill="#ff6b35" font-size="8">S MR</text>

  <!-- Account 3: EURJPY -->
  <rect x="30" y="234" width="170" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" filter="url(#ad-s)"/>
  <text x="115" y="256" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">EURJPY</text>
  <text x="115" y="270" text-anchor="middle" fill="#64748b" font-size="8">Account 3 — 4 strategies</text>
  <text x="115" y="288" text-anchor="middle" fill="#475569" font-size="8">L TF | L MR | S TF | S MR</text>

  <!-- Account 4: EURUSD -->
  <rect x="220" y="234" width="170" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" filter="url(#ad-s)"/>
  <text x="305" y="256" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">EURUSD</text>
  <text x="305" y="270" text-anchor="middle" fill="#64748b" font-size="8">Account 4 — 4 strategies</text>
  <text x="305" y="288" text-anchor="middle" fill="#475569" font-size="8">L TF | L MR | S TF | S MR</text>

  <!-- Account 5: GBPUSD -->
  <rect x="410" y="96" width="170" height="130" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" filter="url(#ad-s)"/>
  <text x="495" y="116" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="700">GBPUSD</text>
  <text x="495" y="130" text-anchor="middle" fill="#64748b" font-size="8">Account 5</text>
  <rect x="422" y="140" width="146" height="18" rx="3" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="0.5"/>
  <text x="495" y="153" text-anchor="middle" fill="#00ff88" font-size="8">L TF</text>
  <rect x="422" y="162" width="146" height="18" rx="3" fill="rgba(34,197,94,0.1)" stroke="#22c55e" stroke-width="0.5"/>
  <text x="495" y="175" text-anchor="middle" fill="#22c55e" font-size="8">L MR</text>
  <rect x="422" y="184" width="146" height="18" rx="3" fill="rgba(255,107,53,0.1)" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="495" y="197" text-anchor="middle" fill="#ff6b35" font-size="8">S TF (coded L)</text>
  <rect x="422" y="206" width="146" height="18" rx="3" fill="rgba(255,107,53,0.1)" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="495" y="219" text-anchor="middle" fill="#ff6b35" font-size="8">S MR (coded L)</text>

  <!-- Account 6: USDCAD -->
  <rect x="600" y="96" width="170" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" filter="url(#ad-s)"/>
  <text x="685" y="116" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="700">USDCAD</text>
  <text x="685" y="130" text-anchor="middle" fill="#64748b" font-size="8">Account 6 — 4 strategies</text>
  <text x="685" y="148" text-anchor="middle" fill="#475569" font-size="8">L TF | L MR | S TF | S MR</text>

  <!-- Account 7: USDCHF -->
  <rect x="600" y="164" width="170" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" filter="url(#ad-s)"/>
  <text x="685" y="184" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="700">USDCHF</text>
  <text x="685" y="198" text-anchor="middle" fill="#64748b" font-size="8">Account 7 — 4 strategies</text>
  <text x="685" y="216" text-anchor="middle" fill="#475569" font-size="8">L TF | L MR | S TF | S MR</text>

  <!-- Account 8: USDJPY -->
  <rect x="410" y="234" width="170" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" filter="url(#ad-s)"/>
  <text x="495" y="256" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="700">USDJPY</text>
  <text x="495" y="270" text-anchor="middle" fill="#64748b" font-size="8">Account 8 — 4 strategies</text>
  <text x="495" y="288" text-anchor="middle" fill="#475569" font-size="8">L TF | L MR | S TF | S MR</text>

  <!-- Legend -->
  <rect x="30" y="310" width="740" height="80" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="332" fill="#e2e8f0" font-size="11" font-weight="600">Strategy Types:</text>
  <rect x="50" y="342" width="12" height="12" rx="2" fill="#00ff88" fill-opacity="0.3" stroke="#00ff88" stroke-width="0.5"/>
  <text x="68" y="353" fill="#00ff88" font-size="10" font-weight="600">L TF</text>
  <text x="96" y="353" fill="#94a3b8" font-size="10">= Long Trend Following</text>
  <rect x="260" y="342" width="12" height="12" rx="2" fill="#22c55e" fill-opacity="0.3" stroke="#22c55e" stroke-width="0.5"/>
  <text x="278" y="353" fill="#22c55e" font-size="10" font-weight="600">L MR</text>
  <text x="310" y="353" fill="#94a3b8" font-size="10">= Long Mean Reversion</text>
  <rect x="50" y="362" width="12" height="12" rx="2" fill="#eab308" fill-opacity="0.3" stroke="#eab308" stroke-width="0.5"/>
  <text x="68" y="373" fill="#eab308" font-size="10" font-weight="600">S TF</text>
  <text x="96" y="373" fill="#94a3b8" font-size="10">= Short Trend Following</text>
  <rect x="260" y="362" width="12" height="12" rx="2" fill="#ff6b35" fill-opacity="0.3" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="278" y="373" fill="#ff6b35" font-size="10" font-weight="600">S MR</text>
  <text x="310" y="373" fill="#94a3b8" font-size="10">= Short Mean Reversion</text>

  <text x="530" y="340" fill="#94a3b8" font-size="10">Each account trades 1 currency pair with 4 strategies.</text>
  <text x="530" y="356" fill="#94a3b8" font-size="10">L = expects price to rise | S = expects price to fall</text>
  <text x="530" y="372" fill="#94a3b8" font-size="10">TF = rides the trend | MR = bets on reversal</text>
</svg>
