<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="850" height="350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowAmber">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD54F" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="ciGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00D4FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#00D4FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="350" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#E2E8F0">Bayesian Calibrator -- MCMC Posterior Convergence</text>
  <text x="425" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">4 chains x 5,000 iterations | Metropolis-Hastings | Beta(1,1) prior</text>

  <!-- Section 1: MCMC Chains (left) -->
  <rect x="20" y="65" width="260" height="210" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="150" y="85" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#E2E8F0">MCMC Chain Traces</text>

  <!-- Chain traces (simulated convergence) -->
  <!-- Chain 1 (Red) -->
  <polyline points="35,200 55,180 75,195 95,170 115,165 135,160 155,162 175,158 195,160 215,157 235,158 255,157" fill="none" stroke="#F87171" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Chain 2 (Cyan) -->
  <polyline points="35,140 55,165 75,150 95,170 115,160 135,155 155,158 175,160 195,157 215,159 235,157 255,158" fill="none" stroke="#00D4FF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Chain 3 (Green) -->
  <polyline points="35,170 55,190 75,175 95,165 115,155 135,162 155,157 175,155 195,159 215,156 235,158 255,157" fill="none" stroke="#4ADE80" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Chain 4 (Purple) -->
  <polyline points="35,230 55,210 75,185 95,175 115,168 135,163 155,160 175,162 195,158 215,158 235,156 255,158" fill="none" stroke="#E879F9" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Convergence zone -->
  <rect x="180" y="152" width="85" height="16" rx="3" fill="#4ADE80" opacity="0.08"/>

  <!-- Y-axis labels -->
  <text x="30" y="140" font-family="Consolas, monospace" font-size="8" fill="#64748B">0.70</text>
  <text x="30" y="165" font-family="Consolas, monospace" font-size="8" fill="#64748B">0.60</text>
  <text x="30" y="195" font-family="Consolas, monospace" font-size="8" fill="#64748B">0.50</text>
  <text x="30" y="230" font-family="Consolas, monospace" font-size="8" fill="#64748B">0.40</text>

  <!-- X-axis -->
  <text x="35" y="262" font-family="Consolas, monospace" font-size="8" fill="#64748B">0</text>
  <text x="145" y="262" font-family="Consolas, monospace" font-size="8" fill="#64748B">2500</text>
  <text x="245" y="262" font-family="Consolas, monospace" font-size="8" fill="#64748B">5000</text>
  <text x="150" y="275" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">iterations</text>

  <!-- R-hat badge -->
  <rect x="60" y="96" width="100" height="22" rx="4" fill="#4ADE80" opacity="0.15" stroke="#4ADE80" stroke-width="1"/>
  <text x="110" y="111" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">R-hat: 1.04</text>

  <!-- Section 2: Posterior Distribution (center) -->
  <rect x="300" y="65" width="250" height="210" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="425" y="85" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#E2E8F0">Posterior Distribution</text>

  <!-- 95% CI shaded region -->
  <path d="M340,240 Q360,230 380,200 Q400,140 425,120 Q450,140 470,200 Q490,230 510,240Z" fill="url(#ciGrad)"/>

  <!-- Bell curve -->
  <path d="M330,240 Q350,238 370,220 Q390,170 410,130 Q420,115 425,112 Q430,115 440,130 Q460,170 480,220 Q500,238 520,240" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Mean line -->
  <line x1="425" y1="100" x2="425" y2="245" stroke="#FFD54F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="425" y="97" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#FFD54F">mean=0.571</text>

  <!-- 95% CI boundaries -->
  <line x1="370" y1="100" x2="370" y2="245" stroke="#F87171" stroke-width="1" stroke-dasharray="3,4" opacity="0.6"/>
  <text x="370" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="8" fill="#F87171">0.381</text>

  <line x1="480" y1="100" x2="480" y2="245" stroke="#F87171" stroke-width="1" stroke-dasharray="3,4" opacity="0.6"/>
  <text x="480" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="8" fill="#F87171">0.753</text>

  <!-- 95% CI label -->
  <text x="425" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">95% credible interval</text>

  <!-- Section 3: n_effective Gauge (right) -->
  <rect x="570" y="65" width="260" height="210" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="700" y="85" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#E2E8F0">Effective Sample Size</text>

  <!-- Gauge background -->
  <rect x="610" y="110" width="180" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <!-- Gauge fill (10.6/15 = 70.7% of way) -->
  <rect x="612" y="112" width="127" height="20" rx="10" fill="#FFD54F" opacity="0.7"/>

  <!-- Threshold marker at 15 -->
  <line x1="790" y1="105" x2="790" y2="140" stroke="#F87171" stroke-width="2" stroke-linecap="round"/>
  <text x="790" y="152" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#F87171">15.0</text>
  <text x="790" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="8" fill="#F87171">threshold</text>

  <!-- Current value -->
  <text x="700" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#0F172A">10.6</text>

  <!-- Evidence breakdown -->
  <text x="620" y="190" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">Evidence:</text>
  <rect x="620" y="200" width="10" height="10" rx="2" fill="#4ADE80"/>
  <text x="638" y="210" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Hard outcomes: 8 (w=1.0)</text>
  <rect x="620" y="220" width="10" height="10" rx="2" fill="#FFD54F" opacity="0.7"/>
  <text x="638" y="230" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Soft outcomes: 4 (w=0.6)</text>
  <text x="638" y="250" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">n_eff = 8 + 4x0.6 = 10.4</text>

  <!-- Status box -->
  <rect x="250" y="290" width="350" height="42" rx="8" fill="#FFD54F" opacity="0.1" stroke="#FFD54F" stroke-width="1.5" filter="url(#glowAmber)"/>
  <text x="425" y="310" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#FFD54F">STATUS: WAITING (10.6 / 15.0)</text>
  <text x="425" y="325" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">Pass-through -- raw ensemble confidence unchanged</text>
</svg>