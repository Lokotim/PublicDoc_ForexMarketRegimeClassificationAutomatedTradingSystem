<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="mcmcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <filter id="mcmcShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="mcmcGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FF6B35" flood-opacity="0.3"/>
    </filter>
    <marker id="mcmcArrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M 0 0 L 7 2.5 L 0 5 Z" fill="#FF6B35" opacity="0.6"/>
    </marker>
    <marker id="mcmcArrowG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M 0 0 L 7 2.5 L 0 5 Z" fill="#475569"/>
    </marker>
    <pattern id="mcmcGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.3" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="800" height="350" fill="url(#mcmcBg)" rx="12"/>
  <rect width="800" height="350" fill="url(#mcmcGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#FF6B35" letter-spacing="2">BAYESIAN MCMC OPTIMIZER</text>
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Markov Chain Monte Carlo confidence calibration with convergence diagnostics</text>

  <!-- ===== MAIN FLOW: LEFT → RIGHT ===== -->

  <!-- Step 1: Trade Outcomes -->
  <g filter="url(#mcmcShadow)">
    <rect x="30" y="70" width="170" height="100" rx="10" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="30" y="70" width="170" height="28" rx="10" fill="#FF6B35" fill-opacity="0.1"/>
    <rect x="30" y="94" width="170" height="1" fill="#FF6B35" fill-opacity="0.2"/>
    <text x="115" y="90" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FF6B35" font-weight="700">Trade Outcomes</text>
    <text x="115" y="114" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">Hard: closed P/L</text>
    <text x="115" y="128" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">Soft: unrealized x 0.6</text>
    <text x="115" y="146" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">rolling 30-day window</text>
    <text x="115" y="160" text-anchor="middle" font-family="monospace" font-size="7" fill="#FF6B35" opacity="0.6">per pair + per regime</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="120" x2="240" y2="120" stroke="#FF6B35" stroke-width="1.5" marker-end="url(#mcmcArrow)" opacity="0.5"/>

  <!-- Step 2: MCMC Sampling -->
  <g filter="url(#mcmcGlow)">
    <rect x="248" y="65" width="220" height="110" rx="10" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="248" y="65" width="220" height="28" rx="10" fill="#FF6B35" fill-opacity="0.12"/>
    <rect x="248" y="89" width="220" height="1" fill="#FF6B35" fill-opacity="0.3"/>
    <text x="358" y="85" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FF6B35" font-weight="700">MCMC Sampling</text>

    <!-- Chain visualization -->
    <g transform="translate(268, 100)">
      <text x="0" y="10" font-family="monospace" font-size="7" fill="#E2E8F0">Chain 1:</text>
      <rect x="50" y="2" width="140" height="8" rx="4" fill="#1E293B"/>
      <path d="M 52 6 Q 65 2, 78 6 Q 91 10, 104 6 Q 117 2, 130 6 Q 143 10, 156 6 Q 169 2, 188 6" fill="none" stroke="#FF6B35" stroke-opacity="0.7" stroke-width="1"/>

      <text x="0" y="26" font-family="monospace" font-size="7" fill="#E2E8F0">Chain 2:</text>
      <rect x="50" y="18" width="140" height="8" rx="4" fill="#1E293B"/>
      <path d="M 52 22 Q 65 26, 78 22 Q 91 18, 104 22 Q 117 26, 130 22 Q 143 18, 156 22 Q 169 26, 188 22" fill="none" stroke="#4ADE80" stroke-opacity="0.7" stroke-width="1"/>

      <text x="0" y="42" font-family="monospace" font-size="7" fill="#E2E8F0">Chain 3:</text>
      <rect x="50" y="34" width="140" height="8" rx="4" fill="#1E293B"/>
      <path d="M 52 38 Q 65 34, 78 38 Q 91 42, 104 38 Q 117 34, 130 38 Q 143 42, 156 38 Q 169 34, 188 38" fill="none" stroke="#00D4FF" stroke-opacity="0.7" stroke-width="1"/>

      <text x="0" y="58" font-family="monospace" font-size="7" fill="#E2E8F0">Chain 4:</text>
      <rect x="50" y="50" width="140" height="8" rx="4" fill="#1E293B"/>
      <path d="M 52 54 Q 65 50, 78 54 Q 91 58, 104 54 Q 117 50, 130 54 Q 143 58, 156 54 Q 169 50, 188 54" fill="none" stroke="#7B68EE" stroke-opacity="0.7" stroke-width="1"/>
    </g>
  </g>

  <text x="358" y="185" text-anchor="middle" font-family="monospace" font-size="8" fill="#FF6B35" opacity="0.7">4 chains x 5,000 iterations</text>

  <!-- Arrow 2→3 -->
  <line x1="468" y1="120" x2="520" y2="120" stroke="#FF6B35" stroke-width="1.5" marker-end="url(#mcmcArrow)" opacity="0.5"/>

  <!-- Step 3: Posterior Distribution -->
  <g filter="url(#mcmcShadow)">
    <rect x="528" y="70" width="240" height="100" rx="10" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="528" y="70" width="240" height="28" rx="10" fill="#FF6B35" fill-opacity="0.1"/>
    <rect x="528" y="94" width="240" height="1" fill="#FF6B35" fill-opacity="0.2"/>
    <text x="648" y="90" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FF6B35" font-weight="700">Posterior Distribution</text>

    <!-- Bell curve visualization -->
    <g transform="translate(558, 100)">
      <rect x="0" y="0" width="180" height="55" rx="4" fill="#1E293B" fill-opacity="0.5"/>
      <path d="M 10 50 Q 20 48, 30 45 Q 50 35, 70 18 Q 80 8, 90 5 Q 100 8, 110 18 Q 130 35, 150 45 Q 160 48, 170 50" fill="#FF6B35" fill-opacity="0.1" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- Mean line -->
      <line x1="90" y1="0" x2="90" y2="50" stroke="#FF6B35" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
      <!-- HDI markers -->
      <line x1="50" y1="48" x2="130" y2="48" stroke="#4ADE80" stroke-width="2" opacity="0.6"/>
      <text x="90" y="58" text-anchor="middle" font-family="monospace" font-size="6" fill="#4ADE80" opacity="0.8">94% HDI</text>
    </g>
  </g>

  <!-- ===== CONVERGENCE DIAGNOSTIC (below) ===== -->
  <g filter="url(#mcmcShadow)">
    <rect x="180" y="210" width="440" height="60" rx="8" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="400" y="232" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FBBF24" font-weight="700">Gelman-Rubin R-hat Convergence Diagnostic</text>
    <text x="400" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0">R-hat &lt; 1.05 required for convergence | Between-chain vs within-chain variance</text>
    <text x="400" y="264" text-anchor="middle" font-family="monospace" font-size="7" fill="#FBBF24" opacity="0.7">Current R-hat: 1.02 (converged)</text>
  </g>

  <!-- Arrow down from MCMC to R-hat -->
  <line x1="358" y1="190" x2="358" y2="210" stroke="#FBBF24" stroke-width="0.8" marker-end="url(#mcmcArrowG)" opacity="0.4" stroke-dasharray="3,2"/>

  <!-- ===== OUTPUT ===== -->
  <line x1="400" y1="270" x2="400" y2="295" stroke="#FF6B35" stroke-width="1" marker-end="url(#mcmcArrow)" opacity="0.4"/>

  <g filter="url(#mcmcGlow)">
    <rect x="240" y="298" width="320" height="30" rx="15" fill="#0A1628" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="1"/>
    <text x="400" y="318" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FF6B35" font-weight="700">Adjusted Confidence Scores</text>
  </g>

  <!-- Safety note -->
  <g>
    <rect x="30" y="290" width="180" height="36" rx="6" fill="#3D0F0F" stroke="#F87171" stroke-opacity="0.3" stroke-width="0.8"/>
    <text x="40" y="306" font-family="'Segoe UI', sans-serif" font-size="8" fill="#F87171" font-weight="700">SAFETY GUARD</text>
    <text x="40" y="320" font-family="monospace" font-size="7" fill="#E2E8F0">Skip if n_effective &lt; 15</text>
  </g>

  <!-- Border -->
</svg>