<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="clShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arwGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F7B32B"/>
    </marker>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="8" fill="#0a192f"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#ccd6f6" font-size="17" font-weight="700">Continuous Learning: The LEVIER System</text>
  <line x1="200" y1="38" x2="600" y2="38" stroke="#F7B32B" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="400" y="52" text-anchor="middle" fill="#8892b0" font-size="9">8 adaptive mechanisms feeding a central feedback cycle</text>

  <!-- Central hub -->
  <ellipse cx="400" cy="262" rx="68" ry="30" fill="url(#hubGrad)" stroke="#F7B32B" stroke-width="2"/>
  <text x="400" y="257" text-anchor="middle" fill="#F7B32B" font-size="12" font-weight="700">LEVIER</text>
  <text x="400" y="271" text-anchor="middle" fill="#FFD54F" font-size="9">Feedback Cycle</text>

  <!-- ========== 9 LEVIER BOXES ========== -->

  <!-- ROW 1: top 3 boxes (y=68) -->

  <!-- L1: Soft Outcomes (top-left) -->
  <rect x="14" y="68" width="232" height="72" rx="6" fill="#112240" stroke="#233554" stroke-width="1.2" filter="url(#clShadow)"/>
  <rect x="14" y="68" width="232" height="20" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="26" y="82" fill="#F7B32B" font-size="9" font-weight="700">L1</text>
  <text x="52" y="82" fill="#ccd6f6" font-size="9" font-weight="600">Soft Outcomes</text>
  <text x="130" y="100" text-anchor="middle" fill="#8892b0" font-size="8">Unrealized PnL tracking</text>
  <text x="130" y="114" text-anchor="middle" fill="#64ffda" font-size="8">Shapes RL reward before close</text>
  <path d="M200,140 Q300,195 345,240" fill="none" stroke="#F7B32B" stroke-width="1" marker-end="url(#arwGold)" stroke-dasharray="4,3"/>

  <!-- L2: Bayesian Optimization (top-center) -->
  <rect x="284" y="68" width="232" height="72" rx="6" fill="#112240" stroke="#233554" stroke-width="1.2" filter="url(#clShadow)"/>
  <rect x="284" y="68" width="232" height="20" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="296" y="82" fill="#F7B32B" font-size="9" font-weight="700">L2</text>
  <text x="322" y="82" fill="#ccd6f6" font-size="9" font-weight="600">Bayesian Optimization</text>
  <text x="400" y="100" text-anchor="middle" fill="#8892b0" font-size="8">MCMC weight recalibration</text>
  <text x="400" y="114" text-anchor="middle" fill="#64ffda" font-size="8">24h cooldown, prior updates</text>
  <path d="M400,140 L400,232" fill="none" stroke="#F7B32B" stroke-width="1" marker-end="url(#arwGold)" stroke-dasharray="4,3"/>

  <!-- L3: Walk-Forward ML (top-right) -->
  <rect x="554" y="68" width="232" height="72" rx="6" fill="#112240" stroke="#233554" stroke-width="1.2" filter="url(#clShadow)"/>
  <rect x="554" y="68" width="232" height="20" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="566" y="82" fill="#F7B32B" font-size="9" font-weight="700">L3</text>
  <text x="592" y="82" fill="#ccd6f6" font-size="9" font-weight="600">Walk-Forward ML</text>
  <text x="670" y="100" text-anchor="middle" fill="#8892b0" font-size="8">30d rolling window retrain</text>
  <text x="670" y="114" text-anchor="middle" fill="#64ffda" font-size="8">Bayesian per-pair accuracy</text>
  <path d="M600,140 Q500,195 455,240" fill="none" stroke="#F7B32B" stroke-width="1" marker-end="url(#arwGold)" stroke-dasharray="4,3"/>

  <!-- ROW 2: middle-left and middle-right (y=208) -->

  <!-- L4: Experience Replay (mid-left) -->
  <rect x="14" y="226" width="220" height="72" rx="6" fill="#112240" stroke="#233554" stroke-width="1.2" filter="url(#clShadow)"/>
  <rect x="14" y="226" width="220" height="20" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="26" y="240" fill="#F7B32B" font-size="9" font-weight="700">L4</text>
  <text x="52" y="240" fill="#ccd6f6" font-size="9" font-weight="600">Experience Replay</text>
  <text x="124" y="258" text-anchor="middle" fill="#8892b0" font-size="8">RL prioritized replay</text>
  <text x="124" y="272" text-anchor="middle" fill="#64ffda" font-size="8">32 batch x 5 iterations</text>
  <path d="M234,262 L332,262" fill="none" stroke="#F7B32B" stroke-width="1" marker-end="url(#arwGold)" stroke-dasharray="4,3"/>

  <!-- L5: Live P&L Adjustment (mid-right) -->
  <rect x="566" y="226" width="220" height="72" rx="6" fill="#112240" stroke="#233554" stroke-width="1.2" filter="url(#clShadow)"/>
  <rect x="566" y="226" width="220" height="20" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="578" y="240" fill="#F7B32B" font-size="9" font-weight="700">L5</text>
  <text x="604" y="240" fill="#ccd6f6" font-size="9" font-weight="600">Live P&amp;L Adjustment</text>
  <text x="676" y="258" text-anchor="middle" fill="#8892b0" font-size="8">Source weight learning</text>
  <text x="676" y="272" text-anchor="middle" fill="#64ffda" font-size="8">From realized outcomes</text>
  <path d="M566,262 L468,262" fill="none" stroke="#F7B32B" stroke-width="1" marker-end="url(#arwGold)" stroke-dasharray="4,3"/>

  <!-- ROW 3: bottom 3 boxes (y=360) -->

  <!-- L6: Differential Sortino (bot-left) -->
  <rect x="14" y="370" width="232" height="72" rx="6" fill="#112240" stroke="#233554" stroke-width="1.2" filter="url(#clShadow)"/>
  <rect x="14" y="370" width="232" height="20" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="26" y="384" fill="#F7B32B" font-size="9" font-weight="700">L6</text>
  <text x="52" y="384" fill="#ccd6f6" font-size="9" font-weight="600">Differential Sortino</text>
  <text x="130" y="402" text-anchor="middle" fill="#8892b0" font-size="8">RL reward = Sortino(with)</text>
  <text x="130" y="416" text-anchor="middle" fill="#64ffda" font-size="8">- Sortino(without RL)</text>
  <path d="M200,370 Q300,320 345,285" fill="none" stroke="#F7B32B" stroke-width="1" marker-end="url(#arwGold)" stroke-dasharray="4,3"/>

  <!-- L7: Strategy Analytics CSI (bot-center-left) -->
  <rect x="170" y="448" width="180" height="46" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.2" filter="url(#clShadow)"/>
  <rect x="170" y="448" width="180" height="18" rx="6" fill="#64ffda" fill-opacity="0.08"/>
  <text x="182" y="461" fill="#64ffda" font-size="9" font-weight="700">L7</text>
  <text x="208" y="461" fill="#ccd6f6" font-size="9" font-weight="600">Strategy Analytics (CSI)</text>
  <text x="260" y="480" text-anchor="middle" fill="#8892b0" font-size="7">Composite Strategy Index, zero-kill</text>
  <path d="M290,448 Q340,380 370,292" fill="none" stroke="#64ffda" stroke-width="1" marker-end="url(#arwGold)" stroke-dasharray="4,3"/>


  <!-- L9: Pair Track Record (bot-right) -->
  <rect x="554" y="370" width="232" height="72" rx="6" fill="#112240" stroke="#233554" stroke-width="1.2" filter="url(#clShadow)"/>
  <rect x="554" y="370" width="232" height="20" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="566" y="384" fill="#F7B32B" font-size="9" font-weight="700">L9</text>
  <text x="592" y="384" fill="#ccd6f6" font-size="9" font-weight="600">Pair Track Record</text>
  <text x="670" y="402" text-anchor="middle" fill="#8892b0" font-size="8">30d rolling win rate/pair</text>
  <text x="670" y="416" text-anchor="middle" fill="#64ffda" font-size="8">&lt;35% = Track Penalty</text>
  <path d="M600,370 Q500,320 455,285" fill="none" stroke="#F7B32B" stroke-width="1" marker-end="url(#arwGold)" stroke-dasharray="4,3"/>
</svg>