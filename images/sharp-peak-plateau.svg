<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320" viewBox="0 0 850 320">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="320" fill="#0f1923" rx="8"/>

  <!-- ============================================================ -->
  <!-- LEFT CHART: Fragile (Sharp Peak)                             -->
  <!-- Chart area: x=60..390, y=60..240  (bars sit on y=240)       -->
  <!-- ============================================================ -->

  <!-- Title -->
  <text x="225" y="35" text-anchor="middle" fill="#FF6B6B" font-size="15" font-weight="bold">FRAGILE (Sharp Peak)</text>

  <!-- Grid lines (horizontal) -->
  <line x1="60" y1="90" x2="390" y2="90" stroke="#1a2d42" stroke-width="1"/>
  <line x1="60" y1="120" x2="390" y2="120" stroke="#1a2d42" stroke-width="1"/>
  <line x1="60" y1="150" x2="390" y2="150" stroke="#1a2d42" stroke-width="1"/>
  <line x1="60" y1="180" x2="390" y2="180" stroke="#1a2d42" stroke-width="1"/>
  <line x1="60" y1="210" x2="390" y2="210" stroke="#1a2d42" stroke-width="1"/>

  <!-- Grid lines (vertical) -->
  <line x1="115" y1="55" x2="115" y2="240" stroke="#1a2d42" stroke-width="1"/>
  <line x1="170" y1="55" x2="170" y2="240" stroke="#1a2d42" stroke-width="1"/>
  <line x1="225" y1="55" x2="225" y2="240" stroke="#1a2d42" stroke-width="1"/>
  <line x1="280" y1="55" x2="280" y2="240" stroke="#1a2d42" stroke-width="1"/>
  <line x1="335" y1="55" x2="335" y2="240" stroke="#1a2d42" stroke-width="1"/>

  <!-- Y-axis -->
  <line x1="60" y1="55" x2="60" y2="240" stroke="#4a5568" stroke-width="1.5"/>
  <!-- X-axis -->
  <line x1="60" y1="240" x2="390" y2="240" stroke="#4a5568" stroke-width="1.5"/>

  <!-- Y-axis label -->
  <text x="20" y="150" text-anchor="middle" fill="#8eacbb" font-size="12" transform="rotate(-90 20 150)">Profit</text>

  <!-- Bars: Sharp peak pattern (13 bars, peak in center) -->
  <!-- Heights: 15, 20, 25, 30, 50, 90, 170, 90, 50, 30, 25, 20, 15 -->
  <rect x="68" y="225" width="20" height="15" rx="2" fill="#FF6B6B" opacity="0.6"/>
  <rect x="93" y="220" width="20" height="20" rx="2" fill="#FF6B6B" opacity="0.65"/>
  <rect x="118" y="215" width="20" height="25" rx="2" fill="#FF6B6B" opacity="0.7"/>
  <rect x="143" y="210" width="20" height="30" rx="2" fill="#FF6B6B" opacity="0.75"/>
  <rect x="168" y="190" width="20" height="50" rx="2" fill="#FF6B6B" opacity="0.8"/>
  <rect x="193" y="150" width="20" height="90" rx="2" fill="#FF6B6B" opacity="0.9"/>
  <rect x="218" y="70" width="20" height="170" rx="2" fill="#FF6B6B" opacity="1.0"/>
  <rect x="243" y="150" width="20" height="90" rx="2" fill="#FF6B6B" opacity="0.9"/>
  <rect x="268" y="190" width="20" height="50" rx="2" fill="#FF6B6B" opacity="0.8"/>
  <rect x="293" y="210" width="20" height="30" rx="2" fill="#FF6B6B" opacity="0.75"/>
  <rect x="318" y="215" width="20" height="25" rx="2" fill="#FF6B6B" opacity="0.7"/>
  <rect x="343" y="220" width="20" height="20" rx="2" fill="#FF6B6B" opacity="0.65"/>
  <rect x="368" y="225" width="20" height="15" rx="2" fill="#FF6B6B" opacity="0.6"/>

  <!-- Annotation arrow pointing to peak -->
  <line x1="228" y1="58" x2="228" y2="66" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- X-axis label -->
  <text x="225" y="260" text-anchor="middle" fill="#8eacbb" font-size="11">Parameter value</text>

  <!-- Bottom label -->
  <text x="225" y="290" text-anchor="middle" fill="#FF6B6B" font-size="13" font-weight="bold">Tiny change = collapse</text>


  <!-- ============================================================ -->
  <!-- RIGHT CHART: Robust (Broad Plateau)                          -->
  <!-- Chart area: x=490..820, y=60..240                            -->
  <!-- ============================================================ -->

  <!-- Title -->
  <text x="655" y="35" text-anchor="middle" fill="#4CAF50" font-size="15" font-weight="bold">ROBUST (Broad Plateau)</text>

  <!-- Grid lines (horizontal) -->
  <line x1="490" y1="90" x2="820" y2="90" stroke="#1a2d42" stroke-width="1"/>
  <line x1="490" y1="120" x2="820" y2="120" stroke="#1a2d42" stroke-width="1"/>
  <line x1="490" y1="150" x2="820" y2="150" stroke="#1a2d42" stroke-width="1"/>
  <line x1="490" y1="180" x2="820" y2="180" stroke="#1a2d42" stroke-width="1"/>
  <line x1="490" y1="210" x2="820" y2="210" stroke="#1a2d42" stroke-width="1"/>

  <!-- Grid lines (vertical) -->
  <line x1="545" y1="55" x2="545" y2="240" stroke="#1a2d42" stroke-width="1"/>
  <line x1="600" y1="55" x2="600" y2="240" stroke="#1a2d42" stroke-width="1"/>
  <line x1="655" y1="55" x2="655" y2="240" stroke="#1a2d42" stroke-width="1"/>
  <line x1="710" y1="55" x2="710" y2="240" stroke="#1a2d42" stroke-width="1"/>
  <line x1="765" y1="55" x2="765" y2="240" stroke="#1a2d42" stroke-width="1"/>

  <!-- Y-axis -->
  <line x1="490" y1="55" x2="490" y2="240" stroke="#4a5568" stroke-width="1.5"/>
  <!-- X-axis -->
  <line x1="490" y1="240" x2="820" y2="240" stroke="#4a5568" stroke-width="1.5"/>

  <!-- Y-axis label -->
  <text x="450" y="150" text-anchor="middle" fill="#8eacbb" font-size="12" transform="rotate(-90 450 150)">Profit</text>

  <!-- Bars: Broad plateau pattern (13 bars, relatively flat in the middle) -->
  <!-- Heights: 25, 55, 90, 110, 115, 120, 120, 120, 115, 110, 90, 55, 25 -->
  <rect x="498" y="215" width="20" height="25" rx="2" fill="#2a9d8f" opacity="0.6"/>
  <rect x="523" y="185" width="20" height="55" rx="2" fill="#2a9d8f" opacity="0.7"/>
  <rect x="548" y="150" width="20" height="90" rx="2" fill="#2a9d8f" opacity="0.8"/>
  <rect x="573" y="130" width="20" height="110" rx="2" fill="#2a9d8f" opacity="0.9"/>
  <rect x="598" y="125" width="20" height="115" rx="2" fill="#2a9d8f" opacity="0.95"/>
  <rect x="623" y="120" width="20" height="120" rx="2" fill="#2a9d8f" opacity="1.0"/>
  <rect x="648" y="120" width="20" height="120" rx="2" fill="#2a9d8f" opacity="1.0"/>
  <rect x="673" y="120" width="20" height="120" rx="2" fill="#2a9d8f" opacity="1.0"/>
  <rect x="698" y="125" width="20" height="115" rx="2" fill="#2a9d8f" opacity="0.95"/>
  <rect x="723" y="130" width="20" height="110" rx="2" fill="#2a9d8f" opacity="0.9"/>
  <rect x="748" y="150" width="20" height="90" rx="2" fill="#2a9d8f" opacity="0.8"/>
  <rect x="773" y="185" width="20" height="55" rx="2" fill="#2a9d8f" opacity="0.7"/>
  <rect x="798" y="215" width="20" height="25" rx="2" fill="#2a9d8f" opacity="0.6"/>

  <!-- Plateau bracket annotation -->
  <line x1="573" y1="115" x2="743" y2="115" stroke="#4CAF50" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- X-axis label -->
  <text x="655" y="260" text-anchor="middle" fill="#8eacbb" font-size="11">Parameter value</text>

  <!-- Bottom label -->
  <text x="655" y="290" text-anchor="middle" fill="#4CAF50" font-size="13" font-weight="bold">Wide range = stability</text>

  <!-- Center divider -->
  <line x1="425" y1="25" x2="425" y2="300" stroke="#1a2d42" stroke-width="2" stroke-dasharray="6,4"/>
</svg>