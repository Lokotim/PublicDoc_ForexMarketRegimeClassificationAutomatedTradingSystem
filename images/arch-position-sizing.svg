<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="psBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>
    <filter id="psGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="psArrowDown" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0" fill="#94A3B8"/>
    </marker>
    <linearGradient id="psFunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFD54F" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff9100" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#psBgGrad)"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#FFD54F" filter="url(#psGlow)">POSITION SIZING: 6-LAYER CASCADE</text>
  <line x1="200" y1="42" x2="700" y2="42" stroke="#FFD54F" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Funnel background shape -->
  <polygon points="170,55 730,55 680,470 220,470" fill="url(#psFunnel)" opacity="0.3"/>

  <!-- Layer 1: Equity Base -->
  <rect x="175" y="55" width="550" height="52" rx="8" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-width="1.2"/>
  <rect x="185" y="60" width="28" height="42" rx="4" fill="#00e5ff" fill-opacity="0.2"/>
  <text x="199" y="86" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00e5ff">1</text>
  <text x="225" y="76" font-family="monospace" font-size="11" font-weight="bold" fill="#00e5ff">Equity Base</text>
  <text x="225" y="95" font-family="monospace" font-size="9" fill="#94A3B8">equity_max = max(NLV, 100K floor)</text>
  <rect x="560" y="65" width="150" height="32" rx="5" fill="#0f1923" stroke="#00e5ff" stroke-width="0.5"/>
  <text x="635" y="85" text-anchor="middle" font-family="monospace" font-size="9" fill="#E2E8F0">equity_max</text>

  <!-- Arrow -->
  <line x1="450" y1="109" x2="450" y2="120" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Layer 2: ATR Risk -->
  <rect x="190" y="120" width="520" height="52" rx="8" fill="#4ADE80" fill-opacity="0.08" stroke="#4ADE80" stroke-width="1.2"/>
  <rect x="200" y="125" width="28" height="42" rx="4" fill="#4ADE80" fill-opacity="0.2"/>
  <text x="214" y="151" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#4ADE80">2</text>
  <text x="240" y="141" font-family="monospace" font-size="11" font-weight="bold" fill="#4ADE80">ATR Risk</text>
  <text x="240" y="160" font-family="monospace" font-size="9" fill="#94A3B8">atr_qty = (equity * 2%) / (2 x ATR)</text>
  <rect x="565" y="130" width="130" height="32" rx="5" fill="#0f1923" stroke="#4ADE80" stroke-width="0.5"/>
  <text x="630" y="150" text-anchor="middle" font-family="monospace" font-size="9" fill="#E2E8F0">atr_qty</text>

  <!-- Arrow -->
  <line x1="450" y1="174" x2="450" y2="185" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Layer 3: Leverage Cap -->
  <rect x="205" y="185" width="490" height="52" rx="8" fill="#FFD54F" fill-opacity="0.08" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="215" y="190" width="28" height="42" rx="4" fill="#FFD54F" fill-opacity="0.2"/>
  <text x="229" y="216" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#FFD54F">3</text>
  <text x="255" y="206" font-family="monospace" font-size="11" font-weight="bold" fill="#FFD54F">Leverage Cap</text>
  <text x="255" y="225" font-family="monospace" font-size="9" fill="#94A3B8">max leverage = 2.5x gross notional</text>
  <rect x="570" y="195" width="110" height="32" rx="5" fill="#0f1923" stroke="#FFD54F" stroke-width="0.5"/>
  <text x="625" y="215" text-anchor="middle" font-family="monospace" font-size="9" fill="#E2E8F0">2.5x max</text>

  <!-- Arrow -->
  <line x1="450" y1="239" x2="450" y2="250" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Layer 4: Kelly Criterion -->
  <rect x="218" y="250" width="464" height="52" rx="8" fill="#ff9100" fill-opacity="0.08" stroke="#ff9100" stroke-width="1.2"/>
  <rect x="228" y="255" width="28" height="42" rx="4" fill="#ff9100" fill-opacity="0.2"/>
  <text x="242" y="281" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#ff9100">4</text>
  <text x="268" y="271" font-family="monospace" font-size="11" font-weight="bold" fill="#ff9100">Kelly Criterion</text>
  <text x="268" y="290" font-family="monospace" font-size="9" fill="#94A3B8">f* scaled by meta-confidence</text>
  <rect x="575" y="260" width="90" height="32" rx="5" fill="#0f1923" stroke="#ff9100" stroke-width="0.5"/>
  <text x="620" y="280" text-anchor="middle" font-family="monospace" font-size="9" fill="#E2E8F0">kelly_f</text>

  <!-- Arrow -->
  <line x1="450" y1="304" x2="450" y2="315" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Layer 5: IV Overlay -->
  <rect x="230" y="315" width="440" height="52" rx="8" fill="#ef5350" fill-opacity="0.08" stroke="#ef5350" stroke-width="1.2"/>
  <rect x="240" y="320" width="28" height="42" rx="4" fill="#ef5350" fill-opacity="0.2"/>
  <text x="254" y="346" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#ef5350">5</text>
  <text x="280" y="336" font-family="monospace" font-size="11" font-weight="bold" fill="#ef5350">IV Overlay</text>
  <text x="280" y="355" font-family="monospace" font-size="9" fill="#94A3B8">FEARFUL: 85% | PRICED: 70%</text>
  <rect x="575" y="325" width="80" height="32" rx="5" fill="#0f1923" stroke="#ef5350" stroke-width="0.5"/>
  <text x="615" y="345" text-anchor="middle" font-family="monospace" font-size="9" fill="#E2E8F0">iv_adj</text>

  <!-- Arrow -->
  <line x1="450" y1="369" x2="450" y2="380" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Layer 6: IDEALPRO Floor -->
  <rect x="242" y="380" width="416" height="52" rx="8" fill="#E2E8F0" fill-opacity="0.06" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="252" y="385" width="28" height="42" rx="4" fill="#E2E8F0" fill-opacity="0.15"/>
  <text x="266" y="411" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">6</text>
  <text x="292" y="401" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">IDEALPRO Floor</text>
  <text x="292" y="420" font-family="monospace" font-size="9" fill="#94A3B8">≥ $25K USD equivalent minimum</text>
  <rect x="575" y="390" width="70" height="32" rx="5" fill="#0f1923" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="610" y="410" text-anchor="middle" font-family="monospace" font-size="9" fill="#E2E8F0">floor</text>

  <!-- Final Output -->
  <line x1="450" y1="434" x2="450" y2="450" stroke="#FFD54F" stroke-width="2"/>

  <!-- Decision diamond -->
  <polygon points="450,452 490,470 450,488 410,470" fill="#FFD54F" fill-opacity="0.15" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="450" y="474" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#FFD54F">OK?</text>

  <!-- SKIP -->
  <rect x="30" y="458" width="100" height="28" rx="6" fill="#ef5350" fill-opacity="0.15" stroke="#ef5350" stroke-width="1.2"/>
  <text x="80" y="476" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ef5350">SKIP</text>
  <line x1="408" y1="470" x2="132" y2="470" stroke="#ef5350" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="275" y="464" text-anchor="middle" font-family="monospace" font-size="7" fill="#ef5350">below floor</text>

  <!-- Valid qty -->
  <rect x="770" y="458" width="110" height="28" rx="6" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-width="1.2"/>
  <text x="825" y="476" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#4ADE80">qty_base</text>
  <line x1="492" y1="470" x2="768" y2="470" stroke="#4ADE80" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="630" y="464" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">valid size</text>

  <!-- Side annotation: progressive narrowing -->
  <text x="810" y="80" font-family="monospace" font-size="8" fill="#94A3B8" text-anchor="end">widest</text>
  <line x1="815" y1="85" x2="815" y2="435" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="810" y="440" font-family="monospace" font-size="8" fill="#94A3B8" text-anchor="end">narrowest</text>
  <!-- Small triangle pointing down -->
  <polygon points="815,88 810,95 820,95" fill="#94A3B8" fill-opacity="0.4"/>
  <polygon points="815,438 810,430 820,430" fill="#94A3B8" fill-opacity="0.4"/>
</svg>