    <text x="45" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#FFD54F">Pair</text>
    <!-- Performance bar -->
    <rect x="15" y="130" width="60" height="8" rx="3" fill="#334155"/>
    <rect x="15" y="130" width="60" height="8" rx="3" fill="#FFD54F" opacity="0.7"/>
    <text x="45" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">RtDD 2.41</text>
    <text x="45" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#FFD54F">BASE</text>
