  <g transform="translate(37, 70)" filter="url(#cellShadow)">
    <rect width="90" height="220" rx="6" fill="#1E293B" stroke="#FFD54F" stroke-width="2"/>
    <rect width="90" height="32" rx="6" fill="#FFD54F" opacity="0.15"/>
    <text x="45" y="21" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#FFD54F">EURUSD</text>
