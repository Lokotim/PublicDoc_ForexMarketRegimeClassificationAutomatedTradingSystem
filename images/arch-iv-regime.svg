<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <linearGradient id="ivBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>
    <filter id="ivGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ivArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94A3B8"/>
    </marker>
    <marker id="ivArrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#00e5ff"/>
    </marker>
  </defs>

  <rect width="900" height="450" fill="url(#ivBgGrad)"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#FFD54F" filter="url(#ivGlow)">IV REGIME CLASSIFICATION</text>
  <line x1="200" y1="42" x2="700" y2="42" stroke="#FFD54F" stroke-opacity="0.3" stroke-width="1"/>

  <!-- TOP: CME FX ETFs -->
  <rect x="100" y="55" width="700" height="70" rx="10" fill="#00e5ff" fill-opacity="0.06" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="450" y="75" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00e5ff">CME FX ETF OPTIONS - IV Data Collection</text>

  <!-- ETF boxes -->
  <g font-family="monospace" font-size="10">
    <rect x="120" y="87" width="70" height="26" rx="5" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="0.8"/>
    <text x="155" y="104" text-anchor="middle" fill="#E2E8F0" font-weight="bold">FXE</text>

    <rect x="205" y="87" width="70" height="26" rx="5" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="0.8"/>
    <text x="240" y="104" text-anchor="middle" fill="#E2E8F0" font-weight="bold">FXY</text>

    <rect x="290" y="87" width="70" height="26" rx="5" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="0.8"/>
    <text x="325" y="104" text-anchor="middle" fill="#E2E8F0" font-weight="bold">FXB</text>

    <rect x="440" y="87" width="70" height="26" rx="5" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="0.8"/>
    <text x="475" y="104" text-anchor="middle" fill="#E2E8F0" font-weight="bold">FXF</text>

    <rect x="525" y="87" width="70" height="26" rx="5" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="0.8"/>
    <text x="560" y="104" text-anchor="middle" fill="#E2E8F0" font-weight="bold">FXA</text>

    <rect x="610" y="87" width="70" height="26" rx="5" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="0.8"/>
    <text x="645" y="104" text-anchor="middle" fill="#E2E8F0" font-weight="bold">FXC</text>
  </g>

  <!-- EUR GBP JPY CHF AUD CAD labels -->
  <g font-family="monospace" font-size="7" fill="#94A3B8">
    <text x="155" y="82" text-anchor="middle">EUR</text>
    <text x="240" y="82" text-anchor="middle">JPY</text>
    <text x="325" y="82" text-anchor="middle">GBP</text>
    <text x="475" y="82" text-anchor="middle">CHF</text>
    <text x="560" y="82" text-anchor="middle">AUD</text>
    <text x="645" y="82" text-anchor="middle">CAD</text>
  </g>

  <!-- Arrow down -->
  <line x1="450" y1="127" x2="450" y2="148" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#ivArrowCyan)"/>

  <!-- MIDDLE: VRP Calculation -->
  <rect x="150" y="152" width="600" height="100" rx="10" fill="#FFD54F" fill-opacity="0.06" stroke="#FFD54F" stroke-width="1" stroke-opacity="0.4"/>
  <text x="450" y="173" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#FFD54F">VRP CALCULATION &amp; z-SCORE</text>

  <!-- VRP formula -->
  <rect x="175" y="182" width="250" height="55" rx="6" fill="#0f1923" stroke="#FFD54F" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="300" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#E2E8F0">VRP = IV - RV</text>
  <text x="300" y="215" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Implied Vol - Realized Vol</text>
  <text x="300" y="228" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">60-day rolling window</text>

  <!-- z-score formula -->
  <rect x="475" y="182" width="250" height="55" rx="6" fill="#0f1923" stroke="#FFD54F" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="600" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#E2E8F0">z = (VRP - mean) / std</text>
  <text x="600" y="215" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Standardized score</text>
  <text x="600" y="228" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Per-pair calibration</text>

  <!-- Arrow between -->
  <line x1="427" y1="210" x2="473" y2="210" stroke="#FFD54F" stroke-width="1.2" marker-end="url(#ivArrow)"/>

  <!-- Arrow down -->
  <line x1="450" y1="254" x2="450" y2="275" stroke="#FFD54F" stroke-width="1.5" marker-end="url(#ivArrow)"/>

  <!-- BOTTOM: Three regime zones -->
  <rect x="50" y="280" width="800" height="90" rx="10" fill="#0f1923" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="450" y="298" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">REGIME CLASSIFICATION</text>

  <!-- COMPLACENT -->
  <rect x="75" y="308" width="220" height="50" rx="8" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="185" y="328" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#4ADE80">COMPLACENT</text>
  <text x="185" y="345" text-anchor="middle" font-family="monospace" font-size="10" fill="#94A3B8">z &lt; -0.5</text>

  <!-- PRICED -->
  <rect x="340" y="308" width="220" height="50" rx="8" fill="#FFD54F" fill-opacity="0.15" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="450" y="328" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#FFD54F">PRICED</text>
  <text x="450" y="345" text-anchor="middle" font-family="monospace" font-size="10" fill="#94A3B8">-0.5 ≤ z ≤ 0.5</text>

  <!-- FEARFUL -->
  <rect x="605" y="308" width="220" height="50" rx="8" fill="#ef5350" fill-opacity="0.15" stroke="#ef5350" stroke-width="1.5"/>
  <text x="715" y="328" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ef5350">FEARFUL</text>
  <text x="715" y="345" text-anchor="middle" font-family="monospace" font-size="10" fill="#94A3B8">z &gt; 0.5</text>

  <!-- Strategy preference table -->
  <rect x="100" y="382" width="700" height="58" rx="8" fill="#0f1923" stroke="#94A3B8" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="450" y="398" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#E2E8F0">STRATEGY PREFERENCE BY REGIME</text>

  <!-- Table headers -->
  <g font-family="monospace" font-size="8">
    <text x="200" y="415" text-anchor="middle" fill="#4ADE80">COMPLACENT</text>
    <text x="450" y="415" text-anchor="middle" fill="#FFD54F">PRICED</text>
    <text x="700" y="415" text-anchor="middle" fill="#ef5350">FEARFUL</text>

    <text x="200" y="430" text-anchor="middle" fill="#94A3B8">Mean Reversion favored</text>
    <text x="450" y="430" text-anchor="middle" fill="#94A3B8">Balanced / Neutral</text>
    <text x="700" y="430" text-anchor="middle" fill="#94A3B8">Trend Following favored</text>
  </g>

  <!-- Dividers -->
  <line x1="325" y1="402" x2="325" y2="435" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="575" y1="402" x2="575" y2="435" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.3"/>
</svg>