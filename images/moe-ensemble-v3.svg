<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="850" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD54F" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="gateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="450" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#E2E8F0">5-Model Mixture of Experts Ensemble</text>
  <text x="425" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">134 features per pair -- gating network selects specialist weights</text>

  <!-- Feature input block (left) -->
  <rect x="20" y="160" width="120" height="130" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">134 Features</text>
  <text x="80" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">30 theory scores</text>
  <text x="80" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">sentiment (32)</text>
  <text x="80" y="235" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">volatility (16)</text>
  <text x="80" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">COT/calendar (14)</text>
  <text x="80" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">macro z-scores (25)</text>
  <text x="80" y="280" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">alt data (17)</text>

  <!-- Flow arrows from features -->
  <line x1="140" y1="200" x2="185" y2="120" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="215" x2="185" y2="185" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="225" x2="185" y2="250" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="235" x2="185" y2="315" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="245" x2="185" y2="380" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 5 Specialist Models -->
  <!-- AdaBoost (Red) -->
  <rect x="190" y="80" width="140" height="60" rx="8" fill="#1E293B" stroke="#F87171" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="210" cy="100" r="6" fill="#F87171"/>
  <text x="260" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#F87171">AdaBoost</text>
  <text x="260" y="125" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">sequential boosting</text>
  <!-- Weight bar -->
  <rect x="195" y="145" width="130" height="4" rx="2" fill="#334155"/>
  <rect x="195" y="145" width="52" height="4" rx="2" fill="#F87171" opacity="0.8"/>

  <!-- XGBoost (Cyan) -->
  <rect x="190" y="158" width="140" height="60" rx="8" fill="#1E293B" stroke="#00D4FF" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="210" cy="178" r="6" fill="#00D4FF"/>
  <text x="260" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#00D4FF">XGBoost</text>
  <text x="260" y="203" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">gradient boosting L2</text>
  <rect x="195" y="223" width="130" height="4" rx="2" fill="#334155"/>
  <rect x="195" y="223" width="78" height="4" rx="2" fill="#00D4FF" opacity="0.8"/>

  <!-- LightGBM (Green) -->
  <rect x="190" y="236" width="140" height="60" rx="8" fill="#1E293B" stroke="#4ADE80" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="210" cy="256" r="6" fill="#4ADE80"/>
  <text x="260" y="261" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#4ADE80">LightGBM</text>
  <text x="260" y="281" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">leaf-wise growth</text>
  <rect x="195" y="301" width="130" height="4" rx="2" fill="#334155"/>
  <rect x="195" y="301" width="71" height="4" rx="2" fill="#4ADE80" opacity="0.8"/>

  <!-- CatBoost (Purple) -->
  <rect x="190" y="314" width="140" height="60" rx="8" fill="#1E293B" stroke="#E879F9" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="210" cy="334" r="6" fill="#E879F9"/>
  <text x="260" y="339" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#E879F9">CatBoost</text>
  <text x="260" y="359" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">ordered boosting</text>
  <rect x="195" y="379" width="130" height="4" rx="2" fill="#334155"/>
  <rect x="195" y="379" width="58" height="4" rx="2" fill="#E879F9" opacity="0.8"/>

  <!-- RandomForest (Amber) -->
  <rect x="190" y="392" width="140" height="48" rx="8" fill="#1E293B" stroke="#FFD54F" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="210" cy="410" r="6" fill="#FFD54F"/>
  <text x="260" y="413" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#FFD54F">RandomForest</text>
  <text x="260" y="430" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">bagging ensemble</text>

  <!-- Arrows from specialists to gating network -->
  <line x1="330" y1="110" x2="420" y2="230" stroke="#F87171" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="330" y1="188" x2="420" y2="230" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="330" y1="266" x2="420" y2="240" stroke="#4ADE80" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="330" y1="344" x2="420" y2="250" stroke="#E879F9" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="330" y1="416" x2="420" y2="260" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Gating Network (Central) -->
  <rect x="420" y="185" width="170" height="100" rx="12" fill="#1E293B" stroke="url(#gateGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <text x="505" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#FFD54F">Gating Network</text>
  <text x="505" y="237" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">conditional weight</text>
  <text x="505" y="253" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">allocation per pair</text>
  <text x="505" y="273" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">v17.0 | 87s training</text>

  <!-- Arrows from gating to outputs -->
  <line x1="590" y1="210" x2="650" y2="105" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="590" y1="220" x2="650" y2="145" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="590" y1="230" x2="650" y2="185" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="590" y1="240" x2="650" y2="225" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="590" y1="250" x2="650" y2="265" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="590" y1="255" x2="650" y2="305" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="590" y1="260" x2="650" y2="345" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="590" y1="265" x2="650" y2="385" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 8 Pair Outputs (right) -->
  <rect x="650" y="85" width="180" height="32" rx="5" fill="#1E293B" stroke="#4ADE80" stroke-width="1" filter="url(#shadow)"/>
  <text x="670" y="105" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">AUDJPY</text>
  <text x="740" y="105" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">SHORT TF 0.62</text>

  <rect x="650" y="125" width="180" height="32" rx="5" fill="#1E293B" stroke="#4ADE80" stroke-width="1" filter="url(#shadow)"/>
  <text x="670" y="145" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">AUDUSD</text>
  <text x="740" y="145" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">LONG  TF 0.71</text>

  <rect x="650" y="165" width="180" height="32" rx="5" fill="#1E293B" stroke="#4ADE80" stroke-width="1" filter="url(#shadow)"/>
  <text x="670" y="185" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">EURJPY</text>
  <text x="740" y="185" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">LONG  TF 0.58</text>

  <rect x="650" y="205" width="180" height="32" rx="5" fill="#1E293B" stroke="#4ADE80" stroke-width="1" filter="url(#shadow)"/>
  <text x="670" y="225" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">EURUSD</text>
  <text x="740" y="225" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">SHORT MR 0.64</text>

  <rect x="650" y="245" width="180" height="32" rx="5" fill="#1E293B" stroke="#4ADE80" stroke-width="1" filter="url(#shadow)"/>
  <text x="670" y="265" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">GBPUSD</text>
  <text x="740" y="265" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">LONG  TF 0.53</text>

  <rect x="650" y="285" width="180" height="32" rx="5" fill="#1E293B" stroke="#4ADE80" stroke-width="1" filter="url(#shadow)"/>
  <text x="670" y="305" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">NZDUSD</text>
  <text x="740" y="305" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">LONG  TF 0.67</text>

  <rect x="650" y="325" width="180" height="32" rx="5" fill="#1E293B" stroke="#4ADE80" stroke-width="1" filter="url(#shadow)"/>
  <text x="670" y="345" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">USDCAD</text>
  <text x="740" y="345" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">SHORT MR 0.59</text>

  <rect x="650" y="365" width="180" height="32" rx="5" fill="#1E293B" stroke="#4ADE80" stroke-width="1" filter="url(#shadow)"/>
  <text x="670" y="385" font-family="Consolas, monospace" font-size="10" fill="#4ADE80">USDCHF</text>
  <text x="740" y="385" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">SHORT TF 0.61</text>

  <!-- Labels -->
  <text x="80" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8" font-style="italic">Input</text>
  <text x="260" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8" font-style="italic">5 Specialists</text>
  <text x="505" y="175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8" font-style="italic">Meta-Learner</text>
  <text x="740" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8" font-style="italic">8 Pair Outputs</text>

  <!-- Training stats -->
  <text x="505" y="430" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">2,984 samples | 87.2s training | self-versioned v17.0</text>
</svg>