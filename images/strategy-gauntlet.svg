<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="gauntletBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="funnelRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F87171;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#F87171;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="survivorGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ADE80;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4ADE80;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="gShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="greenGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#4ADE80" flood-opacity="0.4"/>
    </filter>
    <pattern id="gGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.4" fill="#fff" opacity="0.03"/>
    </pattern>
    <marker id="fArrow" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M 0 0 L 6 2.5 L 0 5 Z" fill="#F87171" opacity="0.5"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#gauntletBg)" rx="12"/>
  <rect width="800" height="500" fill="url(#gGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#00D4FF" letter-spacing="2">STRATEGY GAUNTLET - 9-STAGE ELIMINATION</text>
  <text x="400" y="47" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">From 10,000,000 candidates to 32 survivors</text>

  <!-- Funnel shape (background) -->
  <polygon points="80,65 720,65 580,445 220,445" fill="url(#funnelRed)" stroke="none"/>

  <!-- Stage bars -->
  <!-- Stage 0: Starting pool -->
  <g filter="url(#gShadow)">
    <rect x="80" y="60" width="640" height="38" rx="6" fill="#16213E" stroke="#F87171" stroke-opacity="0.4" stroke-width="1"/>
    <text x="100" y="84" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">START: Random Strategy Generation</text>
    <text x="640" y="84" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F87171" font-weight="800">10,000,000</text>
    <rect x="660" y="72" width="50" height="16" rx="8" fill="#F87171" fill-opacity="0.15"/>
    <text x="685" y="84" text-anchor="middle" font-family="monospace" font-size="8" fill="#F87171">100%</text>
  </g>

  <!-- Stage 1: GA Build -->
  <g filter="url(#gShadow)">
    <rect x="115" y="105" width="570" height="35" rx="6" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="132" y="126" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="600">1. GA Build</text>
    <text x="280" y="126" font-family="monospace" font-size="7" fill="#94A3B8">genetic algorithm, fitness scoring</text>
    <text x="610" y="126" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FF6B35" font-weight="700">50,000</text>
    <rect x="620" y="115" width="55" height="16" rx="8" fill="#FF6B35" fill-opacity="0.12"/>
    <text x="647" y="127" text-anchor="middle" font-family="monospace" font-size="7" fill="#FF6B35">99.5% cut</text>
  </g>

  <!-- Stage 2: Basic Filters -->
  <g filter="url(#gShadow)">
    <rect x="140" y="147" width="520" height="35" rx="6" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.3" stroke-width="0.8"/>
    <text x="157" y="168" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="600">2. Basic Filters</text>
    <text x="310" y="168" font-family="monospace" font-size="7" fill="#94A3B8">Sharpe &gt; 1.5, MaxDD &lt; 20%, WinRate &gt; 40%</text>
    <text x="590" y="168" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FF6B35" font-weight="700">5,000</text>
    <rect x="600" y="157" width="50" height="16" rx="8" fill="#FF6B35" fill-opacity="0.12"/>
    <text x="625" y="169" text-anchor="middle" font-family="monospace" font-size="7" fill="#FF6B35">90% cut</text>
  </g>

  <!-- Stage 3: Monte Carlo -->
  <g filter="url(#gShadow)">
    <rect x="160" y="189" width="480" height="35" rx="6" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.3" stroke-width="0.8"/>
    <text x="177" y="210" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="600">3. Monte Carlo 1000 sims</text>
    <text x="380" y="210" font-family="monospace" font-size="7" fill="#94A3B8">5th %ile Sharpe &gt; 0.8</text>
    <text x="572" y="210" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FF6B35" font-weight="700">500</text>
    <rect x="580" y="199" width="50" height="16" rx="8" fill="#FF6B35" fill-opacity="0.12"/>
    <text x="605" y="211" text-anchor="middle" font-family="monospace" font-size="7" fill="#FF6B35">90% cut</text>
  </g>

  <!-- Stage 4: Walk-Forward -->
  <g filter="url(#gShadow)">
    <rect x="180" y="231" width="440" height="35" rx="6" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="197" y="252" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="600">4. Walk-Forward 10K matrix</text>
    <text x="395" y="252" font-family="monospace" font-size="7" fill="#94A3B8">OOS consistency</text>
    <text x="552" y="252" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FF6B35" font-weight="700">150</text>
    <rect x="560" y="241" width="50" height="16" rx="8" fill="#FF6B35" fill-opacity="0.12"/>
    <text x="585" y="253" text-anchor="middle" font-family="monospace" font-size="7" fill="#FF6B35">70% cut</text>
  </g>

  <!-- Stage 5: Permutation -->
  <g filter="url(#gShadow)">
    <rect x="200" y="273" width="400" height="35" rx="6" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="217" y="294" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="600">5. Permutation 3K vars</text>
    <text x="400" y="294" font-family="monospace" font-size="7" fill="#94A3B8">p-value &lt; 0.05</text>
    <text x="535" y="294" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FF6B35" font-weight="700">100</text>
    <rect x="542" y="283" width="48" height="16" rx="8" fill="#FF6B35" fill-opacity="0.12"/>
    <text x="566" y="295" text-anchor="middle" font-family="monospace" font-size="7" fill="#FF6B35">33% cut</text>
  </g>

  <!-- Stage 6: Multi-Market -->
  <g filter="url(#gShadow)">
    <rect x="215" y="315" width="370" height="35" rx="6" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="232" y="336" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="600">6. Multi-Market 6 pairs</text>
    <text x="415" y="336" font-family="monospace" font-size="7" fill="#94A3B8">cross-pair robustness</text>
    <text x="520" y="336" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FBBF24" font-weight="700">53</text>
    <rect x="528" y="325" width="48" height="16" rx="8" fill="#FBBF24" fill-opacity="0.12"/>
    <text x="552" y="337" text-anchor="middle" font-family="monospace" font-size="7" fill="#FBBF24">47% cut</text>
  </g>

  <!-- Stage 7: Slippage -->
  <g filter="url(#gShadow)">
    <rect x="230" y="357" width="340" height="35" rx="6" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="247" y="378" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="600">7. Slippage 0.3pip</text>
    <text x="410" y="378" font-family="monospace" font-size="7" fill="#94A3B8">realistic execution cost</text>
    <text x="508" y="378" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FBBF24" font-weight="700">40</text>
    <rect x="512" y="367" width="48" height="16" rx="8" fill="#FBBF24" fill-opacity="0.12"/>
    <text x="536" y="379" text-anchor="middle" font-family="monospace" font-size="7" fill="#FBBF24">25% cut</text>
  </g>

  <!-- Stage 8: Final Verdict -->
  <g filter="url(#gShadow)">
    <rect x="245" y="399" width="310" height="35" rx="6" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="262" y="420" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="600">8. Final Verdict</text>
    <text x="410" y="420" font-family="monospace" font-size="7" fill="#94A3B8">ensemble ranking + diversity</text>
    <text x="495" y="420" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FBBF24" font-weight="700">36</text>
    <rect x="500" y="409" width="46" height="16" rx="8" fill="#FBBF24" fill-opacity="0.12"/>
    <text x="523" y="421" text-anchor="middle" font-family="monospace" font-size="7" fill="#FBBF24">10% cut</text>
  </g>

  <!-- Survivors -->
  <g filter="url(#greenGlow)">
    <rect x="270" y="445" width="260" height="40" rx="10" fill="#0F3D1F" stroke="#4ADE80" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="400" y="464" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#4ADE80" font-weight="800">32 SURVIVORS</text>
    <text x="400" y="478" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0" opacity="0.8">0.00032% survival rate</text>
  </g>

  <!-- Elimination rate on the right side -->
  <g transform="translate(730, 80)">
    <text x="0" y="0" font-family="monospace" font-size="8" fill="#F87171" opacity="0.6">ELIMINATED</text>
    <line x1="25" y1="8" x2="25" y2="350" stroke="#F87171" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="25" y="370" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80" opacity="0.6">SURVIVED</text>
  </g>

  <!-- Border -->
</svg>