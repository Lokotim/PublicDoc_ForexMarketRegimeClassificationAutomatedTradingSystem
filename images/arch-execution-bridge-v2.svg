  <text x="637" y="371" text-anchor="middle" fill="#64ffda" font-size="10" font-weight="600">MC16</text>
  <text x="637" y="388" text-anchor="middle" fill="#8892b0" font-size="9">Expected</text>
  <text x="637" y="400" text-anchor="middle" fill="#8892b0" font-size="8">positions</text>

  <!-- vs symbol -->
  <text x="705" y="382" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="700">vs</text>

  <!-- IBKR box -->
  <rect x="720" y="350" width="100" height="50" rx="5" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="770" y="371" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">IBKR</text>
  <text x="770" y="388" text-anchor="middle" fill="#8892b0" font-size="9">Actual</text>
  <text x="770" y="400" text-anchor="middle" fill="#8892b0" font-size="8">positions</text>

