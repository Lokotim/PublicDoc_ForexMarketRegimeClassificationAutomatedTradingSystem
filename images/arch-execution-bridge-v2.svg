  <rect x="555" y="108" width="125" height="44" rx="5" fill="#0a192f" stroke="#64ffda" stroke-width="1"/>
  <text x="617" y="126" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="600">MultiCharts</text>
  <text x="617" y="142" text-anchor="middle" fill="#8892b0" font-size="9">32 strategies</text>

  <!-- Arrow MC to IBKR -->
  <line x1="680" y1="130" x2="700" y2="130" stroke="#ccd6f6" stroke-width="1.5" marker-end="url(#arwW)"/>

