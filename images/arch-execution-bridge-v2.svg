<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arwR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64ffda"/>
    </marker>
    <marker id="arwG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F7B32B"/>
    </marker>
    <marker id="arwW" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ccd6f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="620" rx="8" fill="#0a192f"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" fill="#ccd6f6" font-size="20" font-weight="700">Execution Bridge: Signal to Live Trade</text>
  <line x1="210" y1="48" x2="640" y2="48" stroke="#F7B32B" stroke-width="2" stroke-opacity="0.6"/>

  <!-- ========== LEFT: Python Pipeline ========== -->
  <rect x="20" y="70" width="200" height="210" rx="8" fill="#112240" stroke="#64ffda" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="20" y="70" width="200" height="28" rx="8" fill="#64ffda" fill-opacity="0.12"/>
  <text x="120" y="90" text-anchor="middle" fill="#64ffda" font-size="12" font-weight="700">Python Pipeline</text>

  <!-- Meta signals box -->
  <rect x="35" y="110" width="170" height="36" rx="5" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="120" y="126" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">meta_signals</text>
  <text x="120" y="140" text-anchor="middle" fill="#8892b0" font-size="9">direction + confidence</text>

  <!-- Position sizing box -->
  <rect x="35" y="155" width="170" height="36" rx="5" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="120" y="171" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">Position Sizing</text>
  <text x="120" y="185" text-anchor="middle" fill="#8892b0" font-size="9">Kelly + Monte Carlo</text>

  <!-- Output -->
  <rect x="35" y="206" width="170" height="30" rx="5" fill="#64ffda" fill-opacity="0.08" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="120" y="225" text-anchor="middle" fill="#64ffda" font-size="10">Authorized signals</text>

  <!-- Arrow from Pipeline to Center -->
  <line x1="220" y1="175" x2="275" y2="175" stroke="#64ffda" stroke-width="2" marker-end="url(#arwR)"/>

  <!-- ========== CENTER: Bridge Files ========== -->
  <rect x="280" y="70" width="200" height="210" rx="8" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="280" y="70" width="200" height="28" rx="8" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="380" y="90" text-anchor="middle" fill="#F7B32B" font-size="12" font-weight="700">Bridge Layer</text>

  <!-- CSV file -->
  <rect x="295" y="110" width="170" height="48" rx="5" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="380" y="129" text-anchor="middle" fill="#ccd6f6" font-size="10" font-weight="600">strategies_auth_simple.csv</text>
  <text x="380" y="148" text-anchor="middle" fill="#8892b0" font-size="9">pair, direction, size, confidence</text>

  <!-- GlobalVariable.dll -->
  <rect x="295" y="170" width="170" height="48" rx="5" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="380" y="189" text-anchor="middle" fill="#ccd6f6" font-size="10" font-weight="600">GlobalVariable.dll</text>
  <text x="380" y="208" text-anchor="middle" fill="#8892b0" font-size="9">Shared memory bridge</text>

  <!-- Arrow: write -->
  <text x="250" y="162" fill="#8892b0" font-size="8" transform="rotate(-90 250 162)">write</text>

