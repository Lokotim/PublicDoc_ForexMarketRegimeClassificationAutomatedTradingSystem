  <text x="95" y="527" text-anchor="middle" fill="#64ffda" font-size="9" font-weight="600">Meta Signal</text>
  <text x="95" y="542" text-anchor="middle" fill="#8892b0" font-size="8">direction + conf</text>

  <line x1="155" y1="530" x2="178" y2="530" stroke="#64ffda" stroke-width="1.5" marker-end="url(#arwR)"/>

  <rect x="183" y="510" width="110" height="40" rx="6" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="238" y="527" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="600">Position Sizing</text>
  <text x="238" y="542" text-anchor="middle" fill="#8892b0" font-size="8">Kelly fraction</text>

  <line x1="293" y1="530" x2="316" y2="530" stroke="#F7B32B" stroke-width="1.5" marker-end="url(#arwG)"/>

  <rect x="321" y="510" width="100" height="40" rx="6" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="371" y="527" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="600">CSV Write</text>
  <text x="371" y="542" text-anchor="middle" fill="#8892b0" font-size="8">bridge file</text>

  <line x1="421" y1="530" x2="444" y2="530" stroke="#F7B32B" stroke-width="1.5" marker-end="url(#arwG)"/>

  <rect x="449" y="510" width="100" height="40" rx="6" fill="#0a192f" stroke="#ccd6f6" stroke-width="1"/>
  <text x="499" y="527" text-anchor="middle" fill="#ccd6f6" font-size="9" font-weight="600">GV.dll Read</text>
  <text x="499" y="542" text-anchor="middle" fill="#8892b0" font-size="8">shared mem</text>

  <line x1="549" y1="530" x2="572" y2="530" stroke="#ccd6f6" stroke-width="1.5" marker-end="url(#arwW)"/>

  <rect x="577" y="510" width="100" height="40" rx="6" fill="#0a192f" stroke="#64ffda" stroke-width="1"/>
  <text x="627" y="527" text-anchor="middle" fill="#64ffda" font-size="9" font-weight="600">MultiCharts</text>
  <text x="627" y="542" text-anchor="middle" fill="#8892b0" font-size="8">32 strategies</text>

  <line x1="677" y1="530" x2="700" y2="530" stroke="#64ffda" stroke-width="1.5" marker-end="url(#arwR)"/>

  <rect x="705" y="510" width="110" height="40" rx="6" fill="#F7B32B" fill-opacity="0.1" stroke="#F7B32B" stroke-width="1.5"/>
  <text x="760" y="527" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="700">IDEALPRO</text>
  <text x="760" y="542" text-anchor="middle" fill="#8892b0" font-size="8">live execution</text>

  <!-- Timing note -->
  <text x="425" y="580" text-anchor="middle" fill="#8892b0" font-size="10">Full cycle: Python &#8594; CSV &#8594; GlobalVariable.dll &#8594; MultiCharts &#8594; IBKR TWS &#8594; IDEALPRO</text>
  <text x="425" y="598" text-anchor="middle" fill="#64ffda" font-size="10" font-weight="600">Latency: sub-second for signal propagation</text>
</svg>