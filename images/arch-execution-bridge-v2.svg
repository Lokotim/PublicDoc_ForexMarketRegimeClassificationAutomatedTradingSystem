  <text x="100" y="397" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">Port 7496</text>

  <rect x="155" y="382" width="110" height="22" rx="4" fill="#233554"/>
  <text x="210" y="397" text-anchor="middle" fill="#ccd6f6" font-size="10">Accounts 1-4</text>

  <text x="160" y="427" text-anchor="middle" fill="#8892b0" font-size="9">Primary execution gateway</text>

  <!-- VAL Gateway -->
  <rect x="295" y="350" width="240" height="85" rx="6" fill="#0a192f" stroke="#F7B32B" stroke-width="1.5"/>
  <rect x="295" y="350" width="240" height="24" rx="6" fill="#F7B32B" fill-opacity="0.1"/>
  <text x="415" y="367" text-anchor="middle" fill="#F7B32B" font-size="11" font-weight="700">VAL Gateway</text>

  <rect x="310" y="382" width="90" height="22" rx="4" fill="#233554"/>
  <text x="355" y="397" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">Port 7497</text>

  <rect x="410" y="382" width="110" height="22" rx="4" fill="#233554"/>
  <text x="465" y="397" text-anchor="middle" fill="#ccd6f6" font-size="10">Accounts 5-8</text>

  <text x="415" y="427" text-anchor="middle" fill="#8892b0" font-size="9">Secondary execution gateway</text>

  <!-- ========== GV Cross-Validation Section ========== -->
  <rect x="570" y="310" width="260" height="140" rx="8" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="700" y="335" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="700">GV Cross-Validation</text>

