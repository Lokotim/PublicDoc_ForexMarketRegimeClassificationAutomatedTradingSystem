  <rect x="705" y="108" width="110" height="44" rx="5" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="760" y="126" text-anchor="middle" fill="#F7B32B" font-size="11" font-weight="600">IBKR TWS</text>
  <text x="760" y="142" text-anchor="middle" fill="#8892b0" font-size="9">API Gateway</text>

  <!-- Arrow to IDEALPRO -->
  <line x1="760" y1="152" x2="760" y2="175" stroke="#F7B32B" stroke-width="1.5" marker-end="url(#arwG)"/>

  <!-- IDEALPRO -->
  <rect x="690" y="180" width="130" height="34" rx="5" fill="#F7B32B" fill-opacity="0.1" stroke="#F7B32B" stroke-width="1.5"/>
