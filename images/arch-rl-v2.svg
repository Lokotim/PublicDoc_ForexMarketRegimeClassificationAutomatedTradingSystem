<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow1" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="greenGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <marker id="arrowGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F7B32B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64ffda"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8892b0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="720" rx="8" fill="#0a192f"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" fill="url(#goldGrad1)" font-size="20" font-weight="700" letter-spacing="0.5">Q-Learning Reinforcement Learning Agent</text>
  <line x1="200" y1="50" x2="650" y2="50" stroke="#233554" stroke-width="1"/>

  <!-- ===== STATE SPACE (top-left) ===== -->
  <rect x="30" y="70" width="370" height="130" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="215" y="94" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="600">STATE SPACE</text>
  <text x="215" y="116" text-anchor="middle" fill="#F7B32B" font-size="22" font-weight="700">96 States</text>

  <!-- Factor breakdown -->
  <rect x="50" y="130" width="64" height="28" rx="4" fill="#1a2f50" stroke="#233554"/>
  <text x="82" y="149" text-anchor="middle" fill="#ccd6f6" font-size="10" font-weight="600">8 Pairs</text>

  <text x="122" y="149" fill="#8892b0" font-size="14">×</text>

  <rect x="132" y="130" width="76" height="28" rx="4" fill="#1a2f50" stroke="#233554"/>
  <text x="170" y="149" text-anchor="middle" fill="#ccd6f6" font-size="10" font-weight="600">2 Regimes</text>

  <text x="216" y="149" fill="#8892b0" font-size="14">×</text>

  <rect x="226" y="130" width="76" height="28" rx="4" fill="#1a2f50" stroke="#233554"/>
  <text x="264" y="149" text-anchor="middle" fill="#ccd6f6" font-size="10" font-weight="600">2 Directions</text>

  <text x="310" y="149" fill="#8892b0" font-size="14">×</text>

  <rect x="320" y="130" width="64" height="28" rx="4" fill="#1a2f50" stroke="#233554"/>
  <text x="352" y="149" text-anchor="middle" fill="#ccd6f6" font-size="10" font-weight="600">3 Conf.</text>

  <text x="215" y="184" text-anchor="middle" fill="#8892b0" font-size="10">(trend/range) (long/short) (low/med/high)</text>

  <!-- ===== ACTION SPACE (top-right) ===== -->
  <rect x="420" y="70" width="400" height="130" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="620" y="94" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="600">ACTION SPACE</text>
  <text x="620" y="116" text-anchor="middle" fill="#F7B32B" font-size="22" font-weight="700">4 Actions</text>

  <rect x="440" y="128" width="85" height="30" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="482" y="148" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700">TF-L</text>
  <text x="482" y="160" text-anchor="middle" fill="#8892b0" font-size="8">Trend Long</text>

  <rect x="535" y="128" width="85" height="30" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="577" y="148" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">TF-S</text>
  <text x="577" y="160" text-anchor="middle" fill="#8892b0" font-size="8">Trend Short</text>

  <rect x="630" y="128" width="85" height="30" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="672" y="148" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700">MR-L</text>
  <text x="672" y="160" text-anchor="middle" fill="#8892b0" font-size="8">Revert Long</text>

  <rect x="725" y="128" width="85" height="30" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="767" y="148" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">MR-S</text>
  <text x="767" y="160" text-anchor="middle" fill="#8892b0" font-size="8">Revert Short</text>

  <text x="620" y="190" text-anchor="middle" fill="#8892b0" font-size="10">TF = Trend-Following | MR = Mean-Reversion</text>

  <!-- ===== Q-TABLE (center-left) ===== -->
  <rect x="30" y="220" width="280" height="190" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="170" y="244" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="600">Q-TABLE</text>
  <text x="170" y="260" text-anchor="middle" fill="#8892b0" font-size="10">96 × 4 = 384 cells</text>

  <!-- Mini Q-table grid -->
  <g transform="translate(55, 270)">
    <!-- Header row -->
    <rect x="0" y="0" width="60" height="20" fill="#0a192f" stroke="#233554"/>
    <text x="30" y="14" text-anchor="middle" fill="#8892b0" font-size="9">State \\ Act</text>
    <rect x="60" y="0" width="50" height="20" fill="#0a192f" stroke="#233554"/>
    <text x="85" y="14" text-anchor="middle" fill="#4ADE80" font-size="9">TF-L</text>
    <rect x="110" y="0" width="50" height="20" fill="#0a192f" stroke="#233554"/>
    <text x="135" y="14" text-anchor="middle" fill="#ff6b6b" font-size="9">TF-S</text>
    <rect x="160" y="0" width="50" height="20" fill="#0a192f" stroke="#233554"/>
    <text x="185" y="14" text-anchor="middle" fill="#4ADE80" font-size="9">MR-L</text>
    <rect x="210" y="0" width="50" height="20" fill="#0a192f" stroke="#233554"/>
    <text x="235" y="14" text-anchor="middle" fill="#ff6b6b" font-size="9">MR-S</text>

    <!-- Data rows -->
    <rect x="0" y="20" width="60" height="18" fill="#112240" stroke="#233554"/>
    <text x="30" y="33" text-anchor="middle" fill="#ccd6f6" font-size="8">EUR_T_L_H</text>
    <rect x="60" y="20" width="50" height="18" fill="#1a3a2a" stroke="#233554"/>
    <text x="85" y="33" text-anchor="middle" fill="#4ADE80" font-size="9" font-weight="600">0.82</text>
    <rect x="110" y="20" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="135" y="33" text-anchor="middle" fill="#ccd6f6" font-size="9">0.31</text>
    <rect x="160" y="20" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="185" y="33" text-anchor="middle" fill="#ccd6f6" font-size="9">0.15</text>
    <rect x="210" y="20" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="235" y="33" text-anchor="middle" fill="#ccd6f6" font-size="9">0.22</text>

    <rect x="0" y="38" width="60" height="18" fill="#112240" stroke="#233554"/>
    <text x="30" y="51" text-anchor="middle" fill="#ccd6f6" font-size="8">GBP_R_S_M</text>
    <rect x="60" y="38" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="85" y="51" text-anchor="middle" fill="#ccd6f6" font-size="9">0.18</text>
    <rect x="110" y="38" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="135" y="51" text-anchor="middle" fill="#ccd6f6" font-size="9">0.41</text>
    <rect x="160" y="38" width="50" height="18" fill="#1a3a2a" stroke="#233554"/>
    <text x="185" y="51" text-anchor="middle" fill="#4ADE80" font-size="9" font-weight="600">0.73</text>
    <rect x="210" y="38" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="235" y="51" text-anchor="middle" fill="#ccd6f6" font-size="9">0.29</text>

    <rect x="0" y="56" width="60" height="18" fill="#112240" stroke="#233554"/>
    <text x="30" y="69" text-anchor="middle" fill="#ccd6f6" font-size="8">JPY_T_S_L</text>
    <rect x="60" y="56" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="85" y="69" text-anchor="middle" fill="#ccd6f6" font-size="9">0.12</text>
    <rect x="110" y="56" width="50" height="18" fill="#1a3a2a" stroke="#233554"/>
    <text x="135" y="69" text-anchor="middle" fill="#4ADE80" font-size="9" font-weight="600">0.67</text>
    <rect x="160" y="56" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="185" y="69" text-anchor="middle" fill="#ccd6f6" font-size="9">0.09</text>
    <rect x="210" y="56" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="235" y="69" text-anchor="middle" fill="#ccd6f6" font-size="9">0.44</text>

    <!-- Ellipsis row -->
    <text x="130" y="88" text-anchor="middle" fill="#8892b0" font-size="11">. . .</text>

    <rect x="0" y="92" width="60" height="18" fill="#112240" stroke="#233554"/>
    <text x="30" y="105" text-anchor="middle" fill="#ccd6f6" font-size="8">CAD_R_L_H</text>
    <rect x="60" y="92" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="85" y="105" text-anchor="middle" fill="#ccd6f6" font-size="9">0.25</text>
    <rect x="110" y="92" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="135" y="105" text-anchor="middle" fill="#ccd6f6" font-size="9">0.33</text>
    <rect x="160" y="92" width="50" height="18" fill="#112240" stroke="#233554"/>
    <text x="185" y="105" text-anchor="middle" fill="#ccd6f6" font-size="9">0.51</text>
    <rect x="210" y="92" width="50" height="18" fill="#1a3a2a" stroke="#233554"/>
    <text x="235" y="105" text-anchor="middle" fill="#4ADE80" font-size="9" font-weight="600">0.88</text>
  </g>

  <!-- ===== REWARD FUNCTION (center-right) ===== -->
  <rect x="330" y="220" width="490" height="190" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="575" y="244" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="600">REWARD FUNCTION</text>
  <text x="575" y="262" text-anchor="middle" fill="#F7B32B" font-size="15" font-weight="700">Differential Sortino Ratio</text>

  <!-- Formula concept -->
  <rect x="370" y="274" width="410" height="46" rx="4" fill="#0a192f" stroke="#F7B32B" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="575" y="294" text-anchor="middle" fill="#ccd6f6" font-size="13" font-weight="500">R = Sortino(with RL) - Sortino(without RL)</text>
  <text x="575" y="312" text-anchor="middle" fill="#8892b0" font-size="10">Measures marginal value added by RL agent</text>

  <!-- Hard outcomes -->
  <rect x="370" y="332" width="195" height="62" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="467" y="352" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="600">Hard Outcomes</text>
  <text x="467" y="370" text-anchor="middle" fill="#ccd6f6" font-size="11">Realized P&amp;L</text>
  <text x="467" y="386" text-anchor="middle" fill="#F7B32B" font-size="12" font-weight="700">Weight = 1.0</text>

  <!-- Soft outcomes -->
  <rect x="585" y="332" width="195" height="62" rx="4" fill="#2a2a1a" stroke="#FFD54F" stroke-width="1"/>
  <text x="682" y="352" text-anchor="middle" fill="#FFD54F" font-size="12" font-weight="600">Soft Outcomes</text>
  <text x="682" y="370" text-anchor="middle" fill="#ccd6f6" font-size="11">Unrealized / Mark-to-Market</text>
  <text x="682" y="386" text-anchor="middle" fill="#F7B32B" font-size="12" font-weight="700">Weight = 0 - 0.5</text>

  <!-- ===== PER BOX (bottom-left) ===== -->
  <rect x="30" y="430" width="280" height="120" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="170" y="454" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="600">PRIORITIZED EXPERIENCE REPLAY</text>

  <rect x="50" y="464" width="110" height="34" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="105" y="478" text-anchor="middle" fill="#8892b0" font-size="10">Batch Size</text>
  <text x="105" y="493" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="700">32</text>

  <rect x="180" y="464" width="110" height="34" rx="4" fill="#0a192f" stroke="#233554"/>
  <text x="235" y="478" text-anchor="middle" fill="#8892b0" font-size="10">Iterations</text>
  <text x="235" y="493" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="700">5</text>

  <text x="170" y="534" text-anchor="middle" fill="#8892b0" font-size="10">High-surprise transitions replayed more often</text>

  <!-- ===== OBSERVATION MODE (bottom-right) ===== -->
  <rect x="330" y="430" width="490" height="120" rx="6" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="575" y="454" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="600">OBSERVATION MODE RAMP</text>

  <!-- Three phase bars -->
  <g transform="translate(355, 468)">
    <!-- Observe phase -->
    <rect x="0" y="0" width="130" height="36" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
    <text x="65" y="16" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="600">OBSERVE</text>
    <text x="65" y="30" text-anchor="middle" fill="#ccd6f6" font-size="10">n &lt; 50</text>

    <!-- Arrow -->
    <line x1="135" y1="18" x2="148" y2="18" stroke="#8892b0" stroke-width="1.5" marker-end="url(#arrowGray)"/>

    <!-- Ramp phase -->
    <rect x="152" y="0" width="130" height="36" rx="4" fill="#2a2a1a" stroke="#FFD54F" stroke-width="1"/>
    <text x="217" y="16" text-anchor="middle" fill="#FFD54F" font-size="11" font-weight="600">RAMP</text>
    <text x="217" y="30" text-anchor="middle" fill="#ccd6f6" font-size="10">50 - 200</text>

    <!-- Arrow -->
    <line x1="287" y1="18" x2="300" y2="18" stroke="#8892b0" stroke-width="1.5" marker-end="url(#arrowGray)"/>

    <!-- Full weight phase -->
    <rect x="304" y="0" width="140" height="36" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
    <text x="374" y="16" text-anchor="middle" fill="#4ADE80" font-size="11" font-weight="600">FULL WEIGHT</text>
    <text x="374" y="30" text-anchor="middle" fill="#ccd6f6" font-size="10">n &gt; 200 → 20%</text>
  </g>

  <text x="575" y="536" text-anchor="middle" fill="#8892b0" font-size="10">Weight in meta-ensemble ramps from 0% to max 20%</text>

  <!-- ===== FEEDBACK LOOP ARROWS ===== -->
  <!-- Arrow from Reward box down-left to Q-table -->
  <path d="M 425,410 L 425,565 L 310,565" fill="none" stroke="#F7B32B" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGold)"/>
  <text x="368" y="580" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">Update Q-values</text>

  <!-- Arrow from Q-table up to Action space -->
  <path d="M 310,280 L 340,280 L 340,135 L 420,135" fill="none" stroke="#64ffda" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="368" y="208" fill="#64ffda" font-size="10" font-weight="600" transform="rotate(-90, 368, 208)">Select action</text>

  <!-- ===== BOTTOM BANNER ===== -->
  <rect x="30" y="570" width="790" height="140" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1" filter="url(#shadow1)"/>
  <text x="425" y="596" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="700">LEARNING LOOP</text>

  <g transform="translate(55, 610)">
    <!-- Step circles -->
    <circle cx="0" cy="18" r="14" fill="#0a192f" stroke="#64ffda" stroke-width="1.5"/>
    <text x="0" y="22" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="700">1</text>
    <text x="0" y="44" text-anchor="middle" fill="#ccd6f6" font-size="9">Encode</text>
    <text x="0" y="55" text-anchor="middle" fill="#8892b0" font-size="8">State</text>

    <line x1="18" y1="18" x2="128" y2="18" stroke="#233554" stroke-width="1.5" stroke-dasharray="4,2"/>

    <circle cx="148" cy="18" r="14" fill="#0a192f" stroke="#64ffda" stroke-width="1.5"/>
    <text x="148" y="22" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="700">2</text>
    <text x="148" y="44" text-anchor="middle" fill="#ccd6f6" font-size="9">Q-Lookup</text>
    <text x="148" y="55" text-anchor="middle" fill="#8892b0" font-size="8">argmax(Q)</text>

    <line x1="166" y1="18" x2="276" y2="18" stroke="#233554" stroke-width="1.5" stroke-dasharray="4,2"/>

    <circle cx="296" cy="18" r="14" fill="#0a192f" stroke="#64ffda" stroke-width="1.5"/>
    <text x="296" y="22" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="700">3</text>
    <text x="296" y="44" text-anchor="middle" fill="#ccd6f6" font-size="9">Execute</text>
    <text x="296" y="55" text-anchor="middle" fill="#8892b0" font-size="8">Action</text>

    <line x1="314" y1="18" x2="424" y2="18" stroke="#233554" stroke-width="1.5" stroke-dasharray="4,2"/>

    <circle cx="444" cy="18" r="14" fill="#0a192f" stroke="#64ffda" stroke-width="1.5"/>
    <text x="444" y="22" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="700">4</text>
    <text x="444" y="44" text-anchor="middle" fill="#ccd6f6" font-size="9">Observe</text>
    <text x="444" y="55" text-anchor="middle" fill="#8892b0" font-size="8">Reward</text>

    <line x1="462" y1="18" x2="572" y2="18" stroke="#233554" stroke-width="1.5" stroke-dasharray="4,2"/>

    <circle cx="592" cy="18" r="14" fill="#0a192f" stroke="#64ffda" stroke-width="1.5"/>
    <text x="592" y="22" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="700">5</text>
    <text x="592" y="44" text-anchor="middle" fill="#ccd6f6" font-size="9">PER</text>
    <text x="592" y="55" text-anchor="middle" fill="#8892b0" font-size="8">Replay</text>

    <line x1="610" y1="18" x2="720" y2="18" stroke="#233554" stroke-width="1.5" stroke-dasharray="4,2"/>

    <circle cx="740" cy="18" r="14" fill="#0a192f" stroke="#F7B32B" stroke-width="1.5"/>
    <text x="740" y="22" text-anchor="middle" fill="#F7B32B" font-size="11" font-weight="700">6</text>
    <text x="740" y="44" text-anchor="middle" fill="#ccd6f6" font-size="9">Update</text>
    <text x="740" y="55" text-anchor="middle" fill="#8892b0" font-size="8">Q-table</text>
  </g>
</svg>