<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="850" height="450">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <filter id="s4">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="coreGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD54F" flood-opacity="0.3"/>
    </filter>
    <!-- Arrow marker for forward (green) -->
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4ADE80" opacity="0.7"/>
    </marker>
    <!-- Arrow marker for feedback (amber) -->
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FFD54F" opacity="0.7"/>
    </marker>
  </defs>

  <rect width="850" height="450" fill="url(#bg4)" rx="12"/>

  <!-- Title -->
  <text x="425" y="28" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#E2E8F0">LEVIER -- Nine Mechanisms of Continuous Learning</text>

  <!-- Center: Pipeline Core -->
  <circle cx="425" cy="225" r="55" fill="#2D2A1A" stroke="url(#coreGrad)" stroke-width="2.5" filter="url(#coreGlow)"/>
  <text x="425" y="218" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="bold" fill="#FFD54F">PIPELINE</text>
  <text x="425" y="234" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="bold" fill="#FFD54F">CORE</text>

  <!-- Outer spiral hint (concentric rings suggesting improvement) -->
  <circle cx="425" cy="225" r="80" fill="none" stroke="#FFD54F" stroke-width="0.3" opacity="0.2"/>
  <circle cx="425" cy="225" r="110" fill="none" stroke="#FFD54F" stroke-width="0.3" opacity="0.15"/>
  <circle cx="425" cy="225" r="140" fill="none" stroke="#FFD54F" stroke-width="0.3" opacity="0.1"/>

  <!-- 9 mechanism nodes arranged in a circle (radius ~170) -->
  <!-- Node positions: 0deg=right, 40deg increments -->

  <!-- M1: ML Self-Versioning (0deg = right) -->
  <rect x="600" y="200" width="145" height="50" rx="8" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.2" filter="url(#s4)"/>
  <text x="672" y="217" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#3B82F6">M1: ML Versioning</text>
  <text x="672" y="232" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E2E8F0">v17.0 | Retrain + validate</text>
  <rect x="710" y="237" width="30" height="10" rx="3" fill="#3B82F6" opacity="0.3"/>
  <text x="725" y="245" text-anchor="middle" font-family="Consolas" font-size="7" fill="#3B82F6">WEEKLY</text>
  <line x1="480" y1="220" x2="600" y2="222" stroke="#4ADE80" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- M2: RL Continuous (40deg) -->
  <rect x="620" y="85" width="145" height="50" rx="8" fill="#2D2A1A" stroke="#FFD54F" stroke-width="1.2" filter="url(#s4)"/>
  <text x="692" y="102" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#FFD54F">M2: RL Training</text>
  <text x="692" y="117" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E2E8F0">160 replays/cycle</text>
  <rect x="730" y="122" width="30" height="10" rx="3" fill="#FFD54F" opacity="0.3"/>
  <text x="745" y="130" text-anchor="middle" font-family="Consolas" font-size="7" fill="#FFD54F">HOURLY</text>
  <line x1="465" y1="185" x2="620" y2="112" stroke="#4ADE80" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- M3: Bayesian Posterior (80deg) -->
  <rect x="470" y="40" width="145" height="50" rx="8" fill="#2A1A3A" stroke="#E879F9" stroke-width="1.2" filter="url(#s4)"/>
  <text x="542" y="57" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#E879F9">M3: Bayesian Update</text>
  <text x="542" y="72" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E2E8F0">MCMC posteriors</text>
  <rect x="580" y="77" width="30" height="10" rx="3" fill="#E879F9" opacity="0.3"/>
  <text x="595" y="85" text-anchor="middle" font-family="Consolas" font-size="7" fill="#E879F9">HOURLY</text>
  <line x1="440" y1="172" x2="510" y2="90" stroke="#4ADE80" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- M4: Source Weight Learning (120deg) -->
  <rect x="235" y="40" width="145" height="50" rx="8" fill="#1A3A2A" stroke="#4ADE80" stroke-width="1.2" filter="url(#s4)"/>
  <text x="307" y="57" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#4ADE80">M4: Weight Learning</text>
  <text x="307" y="72" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E2E8F0">Disagreement-only</text>
  <rect x="340" y="77" width="30" height="10" rx="3" fill="#4ADE80" opacity="0.3"/>
  <text x="355" y="85" text-anchor="middle" font-family="Consolas" font-size="7" fill="#4ADE80">HOURLY</text>
  <line x1="405" y1="175" x2="340" y2="90" stroke="#4ADE80" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- M5: Crowding A/B (160deg) -->
  <rect x="85" y="85" width="145" height="50" rx="8" fill="#1A2A2A" stroke="#00D4FF" stroke-width="1.2" filter="url(#s4)"/>
  <text x="157" y="102" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#00D4FF">M5: Crowding A/B</text>
  <text x="157" y="117" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E2E8F0">Sortino comparison</text>
  <rect x="90" y="122" width="28" height="10" rx="3" fill="#00D4FF" opacity="0.3"/>
  <text x="104" y="130" text-anchor="middle" font-family="Consolas" font-size="7" fill="#00D4FF">DAILY</text>
  <line x1="385" y1="190" x2="230" y2="115" stroke="#4ADE80" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- M6: CSI Recovery (200deg) -->
  <rect x="85" y="200" width="145" height="50" rx="8" fill="#1A2520" stroke="#4ADE80" stroke-width="1.2" filter="url(#s4)"/>
  <text x="157" y="217" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#4ADE80">M6: CSI Recovery</text>
  <text x="157" y="232" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E2E8F0">+3 CSI/24h (cap 50)</text>
  <rect x="90" y="237" width="30" height="10" rx="3" fill="#4ADE80" opacity="0.3"/>
  <text x="105" y="245" text-anchor="middle" font-family="Consolas" font-size="7" fill="#4ADE80">HOURLY</text>
  <line x1="370" y1="228" x2="230" y2="225" stroke="#FFD54F" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrowAmber)"/>

  <!-- M7: Pair Track Recency (240deg) -->
  <rect x="85" y="315" width="145" height="50" rx="8" fill="#2D2A1A" stroke="#FFD54F" stroke-width="1.2" filter="url(#s4)"/>
  <text x="157" y="332" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#FFD54F">M7: Pair Track</text>
  <text x="157" y="347" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E2E8F0">7d half-life weighting</text>
  <rect x="90" y="352" width="30" height="10" rx="3" fill="#FFD54F" opacity="0.3"/>
  <text x="105" y="360" text-anchor="middle" font-family="Consolas" font-size="7" fill="#FFD54F">HOURLY</text>
  <line x1="388" y1="262" x2="230" y2="330" stroke="#FFD54F" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrowAmber)"/>

  <!-- M8: Outcome Recording (280deg) -->
  <rect x="235" y="365" width="145" height="50" rx="8" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.2" filter="url(#s4)"/>
  <text x="307" y="382" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#3B82F6">M8: PnL Attribution</text>
  <text x="307" y="397" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E2E8F0">Full outcome recording</text>
  <rect x="340" y="402" width="30" height="10" rx="3" fill="#3B82F6" opacity="0.3"/>
  <text x="355" y="410" text-anchor="middle" font-family="Consolas" font-size="7" fill="#3B82F6">HOURLY</text>
  <line x1="410" y1="275" x2="340" y2="365" stroke="#FFD54F" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrowAmber)"/>

  <!-- M9: Continuous Learning (320deg) -->
  <rect x="470" y="365" width="145" height="50" rx="8" fill="#2A1A3A" stroke="#E879F9" stroke-width="1.2" filter="url(#s4)"/>
  <text x="542" y="382" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#E879F9">M9: Continuous Learn</text>
  <text x="542" y="397" text-anchor="middle" font-family="Consolas" font-size="9" fill="#E2E8F0">Accuracy + Sortino track</text>
  <rect x="580" y="402" width="30" height="10" rx="3" fill="#E879F9" opacity="0.3"/>
  <text x="595" y="410" text-anchor="middle" font-family="Consolas" font-size="7" fill="#E879F9">HOURLY</text>
  <line x1="445" y1="275" x2="510" y2="365" stroke="#FFD54F" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrowAmber)"/>

  <!-- Feedback arrow back to M2 (closing the loop from M9) -->
  <path d="M 615,385 Q 750,380 750,180 Q 750,110 690,105" fill="none" stroke="#FFD54F" stroke-width="1" stroke-dasharray="4,3" stroke-linecap="round" opacity="0.4" marker-end="url(#arrowAmber)"/>

  <!-- Legend -->
  <rect x="20" y="420" width="300" height="25" rx="4" fill="#0F172A" stroke="#94A3B8" stroke-width="0.5" opacity="0.8"/>
  <line x1="35" y1="433" x2="55" y2="433" stroke="#4ADE80" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="63" y="436" font-family="Consolas" font-size="9" fill="#94A3B8">Forward (action)</text>
  <line x1="165" y1="433" x2="185" y2="433" stroke="#FFD54F" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="193" y="436" font-family="Consolas" font-size="9" fill="#94A3B8">Feedback (learning)</text>

  <!-- Bottom label -->
  <text x="425" y="445" text-anchor="middle" font-family="Consolas" font-size="10" fill="#94A3B8">9 mechanisms | 3 timescales (hourly/daily/weekly) | Bounded drift prevents overfitting</text>
</svg>