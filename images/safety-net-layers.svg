<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <defs>
    <filter id="sn-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sn-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="sn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a1119"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="400" fill="url(#sn-bg)"/>

  <!-- Title -->
  <text x="425" y="28" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">THE SAFETY NET</text>
  <text x="425" y="46" text-anchor="middle" fill="#5a7a8a" font-family="'Segoe UI', Arial, sans-serif" font-size="11" letter-spacing="1.5">5 LAYERS OF PROTECTION</text>

  <!-- Concentric semi-circles (arcs) centered at 425, 310 -->
  <!-- Layer 1 (outermost): CIRCUIT BREAKER - Red -->
  <path d="M 55,310 A 370,270 0 0 1 795,310" fill="none" stroke="#ff5252" stroke-width="2.5" opacity="0.9"/>
  <path d="M 55,310 A 370,270 0 0 1 795,310" fill="#ff5252" fill-opacity="0.04" stroke="none"/>
  <!-- Layer 1 label background -->
  <rect x="100" y="62" width="340" height="20" rx="3" fill="#1a0a0a" stroke="#ff5252" stroke-width="0.5" opacity="0.8"/>
  <text x="110" y="76" fill="#ff5252" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">LAYER 1</text>
  <text x="155" y="76" fill="#ff8a80" font-family="'Segoe UI', Arial, sans-serif" font-size="9">CIRCUIT BREAKER -- Daily PnL limits, kill switch</text>

  <!-- Layer 2: SHOCK DETECTOR - Orange -->
  <path d="M 120,310 A 305,225 0 0 1 730,310" fill="none" stroke="#ff9100" stroke-width="2.5" opacity="0.9"/>
  <path d="M 120,310 A 305,225 0 0 1 730,310" fill="#ff9100" fill-opacity="0.04" stroke="none"/>
  <rect x="130" y="100" width="340" height="20" rx="3" fill="#1a1200" stroke="#ff9100" stroke-width="0.5" opacity="0.8"/>
  <text x="140" y="114" fill="#ff9100" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">LAYER 2</text>
  <text x="185" y="114" fill="#ffcc80" font-family="'Segoe UI', Arial, sans-serif" font-size="9">SHOCK DETECTOR -- White Swan events, Kelly reduction</text>

  <!-- Layer 3: CROWDING PENALTY - Yellow -->
  <path d="M 185,310 A 240,180 0 0 1 665,310" fill="none" stroke="#ffd740" stroke-width="2.5" opacity="0.9"/>
  <path d="M 185,310 A 240,180 0 0 1 665,310" fill="#ffd740" fill-opacity="0.04" stroke="none"/>
  <rect x="160" y="145" width="335" height="20" rx="3" fill="#1a1800" stroke="#ffd740" stroke-width="0.5" opacity="0.8"/>
  <text x="170" y="159" fill="#ffd740" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">LAYER 3</text>
  <text x="215" y="159" fill="#fff59d" font-family="'Segoe UI', Arial, sans-serif" font-size="9">CROWDING PENALTY -- A/B tested, auto-learning</text>

  <!-- Layer 4: IBKR CROSS-VALIDATION - Green -->
  <path d="M 245,310 A 180,140 0 0 1 605,310" fill="none" stroke="#00e676" stroke-width="2.5" opacity="0.9"/>
  <path d="M 245,310 A 180,140 0 0 1 605,310" fill="#00e676" fill-opacity="0.04" stroke="none"/>
  <rect x="185" y="190" width="370" height="20" rx="3" fill="#001a0a" stroke="#00e676" stroke-width="0.5" opacity="0.8"/>
  <text x="195" y="204" fill="#00e676" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">LAYER 4</text>
  <text x="240" y="204" fill="#a5d6a7" font-family="'Segoe UI', Arial, sans-serif" font-size="9">IBKR CROSS-VALIDATION -- MCPT order tracking (IBKR confirmed)</text>

  <!-- Layer 5 (innermost): DATA INTEGRITY GUARD - Cyan -->
  <path d="M 310,310 A 115,95 0 0 1 540,310" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.9"/>
  <path d="M 310,310 A 115,95 0 0 1 540,310" fill="#00e5ff" fill-opacity="0.05" stroke="none"/>
  <rect x="215" y="235" width="340" height="20" rx="3" fill="#001a1a" stroke="#00e5ff" stroke-width="0.5" opacity="0.8"/>
  <text x="225" y="249" fill="#00e5ff" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">LAYER 5</text>
  <text x="270" y="249" fill="#80deea" font-family="'Segoe UI', Arial, sans-serif" font-size="9">DATA INTEGRITY GUARD -- Validates all inputs</text>

  <!-- Center: LIVE POSITIONS -->
  <circle cx="425" cy="295" r="30" fill="#0f1923" stroke="#ffffff" stroke-width="1.5" filter="url(#sn-glow)"/>
  <text x="425" y="291" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">LIVE</text>
  <text x="425" y="303" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">POSITIONS</text>

  <!-- Right side: layer numbers with icons -->
  <g transform="translate(620, 62)">
    <circle cx="8" cy="8" r="8" fill="none" stroke="#ff5252" stroke-width="1"/>
    <text x="8" y="12" text-anchor="middle" fill="#ff5252" font-size="9" font-weight="700">1</text>
    <text x="25" y="12" fill="#5a6a7a" font-size="8">Outermost</text>
  </g>
  <g transform="translate(640, 100)">
    <circle cx="8" cy="8" r="8" fill="none" stroke="#ff9100" stroke-width="1"/>
    <text x="8" y="12" text-anchor="middle" fill="#ff9100" font-size="9" font-weight="700">2</text>
  </g>
  <g transform="translate(660, 145)">
    <circle cx="8" cy="8" r="8" fill="none" stroke="#ffd740" stroke-width="1"/>
    <text x="8" y="12" text-anchor="middle" fill="#ffd740" font-size="9" font-weight="700">3</text>
  </g>
  <g transform="translate(680, 190)">
    <circle cx="8" cy="8" r="8" fill="none" stroke="#00e676" stroke-width="1"/>
    <text x="8" y="12" text-anchor="middle" fill="#00e676" font-size="9" font-weight="700">4</text>
  </g>
  <g transform="translate(700, 235)">
    <circle cx="8" cy="8" r="8" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <text x="8" y="12" text-anchor="middle" fill="#00e5ff" font-size="9" font-weight="700">5</text>
    <text x="25" y="12" fill="#5a6a7a" font-size="8">Innermost</text>
  </g>

  <!-- Decorative radial lines from center -->
  <g stroke="#1e3040" stroke-width="0.4" opacity="0.3">
    <line x1="425" y1="265" x2="425" y2="60"/>
    <line x1="395" y1="270" x2="200" y2="80"/>
    <line x1="455" y1="270" x2="650" y2="80"/>
    <line x1="370" y1="290" x2="80" y2="280"/>
    <line x1="480" y1="290" x2="770" y2="280"/>
  </g>

  <!-- Bottom status bar -->
  <rect x="130" y="340" width="590" height="40" rx="8" fill="#111d28" stroke="#1e3040" stroke-width="1"/>
  <!-- Status indicator dot -->
  <circle cx="160" cy="355" r="5" fill="#00e676" filter="url(#sn-glow)"/>
  <text x="175" y="352" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600">Current status:</text>
  <text x="280" y="352" fill="#00e676" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700">NORMAL</text>

  <text x="160" y="370" fill="#7a8a9a" font-family="'Segoe UI', Arial, sans-serif" font-size="9">
    <tspan fill="#ffd740" font-weight="600">3</tspan> active SHOCK warnings  |  <tspan fill="#00e676" font-weight="600">0</tspan> critical alerts
  </text>

  <!-- Small shield icon in top right -->
  <g transform="translate(780, 15)" opacity="0.15">
    <path d="M20,0 L40,8 L40,22 C40,35 30,42 20,48 C10,42 0,35 0,22 L0,8 Z" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M20,12 L20,32 M12,22 L28,22" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>