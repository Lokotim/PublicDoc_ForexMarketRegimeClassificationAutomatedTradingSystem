<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="850" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFD54F" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="450" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#E2E8F0">META-SIGNAL RESOLVER v3 -- Four-Source Arbitration</text>

  <!-- Source boxes (left column) -->
  <!-- ML Ensemble -->
  <rect x="30" y="60" width="180" height="70" rx="8" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="120" y="82" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="bold" fill="#3B82F6">ML ENSEMBLE</text>
  <text x="120" y="100" text-anchor="middle" font-family="Consolas" font-size="11" fill="#E2E8F0">5-Model MoE</text>
  <rect x="40" y="110" width="100" height="10" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="0.5"/>
  <rect x="40" y="110" width="100" height="10" rx="3" fill="#3B82F6" opacity="0.8"/>
  <text x="155" y="120" font-family="Consolas" font-size="10" fill="#3B82F6">50%</text>

  <!-- Forecast -->
  <rect x="30" y="145" width="180" height="70" rx="8" fill="#1A3A2A" stroke="#4ADE80" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="120" y="167" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="bold" fill="#4ADE80">FORECAST</text>
  <text x="120" y="185" text-anchor="middle" font-family="Consolas" font-size="11" fill="#E2E8F0">4-Day Markov</text>
  <rect x="40" y="195" width="100" height="10" rx="3" fill="#1E293B" stroke="#4ADE80" stroke-width="0.5"/>
  <rect x="40" y="195" width="56" height="10" rx="3" fill="#4ADE80" opacity="0.8"/>
  <text x="155" y="205" font-family="Consolas" font-size="10" fill="#4ADE80">28%</text>

  <!-- RL Agent -->
  <rect x="30" y="230" width="180" height="70" rx="8" fill="#2D2A1A" stroke="#FFD54F" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="120" y="252" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="bold" fill="#FFD54F">RL AGENT</text>
  <text x="120" y="270" text-anchor="middle" font-family="Consolas" font-size="11" fill="#E2E8F0">Q-Learning + PER</text>
  <rect x="40" y="280" width="100" height="10" rx="3" fill="#1E293B" stroke="#FFD54F" stroke-width="0.5"/>
  <rect x="40" y="280" width="24" height="10" rx="3" fill="#FFD54F" opacity="0.8"/>
  <text x="155" y="290" font-family="Consolas" font-size="10" fill="#FFD54F">12%</text>
  <text x="120" y="296" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">x30% progressive = 3.6% eff</text>

  <!-- Macro Composite -->
  <rect x="30" y="315" width="180" height="70" rx="8" fill="#2A1A3A" stroke="#E879F9" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="120" y="337" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="bold" fill="#E879F9">MACRO COMPOSITE</text>
  <text x="120" y="355" text-anchor="middle" font-family="Consolas" font-size="11" fill="#E2E8F0">Cross-Asset Factor</text>
  <rect x="40" y="365" width="100" height="10" rx="3" fill="#1E293B" stroke="#E879F9" stroke-width="0.5"/>
  <rect x="40" y="365" width="20" height="10" rx="3" fill="#E879F9" opacity="0.8"/>
  <text x="155" y="375" font-family="Consolas" font-size="10" fill="#E879F9">10%</text>

  <!-- Echo detection: dimmed connection ML -> Forecast -->
  <line x1="120" y1="130" x2="120" y2="145" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="185" y="140" font-family="Consolas" font-size="8" fill="#94A3B8">ECHO -60%</text>

  <!-- Flow arrows to ARBITER -->
  <line x1="210" y1="95" x2="330" y2="210" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="210" y1="180" x2="330" y2="210" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="210" y1="265" x2="330" y2="225" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="210" y1="350" x2="330" y2="240" stroke="#E879F9" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- ARBITER central node -->
  <rect x="330" y="170" width="160" height="100" rx="12" fill="#2D2A1A" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <text x="410" y="200" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#FFD54F">ARBITER</text>
  <text x="410" y="218" text-anchor="middle" font-family="Consolas" font-size="10" fill="#E2E8F0">Weighted Consensus</text>
  <text x="410" y="234" text-anchor="middle" font-family="Consolas" font-size="10" fill="#E2E8F0">Disagreement Learning</text>
  <text x="410" y="250" text-anchor="middle" font-family="Consolas" font-size="10" fill="#E2E8F0">Agreement Taxonomy</text>

  <!-- Paper Consensus (firewalled, side) -->
  <rect x="310" y="310" width="180" height="55" rx="8" fill="#1A2A2A" stroke="#00D4FF" stroke-width="1" stroke-dasharray="4,3" filter="url(#softShadow)"/>
  <text x="400" y="332" text-anchor="middle" font-family="Segoe UI" font-size="11" font-weight="bold" fill="#00D4FF">PAPER CONSENSUS</text>
  <text x="400" y="348" text-anchor="middle" font-family="Consolas" font-size="9" fill="#94A3B8">32 strategies | PnL-weighted vote</text>
  <!-- Firewall dashed line -->
  <line x1="400" y1="310" x2="400" y2="270" stroke="#F87171" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="445" y="295" font-family="Consolas" font-size="8" fill="#F87171">FIREWALL</text>
  <!-- Arrow to CSI only -->
  <line x1="490" y1="337" x2="540" y2="337" stroke="#00D4FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="560" y="330" font-family="Consolas" font-size="8" fill="#00D4FF">to CSI</text>
  <text x="560" y="342" font-family="Consolas" font-size="8" fill="#00D4FF">only</text>

  <!-- Output arrows to 8 pairs -->
  <line x1="490" y1="200" x2="570" y2="80" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="490" y1="205" x2="570" y2="110" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="490" y1="210" x2="570" y2="140" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="490" y1="215" x2="570" y2="170" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="490" y1="220" x2="570" y2="200" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="490" y1="230" x2="570" y2="230" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="490" y1="240" x2="570" y2="260" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="490" y1="250" x2="570" y2="290" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 8 Pair output boxes (right column) -->
  <!-- AUDJPY -->
  <rect x="570" y="62" width="130" height="28" rx="6" fill="#1A3A2A" stroke="#4ADE80" stroke-width="1"/>
  <text x="585" y="80" font-family="Consolas" font-size="10" fill="#E2E8F0">AUDJPY</text>
  <text x="660" y="80" font-family="Consolas" font-size="9" fill="#4ADE80">LONG</text>
  <circle cx="693" cy="76" r="4" fill="#4ADE80" opacity="0.8"/>

  <!-- AUDUSD -->
  <rect x="570" y="96" width="130" height="28" rx="6" fill="#1A3A2A" stroke="#4ADE80" stroke-width="1"/>
  <text x="585" y="114" font-family="Consolas" font-size="10" fill="#E2E8F0">AUDUSD</text>
  <text x="660" y="114" font-family="Consolas" font-size="9" fill="#4ADE80">LONG</text>
  <circle cx="693" cy="110" r="3" fill="#FFD54F" opacity="0.8"/>

  <!-- EURJPY -->
  <rect x="570" y="130" width="130" height="28" rx="6" fill="#2A1A1A" stroke="#F87171" stroke-width="1"/>
  <text x="585" y="148" font-family="Consolas" font-size="10" fill="#E2E8F0">EURJPY</text>
  <text x="655" y="148" font-family="Consolas" font-size="9" fill="#F87171">SHORT</text>
  <circle cx="693" cy="144" r="4" fill="#4ADE80" opacity="0.8"/>

  <!-- EURUSD -->
  <rect x="570" y="164" width="130" height="28" rx="6" fill="#2A1A1A" stroke="#F87171" stroke-width="1"/>
  <text x="585" y="182" font-family="Consolas" font-size="10" fill="#E2E8F0">EURUSD</text>
  <text x="655" y="182" font-family="Consolas" font-size="9" fill="#F87171">SHORT</text>
  <circle cx="693" cy="178" r="3" fill="#FFD54F" opacity="0.8"/>

  <!-- GBPUSD -->
  <rect x="570" y="198" width="130" height="28" rx="6" fill="#1A3A2A" stroke="#4ADE80" stroke-width="1"/>
  <text x="585" y="216" font-family="Consolas" font-size="10" fill="#E2E8F0">GBPUSD</text>
  <text x="660" y="216" font-family="Consolas" font-size="9" fill="#4ADE80">LONG</text>
  <circle cx="693" cy="212" r="4" fill="#4ADE80" opacity="0.8"/>

  <!-- USDCAD -->
  <rect x="570" y="232" width="130" height="28" rx="6" fill="#2A1A1A" stroke="#F87171" stroke-width="1"/>
  <text x="585" y="250" font-family="Consolas" font-size="10" fill="#E2E8F0">USDCAD</text>
  <text x="655" y="250" font-family="Consolas" font-size="9" fill="#F87171">SHORT</text>
  <circle cx="693" cy="246" r="4" fill="#4ADE80" opacity="0.8"/>

  <!-- USDCHF -->
  <rect x="570" y="266" width="130" height="28" rx="6" fill="#1A3A2A" stroke="#4ADE80" stroke-width="1"/>
  <text x="585" y="284" font-family="Consolas" font-size="10" fill="#E2E8F0">USDCHF</text>
  <text x="660" y="284" font-family="Consolas" font-size="9" fill="#4ADE80">LONG</text>
  <circle cx="693" cy="280" r="3" fill="#FFD54F" opacity="0.8"/>

  <!-- USDJPY -->
  <rect x="570" y="300" width="130" height="28" rx="6" fill="#2A1A1A" stroke="#F87171" stroke-width="1"/>
  <text x="585" y="318" font-family="Consolas" font-size="10" fill="#E2E8F0">USDJPY</text>
  <text x="655" y="318" font-family="Consolas" font-size="9" fill="#F87171">SHORT</text>
  <circle cx="693" cy="314" r="4" fill="#4ADE80" opacity="0.8"/>

  <!-- Agreement legend -->
  <rect x="720" y="62" width="115" height="100" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="0.5" opacity="0.8"/>
  <text x="777" y="78" text-anchor="middle" font-family="Segoe UI" font-size="9" font-weight="bold" fill="#94A3B8">AGREEMENT</text>
  <circle cx="733" cy="92" r="4" fill="#4ADE80"/>
  <text x="745" y="95" font-family="Consolas" font-size="8" fill="#E2E8F0">UNANIM x1.20</text>
  <circle cx="733" cy="108" r="4" fill="#00D4FF"/>
  <text x="745" y="111" font-family="Consolas" font-size="8" fill="#E2E8F0">STRONG x1.00</text>
  <circle cx="733" cy="124" r="3" fill="#FFD54F"/>
  <text x="745" y="127" font-family="Consolas" font-size="8" fill="#E2E8F0">MAJOR  x0.75</text>
  <circle cx="733" cy="140" r="3" fill="#F87171"/>
  <text x="745" y="143" font-family="Consolas" font-size="8" fill="#E2E8F0">SPLIT  x0.50</text>

  <!-- Bottom label -->
  <text x="425" y="430" text-anchor="middle" font-family="Consolas" font-size="10" fill="#94A3B8">Phase 7c | Hourly | Disagreement-only weight learning | Bounded +/-5pp drift</text>
</svg>