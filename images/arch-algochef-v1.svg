<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1020" width="850" height="1020" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="acShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="acGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="acBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="20%" stop-color="#ff6b6b"/>
      <stop offset="20%" stop-color="#F7B32B"/>
      <stop offset="40%" stop-color="#F7B32B"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#64ffda"/>
      <stop offset="80%" stop-color="#64ffda"/>
      <stop offset="80%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <marker id="acArrDown" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#F7B32B"/>
    </marker>
    <marker id="acArrRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F7B32B"/>
    </marker>
    <marker id="acArrRightTeal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64ffda"/>
    </marker>
    <marker id="acArrDownTeal" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#64ffda"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="1020" rx="8" fill="#0a192f"/>

  <!-- Title -->
  <text x="425" y="34" text-anchor="middle" fill="url(#acGoldGrad)" font-size="20" font-weight="700" letter-spacing="0.5">Strategy Analytics: The AlgoChef Layer</text>
  <line x1="180" y1="46" x2="670" y2="46" stroke="#233554" stroke-width="1"/>
  <text x="425" y="62" text-anchor="middle" fill="#8892b0" font-size="10">Composite Strategy Index (CSI) -- strategy health monitoring and adaptive position sizing</text>

  <!-- ===== INPUT: Trade Outcomes ===== -->
  <rect x="275" y="78" width="300" height="48" rx="24" fill="#112240" stroke="#64ffda" stroke-width="2" filter="url(#acShadow)"/>
  <text x="425" y="97" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="600">INPUT</text>
  <text x="425" y="114" text-anchor="middle" fill="#ccd6f6" font-size="13" font-weight="700">Trade Outcomes (strategy_outcomes)</text>

  <!-- Arrow down -->
  <line x1="425" y1="126" x2="425" y2="152" stroke="#F7B32B" stroke-width="2" marker-end="url(#acArrDown)"/>

  <!-- ===== CSI CALCULATOR: 3 pillars ===== -->
  <rect x="60" y="160" width="730" height="200" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#acShadow)"/>
  <!-- Header bar -->
  <rect x="60" y="160" width="730" height="26" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="425" y="178" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="700">CSI Calculator (Composite Strategy Index)</text>

  <!-- Pillar 1: Profitability -->
  <rect x="80" y="198" width="210" height="148" rx="5" fill="#0a192f" stroke="#4ADE80" stroke-width="1.2"/>
  <rect x="80" y="198" width="210" height="22" rx="5" fill="#4ADE80" fill-opacity="0.1"/>
  <text x="185" y="214" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700">Profitability</text>
  <!-- Sub-items -->
  <rect x="94" y="228" width="182" height="24" rx="4" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="185" y="244" text-anchor="middle" fill="#ccd6f6" font-size="10">Rolling 30d Sortino Ratio</text>
  <rect x="94" y="258" width="182" height="24" rx="4" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="185" y="274" text-anchor="middle" fill="#ccd6f6" font-size="10">Win Rate (30d window)</text>
  <rect x="94" y="288" width="182" height="24" rx="4" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="185" y="304" text-anchor="middle" fill="#ccd6f6" font-size="10">Profit Factor</text>
  <rect x="94" y="318" width="182" height="20" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="0.8"/>
  <text x="185" y="332" text-anchor="middle" fill="#4ADE80" font-size="9" font-weight="600">Weight: 40%</text>

  <!-- Pillar 2: Risk -->
  <rect x="320" y="198" width="210" height="148" rx="5" fill="#0a192f" stroke="#ff6b6b" stroke-width="1.2"/>
  <rect x="320" y="198" width="210" height="22" rx="5" fill="#ff6b6b" fill-opacity="0.1"/>
  <text x="425" y="214" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">Risk</text>
  <!-- Sub-items -->
  <rect x="334" y="228" width="182" height="24" rx="4" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="425" y="244" text-anchor="middle" fill="#ccd6f6" font-size="10">Max Drawdown</text>
  <rect x="334" y="258" width="182" height="24" rx="4" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="425" y="274" text-anchor="middle" fill="#ccd6f6" font-size="10">Return Volatility</text>
  <rect x="334" y="288" width="182" height="24" rx="4" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="425" y="304" text-anchor="middle" fill="#ccd6f6" font-size="10">Tail Risk (CVaR)</text>
  <rect x="334" y="318" width="182" height="20" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="0.8"/>
  <text x="425" y="332" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="600">Weight: 30%</text>

  <!-- Pillar 3: Confidence -->
  <rect x="560" y="198" width="210" height="148" rx="5" fill="#0a192f" stroke="#64ffda" stroke-width="1.2"/>
  <rect x="560" y="198" width="210" height="22" rx="5" fill="#64ffda" fill-opacity="0.1"/>
  <text x="665" y="214" text-anchor="middle" fill="#64ffda" font-size="12" font-weight="700">Confidence</text>
  <!-- Sub-items -->
  <rect x="574" y="228" width="182" height="24" rx="4" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="665" y="244" text-anchor="middle" fill="#ccd6f6" font-size="10">Bayesian Posterior n_eff</text>
  <rect x="574" y="258" width="182" height="24" rx="4" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="665" y="274" text-anchor="middle" fill="#ccd6f6" font-size="10">Prior-Only Discount</text>
  <rect x="574" y="288" width="182" height="24" rx="4" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="665" y="304" text-anchor="middle" fill="#ccd6f6" font-size="10">n_effective Count</text>
  <rect x="574" y="318" width="182" height="20" rx="4" fill="#1a2a3a" stroke="#64ffda" stroke-width="0.8"/>
  <text x="665" y="332" text-anchor="middle" fill="#64ffda" font-size="9" font-weight="600">Weight: 30%</text>

  <!-- Arrow down from CSI Calculator -->
  <line x1="425" y1="360" x2="425" y2="386" stroke="#F7B32B" stroke-width="2" marker-end="url(#acArrDown)"/>

  <!-- ===== CSI SCALE BAR ===== -->
  <rect x="60" y="394" width="730" height="130" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#acShadow)"/>
  <rect x="60" y="394" width="730" height="26" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="425" y="412" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="700">CSI Scale (0 - 100) and Multiplier Mapping</text>

  <!-- Gradient bar -->
  <rect x="100" y="432" width="650" height="24" rx="4" fill="url(#acBarGrad)" opacity="0.85"/>
  <!-- Divider lines on bar -->
  <line x1="230" y1="432" x2="230" y2="456" stroke="#0a192f" stroke-width="2"/>
  <line x1="360" y1="432" x2="360" y2="456" stroke="#0a192f" stroke-width="2"/>
  <line x1="490" y1="432" x2="490" y2="456" stroke="#0a192f" stroke-width="2"/>
  <line x1="620" y1="432" x2="620" y2="456" stroke="#0a192f" stroke-width="2"/>

  <!-- Scale labels above bar -->
  <text x="100" y="428" text-anchor="middle" fill="#8892b0" font-size="9">0</text>
  <text x="230" y="428" text-anchor="middle" fill="#8892b0" font-size="9">20</text>
  <text x="360" y="428" text-anchor="middle" fill="#8892b0" font-size="9">40</text>
  <text x="490" y="428" text-anchor="middle" fill="#8892b0" font-size="9">60</text>
  <text x="620" y="428" text-anchor="middle" fill="#8892b0" font-size="9">80</text>
  <text x="750" y="428" text-anchor="middle" fill="#8892b0" font-size="9">100</text>

  <!-- Zone labels below bar -->
  <!-- Zone 1: 0-20 (ZERO-KILL) -->
  <rect x="100" y="464" width="130" height="46" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="165" y="480" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="700">ZERO-KILL</text>
  <text x="165" y="494" text-anchor="middle" fill="#ff6b6b" font-size="9">mult = 0.00</text>
  <text x="165" y="506" text-anchor="middle" fill="#8892b0" font-size="8">size = 0 in CSV</text>

  <!-- Zone 2: 20-40 (Reduced) -->
  <rect x="235" y="464" width="120" height="46" rx="4" fill="#2a2a1a" stroke="#F7B32B" stroke-width="1"/>
  <text x="295" y="480" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="700">REDUCED</text>
  <text x="295" y="494" text-anchor="middle" fill="#F7B32B" font-size="9">mult = 0.20-0.40</text>
  <text x="295" y="506" text-anchor="middle" fill="#8892b0" font-size="8">recovery zone</text>

  <!-- Zone 3: 40-60 (Cautious) -->
  <rect x="365" y="464" width="120" height="46" rx="4" fill="#2a2a1a" stroke="#FFD54F" stroke-width="1"/>
  <text x="425" y="480" text-anchor="middle" fill="#FFD54F" font-size="10" font-weight="700">CAUTIOUS</text>
  <text x="425" y="494" text-anchor="middle" fill="#FFD54F" font-size="9">mult = 0.40-0.60</text>
  <text x="425" y="506" text-anchor="middle" fill="#8892b0" font-size="8">gaining trust</text>

  <!-- Zone 4: 60-80 (Normal) -->
  <rect x="495" y="464" width="120" height="46" rx="4" fill="#1a2a3a" stroke="#64ffda" stroke-width="1"/>
  <text x="555" y="480" text-anchor="middle" fill="#64ffda" font-size="10" font-weight="700">NORMAL</text>
  <text x="555" y="494" text-anchor="middle" fill="#64ffda" font-size="9">mult = 0.60-0.80</text>
  <text x="555" y="506" text-anchor="middle" fill="#8892b0" font-size="8">standard ops</text>

  <!-- Zone 5: 80-100 (Full Trust) -->
  <rect x="625" y="464" width="125" height="46" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="688" y="480" text-anchor="middle" fill="#4ADE80" font-size="10" font-weight="700">FULL TRUST</text>
  <text x="688" y="494" text-anchor="middle" fill="#4ADE80" font-size="9">mult = 0.80-1.00</text>
  <text x="688" y="506" text-anchor="middle" fill="#8892b0" font-size="8">max allocation</text>

  <!-- Arrow down from CSI Scale -->
  <line x1="425" y1="524" x2="425" y2="550" stroke="#F7B32B" stroke-width="2" marker-end="url(#acArrDown)"/>

  <!-- ===== PAPER CSI BLENDING (side panel) ===== -->
  <rect x="60" y="558" width="350" height="142" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.5" filter="url(#acShadow)"/>
  <rect x="60" y="558" width="350" height="24" rx="6" fill="#64ffda" fill-opacity="0.1"/>
  <text x="235" y="574" text-anchor="middle" fill="#64ffda" font-size="12" font-weight="700">Paper CSI Blending</text>
  <text x="235" y="592" text-anchor="middle" fill="#8892b0" font-size="9">Strategies with &lt; 30 live trades get paper data blended in</text>

  <!-- Paper blending details -->
  <rect x="78" y="602" width="155" height="28" rx="4" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="155" y="614" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">Discount: 0.50</text>
  <text x="155" y="626" text-anchor="middle" fill="#8892b0" font-size="8">1 paper = 0.5 real trade</text>

  <rect x="240" y="602" width="155" height="28" rx="4" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="318" y="614" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">Weight Cap: 40%</text>
  <text x="318" y="626" text-anchor="middle" fill="#8892b0" font-size="8">max paper blend ratio</text>

  <!-- Guard rails -->
  <rect x="78" y="638" width="155" height="28" rx="4" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="155" y="650" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="600">CSI Cap: 50</text>
  <text x="155" y="662" text-anchor="middle" fill="#8892b0" font-size="8">max when paper-blended</text>

  <rect x="240" y="638" width="155" height="28" rx="4" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="318" y="650" text-anchor="middle" fill="#64ffda" font-size="10" font-weight="600">Min Trades: 3</text>
  <text x="318" y="662" text-anchor="middle" fill="#8892b0" font-size="8">min paper to contribute</text>

  <!-- Formula -->
  <rect x="78" y="674" width="317" height="18" rx="3" fill="#0a192f" stroke="#F7B32B" stroke-width="0.8"/>
  <text x="235" y="687" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="600">n_effective = n_live + n_paper x 0.50</text>

  <!-- ===== TRACK RECORD (side panel right) ===== -->
  <rect x="440" y="558" width="350" height="142" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#acShadow)"/>
  <rect x="440" y="558" width="350" height="24" rx="6" fill="#ff6b6b" fill-opacity="0.1"/>
  <text x="615" y="574" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">Track Record &amp; Penalties</text>
  <text x="615" y="592" text-anchor="middle" fill="#8892b0" font-size="9">30d rolling win rate per pair, pair-level kill switch</text>

  <!-- Track record details -->
  <rect x="458" y="602" width="155" height="36" rx="4" fill="#0a192f" stroke="#4ADE80" stroke-width="1"/>
  <text x="535" y="617" text-anchor="middle" fill="#4ADE80" font-size="10" font-weight="600">Win Rate >= 35%</text>
  <text x="535" y="631" text-anchor="middle" fill="#8892b0" font-size="9">Normal operation</text>

  <rect x="620" y="602" width="155" height="36" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="697" y="617" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="600">Win Rate &lt; 35%</text>
  <text x="697" y="631" text-anchor="middle" fill="#ff6b6b" font-size="9">TRACK PENALTY</text>

  <!-- Kill description -->
  <rect x="458" y="648" width="317" height="42" rx="4" fill="#0a192f" stroke="#ff6b6b" stroke-width="0.8"/>
  <text x="616" y="664" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="700">Track Penalty = sizing forced to 0</text>
  <text x="616" y="678" text-anchor="middle" fill="#8892b0" font-size="9">Independent of CSI score -- hard override per pair</text>

  <!-- ===== CORRELATION MATRIX (middle panel) ===== -->
  <rect x="60" y="714" width="730" height="100" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#acShadow)"/>
  <rect x="60" y="714" width="730" height="24" rx="6" fill="#F7B32B" fill-opacity="0.12"/>
  <text x="425" y="731" text-anchor="middle" fill="#F7B32B" font-size="13" font-weight="700">Correlation Matrix &amp; Risk of Ruin</text>

  <!-- Correlation details -->
  <rect x="80" y="748" width="220" height="52" rx="4" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="190" y="766" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">Inter-Strategy Correlation</text>
  <text x="190" y="782" text-anchor="middle" fill="#8892b0" font-size="9">Pairwise return correlation matrix</text>
  <text x="190" y="794" text-anchor="middle" fill="#8892b0" font-size="9">across all 32 MCPT strategies</text>

  <rect x="315" y="748" width="220" height="52" rx="4" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="425" y="766" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">Monte Carlo Risk of Ruin</text>
  <text x="425" y="782" text-anchor="middle" fill="#8892b0" font-size="9">Simulated portfolio drawdown paths</text>
  <text x="425" y="794" text-anchor="middle" fill="#8892b0" font-size="9">probability of catastrophic loss</text>

  <rect x="550" y="748" width="220" height="52" rx="4" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="660" y="766" text-anchor="middle" fill="#ccd6f6" font-size="11" font-weight="600">Concentration Guard</text>
  <text x="660" y="782" text-anchor="middle" fill="#8892b0" font-size="9">Highly correlated strategies</text>
  <text x="660" y="794" text-anchor="middle" fill="#8892b0" font-size="9">get sizing reduced together</text>

  <!-- Arrow down -->
  <line x1="425" y1="814" x2="425" y2="840" stroke="#F7B32B" stroke-width="2" marker-end="url(#acArrDown)"/>

  <!-- ===== MULTIPLIER APPLICATION ===== -->
  <rect x="160" y="848" width="530" height="72" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.5" filter="url(#acShadow)"/>
  <rect x="160" y="848" width="530" height="24" rx="6" fill="#64ffda" fill-opacity="0.1"/>
  <text x="425" y="865" text-anchor="middle" fill="#64ffda" font-size="13" font-weight="700">Multiplier Application</text>

  <!-- Formula -->
  <rect x="180" y="880" width="490" height="28" rx="4" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="425" y="899" text-anchor="middle" fill="#ccd6f6" font-size="12">final_size = <tspan fill="#F7B32B" font-weight="600">kelly_size</tspan> x <tspan fill="#64ffda" font-weight="600">CSI_mult</tspan> x <tspan fill="#ff6b6b" font-weight="600">track_penalty</tspan> x <tspan fill="#4ADE80" font-weight="600">corr_adj</tspan></text>

  <!-- Arrow down to output -->
  <line x1="425" y1="920" x2="425" y2="946" stroke="#64ffda" stroke-width="2" marker-end="url(#acArrDownTeal)"/>

  <!-- ===== OUTPUT ===== -->
  <rect x="250" y="952" width="350" height="48" rx="24" fill="#112240" stroke="#64ffda" stroke-width="2" filter="url(#acShadow)"/>
  <text x="425" y="971" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="600">OUTPUT</text>
  <text x="425" y="989" text-anchor="middle" fill="#ccd6f6" font-size="13" font-weight="700">strategies_auth_simple.csv (MP_tgt)</text>

  <!-- ===== SIDE ANNOTATION: Zero-Kill callout ===== -->
  <rect x="20" y="430" width="30" height="88" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="35" y="455" text-anchor="middle" fill="#ff6b6b" font-size="18">&#9888;</text>
  <text x="35" y="475" text-anchor="middle" fill="#ff6b6b" font-size="7" font-weight="700" transform="rotate(-90, 35, 490)">ZERO-KILL</text>

  <!-- ===== Connection: Paper blending feeds into multiplier ===== -->
  <path d="M235,700 L235,710 Q235,720 245,720 L415,720 Q425,720 425,730 L425,740" fill="none" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== Connection: Track record feeds into multiplier ===== -->
  <path d="M615,700 L615,710 Q615,720 605,720 L435,720 Q425,720 425,730 L425,740" fill="none" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>

</svg>