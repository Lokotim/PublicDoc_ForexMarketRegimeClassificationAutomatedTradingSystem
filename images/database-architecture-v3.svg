<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="850" height="400" fill="url(#bg)" rx="12"/>

  <text x="425" y="28" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#E2E8F0">THREE-DATABASE NORMALIZATION: Non-Circular Write Authority</text>

  <!-- DB 1: forex_sentiment.db -->
  <ellipse cx="145" cy="90" rx="95" ry="18" fill="#1A2A3A" stroke="#00D4FF" stroke-width="1.5"/>
  <rect x="50" y="90" width="190" height="100" fill="#1A2A3A" stroke="#00D4FF" stroke-width="1.5"/>
  <ellipse cx="145" cy="190" rx="95" ry="18" fill="#1A2A3A" stroke="#00D4FF" stroke-width="1.5"/>
  <ellipse cx="145" cy="90" rx="95" ry="18" fill="#162032" stroke="#00D4FF" stroke-width="1.5"/>
  <text x="145" y="95" text-anchor="middle" font-family="Consolas" font-size="11" font-weight="bold" fill="#00D4FF">forex_sentiment.db</text>
  <text x="145" y="120" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">sentiment_hourly, theory_scores</text>
  <text x="145" y="133" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">ml_classifications, meta_signals</text>
  <text x="145" y="146" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">macro_data, macro_composite</text>
  <text x="145" y="159" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">forecast_4day, rl_experiences</text>
  <text x="145" y="175" text-anchor="middle" font-family="Consolas" font-size="8" fill="#64748B">29+ tables</text>

  <!-- DB 2: forexregime.db -->
  <ellipse cx="425" cy="90" rx="95" ry="18" fill="#1A2520" stroke="#4ADE80" stroke-width="1.5"/>
  <rect x="330" y="90" width="190" height="100" fill="#1A2520" stroke="#4ADE80" stroke-width="1.5"/>
  <ellipse cx="425" cy="190" rx="95" ry="18" fill="#1A2520" stroke="#4ADE80" stroke-width="1.5"/>
  <ellipse cx="425" cy="90" rx="95" ry="18" fill="#162520" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="425" y="95" text-anchor="middle" font-family="Consolas" font-size="11" font-weight="bold" fill="#4ADE80">forexregime.db</text>
  <text x="425" y="120" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">ohlc_bars, ibkr_positions</text>
  <text x="425" y="133" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">cross_asset_vol, macro_regime</text>
  <text x="425" y="146" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">pipeline_diagnostics</text>
  <text x="425" y="175" text-anchor="middle" font-family="Consolas" font-size="8" fill="#64748B">12+ tables</text>

  <!-- DB 3: risk_management.db -->
  <ellipse cx="705" cy="90" rx="95" ry="18" fill="#1A1530" stroke="#E879F9" stroke-width="1.5"/>
  <rect x="610" y="90" width="190" height="100" fill="#1A1530" stroke="#E879F9" stroke-width="1.5"/>
  <ellipse cx="705" cy="190" rx="95" ry="18" fill="#1A1530" stroke="#E879F9" stroke-width="1.5"/>
  <ellipse cx="705" cy="90" rx="95" ry="18" fill="#161530" stroke="#E879F9" stroke-width="1.5"/>
  <text x="705" y="95" text-anchor="middle" font-family="Consolas" font-size="11" font-weight="bold" fill="#E879F9">risk_management.db</text>
  <text x="705" y="120" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">ibkr_account_metrics</text>
  <text x="705" y="133" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">daily_pnl_tracking, atr_data</text>
  <text x="705" y="146" text-anchor="middle" font-family="Consolas" font-size="8" fill="#94A3B8">pnl_realized, rl_pnl_snapshots</text>
  <text x="705" y="175" text-anchor="middle" font-family="Consolas" font-size="8" fill="#64748B">8+ tables</text>

  <!-- Writers section -->
  <text x="60" y="230" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#FFD54F">WRITERS</text>
  <rect x="50" y="240" width="190" height="65" rx="4" fill="#162032" stroke="#334155" stroke-width="0.5"/>
  <text x="145" y="256" text-anchor="middle" font-family="Consolas" font-size="8" fill="#00D4FF">Scrapers (19 sources)</text>
  <text x="145" y="270" text-anchor="middle" font-family="Consolas" font-size="8" fill="#00D4FF">ML Ensemble</text>
  <text x="145" y="284" text-anchor="middle" font-family="Consolas" font-size="8" fill="#00D4FF">Meta-Signal Resolver</text>
  <text x="145" y="298" text-anchor="middle" font-family="Consolas" font-size="8" fill="#00D4FF">Macro Composite</text>

  <rect x="330" y="240" width="190" height="65" rx="4" fill="#162520" stroke="#334155" stroke-width="0.5"/>
  <text x="425" y="256" text-anchor="middle" font-family="Consolas" font-size="8" fill="#4ADE80">Pipeline Orchestrator</text>
  <text x="425" y="270" text-anchor="middle" font-family="Consolas" font-size="8" fill="#4ADE80">IV Regime Step</text>
  <text x="425" y="284" text-anchor="middle" font-family="Consolas" font-size="8" fill="#4ADE80">Cross-Asset Vol</text>
  <text x="425" y="298" text-anchor="middle" font-family="Consolas" font-size="8" fill="#4ADE80">Macro Regime</text>

  <rect x="610" y="240" width="190" height="65" rx="4" fill="#161530" stroke="#334155" stroke-width="0.5"/>
  <text x="705" y="256" text-anchor="middle" font-family="Consolas" font-size="8" fill="#E879F9">RME Step</text>
  <text x="705" y="270" text-anchor="middle" font-family="Consolas" font-size="8" fill="#E879F9">PnL Tracker</text>
  <text x="705" y="284" text-anchor="middle" font-family="Consolas" font-size="8" fill="#E879F9">ATR Computation</text>

  <!-- Write arrows (down) -->
  <line x1="145" y1="210" x2="145" y2="238" stroke="#00D4FF" stroke-width="1" stroke-linecap="round" marker-end="url(#arrowCyan)"/>
  <line x1="425" y1="210" x2="425" y2="238" stroke="#4ADE80" stroke-width="1" stroke-linecap="round"/>
  <line x1="705" y1="210" x2="705" y2="238" stroke="#E879F9" stroke-width="1" stroke-linecap="round"/>

  <!-- Cross-read arrows -->
  <text x="425" y="340" text-anchor="middle" font-family="Segoe UI" font-size="10" font-weight="bold" fill="#FFD54F">READS (cross-database)</text>

  <!-- Read arrows (horizontal, dashed) -->
  <line x1="245" y1="355" x2="325" y2="355" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="285" y="350" text-anchor="middle" font-family="Consolas" font-size="7" fill="#94A3B8">ML reads</text>

  <line x1="525" y1="355" x2="605" y2="355" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="565" y="350" text-anchor="middle" font-family="Consolas" font-size="7" fill="#94A3B8">RME reads</text>

  <line x1="245" y1="370" x2="605" y2="370" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="425" y="365" text-anchor="middle" font-family="Consolas" font-size="7" fill="#94A3B8">Sizing reads all 3</text>

  <!-- Rule box -->
  <rect x="200" y="383" width="450" height="14" rx="3" fill="#1A1520" stroke="#F87171" stroke-width="0.5"/>
  <text x="425" y="394" text-anchor="middle" font-family="Consolas" font-size="9" fill="#F87171">RULE: Each component writes to exactly ONE database, reads from MANY</text>
</svg>