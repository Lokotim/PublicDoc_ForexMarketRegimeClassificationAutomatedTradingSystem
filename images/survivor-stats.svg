<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD54F" flood-opacity="0.4"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="bigGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFD54F" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00D4FF" flood-opacity="0.3"/>
    </filter>
    <filter id="purpleGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#E879F9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="850" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="425" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#FFD54F" filter="url(#glow)">Final Verdict: Aggregate Survivor Statistics</text>

  <!-- LEFT: Big number 32 -->
  <g transform="translate(30, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="290" rx="12" fill="#0F172A" stroke="#FFD54F" stroke-width="1.5" opacity="0.8"/>

    <!-- Ring decoration -->
    <circle cx="100" cy="110" r="70" fill="none" stroke="url(#goldRing)" stroke-width="3" opacity="0.3"/>
    <circle cx="100" cy="110" r="55" fill="none" stroke="url(#goldRing)" stroke-width="1.5" opacity="0.2"/>

    <!-- Big number -->
    <text x="100" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="72" font-weight="bold" fill="#FFD54F" filter="url(#bigGlow)">32</text>
    <text x="100" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#94A3B8">survivors</text>

    <!-- Sub stats -->
    <line x1="30" y1="185" x2="170" y2="185" stroke="#334155" stroke-width="1"/>
    <text x="100" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3B82F6">16 Long</text>
    <text x="100" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#F87171">16 Short</text>
    <text x="100" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#E879F9">16 Trend Following</text>
    <text x="100" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#00D4FF">16 Mean Reversion</text>
  </g>

  <!-- CENTER: Key stats vertical list -->
  <g transform="translate(270, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="290" rx="12" fill="#0F172A" stroke="#00D4FF" stroke-width="1" opacity="0.8"/>

    <text x="130" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#00D4FF">Key Performance Metrics</text>
    <line x1="20" y1="38" x2="240" y2="38" stroke="#334155" stroke-width="1"/>

    <!-- Stat rows -->
    <!-- Profit Factor -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="220" height="44" rx="6" fill="#1E293B" opacity="0.5"/>
      <text x="10" y="18" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Profit Factor</text>
      <text x="10" y="36" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#4ADE80">1.48</text>
      <text x="70" y="36" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B">avg</text>
      <!-- Mini bar -->
      <rect x="120" y="22" width="90" height="8" rx="3" fill="#334155"/>
      <rect x="120" y="22" width="67" height="8" rx="3" fill="#4ADE80" opacity="0.6"/>
    </g>

    <!-- OOS Win Rate -->
    <g transform="translate(20, 104)">
      <rect x="0" y="0" width="220" height="44" rx="6" fill="#1E293B" opacity="0.5"/>
      <text x="10" y="18" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">OOS Win Rate</text>
      <text x="10" y="36" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#4ADE80">76%</text>
      <rect x="120" y="22" width="90" height="8" rx="3" fill="#334155"/>
      <rect x="120" y="22" width="68" height="8" rx="3" fill="#4ADE80" opacity="0.6"/>
    </g>

    <!-- Max DD -->
    <g transform="translate(20, 158)">
      <rect x="0" y="0" width="220" height="44" rx="6" fill="#1E293B" opacity="0.5"/>
      <text x="10" y="18" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Max Drawdown</text>
      <text x="10" y="36" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#FBBF24">8.2%</text>
      <rect x="120" y="22" width="90" height="8" rx="3" fill="#334155"/>
      <rect x="120" y="22" width="18" height="8" rx="3" fill="#FBBF24" opacity="0.6"/>
    </g>

    <!-- Trades/Mo -->
    <g transform="translate(20, 212)">
      <rect x="0" y="0" width="220" height="44" rx="6" fill="#1E293B" opacity="0.5"/>
      <text x="10" y="18" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Trades per Month</text>
      <text x="10" y="36" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#00D4FF">8.4</text>
      <rect x="120" y="22" width="90" height="8" rx="3" fill="#334155"/>
      <rect x="120" y="22" width="38" height="8" rx="3" fill="#00D4FF" opacity="0.6"/>
    </g>
  </g>

  <!-- RIGHT: Compound probability -->
  <g transform="translate(570, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="290" rx="12" fill="url(#purpleCard)" stroke="#E879F9" stroke-width="1" opacity="0.9"/>

    <text x="125" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#E879F9">Compound Probability</text>
    <line x1="20" y1="38" x2="230" y2="38" stroke="#334155" stroke-width="1"/>

    <!-- Formula label -->
    <text x="125" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Probability of surviving all gates</text>
    <text x="125" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">by pure chance alone:</text>

    <!-- Formula box -->
    <rect x="20" y="100" width="210" height="60" rx="8" fill="#0F172A" stroke="#E879F9" stroke-width="0.5" opacity="0.6"/>

    <!-- P = formula -->
    <text x="125" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#94A3B8">P(luck) =</text>
    <text x="125" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#E879F9" filter="url(#purpleGlow)">3.2 x 10</text>
    <text x="203" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#E879F9">-6</text>

    <!-- Interpretation -->
    <line x1="40" y1="180" x2="210" y2="180" stroke="#E879F9" stroke-width="0.5" opacity="0.4"/>

    <text x="125" y="205" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">That is approximately</text>

    <!-- Big odds number -->
    <rect x="30" y="215" width="190" height="40" rx="8" fill="#0F172A" stroke="#FFD54F" stroke-width="1" opacity="0.5"/>
    <text x="125" y="241" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#FFD54F" filter="url(#glow)">1 in 312,500</text>

    <!-- Conclusion -->
    <text x="125" y="275" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#4ADE80">Not luck. Systematic edge.</text>
  </g>

  <!-- Bottom bar -->
  <rect x="30" y="370" width="790" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="425" y="387" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">Walk-forward validated | Parameter-permuted | Multi-market tested | Slippage-adjusted</text>
</svg>