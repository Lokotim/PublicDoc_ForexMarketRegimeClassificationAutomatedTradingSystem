  <text x="530" y="384" text-anchor="middle" fill="#F7B32B" font-size="10" font-weight="600">15-min cooldown</text>
  <text x="625" y="384" fill="#8892b0" font-size="9">(anti-spam)</text>

  <!-- Alert types -->
  <rect x="450" y="400" width="365" height="116" rx="5" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
  <text x="460" y="418" fill="#8892b0" font-size="9" font-weight="600">ALERT TYPES:</text>

  <rect x="462" y="426" width="14" height="14" rx="2" fill="#ff6b6b" fill-opacity="0.3" stroke="#ff6b6b" stroke-width="0.8"/>
  <text x="469" y="437" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="700">!</text>
