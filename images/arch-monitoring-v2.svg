  <rect x="462" y="448" width="14" height="14" rx="2" fill="#F7B32B" fill-opacity="0.3" stroke="#F7B32B" stroke-width="0.8"/>
  <text x="469" y="459" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="700">$</text>
  <text x="484" y="459" fill="#ccd6f6" font-size="9">Drawdown alerts (threshold breach)</text>

  <rect x="462" y="470" width="14" height="14" rx="2" fill="#64ffda" fill-opacity="0.3" stroke="#64ffda" stroke-width="0.8"/>
  <text x="469" y="481" text-anchor="middle" fill="#64ffda" font-size="9" font-weight="700">&#10003;</text>
  <text x="484" y="481" fill="#ccd6f6" font-size="9">CSV ready confirmations</text>

  <rect x="462" y="492" width="14" height="14" rx="2" fill="#8892b0" fill-opacity="0.3" stroke="#8892b0" stroke-width="0.8"/>
  <text x="469" y="503" text-anchor="middle" fill="#8892b0" font-size="9" font-weight="700">i</text>
  <text x="484" y="503" fill="#ccd6f6" font-size="9">Position mismatch warnings</text>
