<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arUp" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64ffda"/>
    </marker>
    <marker id="arUpG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F7B32B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="720" rx="8" fill="#0a192f"/>

  <!-- Title -->
