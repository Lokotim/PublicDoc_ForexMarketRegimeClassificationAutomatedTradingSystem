    <text x="27" y="15" text-anchor="middle" fill="#4ADE80" font-size="10" font-weight="700">OK</text>

    <rect x="65" y="0" width="65" height="22" rx="4" fill="#F7B32B" fill-opacity="0.15" stroke="#F7B32B" stroke-width="1"/>
