  <ellipse cx="315" cy="618" rx="60" ry="8" fill="#64ffda" fill-opacity="0.15" stroke="#64ffda" stroke-width="1"/>
  <text x="315" y="622" text-anchor="middle" fill="#64ffda" font-size="8" font-weight="600">DB</text>
  <text x="315" y="645" text-anchor="middle" fill="#ccd6f6" font-size="10" font-weight="600">forexregime.db</text>
  <text x="315" y="660" text-anchor="middle" fill="#8892b0" font-size="9">2 MB | 8 tables</text>
  <text x="315" y="675" text-anchor="middle" fill="#64ffda" font-size="8">IBKR, OHLC, FX</text>

  <!-- DB3 -->
  <rect x="420" y="608" width="170" height="72" rx="6" fill="#0a192f" stroke="#ff6b6b" stroke-width="1.5"/>
  <ellipse cx="505" cy="618" rx="60" ry="8" fill="#ff6b6b" fill-opacity="0.15" stroke="#ff6b6b" stroke-width="1"/>
