  <rect x="435" y="308" width="395" height="30" rx="8" fill="#ff6b6b" fill-opacity="0.1"/>
  <text x="632" y="329" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="700">Discord Alerts</text>

  <text x="455" y="356" fill="#ccd6f6" font-size="11" font-weight="600">Intelligent alerting system</text>

  <!-- Anti-spam -->
