  <text x="58" y="231" fill="#ccd6f6" font-size="9">Position reconciliation</text>

  <rect x="220" y="215" width="180" height="24" rx="4" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
  <circle cx="233" cy="227" r="4" fill="#ff6b6b"/>
  <text x="243" y="231" fill="#ccd6f6" font-size="9">Circuit breaker status</text>

  <rect x="35" y="245" width="180" height="24" rx="4" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
