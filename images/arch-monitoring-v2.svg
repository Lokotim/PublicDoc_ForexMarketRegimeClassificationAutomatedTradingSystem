    <rect x="282" y="28" width="88" height="22" rx="3" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
    <text x="326" y="43" text-anchor="middle" fill="#ccd6f6" font-size="8">RL Performance</text>

    <rect x="0" y="56" width="88" height="22" rx="3" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
    <text x="44" y="71" text-anchor="middle" fill="#ccd6f6" font-size="8">Exposure Map</text>

    <rect x="94" y="56" width="88" height="22" rx="3" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
    <text x="138" y="71" text-anchor="middle" fill="#ccd6f6" font-size="8">ATR Analysis</text>

    <rect x="188" y="56" width="88" height="22" rx="3" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
    <text x="232" y="71" text-anchor="middle" fill="#ccd6f6" font-size="8">Scraper Health</text>

    <rect x="282" y="56" width="88" height="22" rx="3" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
    <text x="326" y="71" text-anchor="middle" fill="#ccd6f6" font-size="8">+ 8 more...</text>
