    <rect x="94" y="28" width="88" height="22" rx="3" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
    <text x="138" y="43" text-anchor="middle" fill="#ccd6f6" font-size="8">Drawdown</text>

    <rect x="188" y="28" width="88" height="22" rx="3" fill="#0a192f" stroke="#233554" stroke-width="0.8"/>
