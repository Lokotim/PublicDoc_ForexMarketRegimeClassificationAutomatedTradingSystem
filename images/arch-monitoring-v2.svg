  <!-- ========== DATA SOURCES (Bottom strip) ========== -->
  <rect x="20" y="570" width="810" height="130" rx="8" fill="#112240" stroke="#233554" stroke-width="1.5" filter="url(#shadow4)"/>
  <text x="425" y="594" text-anchor="middle" fill="#8892b0" font-size="12" font-weight="600">DATA SOURCES</text>

  <!-- DB1 -->
  <rect x="40" y="608" width="170" height="72" rx="6" fill="#0a192f" stroke="#F7B32B" stroke-width="1.5"/>
  <ellipse cx="125" cy="618" rx="60" ry="8" fill="#F7B32B" fill-opacity="0.15" stroke="#F7B32B" stroke-width="1"/>
  <text x="125" y="622" text-anchor="middle" fill="#F7B32B" font-size="8" font-weight="600">DB</text>
  <text x="125" y="645" text-anchor="middle" fill="#ccd6f6" font-size="10" font-weight="600">forex_sentiment.db</text>
  <text x="125" y="660" text-anchor="middle" fill="#8892b0" font-size="9">831 MB | 29+ tables</text>
  <text x="125" y="675" text-anchor="middle" fill="#F7B32B" font-size="8">Signals, ML, RL</text>

  <!-- DB2 -->
