  <text x="500" y="48" text-anchor="middle" fill="#607D8B" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.5">15 DATA SOURCES IN 58 SECONDS</text>

  <!-- Central Hub -->
