    <circle cx="500" cy="215" r="42" fill="none" stroke="#37474F" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    <text x="500" y="210" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">UNIFIED</text>
