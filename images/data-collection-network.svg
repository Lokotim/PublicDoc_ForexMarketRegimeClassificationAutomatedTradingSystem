<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1e3a4f"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle radial lines from center -->
  <g opacity="0.03" stroke="#ffffff">
    <line x1="500" y1="215" x2="0" y2="0"/>
    <line x1="500" y1="215" x2="1000" y2="0"/>
    <line x1="500" y1="215" x2="0" y2="450"/>
    <line x1="500" y1="215" x2="1000" y2="450"/>
    <line x1="500" y1="215" x2="0" y2="215"/>
    <line x1="500" y1="215" x2="1000" y2="215"/>
    <line x1="500" y1="215" x2="500" y2="0"/>
    <line x1="500" y1="215" x2="500" y2="450"/>
  </g>

  <!-- Title -->
