<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow3" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F7B32B" stop-opacity="0.15"/>
    </linearGradient>
    <marker id="arr3Down" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#F7B32B"/>
    </marker>
    <marker id="arr3DownGreen" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#64ffda"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="1100" rx="8" fill="#0a192f"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" fill="url(#goldGrad3)" font-size="20" font-weight="700" letter-spacing="0.5">Position Sizing: Kelly Criterion Cascade</text>
  <line x1="200" y1="50" x2="650" y2="50" stroke="#233554" stroke-width="1"/>

  <!-- ===== FUNNEL BACKGROUND ===== -->
  <polygon points="200,80 650,80 610,1040 240,1040" fill="url(#funnelGrad)" opacity="0.4"/>

  <!-- ===== INPUT: Account Equity ===== -->
  <rect x="275" y="68" width="300" height="48" rx="24" fill="#112240" stroke="#64ffda" stroke-width="2" filter="url(#shadow3)"/>
  <text x="425" y="87" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="600">INPUT</text>
  <text x="425" y="105" text-anchor="middle" fill="#ccd6f6" font-size="13" font-weight="700">Account Equity</text>

  <!-- Arrow -->
  <line x1="425" y1="116" x2="425" y2="140" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr3Down)"/>

  <!-- ===== LAYER 1: Kelly Formula ===== -->
  <rect x="120" y="148" width="610" height="96" rx="6" fill="#112240" stroke="#64ffda" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="120" y="148" width="36" height="96" rx="6" fill="#64ffda"/>
  <rect x="142" y="148" width="14" height="96" fill="#112240"/>
  <text x="138" y="204" text-anchor="middle" fill="#0a192f" font-size="16" font-weight="700" transform="rotate(-90, 138, 204)">L1</text>

  <text x="445" y="172" text-anchor="middle" fill="#64ffda" font-size="14" font-weight="700">Kelly Criterion</text>

  <rect x="200" y="182" width="240" height="44" rx="4" fill="#0a192f" stroke="#F7B32B" stroke-width="1"/>
  <text x="320" y="202" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="600">f* = (bp - q) / b</text>
  <text x="320" y="218" text-anchor="middle" fill="#8892b0" font-size="10">b=odds, p=win prob, q=1-p</text>

  <rect x="470" y="182" width="240" height="44" rx="4" fill="#0a192f" stroke="#4ADE80" stroke-width="1"/>
  <text x="590" y="202" text-anchor="middle" fill="#4ADE80" font-size="14" font-weight="600">Half-Kelly: f* × 0.50</text>
  <text x="590" y="218" text-anchor="middle" fill="#8892b0" font-size="10">Conservative: half optimal size</text>

  <!-- Arrow -->
  <line x1="425" y1="244" x2="425" y2="268" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr3Down)"/>

  <!-- ===== LAYER 2: ATR Risk Sizing ===== -->
  <rect x="130" y="276" width="590" height="96" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="130" y="276" width="36" height="96" rx="6" fill="#F7B32B"/>
  <rect x="152" y="276" width="14" height="96" fill="#112240"/>
  <text x="148" y="332" text-anchor="middle" fill="#0a192f" font-size="16" font-weight="700" transform="rotate(-90, 148, 332)">L2</text>

  <text x="445" y="300" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="700">ATR Risk Sizing</text>

  <rect x="200" y="310" width="460" height="44" rx="4" fill="#0a192f" stroke="#233554" stroke-width="1"/>
  <text x="430" y="330" text-anchor="middle" fill="#ccd6f6" font-size="13">units = <tspan fill="#F7B32B" font-weight="600">2% equity</tspan> / ( <tspan fill="#64ffda">ATR × 2.0</tspan> × pip_value )</text>
  <text x="430" y="348" text-anchor="middle" fill="#8892b0" font-size="10">Volatility-adjusted position sizing using 14-period ATR</text>

  <!-- Arrow -->
  <line x1="425" y1="372" x2="425" y2="396" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr3Down)"/>

  <!-- ===== LAYER 3: IV Filter ===== -->
  <rect x="145" y="404" width="560" height="80" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="145" y="404" width="36" height="80" rx="6" fill="#ff6b6b"/>
  <rect x="167" y="404" width="14" height="80" fill="#112240"/>
  <text x="163" y="450" text-anchor="middle" fill="#0a192f" font-size="16" font-weight="700" transform="rotate(-90, 163, 450)">L3</text>

  <text x="445" y="428" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="700">IV Filter (Implied Volatility)</text>

  <rect x="230" y="440" width="180" height="32" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="320" y="461" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700">PASS = 1.0</text>

  <rect x="440" y="440" width="180" height="32" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="530" y="461" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">REJECT = 0.0</text>

  <!-- Arrow -->
  <line x1="425" y1="484" x2="425" y2="508" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr3Down)"/>

  <!-- ===== LAYER 4: Circuit Breaker ===== -->
  <rect x="160" y="516" width="530" height="80" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="160" y="516" width="36" height="80" rx="6" fill="#ff6b6b"/>
  <rect x="182" y="516" width="14" height="80" fill="#112240"/>
  <text x="178" y="562" text-anchor="middle" fill="#0a192f" font-size="16" font-weight="700" transform="rotate(-90, 178, 562)">L4</text>

  <text x="450" y="540" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="700">Circuit Breaker</text>

  <rect x="220" y="552" width="120" height="30" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="280" y="572" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">HALT: 0.0</text>

  <rect x="360" y="552" width="140" height="30" rx="4" fill="#2a2a1a" stroke="#FFD54F" stroke-width="1"/>
  <text x="430" y="572" text-anchor="middle" fill="#FFD54F" font-size="12" font-weight="700">REDUCED: 0.75</text>

  <rect x="520" y="552" width="130" height="30" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="585" y="572" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700">NORMAL: 1.0</text>

  <!-- Arrow -->
  <line x1="425" y1="596" x2="425" y2="620" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr3Down)"/>

  <!-- ===== LAYER 5: Crowding Filter ===== -->
  <rect x="175" y="628" width="500" height="80" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="175" y="628" width="36" height="80" rx="6" fill="#F7B32B"/>
  <rect x="197" y="628" width="14" height="80" fill="#112240"/>
  <text x="193" y="674" text-anchor="middle" fill="#0a192f" font-size="16" font-weight="700" transform="rotate(-90, 193, 674)">L5</text>

  <text x="450" y="652" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="700">Crowding Filter</text>

  <rect x="260" y="664" width="180" height="32" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="350" y="685" text-anchor="middle" fill="#4ADE80" font-size="12" font-weight="700">PASS = 1.0</text>

  <rect x="460" y="664" width="180" height="32" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="550" y="685" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">CROWDED = 0.0</text>

  <!-- Arrow -->
  <line x1="425" y1="708" x2="425" y2="732" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr3Down)"/>

  <!-- ===== LAYER 6: CSI Multiplier ===== -->
  <rect x="185" y="740" width="480" height="80" rx="6" fill="#112240" stroke="#F7B32B" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="185" y="740" width="36" height="80" rx="6" fill="#F7B32B"/>
  <rect x="207" y="740" width="14" height="80" fill="#112240"/>
  <text x="203" y="786" text-anchor="middle" fill="#0a192f" font-size="16" font-weight="700" transform="rotate(-90, 203, 786)">L6</text>

  <text x="450" y="758" text-anchor="middle" fill="#F7B32B" font-size="14" font-weight="700">CSI v2.1 Multiplier (6-Tier Graduated)</text>

  <rect x="230" y="768" width="65" height="28" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="262" y="786" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="700">&lt;10: 0.0</text>

  <rect x="300" y="768" width="70" height="28" rx="4" fill="#3a1a1a" stroke="#ff8c42" stroke-width="1"/>
  <text x="335" y="786" text-anchor="middle" fill="#ff8c42" font-size="9" font-weight="700">10+: 0.10</text>

  <rect x="375" y="768" width="70" height="28" rx="4" fill="#2a2a1a" stroke="#FFD54F" stroke-width="1"/>
  <text x="410" y="786" text-anchor="middle" fill="#FFD54F" font-size="9" font-weight="700">20+: 0.25</text>

  <rect x="450" y="768" width="70" height="28" rx="4" fill="#2a2a1a" stroke="#eab308" stroke-width="1"/>
  <text x="485" y="786" text-anchor="middle" fill="#eab308" font-size="9" font-weight="700">40+: 0.50</text>

  <rect x="525" y="768" width="70" height="28" rx="4" fill="#1a3a2a" stroke="#22c55e" stroke-width="1"/>
  <text x="560" y="786" text-anchor="middle" fill="#22c55e" font-size="9" font-weight="700">60+: 0.75</text>

  <rect x="600" y="768" width="70" height="28" rx="4" fill="#1a3a2a" stroke="#4ADE80" stroke-width="1"/>
  <text x="635" y="786" text-anchor="middle" fill="#4ADE80" font-size="9" font-weight="700">80+: 1.00</text>

  <text x="450" y="810" text-anchor="middle" fill="#8892b0" font-size="9">Graduated penalties: floor=5.0, scale=0.25 | Time recovery: +3/24h after 24h</text>

  <!-- Arrow -->
  <line x1="425" y1="820" x2="425" y2="844" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr3Down)"/>

  <!-- ===== LAYER 7: Track Penalty ===== -->
  <rect x="195" y="852" width="460" height="66" rx="6" fill="#112240" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="195" y="852" width="36" height="66" rx="6" fill="#ff6b6b"/>
  <rect x="217" y="852" width="14" height="66" fill="#112240"/>
  <text x="213" y="891" text-anchor="middle" fill="#0a192f" font-size="16" font-weight="700" transform="rotate(-90, 213, 891)">L7</text>

  <text x="450" y="876" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="700">Track Penalty v2</text>
  <text x="450" y="906" text-anchor="middle" fill="#8892b0" font-size="10">14d recency-weighted WR | Soft reject: conf floor 0.20, sizing floor 0.15</text>

  <!-- Arrow -->
  <line x1="425" y1="918" x2="425" y2="942" stroke="#F7B32B" stroke-width="2" marker-end="url(#arr3Down)"/>

  <!-- ===== LAYER 8: IDEALPRO Floor ===== -->
  <rect x="205" y="950" width="440" height="56" rx="6" fill="#112240" stroke="#8892b0" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="205" y="950" width="36" height="56" rx="6" fill="#8892b0"/>
  <rect x="227" y="950" width="14" height="56" fill="#112240"/>
  <text x="223" y="984" text-anchor="middle" fill="#0a192f" font-size="16" font-weight="700" transform="rotate(-90, 223, 984)">L8</text>

  <text x="450" y="974" text-anchor="middle" fill="#8892b0" font-size="13" font-weight="700">IDEALPRO Floor</text>
  <text x="450" y="994" text-anchor="middle" fill="#ccd6f6" font-size="10">Minimum order sizes per currency (e.g. 20,000 base units)</text>

  <!-- Arrow -->
  <line x1="425" y1="1006" x2="425" y2="1030" stroke="#64ffda" stroke-width="2" marker-end="url(#arr3DownGreen)"/>

  <!-- ===== OUTPUT ===== -->
  <rect x="250" y="1036" width="350" height="44" rx="22" fill="#112240" stroke="#64ffda" stroke-width="2" filter="url(#shadow3)"/>
  <text x="425" y="1054" text-anchor="middle" fill="#64ffda" font-size="11" font-weight="600">OUTPUT</text>
  <text x="425" y="1072" text-anchor="middle" fill="#ccd6f6" font-size="13" font-weight="700">Final Position Size (base currency units)</text>

  <!-- ===== WHITE SWAN CALLOUT ===== -->
  <rect x="30" y="432" width="100" height="100" rx="6" fill="#0a192f" stroke="#F7B32B" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="80" y="464" text-anchor="middle" fill="#F7B32B" font-size="24">&#9888;</text>
  <text x="80" y="482" text-anchor="middle" fill="#F7B32B" font-size="9" font-weight="700">WHITE SWAN</text>
  <text x="80" y="496" text-anchor="middle" fill="#8892b0" font-size="8">Binary filters</text>
  <text x="80" y="508" text-anchor="middle" fill="#8892b0" font-size="8">not gradual</text>
  <text x="80" y="522" text-anchor="middle" fill="#ccd6f6" font-size="8" font-weight="600">0.0 or 1.0</text>
</svg>