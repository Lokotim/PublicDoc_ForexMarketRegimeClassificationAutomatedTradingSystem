<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="850" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowPurple">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#E879F9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="450" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="425" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#E2E8F0">IV Regime Classification -- 4 Quadrants of Market Fear</text>
  <text x="425" y="46" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">VRP = IV - RV  |  z-score = historical percentile</text>

  <!-- Axes -->
  <!-- X axis (VRP) -->
  <line x1="100" y1="260" x2="580" y2="260" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="580,256 590,260 580,264" fill="#475569"/>
  <text x="590" y="265" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">VRP</text>
  <text x="100" y="278" font-family="Consolas, monospace" font-size="9" fill="#64748B">-3%</text>
  <text x="240" y="278" font-family="Consolas, monospace" font-size="9" fill="#64748B">-1%</text>
  <text x="340" y="278" font-family="Consolas, monospace" font-size="9" fill="#64748B">0</text>
  <text x="440" y="278" font-family="Consolas, monospace" font-size="9" fill="#64748B">+2%</text>
  <text x="540" y="278" font-family="Consolas, monospace" font-size="9" fill="#64748B">+4%</text>

  <!-- Y axis (z-score) -->
  <line x1="340" y1="70" x2="340" y2="410" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="336,70 340,60 344,70" fill="#475569"/>
  <text x="355" y="62" font-family="Consolas, monospace" font-size="9" fill="#64748B">z-score</text>
  <text x="325" y="100" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#64748B">1.5</text>
  <text x="325" y="180" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#64748B">0.75</text>
  <text x="325" y="260" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#64748B">0</text>
  <text x="325" y="340" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#64748B">-0.5</text>

  <!-- Quadrant fills (2x2 grid split by axes at x=340, y=260) -->
  <!-- COMPLACENT (lower-left: low VRP, low z) -->
  <rect x="100" y="260" width="240" height="150" fill="#00D4FF" opacity="0.06" rx="4"/>
  <!-- PRICED (lower-right: high VRP, low/mod z) -->
  <rect x="340" y="260" width="240" height="150" fill="#FFD54F" opacity="0.05" rx="4"/>
  <!-- FEARFUL (upper-right: high VRP, high z) -->
  <rect x="340" y="70" width="240" height="190" fill="#F87171" opacity="0.06" rx="4"/>
  <!-- SURPRISE (upper-left: low/neg VRP, high z) -->
  <rect x="100" y="70" width="240" height="190" fill="#E879F9" opacity="0.06" rx="4"/>

  <!-- Quadrant Labels -->
  <text x="220" y="350" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#00D4FF">COMPLACENT</text>
  <text x="220" y="368" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748B">IV ~ RV, low z</text>
  <text x="220" y="383" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748B">normal conditions</text>

  <text x="460" y="340" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#FFD54F">PRICED</text>
  <text x="460" y="358" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748B">IV >> RV, low z</text>
  <text x="460" y="373" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748B">fear acknowledged</text>

  <text x="460" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#F87171">FEARFUL</text>
  <text x="460" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748B">IV >>> RV, high z</text>
  <text x="460" y="143" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748B">panic hedging</text>

  <text x="200" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#E879F9" filter="url(#glowPurple)">SURPRISE</text>
  <text x="200" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">IV &lt; RV, high z</text>
  <text x="200" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">White Swan zone</text>

  <!-- White Swan emoji in SURPRISE zone (flipped to face right) -->
  <g transform="translate(200, 210) scale(-1,1)">
    <text x="0" y="0" font-size="40" opacity="0.9">&#x1F9A2;</text>
  </g>
  <circle cx="210" cy="185" r="7" fill="#E879F9" opacity="0.9" filter="url(#glowPurple)"/>
  <text x="222" y="195" font-family="Segoe UI, sans-serif" font-size="9" fill="#E879F9" font-style="italic">Le Cygne Blanc</text>

  <!-- 8 Pair dots (spread to avoid overlap) -->
  <!-- PRICED cluster: EU, AJ, AU in lower-right quadrant -->
  <circle cx="400" cy="290" r="6" fill="#FFD54F" opacity="0.9"/>
  <text x="408" y="287" font-family="Consolas, monospace" font-size="9" font-weight="bold" fill="#FFD54F">EU</text>

  <circle cx="470" cy="310" r="6" fill="#FFD54F" opacity="0.9"/>
  <text x="478" y="307" font-family="Consolas, monospace" font-size="9" font-weight="bold" fill="#FFD54F">AJ</text>

  <circle cx="530" cy="295" r="6" fill="#FFD54F" opacity="0.9"/>
  <text x="538" y="292" font-family="Consolas, monospace" font-size="9" font-weight="bold" fill="#FFD54F">AU</text>

  <!-- SURPRISE cluster: UJ, EJ well-separated -->
  <circle cx="160" cy="92" r="7" fill="#E879F9" opacity="0.9" filter="url(#glowPurple)"/>
  <text x="170" y="89" font-family="Consolas, monospace" font-size="9" font-weight="bold" fill="#E879F9">UJ</text>

  <circle cx="250" cy="120" r="7" fill="#E879F9" opacity="0.9" filter="url(#glowPurple)"/>
  <text x="260" y="117" font-family="Consolas, monospace" font-size="9" font-weight="bold" fill="#E879F9">EJ</text>

  <!-- COMPLACENT cluster: GU, NU, UC well-separated -->
  <circle cx="200" cy="310" r="6" fill="#00D4FF" opacity="0.9"/>
  <text x="210" y="307" font-family="Consolas, monospace" font-size="9" font-weight="bold" fill="#00D4FF">GU</text>

  <circle cx="270" cy="340" r="6" fill="#00D4FF" opacity="0.9"/>
  <text x="280" y="337" font-family="Consolas, monospace" font-size="9" font-weight="bold" fill="#00D4FF">NU</text>

  <circle cx="310" cy="295" r="6" fill="#00D4FF" opacity="0.9"/>
  <text x="320" y="292" font-family="Consolas, monospace" font-size="9" font-weight="bold" fill="#00D4FF">UC</text>

  <!-- Legend (right side) -->
  <rect x="630" y="70" width="200" height="330" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="730" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">Pair Regimes</text>

  <circle cx="655" cy="125" r="5" fill="#E879F9"/>
  <text x="670" y="129" font-family="Consolas, monospace" font-size="10" fill="#E879F9">USDJPY  SURPRISE</text>
  <text x="670" y="143" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">VRP=-2.4% z=0.82</text>

  <circle cx="655" cy="165" r="5" fill="#E879F9"/>
  <text x="670" y="169" font-family="Consolas, monospace" font-size="10" fill="#E879F9">EURJPY  SURPRISE</text>
  <text x="670" y="183" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">VRP=-1.3% z=0.71</text>

  <circle cx="655" cy="205" r="5" fill="#FFD54F"/>
  <text x="670" y="209" font-family="Consolas, monospace" font-size="10" fill="#FFD54F">EURUSD  PRICED</text>
  <text x="670" y="223" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">VRP=+2.1% z=0.45</text>

  <circle cx="655" cy="245" r="5" fill="#FFD54F"/>
  <text x="670" y="249" font-family="Consolas, monospace" font-size="10" fill="#FFD54F">AUDUSD  PRICED</text>
  <text x="670" y="263" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">VRP=+1.7% z=0.38</text>

  <circle cx="655" cy="285" r="5" fill="#FFD54F"/>
  <text x="670" y="289" font-family="Consolas, monospace" font-size="10" fill="#FFD54F">AUDJPY  PRICED</text>
  <text x="670" y="303" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">VRP=+1.7% z=0.40</text>

  <circle cx="655" cy="325" r="5" fill="#00D4FF"/>
  <text x="670" y="329" font-family="Consolas, monospace" font-size="10" fill="#00D4FF">GBPUSD  COMPLACENT</text>

  <circle cx="655" cy="350" r="5" fill="#00D4FF"/>
  <text x="670" y="354" font-family="Consolas, monospace" font-size="10" fill="#00D4FF">USDCAD  COMPLACENT</text>

  <circle cx="655" cy="375" r="5" fill="#00D4FF"/>
  <text x="670" y="379" font-family="Consolas, monospace" font-size="10" fill="#00D4FF">USDCHF  COMPLACENT</text>

  <!-- Footer -->
  <text x="425" y="440" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748B">CME FX ETF options: FXE, FXY, FXB, FXF, FXA, FXC + triangular decomposition for crosses</text>
</svg>