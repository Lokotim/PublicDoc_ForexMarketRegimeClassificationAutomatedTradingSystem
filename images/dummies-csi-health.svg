<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="850" height="350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD54F" flood-opacity="0.5"/>
    </filter>
    <filter id="arrowGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFD54F" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="850" height="350" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="425" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#FFD54F" filter="url(#glow)">CSI v2: Strategy Health Score</text>

  <!-- Bar layout: left-aligned bars, widest at top, narrowest at bottom -->
  <!-- Each bar: y spacing ~44px, starting at y=65 -->

  <!-- Tier 1: 80-100, Full Trust x1.00 (green, widest) -->
  <rect x="100" y="65" width="600" height="36" rx="8" fill="#4ADE80" opacity="0.25" stroke="#4ADE80" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="115" y="88" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4ADE80">80 to 100</text>
  <text x="400" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#4ADE80">Full Trust</text>
  <text x="685" y="88" text-anchor="end" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#4ADE80">x1.00</text>

  <!-- Tier 2: 60-79, Established x0.75 (cyan) -->
  <rect x="100" y="109" width="500" height="36" rx="8" fill="#00D4FF" opacity="0.2" stroke="#00D4FF" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="115" y="132" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#00D4FF">60 to 79</text>
  <text x="350" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#00D4FF">Established</text>
  <text x="585" y="132" text-anchor="end" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#00D4FF">x0.75</text>

  <!-- Arrow pointing to Tier 2 = "current strategy score" -->
  <polygon points="72,127 88,120 88,134" fill="#FFD54F" filter="url(#arrowGlow)"/>
  <text x="68" y="131" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="9" fill="#FFD54F">YOU</text>

  <!-- Tier 3: 40-59, Developing x0.50 (amber) -->
  <rect x="100" y="153" width="400" height="36" rx="8" fill="#FFB74D" opacity="0.2" stroke="#FFB74D" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="115" y="176" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFB74D">40 to 59</text>
  <text x="300" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#FFB74D">Developing</text>
  <text x="485" y="176" text-anchor="end" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFB74D">x0.50</text>

  <!-- Tier 4: 20-39, Needs Work x0.25 (orange) -->
  <rect x="100" y="197" width="300" height="36" rx="8" fill="#FB923C" opacity="0.2" stroke="#FB923C" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="115" y="220" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FB923C">20 to 39</text>
  <text x="260" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#FB923C">Needs Work</text>
  <text x="385" y="220" text-anchor="end" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FB923C">x0.25</text>

  <!-- Tier 5: 10-19, Probation x0.10 (red) -->
  <rect x="100" y="241" width="200" height="36" rx="8" fill="#F87171" opacity="0.2" stroke="#F87171" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="115" y="264" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#F87171">10 to 19</text>
  <text x="230" y="264" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#F87171">Probation</text>
  <text x="290" y="264" text-anchor="end" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#F87171">x0.10</text>

  <!-- Tier 6: 0-9, Suspended x0.00 (dark, narrowest) -->
  <rect x="100" y="285" width="120" height="36" rx="8" fill="#475569" opacity="0.25" stroke="#475569" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="115" y="308" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#64748B">0 to 9</text>
  <text x="160" y="322" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B">Suspended x0.00</text>

  <!-- Right side: explanation panel -->
  <g transform="translate(620, 120)">
    <rect x="0" y="0" width="200" height="190" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="100" y="24" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#E2E8F0">Score Components</text>
    <line x1="15" y1="34" x2="185" y2="34" stroke="#334155" stroke-width="0.5"/>

    <circle cx="25" cy="55" r="5" fill="#4ADE80"/>
    <text x="38" y="59" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Profitability (25%)</text>

    <circle cx="25" cy="80" r="5" fill="#00D4FF"/>
    <text x="38" y="84" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Risk Control (25%)</text>

    <circle cx="25" cy="105" r="5" fill="#E879F9"/>
    <text x="38" y="109" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Confidence (25%)</text>

    <circle cx="25" cy="130" r="5" fill="#FFD54F"/>
    <text x="38" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Consistency (25%)</text>

    <line x1="15" y1="148" x2="185" y2="148" stroke="#334155" stroke-width="0.5"/>
    <text x="100" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#94A3B8">Recalculated every hour</text>
    <text x="100" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#94A3B8">Paper trades can rescue</text>
  </g>

  <!-- Bottom tagline -->
  <text x="425" y="345" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#94A3B8">Higher score = bigger position sizes. Low score = strategy on a leash.</text>
</svg>