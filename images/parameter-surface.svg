<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="60%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="plateauGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="60%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="gridPlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD54F" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="850" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="425" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#FFD54F" filter="url(#glow)">Parameter Permutation: 3,000 Variations per Strategy</text>

  <!-- LEFT: Needle Peak -->
  <g transform="translate(30, 60)">
    <!-- Grid base (3D perspective) -->
    <polygon points="50,260 200,310 350,260 200,210" fill="url(#gridPlane)" stroke="#334155" stroke-width="0.5" opacity="0.6"/>
    <!-- Grid lines -->
    <line x1="80" y1="223" x2="230" y2="273" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="110" y1="236" x2="260" y2="286" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="140" y1="248" x2="290" y2="298" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="100" y1="283" x2="250" y2="233" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="130" y1="296" x2="280" y2="246" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="160" y1="308" x2="310" y2="258" stroke="#334155" stroke-width="0.5" opacity="0.4"/>

    <!-- Needle spike -->
    <polygon points="200,30 180,250 200,260 220,250" fill="url(#needleGrad)" opacity="0.85"/>
    <polygon points="200,30 200,260 230,245" fill="#F87171" opacity="0.4"/>
    <polygon points="200,30 170,245 200,260" fill="#DC2626" opacity="0.3"/>
    <!-- Spike tip glow -->
    <circle cx="200" cy="30" r="4" fill="#F87171" opacity="0.8"/>

    <!-- Axes -->
    <line x1="50" y1="260" x2="350" y2="260" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
    <line x1="50" y1="260" x2="50" y2="40" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
    <text x="200" y="335" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Parameter 1</text>
    <text x="330" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8" transform="rotate(-25,330,300)">Parameter 2</text>
    <text x="30" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8" transform="rotate(-90,30,150)">Performance</text>

    <!-- Label -->
    <rect x="120" y="290" width="160" height="24" rx="4" fill="#7F1D1D" opacity="0.7"/>
    <text x="200" y="307" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#F87171">NEEDLE: Eliminated</text>
  </g>

  <!-- RIGHT: Broad Plateau -->
  <g transform="translate(440, 60)">
    <!-- Grid base -->
    <polygon points="50,260 200,310 350,260 200,210" fill="url(#gridPlane)" stroke="#334155" stroke-width="0.5" opacity="0.6"/>
    <!-- Grid lines -->
    <line x1="80" y1="223" x2="230" y2="273" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="110" y1="236" x2="260" y2="286" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="140" y1="248" x2="290" y2="298" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="100" y1="283" x2="250" y2="233" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="130" y1="296" x2="280" y2="246" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="160" y1="308" x2="310" y2="258" stroke="#334155" stroke-width="0.5" opacity="0.4"/>

    <!-- Plateau surface -->
    <polygon points="100,140 300,140 320,170 310,200 280,220 120,220 90,200 80,170" fill="url(#plateauGrad)" opacity="0.7"/>
    <!-- Plateau top face -->
    <polygon points="110,140 290,140 300,150 280,155 120,155 100,150" fill="#4ADE80" opacity="0.5"/>
    <!-- Side faces -->
    <polygon points="100,140 80,170 90,200 120,220 120,155 110,140" fill="#166534" opacity="0.5"/>
    <polygon points="300,140 320,170 310,200 280,220 280,155 290,140" fill="#15803D" opacity="0.4"/>
    <!-- Front face -->
    <polygon points="120,220 280,220 280,155 120,155" fill="#22C55E" opacity="0.3"/>
    <!-- Drop to base -->
    <polygon points="120,220 120,260 200,280 280,260 280,220 200,240" fill="#166534" opacity="0.3"/>

    <!-- Axes -->
    <line x1="50" y1="260" x2="350" y2="260" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
    <line x1="50" y1="260" x2="50" y2="40" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
    <text x="200" y="335" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Parameter 1</text>
    <text x="330" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8" transform="rotate(-25,330,300)">Parameter 2</text>
    <text x="30" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8" transform="rotate(-90,30,150)">Performance</text>

    <!-- Label -->
    <rect x="120" y="290" width="160" height="24" rx="4" fill="#14532D" opacity="0.7"/>
    <text x="200" y="307" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">PLATEAU: Survives</text>
  </g>

  <!-- Bottom note -->
  <rect x="225" y="370" width="400" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="425" y="387" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#00D4FF">70% of permutations must remain profitable</text>
</svg>