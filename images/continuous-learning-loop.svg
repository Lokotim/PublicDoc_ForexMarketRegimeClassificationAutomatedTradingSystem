<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="clBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <radialGradient id="clCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </radialGradient>
    <filter id="clShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="clGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00D4FF" flood-opacity="0.3"/>
    </filter>
    <marker id="clArrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#00D4FF" opacity="0.6"/>
    </marker>
    <marker id="clArrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#FF6B35" opacity="0.6"/>
    </marker>
    <marker id="clArrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#4ADE80" opacity="0.6"/>
    </marker>
    <marker id="clArrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#7B68EE" opacity="0.6"/>
    </marker>
    <marker id="clArrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#F87171" opacity="0.6"/>
    </marker>
    <marker id="clArrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#FBBF24" opacity="0.6"/>
    </marker>
    <pattern id="clGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.3" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#clBg)" rx="12"/>
  <rect width="800" height="400" fill="url(#clGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#00D4FF" letter-spacing="2">CONTINUOUS LEARNING LOOP</text>
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Self-improving autonomous system with 6 interconnected phases</text>

  <!-- Center glow -->
  <circle cx="400" cy="220" r="100" fill="url(#clCenter)"/>

  <!-- Center text -->
  <g filter="url(#clGlow)">
    <circle cx="400" cy="220" r="52" fill="#0A1628" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="213" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00D4FF" font-weight="800">Self-Improving</text>
    <text x="400" y="230" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00D4FF" font-weight="800">System</text>
    <text x="400" y="248" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">24/7 cycle</text>
  </g>

  <!-- ===== 6 STAGES around the circle ===== -->
  <!-- Layout: hexagonal arrangement -->
  <!-- Top: COLLECT (12 o'clock) -->
  <g filter="url(#clShadow)">
    <rect x="310" y="62" width="180" height="70" rx="10" fill="#16213E" stroke="#00D4FF" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="310" y="62" width="180" height="22" rx="10" fill="#00D4FF" fill-opacity="0.1"/>
    <text x="400" y="79" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00D4FF" font-weight="700">1. COLLECT</text>
    <text x="400" y="100" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">15 live data sources</text>
    <text x="400" y="114" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">sentiment + macro + vol + news</text>
    <text x="400" y="126" text-anchor="middle" font-family="monospace" font-size="7" fill="#00D4FF" opacity="0.6">134 features/pair generated</text>
  </g>

  <!-- Top-right: PREDICT (2 o'clock) -->
  <g filter="url(#clShadow)">
    <rect x="560" y="108" width="200" height="70" rx="10" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="560" y="108" width="200" height="22" rx="10" fill="#7B68EE" fill-opacity="0.1"/>
    <text x="660" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7B68EE" font-weight="700">2. PREDICT</text>
    <text x="660" y="146" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">5-Model MoE + Markov + RL</text>
    <text x="660" y="160" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">regime detection + forecasting</text>
    <text x="660" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#7B68EE" opacity="0.6">meta-signal resolution</text>
  </g>

  <!-- Bottom-right: EXECUTE (4 o'clock) -->
  <g filter="url(#clShadow)">
    <rect x="560" y="250" width="200" height="70" rx="10" fill="#16213E" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="560" y="250" width="200" height="22" rx="10" fill="#4ADE80" fill-opacity="0.1"/>
    <text x="660" y="267" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4ADE80" font-weight="700">3. EXECUTE</text>
    <text x="660" y="288" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">CSV -&gt; MCPT -&gt; IBKR</text>
    <text x="660" y="302" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">position sizing cascade</text>
    <text x="660" y="314" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80" opacity="0.6">5 safety layers active</text>
  </g>

  <!-- Bottom: OBSERVE (6 o'clock) -->
  <g filter="url(#clShadow)">
    <rect x="310" y="310" width="180" height="70" rx="10" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="310" y="310" width="180" height="22" rx="10" fill="#FF6B35" fill-opacity="0.1"/>
    <text x="400" y="327" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FF6B35" font-weight="700">4. OBSERVE</text>
    <text x="400" y="348" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">PnL Tracker (hard + soft)</text>
    <text x="400" y="362" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">trade outcomes attribution</text>
    <text x="400" y="376" text-anchor="middle" font-family="monospace" font-size="7" fill="#FF6B35" opacity="0.6">per-pair per-regime metrics</text>
  </g>

  <!-- Bottom-left: LEARN (8 o'clock) -->
  <g filter="url(#clShadow)">
    <rect x="40" y="250" width="200" height="70" rx="10" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="40" y="250" width="200" height="22" rx="10" fill="#FBBF24" fill-opacity="0.1"/>
    <text x="140" y="267" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FBBF24" font-weight="700">5. LEARN</text>
    <text x="140" y="288" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">Bayesian MCMC + RL update</text>
    <text x="140" y="302" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">A/B crowding test selection</text>
    <text x="140" y="314" text-anchor="middle" font-family="monospace" font-size="7" fill="#FBBF24" opacity="0.6">confidence recalibration</text>
  </g>

  <!-- Top-left: ADAPT (10 o'clock) -->
  <g filter="url(#clShadow)">
    <rect x="40" y="108" width="200" height="70" rx="10" fill="#16213E" stroke="#F87171" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="40" y="108" width="200" height="22" rx="10" fill="#F87171" fill-opacity="0.1"/>
    <text x="140" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F87171" font-weight="700">6. ADAPT</text>
    <text x="140" y="146" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0">Model v17.0 evolution</text>
    <text x="140" y="160" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">weight rebalancing</text>
    <text x="140" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#F87171" opacity="0.6">regime memory update</text>
  </g>

  <!-- ===== CONNECTING ARROWS (clockwise) ===== -->
  <!-- COLLECT → PREDICT -->
  <path d="M 490 97 Q 530 90, 560 115" fill="none" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#clArrowPurple)" opacity="0.5"/>

  <!-- PREDICT → EXECUTE -->
  <path d="M 665 178 Q 668 215, 665 250" fill="none" stroke="#7B68EE" stroke-width="1.5" marker-end="url(#clArrowGreen)" opacity="0.5"/>

  <!-- EXECUTE → OBSERVE -->
  <path d="M 560 305 Q 520 320, 490 330" fill="none" stroke="#4ADE80" stroke-width="1.5" marker-end="url(#clArrowOrange)" opacity="0.5"/>

  <!-- OBSERVE → LEARN -->
  <path d="M 310 350 Q 260 355, 240 310" fill="none" stroke="#FF6B35" stroke-width="1.5" marker-end="url(#clArrowYellow)" opacity="0.5"/>

  <!-- LEARN → ADAPT -->
  <path d="M 140 250 Q 138 215, 140 178" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#clArrowRed)" opacity="0.5"/>

  <!-- ADAPT → COLLECT -->
  <path d="M 240 120 Q 280 90, 310 85" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#clArrowCyan)" opacity="0.5"/>

  <!-- Border -->
</svg>