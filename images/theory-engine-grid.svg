    <linearGradient id="teg-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00c853" stop-opacity="0.15"/>
