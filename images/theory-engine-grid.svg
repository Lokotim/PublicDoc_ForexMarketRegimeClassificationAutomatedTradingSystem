      <stop offset="100%" stop-color="#2962ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="teg-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5252" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d50000" stop-opacity="0.15"/>
