<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <linearGradient id="rlBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>
    <filter id="rlGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="rlArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94A3B8"/>
    </marker>
    <marker id="rlArrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#00e5ff"/>
    </marker>
  </defs>

  <rect width="900" height="450" fill="url(#rlBgGrad)"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#FFD54F" filter="url(#rlGlow)">Q-LEARNING RL AGENT ARCHITECTURE</text>
  <line x1="175" y1="42" x2="725" y2="42" stroke="#FFD54F" stroke-opacity="0.3" stroke-width="1"/>

  <!-- State Space (left) -->
  <rect x="25" y="55" width="260" height="175" rx="10" fill="#00e5ff" fill-opacity="0.06" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="155" y="77" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00e5ff">STATE SPACE</text>

  <g font-family="monospace" font-size="9">
    <rect x="40" y="90" width="230" height="25" rx="5" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="0.6"/>
    <text x="155" y="107" text-anchor="middle" fill="#E2E8F0">pair: 6 currencies</text>

    <text x="155" y="127" text-anchor="middle" fill="#94A3B8" font-size="14">×</text>

    <rect x="40" y="133" width="230" height="25" rx="5" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="0.6"/>
    <text x="155" y="150" text-anchor="middle" fill="#E2E8F0">regime: 3 (C / P / F)</text>

    <text x="155" y="170" text-anchor="middle" fill="#94A3B8" font-size="14">×</text>

    <!-- Removed confidence bucket to make = 18 states: 6 pairs x 3 regimes = 18 -->
    <!-- Using pair x regime x confidence_bucket with adjustments -->
    <rect x="40" y="176" width="230" height="25" rx="5" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="0.6"/>
    <text x="155" y="193" text-anchor="middle" fill="#E2E8F0">confidence: (Lo / Hi)</text>
  </g>

  <!-- = 18 states -->
  <rect x="65" y="210" width="180" height="25" rx="6" fill="#00e5ff" fill-opacity="0.2" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="155" y="227" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#00e5ff">= 36 states</text>

  <!-- Action Space (right side top) -->
  <rect x="615" y="55" width="260" height="175" rx="10" fill="#ff9100" fill-opacity="0.06" stroke="#ff9100" stroke-width="1" stroke-opacity="0.5"/>
  <text x="745" y="77" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#ff9100">ACTION SPACE</text>

  <g font-family="monospace" font-size="9">
    <rect x="635" y="90" width="105" height="28" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="0.8"/>
    <text x="687" y="108" text-anchor="middle" fill="#4ADE80">TF_L</text>
    <text x="687" y="98" text-anchor="middle" font-size="6" fill="#94A3B8">Trend Long</text>

    <rect x="755" y="90" width="105" height="28" rx="5" fill="#ef5350" fill-opacity="0.12" stroke="#ef5350" stroke-width="0.8"/>
    <text x="807" y="108" text-anchor="middle" fill="#ef5350">TF_S</text>
    <text x="807" y="98" text-anchor="middle" font-size="6" fill="#94A3B8">Trend Short</text>

    <rect x="635" y="130" width="105" height="28" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="0.8"/>
    <text x="687" y="148" text-anchor="middle" fill="#4ADE80">MR_L</text>
    <text x="687" y="138" text-anchor="middle" font-size="6" fill="#94A3B8">MR Long</text>

    <rect x="755" y="130" width="105" height="28" rx="5" fill="#ef5350" fill-opacity="0.12" stroke="#ef5350" stroke-width="0.8"/>
    <text x="807" y="148" text-anchor="middle" fill="#ef5350">MR_S</text>
    <text x="807" y="138" text-anchor="middle" font-size="6" fill="#94A3B8">MR Short</text>
  </g>

  <rect x="660" y="170" width="170" height="22" rx="5" fill="#ff9100" fill-opacity="0.15" stroke="#ff9100" stroke-width="0.8"/>
  <text x="745" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff9100">4 Actions Total</text>

  <!-- Q-Table (center) -->
  <rect x="310" y="55" width="280" height="175" rx="10" fill="#FFD54F" fill-opacity="0.06" stroke="#FFD54F" stroke-width="1" stroke-opacity="0.5"/>
  <text x="450" y="77" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#FFD54F">Q-TABLE</text>

  <!-- Grid visualization -->
  <g stroke="#94A3B8" stroke-width="0.3" stroke-opacity="0.4">
    <!-- Rows -->
    <line x1="335" y1="90" x2="565" y2="90"/>
    <line x1="335" y1="105" x2="565" y2="105"/>
    <line x1="335" y1="120" x2="565" y2="120"/>
    <line x1="335" y1="135" x2="565" y2="135"/>
    <line x1="335" y1="150" x2="565" y2="150"/>
    <line x1="335" y1="165" x2="565" y2="165"/>
    <line x1="335" y1="180" x2="565" y2="180"/>
    <line x1="335" y1="195" x2="565" y2="195"/>
    <!-- Cols -->
    <line x1="335" y1="90" x2="335" y2="195"/>
    <line x1="395" y1="90" x2="395" y2="195"/>
    <line x1="450" y1="90" x2="450" y2="195"/>
    <line x1="505" y1="90" x2="505" y2="195"/>
    <line x1="565" y1="90" x2="565" y2="195"/>
  </g>

  <!-- Column headers -->
  <g font-family="monospace" font-size="7" fill="#ff9100">
    <text x="365" y="100" text-anchor="middle">TF_L</text>
    <text x="422" y="100" text-anchor="middle">TF_S</text>
    <text x="477" y="100" text-anchor="middle">MR_L</text>
    <text x="535" y="100" text-anchor="middle">MR_S</text>
  </g>

  <!-- Row labels -->
  <g font-family="monospace" font-size="6" fill="#00e5ff">
    <text x="332" y="115" text-anchor="end">EUR_C_Hi</text>
    <text x="332" y="130" text-anchor="end">EUR_P_Lo</text>
    <text x="332" y="145" text-anchor="end">GBP_F_Hi</text>
    <text x="332" y="160" text-anchor="end">JPY_C_Lo</text>
    <text x="332" y="175" text-anchor="end">AUD_P_Hi</text>
    <text x="332" y="190" text-anchor="end">...</text>
  </g>

  <!-- Sample Q-values -->
  <g font-family="monospace" font-size="7" fill="#E2E8F0">
    <text x="365" y="115" text-anchor="middle" fill="#4ADE80">0.82</text>
    <text x="422" y="115" text-anchor="middle">0.31</text>
    <text x="477" y="115" text-anchor="middle">0.45</text>
    <text x="535" y="115" text-anchor="middle">0.12</text>

    <text x="365" y="130" text-anchor="middle">0.22</text>
    <text x="422" y="130" text-anchor="middle">0.55</text>
    <text x="477" y="130" text-anchor="middle" fill="#4ADE80">0.78</text>
    <text x="535" y="130" text-anchor="middle">0.41</text>

    <text x="365" y="145" text-anchor="middle" fill="#4ADE80">0.91</text>
    <text x="422" y="145" text-anchor="middle">0.65</text>
    <text x="477" y="145" text-anchor="middle">0.30</text>
    <text x="535" y="145" text-anchor="middle">0.15</text>

    <text x="365" y="160" text-anchor="middle">0.35</text>
    <text x="422" y="160" text-anchor="middle">0.20</text>
    <text x="477" y="160" text-anchor="middle" fill="#4ADE80">0.88</text>
    <text x="535" y="160" text-anchor="middle">0.62</text>

    <text x="365" y="175" text-anchor="middle">0.48</text>
    <text x="422" y="175" text-anchor="middle">0.33</text>
    <text x="477" y="175" text-anchor="middle">0.55</text>
    <text x="535" y="175" text-anchor="middle" fill="#4ADE80">0.72</text>
  </g>

  <text x="450" y="210" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">36 states × 4 actions = 144 Q-values</text>

  <!-- Arrows between sections -->
  <line x1="287" y1="145" x2="308" y2="145" stroke="#00e5ff" stroke-width="1.2" marker-end="url(#rlArrowCyan)" stroke-dasharray="4,2"/>
  <line x1="592" y1="145" x2="613" y2="145" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#rlArrow)" stroke-dasharray="4,2"/>

  <!-- Reward Section (bottom left) -->
  <rect x="25" y="255" width="410" height="80" rx="10" fill="#4ADE80" fill-opacity="0.06" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.5"/>
  <text x="230" y="277" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#4ADE80">REWARD FUNCTION</text>

  <rect x="45" y="290" width="175" height="35" rx="6" fill="#0f1923" stroke="#4ADE80" stroke-width="0.6"/>
  <text x="132" y="305" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ADE80">Hard Reward</text>
  <text x="132" y="318" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Closed trade PnL</text>

  <text x="237" y="310" font-family="monospace" font-size="14" fill="#94A3B8">+</text>

  <rect x="260" y="290" width="155" height="35" rx="6" fill="#0f1923" stroke="#FFD54F" stroke-width="0.6"/>
  <text x="337" y="305" text-anchor="middle" font-family="monospace" font-size="9" fill="#FFD54F">Soft Reward</text>
  <text x="337" y="318" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Unrealized PnL</text>

  <!-- Parameters (bottom center) -->
  <rect x="460" y="255" width="200" height="80" rx="10" fill="#00e5ff" fill-opacity="0.06" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="560" y="277" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00e5ff">PARAMETERS</text>

  <g font-family="monospace" font-size="10" fill="#E2E8F0">
    <text x="480" y="298" fill="#94A3B8">α</text><text x="500" y="298"> = 0.10</text>
    <text x="480" y="313" fill="#94A3B8">γ</text><text x="500" y="313"> = 0.95</text>
    <text x="480" y="328" fill="#94A3B8">ε</text><text x="500" y="328"> = 0.15</text>
    <text x="570" y="298" fill="#94A3B8" font-size="7">learning rate</text>
    <text x="570" y="313" fill="#94A3B8" font-size="7">discount</text>
    <text x="570" y="328" fill="#94A3B8" font-size="7">exploration</text>
  </g>

  <!-- Progressive Trust (bottom right) -->
  <rect x="685" y="255" width="195" height="80" rx="10" fill="#FFD54F" fill-opacity="0.06" stroke="#FFD54F" stroke-width="1" stroke-opacity="0.5"/>
  <text x="782" y="277" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#FFD54F">PROGRESSIVE TRUST</text>

  <g font-family="monospace" font-size="8">
    <rect x="700" y="288" width="165" height="18" rx="4" fill="#94A3B8" fill-opacity="0.1" stroke="#94A3B8" stroke-width="0.5"/>
    <text x="782" y="300" text-anchor="middle" fill="#94A3B8">Observation Mode</text>

    <text x="782" y="315" text-anchor="middle" fill="#94A3B8">↓</text>

    <rect x="700" y="318" width="165" height="18" rx="4" fill="#FFD54F" fill-opacity="0.15" stroke="#FFD54F" stroke-width="0.8"/>
    <text x="782" y="330" text-anchor="middle" fill="#FFD54F">Full Weight Active</text>
  </g>

  <!-- Update rule -->
  <rect x="25" y="355" width="855" height="80" rx="10" fill="#0f1923" stroke="#94A3B8" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="450" y="377" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#E2E8F0">Q-UPDATE RULE (Bellman Equation)</text>
  <text x="450" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#00e5ff">Q(s,a) ← Q(s,a) + α [ r + γ max Q(s',a') - Q(s,a) ]</text>
  <text x="450" y="420" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Updated after each trade outcome | Epsilon-greedy exploration policy</text>
</svg>