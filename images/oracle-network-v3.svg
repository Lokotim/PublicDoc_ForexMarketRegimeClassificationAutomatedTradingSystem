  <text x="370" y="528" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">x</text>
  <text x="385" y="528" font-family="Consolas, monospace" font-size="10" fill="#00D4FF">8 pairs</text>
  <text x="440" y="528" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">=</text>
  <text x="455" y="528" font-family="Consolas, monospace" font-size="10" fill="#FFD54F">full coverage across all dimensions</text>
</svg>