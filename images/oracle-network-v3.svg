  <text x="425" y="285" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#00D4FF">PIPELINE</text>
  <text x="425" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94A3B8">Stage 1</text>

