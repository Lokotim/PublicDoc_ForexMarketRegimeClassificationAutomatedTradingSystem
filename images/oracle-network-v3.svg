  <text x="66" y="528" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">Completed</text>
  <circle cx="155" cy="524" r="5" fill="#FFD54F"/>
  <text x="166" y="528" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">Bottleneck</text>
