  <text x="233" y="84" font-family="Consolas, monospace" font-size="9" fill="#4ADE80">T1</text>
  <text x="248" y="84" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0">Retail Sentiment</text>
  <text x="233" y="98" font-family="Consolas, monospace" font-size="8" fill="#94A3B8">IG / Dukascopy</text>
  <text x="233" y="112" font-family="Consolas, monospace" font-size="8" fill="#94A3B8">MyFxBook / FXSSI</text>

