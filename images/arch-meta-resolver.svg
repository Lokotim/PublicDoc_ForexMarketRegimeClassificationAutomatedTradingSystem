<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <linearGradient id="mrBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>
    <filter id="mrGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="mrArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94A3B8"/>
    </marker>
    <marker id="mrArrowGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#FFD54F"/>
    </marker>
    <linearGradient id="mrResolverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="900" height="450" fill="url(#mrBgGrad)"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#FFD54F" filter="url(#mrGlow)">META-RESOLVER: SIGNAL CONFLICT ARBITRATION</text>
  <line x1="150" y1="42" x2="750" y2="42" stroke="#FFD54F" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Input Sources -->
  <!-- ML MoE -->
  <rect x="30" y="70" width="180" height="90" rx="10" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="120" y="95" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#00e5ff">ML MoE</text>
  <text x="120" y="115" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#E2E8F0">46%</text>
  <text x="120" y="135" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Bayesian-weighted ensemble</text>
  <text x="120" y="148" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Highest base weight</text>

  <!-- Forecast -->
  <rect x="30" y="180" width="180" height="90" rx="10" fill="#4ADE80" fill-opacity="0.08" stroke="#4ADE80" stroke-width="1.2"/>
  <text x="120" y="205" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#4ADE80">Forecast</text>
  <text x="120" y="225" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#E2E8F0">38.4%</text>
  <text x="120" y="245" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Multi-horizon directional</text>
  <text x="120" y="258" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">EWMA-smoothed signal</text>

  <!-- RL Agent -->
  <rect x="30" y="290" width="180" height="90" rx="10" fill="#ff9100" fill-opacity="0.08" stroke="#ff9100" stroke-width="1.2"/>
  <text x="120" y="315" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ff9100">RL Agent</text>
  <text x="120" y="335" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#E2E8F0">15.6%</text>
  <text x="120" y="355" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Q-learning strategy picker</text>
  <text x="120" y="368" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Progressive trust ramp</text>

  <!-- Weighted arrows to resolver -->
  <!-- ML arrow (thickest) -->
  <line x1="212" y1="115" x2="330" y2="195" stroke="#00e5ff" stroke-width="4" stroke-opacity="0.6" marker-end="url(#mrArrow)"/>
  <text x="260" y="140" font-family="monospace" font-size="8" fill="#00e5ff" transform="rotate(-18, 260, 140)">46%</text>

  <!-- Forecast arrow -->
  <line x1="212" y1="225" x2="330" y2="215" stroke="#4ADE80" stroke-width="3" stroke-opacity="0.6" marker-end="url(#mrArrow)"/>
  <text x="265" y="215" font-family="monospace" font-size="8" fill="#4ADE80">38.4%</text>

  <!-- RL arrow (thinnest) -->
  <line x1="212" y1="335" x2="330" y2="235" stroke="#ff9100" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#mrArrow)"/>
  <text x="260" y="290" font-family="monospace" font-size="8" fill="#ff9100" transform="rotate(18, 260, 290)">15.6%</text>

  <!-- Central Resolver Box -->
  <rect x="335" y="130" width="230" height="185" rx="12" fill="url(#mrResolverGrad)" stroke="#FFD54F" stroke-width="2"/>
  <text x="450" y="155" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FFD54F">META-RESOLVER</text>

  <rect x="355" y="168" width="190" height="22" rx="4" fill="#0f1923" stroke="#94A3B8" stroke-width="0.5"/>
  <text x="450" y="183" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Weighted Voting Logic</text>

  <rect x="355" y="198" width="190" height="22" rx="4" fill="#0f1923" stroke="#94A3B8" stroke-width="0.5"/>
  <text x="450" y="213" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Direction Consensus Check</text>

  <rect x="355" y="228" width="190" height="22" rx="4" fill="#0f1923" stroke="#94A3B8" stroke-width="0.5"/>
  <text x="450" y="243" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Confidence Aggregation</text>

  <rect x="355" y="258" width="190" height="22" rx="4" fill="#0f1923" stroke="#94A3B8" stroke-width="0.5"/>
  <text x="450" y="273" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Sizing Multiplier Calc</text>

  <rect x="355" y="288" width="190" height="18" rx="4" fill="#ef5350" fill-opacity="0.1" stroke="#ef5350" stroke-width="0.6"/>
  <text x="450" y="300" text-anchor="middle" font-family="monospace" font-size="7" fill="#ef5350">Shock Override Logic</text>

  <!-- 4 Agreement Levels (right side) -->
  <rect x="600" y="70" width="280" height="180" rx="10" fill="#0f1923" stroke="#94A3B8" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="740" y="92" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#E2E8F0">AGREEMENT LEVELS</text>

  <!-- UNANIMOUS -->
  <rect x="620" y="105" width="240" height="30" rx="6" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="1"/>
  <text x="640" y="124" font-family="monospace" font-size="10" font-weight="bold" fill="#4ADE80">UNANIMOUS</text>
  <text x="845" y="124" text-anchor="end" font-family="monospace" font-size="8" fill="#94A3B8">3/3 agree → full size</text>

  <!-- MAJORITY -->
  <rect x="620" y="143" width="240" height="30" rx="6" fill="#FFD54F" fill-opacity="0.12" stroke="#FFD54F" stroke-width="1"/>
  <text x="640" y="162" font-family="monospace" font-size="10" font-weight="bold" fill="#FFD54F">MAJORITY</text>
  <text x="845" y="162" text-anchor="end" font-family="monospace" font-size="8" fill="#94A3B8">2/3 agree → 70% size</text>

  <!-- SPLIT -->
  <rect x="620" y="181" width="240" height="30" rx="6" fill="#ef5350" fill-opacity="0.12" stroke="#ef5350" stroke-width="1"/>
  <text x="640" y="200" font-family="monospace" font-size="10" font-weight="bold" fill="#ef5350">SPLIT</text>
  <text x="845" y="200" text-anchor="end" font-family="monospace" font-size="8" fill="#94A3B8">No majority → 40% size</text>

  <!-- FLAT -->
  <rect x="620" y="219" width="240" height="30" rx="6" fill="#94A3B8" fill-opacity="0.12" stroke="#94A3B8" stroke-width="1"/>
  <text x="640" y="238" font-family="monospace" font-size="10" font-weight="bold" fill="#94A3B8">FLAT</text>
  <text x="845" y="238" text-anchor="end" font-family="monospace" font-size="8" fill="#94A3B8">Low conf → skip trade</text>

  <!-- Arrow from resolver to agreement -->
  <line x1="567" y1="175" x2="598" y2="175" stroke="#FFD54F" stroke-width="1.5" marker-end="url(#mrArrowGold)"/>

  <!-- Shock Integration -->
  <rect x="335" y="335" width="230" height="50" rx="8" fill="#ef5350" fill-opacity="0.1" stroke="#ef5350" stroke-width="1.2"/>
  <text x="450" y="355" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ef5350">SHOCK INTEGRATION</text>
  <text x="450" y="373" text-anchor="middle" font-family="monospace" font-size="9" fill="#E2E8F0">Active Shock → Kelly reduction</text>

  <!-- Arrow from shock to resolver -->
  <line x1="450" y1="335" x2="450" y2="317" stroke="#ef5350" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#mrArrow)"/>

  <!-- Output -->
  <rect x="600" y="280" width="280" height="105" rx="10" fill="#FFD54F" fill-opacity="0.08" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="740" y="302" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#FFD54F">OUTPUT SIGNAL</text>

  <g font-family="monospace" font-size="9">
    <rect x="620" y="312" width="240" height="20" rx="4" fill="#0f1923" stroke="#FFD54F" stroke-width="0.5"/>
    <text x="640" y="326" fill="#E2E8F0">final_direction</text>
    <text x="845" y="326" text-anchor="end" fill="#4ADE80">LONG / SHORT</text>

    <rect x="620" y="338" width="240" height="20" rx="4" fill="#0f1923" stroke="#FFD54F" stroke-width="0.5"/>
    <text x="640" y="352" fill="#E2E8F0">final_confidence</text>
    <text x="845" y="352" text-anchor="end" fill="#00e5ff">0.0 - 1.0</text>

    <rect x="620" y="364" width="240" height="20" rx="4" fill="#0f1923" stroke="#FFD54F" stroke-width="0.5"/>
    <text x="640" y="378" fill="#E2E8F0">sizing_multiplier</text>
    <text x="845" y="378" text-anchor="end" fill="#ff9100">0.4 - 1.0</text>
  </g>

  <!-- Arrow from agreement to output -->
  <line x1="740" y1="252" x2="740" y2="278" stroke="#FFD54F" stroke-width="1.2" marker-end="url(#mrArrowGold)"/>

  <!-- Decorative pipe to execution -->
  <rect x="600" y="400" width="280" height="35" rx="6" fill="#ff9100" fill-opacity="0.06" stroke="#ff9100" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="740" y="422" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff9100">→ Position Sizing Cascade →</text>
</svg>