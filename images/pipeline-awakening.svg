<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7B32B" stop-opacity="0.3"/>
      <stop offset="10%" stop-color="#FFD54F"/>
      <stop offset="90%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F7B32B" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFD54F" flood-opacity="0.5"/>
    </filter>
    <filter id="pulseGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#4ADE80" flood-opacity="0.8"/>
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { r: 6; opacity: 1; }
        50% { r: 10; opacity: 0.7; }
      }
      .pulse-node { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="280" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFD54F" filter="url(#glow)">168 SECONDS TO AUTONOMY</text>
  <text x="425" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8892B0">From raw data to live orders — one pipeline cycle</text>

  <!-- Timeline base line -->
  <line x1="80" y1="150" x2="770" y2="150" stroke="url(#goldLine)" stroke-width="2" stroke-linecap="round"/>

  <!-- Elapsed time labels between nodes -->
  <text x="218" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8" opacity="0.6">62s</text>
  <text x="356" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8" opacity="0.6">38s</text>
  <text x="494" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8" opacity="0.6">40s</text>
  <text x="609" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8" opacity="0.6">15s</text>
  <text x="701" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#94A3B8" opacity="0.6">13s</text>

  <!-- Node 1: WAKE (0s) -->
  <circle cx="80" cy="150" r="6" fill="#FFD54F" filter="url(#glow)"/>
  <text x="80" y="120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">WAKE</text>
  <text x="80" y="134" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">data collection</text>
  <text x="80" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#FFD54F">0s</text>

  <!-- Node 2: HARVEST (62s) -->
  <circle cx="218" cy="150" r="6" fill="#FFD54F" filter="url(#glow)"/>
  <text x="218" y="120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">HARVEST</text>
  <text x="218" y="134" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">19 sources scraped</text>
  <text x="218" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#FFD54F">62s</text>

  <!-- Node 3: THINK (100s) -->
  <circle cx="356" cy="150" r="6" fill="#FFD54F" filter="url(#glow)"/>
  <text x="356" y="120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">THINK</text>
  <text x="356" y="134" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">ML ensemble trained</text>
  <text x="356" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#FFD54F">100s</text>

  <!-- Node 4: DECIDE (140s) -->
  <circle cx="494" cy="150" r="6" fill="#FFD54F" filter="url(#glow)"/>
  <text x="494" y="120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">DECIDE</text>
  <text x="494" y="134" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">meta-signal resolved</text>
  <text x="494" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#FFD54F">140s</text>

  <!-- Node 5: ACT (155s) — pulsing -->
  <circle cx="632" cy="150" r="6" fill="#4ADE80" filter="url(#pulseGlow)" class="pulse-node"/>
  <text x="632" y="120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#4ADE80">ACT</text>
  <text x="632" y="134" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">CSV written, orders flow</text>
  <text x="632" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#4ADE80">155s</text>

  <!-- Node 6: LEARN (168s) -->
  <circle cx="770" cy="150" r="6" fill="#FFD54F" filter="url(#glow)"/>
  <text x="770" y="120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">LEARN</text>
  <text x="770" y="134" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">diagnostics, learning</text>
  <text x="770" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#FFD54F">168s</text>

  <!-- Bottom cadence label -->
  <text x="425" y="252" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94A3B8" opacity="0.7">Repeats every hour at :55 — 24/5</text>
</svg>