<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="slBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <filter id="slShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="slGlowRed">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F87171" flood-opacity="0.3"/>
    </filter>
    <pattern id="slGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.3" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#slBg)" rx="12"/>
  <rect width="800" height="400" fill="url(#slGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#F87171" letter-spacing="2">5 INDEPENDENT SAFETY LAYERS</text>
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Any single layer can reduce or halt all trading activity</text>

  <!-- Shield 1: PnL Circuit Breaker -->
  <g filter="url(#slShadow)">
    <rect x="20" y="65" width="144" height="200" rx="10" fill="#16213E" stroke="#F87171" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Shield icon -->
    <g transform="translate(92, 100)">
      <path d="M 0 -25 L -22 -15 L -22 5 C -22 20, 0 32, 0 32 C 0 32, 22 20, 22 5 L 22 -15 Z" fill="#F87171" fill-opacity="0.1" stroke="#F87171" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="2" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#F87171" font-weight="700">!</text>
    </g>
    <text x="92" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">PnL Circuit</text>
    <text x="92" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">Breaker</text>
    <line x1="40" y1="170" x2="144" y2="170" stroke="#F87171" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="92" y="186" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Daily loss > 3%</text>
    <text x="92" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Weekly DD > 5%</text>
    <text x="92" y="214" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Consecutive loss</text>
    <text x="92" y="228" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">streak > 8</text>
    <!-- Status indicator -->
    <rect x="40" y="240" width="104" height="16" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="52" cy="248" r="3" fill="#4ADE80"/>
    <text x="92" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">NORMAL</text>
  </g>

  <!-- Shield 2: Shock Detector (White Swan) -->
  <g filter="url(#slShadow)">
    <rect x="176" y="65" width="144" height="200" rx="10" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(248, 100)">
      <path d="M 0 -25 L -22 -15 L -22 5 C -22 20, 0 32, 0 32 C 0 32, 22 20, 22 5 L 22 -15 Z" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FBBF24" font-weight="700">&#9889;</text>
    </g>
    <text x="248" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">Shock Detector</text>
    <text x="248" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">(White Swan)</text>
    <line x1="196" y1="170" x2="300" y2="170" stroke="#FBBF24" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="248" y="186" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Calendar event</text>
    <text x="248" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">IV spike detect</text>
    <text x="248" y="214" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">NFP / FOMC /</text>
    <text x="248" y="228" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">BOJ / ECB guard</text>
    <rect x="196" y="240" width="104" height="16" rx="8" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="208" cy="248" r="3" fill="#FBBF24"/>
    <text x="248" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#FBBF24">WARNING</text>
  </g>

  <!-- Shield 3: Crowding Penalty (A/B) -->
  <g filter="url(#slShadow)">
    <rect x="332" y="65" width="144" height="200" rx="10" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(404, 100)">
      <path d="M 0 -25 L -22 -15 L -22 5 C -22 20, 0 32, 0 32 C 0 32, 22 20, 22 5 L 22 -15 Z" fill="#7B68EE" fill-opacity="0.1" stroke="#7B68EE" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-family="monospace" font-size="10" fill="#7B68EE" font-weight="700">AB</text>
    </g>
    <text x="404" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">Crowding</text>
    <text x="404" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">Penalty (A/B)</text>
    <line x1="352" y1="170" x2="456" y2="170" stroke="#7B68EE" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="404" y="186" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Retail crowd &gt; 75%</text>
    <text x="404" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">A/B test: fade vs</text>
    <text x="404" y="214" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">ignore crowding</text>
    <text x="404" y="228" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Auto-select winner</text>
    <rect x="352" y="240" width="104" height="16" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="364" cy="248" r="3" fill="#4ADE80"/>
    <text x="404" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">NORMAL</text>
  </g>

  <!-- Shield 4: Cross-Validation -->
  <g filter="url(#slShadow)">
    <rect x="488" y="65" width="144" height="200" rx="10" fill="#16213E" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(560, 100)">
      <path d="M 0 -25 L -22 -15 L -22 5 C -22 20, 0 32, 0 32 C 0 32, 22 20, 22 5 L 22 -15 Z" fill="#00D4FF" fill-opacity="0.1" stroke="#00D4FF" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#00D4FF" font-weight="700">&#10003;</text>
    </g>
    <text x="560" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">Cross</text>
    <text x="560" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">Validation</text>
    <line x1="508" y1="170" x2="612" y2="170" stroke="#00D4FF" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="560" y="186" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Theory coherence</text>
    <text x="560" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">ML vs Markov vs RL</text>
    <text x="560" y="214" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">agreement check</text>
    <text x="560" y="228" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Penalty on conflict</text>
    <rect x="508" y="240" width="104" height="16" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="520" cy="248" r="3" fill="#4ADE80"/>
    <text x="560" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">NORMAL</text>
  </g>

  <!-- Shield 5: Data Integrity -->
  <g filter="url(#slShadow)">
    <rect x="644" y="65" width="144" height="200" rx="10" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(716, 100)">
      <path d="M 0 -25 L -22 -15 L -22 5 C -22 20, 0 32, 0 32 C 0 32, 22 20, 22 5 L 22 -15 Z" fill="#FF6B35" fill-opacity="0.1" stroke="#FF6B35" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FF6B35" font-weight="700">&#128274;</text>
    </g>
    <text x="716" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">Data</text>
    <text x="716" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E2E8F0" font-weight="700">Integrity</text>
    <line x1="664" y1="170" x2="768" y2="170" stroke="#FF6B35" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="716" y="186" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Stale data check</text>
    <text x="716" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Source availability</text>
    <text x="716" y="214" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">GV health status</text>
    <text x="716" y="228" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">TWS connectivity</text>
    <rect x="664" y="240" width="104" height="16" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="676" cy="248" r="3" fill="#4ADE80"/>
    <text x="716" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">NORMAL</text>
  </g>

  <!-- Bottom: Halt warning -->
  <g filter="url(#slGlowRed)">
    <rect x="100" y="290" width="600" height="48" rx="10" fill="#3D0F0F" stroke="#F87171" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="400" y="312" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#F87171" font-weight="800">ANY SINGLE LAYER CAN REDUCE OR HALT ALL TRADING</text>
    <text x="400" y="330" text-anchor="middle" font-family="monospace" font-size="8" fill="#E2E8F0" opacity="0.8">Independent checks = no single point of failure | Defense-in-depth architecture</text>
  </g>

  <!-- Response actions -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#4ADE80" fill-opacity="0.06" stroke="#4ADE80" stroke-opacity="0.2" stroke-width="0.5"/>
    <circle cx="12" cy="12" r="4" fill="#4ADE80"/>
    <text x="24" y="16" font-family="monospace" font-size="7" fill="#4ADE80">NORMAL: Full sizing</text>

    <rect x="200" y="0" width="180" height="24" rx="6" fill="#FBBF24" fill-opacity="0.06" stroke="#FBBF24" stroke-opacity="0.2" stroke-width="0.5"/>
    <circle cx="212" cy="12" r="4" fill="#FBBF24"/>
    <text x="224" y="16" font-family="monospace" font-size="7" fill="#FBBF24">WARNING: Reduce 30-50%</text>

    <rect x="400" y="0" width="200" height="24" rx="6" fill="#F87171" fill-opacity="0.06" stroke="#F87171" stroke-opacity="0.2" stroke-width="0.5"/>
    <circle cx="412" cy="12" r="4" fill="#F87171"/>
    <text x="424" y="16" font-family="monospace" font-size="7" fill="#F87171">TRIGGERED: Halt all trades</text>
  </g>

  <!-- Border -->
</svg>