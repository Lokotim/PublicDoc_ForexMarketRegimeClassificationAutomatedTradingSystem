<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="slBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#141a2e"/>
    </linearGradient>
    <filter id="slShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="slGlowRed">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F87171" flood-opacity="0.3"/>
    </filter>
    <pattern id="slGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.3" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#slBg)" rx="12"/>
  <rect width="800" height="500" fill="url(#slGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#F87171" letter-spacing="2">6 INDEPENDENT SAFETY LAYERS</text>
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Any single layer can reduce or halt all trading activity</text>

  <!-- ROW 1: Shields 1-3 -->

  <!-- Shield 1: PnL Circuit Breaker -->
  <g filter="url(#slShadow)">
    <rect x="16" y="62" width="244" height="180" rx="10" fill="#16213E" stroke="#F87171" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(138, 94)">
      <path d="M 0 -22 L -20 -13 L -20 4 C -20 17, 0 28, 0 28 C 0 28, 20 17, 20 4 L 20 -13 Z" fill="#F87171" fill-opacity="0.1" stroke="#F87171" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="2" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#F87171" font-weight="700">!</text>
    </g>
    <text x="138" y="132" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">PnL Circuit Breaker</text>
    <line x1="36" y1="140" x2="240" y2="140" stroke="#F87171" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="138" y="156" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">NORMAL / REDUCED / HALT</text>
    <text x="138" y="170" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Daily loss threshold</text>
    <text x="138" y="184" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">100% / 50% / 0% sizing</text>
    <rect x="50" y="198" width="176" height="16" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="64" cy="206" r="3" fill="#4ADE80"/>
    <text x="138" y="210" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">NORMAL</text>
  </g>

  <!-- Shield 2: Shock Opportunity Detector -->
  <g filter="url(#slShadow)">
    <rect x="278" y="62" width="244" height="180" rx="10" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(400, 94)">
      <path d="M 0 -22 L -20 -13 L -20 4 C -20 17, 0 28, 0 28 C 0 28, 20 17, 20 4 L 20 -13 Z" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FBBF24" font-weight="700">&#9889;</text>
    </g>
    <text x="400" y="132" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">Shock Opportunity Detector</text>
    <line x1="298" y1="140" x2="502" y2="140" stroke="#FBBF24" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="400" y="156" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">White Swan philosophy</text>
    <text x="400" y="170" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">IV regime-based gating</text>
    <text x="400" y="184" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">COMPLACENT / PRICED</text>
    <text x="400" y="198" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">FEARFUL / SURPRISE</text>
    <rect x="312" y="210" width="176" height="16" rx="8" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="326" cy="218" r="3" fill="#FBBF24"/>
    <text x="400" y="222" text-anchor="middle" font-family="monospace" font-size="7" fill="#FBBF24">IV REGIME</text>
  </g>

  <!-- Shield 3: Crowding Penalty -->
  <g filter="url(#slShadow)">
    <rect x="540" y="62" width="244" height="180" rx="10" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(662, 94)">
      <path d="M 0 -22 L -20 -13 L -20 4 C -20 17, 0 28, 0 28 C 0 28, 20 17, 20 4 L 20 -13 Z" fill="#7B68EE" fill-opacity="0.1" stroke="#7B68EE" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-family="monospace" font-size="10" fill="#7B68EE" font-weight="700">AB</text>
    </g>
    <text x="662" y="132" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">Crowding Penalty</text>
    <line x1="560" y1="140" x2="764" y2="140" stroke="#7B68EE" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="662" y="156" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">A/B tested cohorts</text>
    <text x="662" y="170" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Sortino-based split</text>
    <text x="662" y="184" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Fade vs ignore crowding</text>
    <rect x="574" y="198" width="176" height="16" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="588" cy="206" r="3" fill="#4ADE80"/>
    <text x="662" y="210" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">NORMAL</text>
  </g>

  <!-- ROW 2: Shields 4-6 -->

  <!-- Shield 4: IBKR Cross-Validation -->
  <g filter="url(#slShadow)">
    <rect x="16" y="260" width="244" height="180" rx="10" fill="#16213E" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(138, 292)">
      <path d="M 0 -22 L -20 -13 L -20 4 C -20 17, 0 28, 0 28 C 0 28, 20 17, 20 4 L 20 -13 Z" fill="#00D4FF" fill-opacity="0.1" stroke="#00D4FF" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#00D4FF" font-weight="700">&#10003;</text>
    </g>
    <text x="138" y="330" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">IBKR Cross-Validation</text>
    <line x1="36" y1="338" x2="240" y2="338" stroke="#00D4FF" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="138" y="354" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Expected vs actual positions</text>
    <text x="138" y="368" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">GV signal cross-check</text>
    <text x="138" y="382" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Mismatch = block trade</text>
    <rect x="50" y="396" width="176" height="16" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="64" cy="404" r="3" fill="#4ADE80"/>
    <text x="138" y="408" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">SYNCED</text>
  </g>

  <!-- Shield 5: Data Integrity Guard -->
  <g filter="url(#slShadow)">
    <rect x="278" y="260" width="244" height="180" rx="10" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(400, 292)">
      <path d="M 0 -22 L -20 -13 L -20 4 C -20 17, 0 28, 0 28 C 0 28, 20 17, 20 4 L 20 -13 Z" fill="#FF6B35" fill-opacity="0.1" stroke="#FF6B35" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FF6B35" font-weight="700">Q</text>
    </g>
    <text x="400" y="330" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">Data Integrity Guard</text>
    <line x1="298" y1="338" x2="502" y2="338" stroke="#FF6B35" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="400" y="354" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Quarantine suspicious</text>
    <text x="400" y="368" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">outcomes before models</text>
    <text x="400" y="382" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">PnL bounds check</text>
    <rect x="312" y="396" width="176" height="16" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="326" cy="404" r="3" fill="#4ADE80"/>
    <text x="400" y="408" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">CLEAN</text>
  </g>

  <!-- Shield 6: Strategy Analytics (AlgoChef) -->
  <g filter="url(#slShadow)">
    <rect x="540" y="260" width="244" height="180" rx="10" fill="#16213E" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(662, 292)">
      <path d="M 0 -22 L -20 -13 L -20 4 C -20 17, 0 28, 0 28 C 0 28, 20 17, 20 4 L 20 -13 Z" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4ADE80" font-weight="700">&#9733;</text>
    </g>
    <text x="662" y="330" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">Strategy Analytics</text>
    <text x="662" y="342" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#94A3B8">(AlgoChef)</text>
    <line x1="560" y1="350" x2="764" y2="350" stroke="#4ADE80" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="662" y="366" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Health Monitor + CSI</text>
    <text x="662" y="380" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Correlation Matrix</text>
    <text x="662" y="394" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Monte Carlo Risk of Ruin</text>
    <rect x="574" y="406" width="176" height="16" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="588" cy="414" r="3" fill="#4ADE80"/>
    <text x="662" y="418" text-anchor="middle" font-family="monospace" font-size="7" fill="#4ADE80">HEALTHY</text>
  </g>

  <!-- Bottom: Halt warning -->
  <g filter="url(#slGlowRed)">
    <rect x="60" y="452" width="680" height="36" rx="10" fill="#3D0F0F" stroke="#F87171" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="400" y="468" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F87171" font-weight="800">ANY SINGLE LAYER CAN REDUCE OR HALT ALL TRADING</text>
    <text x="400" y="482" text-anchor="middle" font-family="monospace" font-size="7" fill="#E2E8F0" opacity="0.8">Independent checks = no single point of failure | Defense-in-depth architecture</text>
  </g>
</svg>