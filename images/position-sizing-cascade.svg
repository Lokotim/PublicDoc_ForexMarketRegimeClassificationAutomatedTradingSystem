<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <filter id="psShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="psGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00D4FF" flood-opacity="0.3"/>
    </filter>
    <marker id="psArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#00D4FF" opacity="0.5"/>
    </marker>
    <pattern id="psGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.3" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#psBg)" rx="12"/>
  <rect width="800" height="450" fill="url(#psGrid)" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#00D4FF" letter-spacing="2">POSITION SIZING CASCADE</text>
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">6-layer risk management pipeline with sample calculation</text>

  <!-- ===== LAYER 1: Account Equity ===== -->
  <g filter="url(#psShadow)">
    <rect x="100" y="58" width="420" height="48" rx="10" fill="#16213E" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="124" cy="82" r="14" fill="#00D4FF" fill-opacity="0.1" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="124" y="86" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00D4FF" font-weight="700">1</text>
    <text x="155" y="77" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">Account Equity (Base)</text>
    <text x="155" y="96" font-family="monospace" font-size="7" fill="#94A3B8">Current account value = starting reference for all sizing</text>
  </g>
  <g filter="url(#psShadow)">
    <rect x="550" y="62" width="210" height="38" rx="8" fill="#16213E" stroke="#00D4FF" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="565" y="78" font-family="monospace" font-size="7" fill="#94A3B8">Equity:</text>
    <text x="565" y="94" font-family="monospace" font-size="11" fill="#00D4FF" font-weight="700">$50,000</text>
  </g>

  <line x1="400" y1="106" x2="400" y2="120" stroke="#00D4FF" stroke-width="1" marker-end="url(#psArrow)" opacity="0.3"/>

  <!-- ===== LAYER 2: ATR Risk Budget ===== -->
  <g filter="url(#psShadow)">
    <rect x="100" y="122" width="420" height="48" rx="10" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="124" cy="146" r="14" fill="#7B68EE" fill-opacity="0.1" stroke="#7B68EE" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="124" y="150" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7B68EE" font-weight="700">2</text>
    <text x="155" y="141" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">ATR Risk Budget</text>
    <text x="155" y="160" font-family="monospace" font-size="7" fill="#94A3B8">risk_amount = 2% x equity / (ATR x 2) = max units</text>
  </g>
  <g filter="url(#psShadow)">
    <rect x="550" y="126" width="210" height="38" rx="8" fill="#16213E" stroke="#7B68EE" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="565" y="142" font-family="monospace" font-size="7" fill="#94A3B8">2% x $50K / (80pip x 2):</text>
    <text x="565" y="158" font-family="monospace" font-size="11" fill="#7B68EE" font-weight="700">62,500 units</text>
  </g>

  <line x1="400" y1="170" x2="400" y2="184" stroke="#00D4FF" stroke-width="1" marker-end="url(#psArrow)" opacity="0.3"/>

  <!-- ===== LAYER 3: Leverage Cap ===== -->
  <g filter="url(#psShadow)">
    <rect x="100" y="186" width="420" height="48" rx="10" fill="#16213E" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="124" cy="210" r="14" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="124" y="214" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4ADE80" font-weight="700">3</text>
    <text x="155" y="205" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">Leverage Cap (5.0x)</text>
    <text x="155" y="224" font-family="monospace" font-size="7" fill="#94A3B8">max_position = min(ATR_size, equity x leverage_limit)</text>
  </g>
  <g filter="url(#psShadow)">
    <rect x="550" y="190" width="210" height="38" rx="8" fill="#16213E" stroke="#4ADE80" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="565" y="206" font-family="monospace" font-size="7" fill="#94A3B8">min(62.5K, $50K x 5):</text>
    <text x="565" y="222" font-family="monospace" font-size="11" fill="#4ADE80" font-weight="700">62,500 units</text>
  </g>

  <line x1="400" y1="234" x2="400" y2="248" stroke="#00D4FF" stroke-width="1" marker-end="url(#psArrow)" opacity="0.3"/>

  <!-- ===== LAYER 4: Kelly Confidence ===== -->
  <g filter="url(#psShadow)">
    <rect x="100" y="250" width="420" height="48" rx="10" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="124" cy="274" r="14" fill="#FF6B35" fill-opacity="0.1" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="124" y="278" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FF6B35" font-weight="700">4</text>
    <text x="155" y="269" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">Kelly Confidence (50-94%)</text>
    <text x="155" y="288" font-family="monospace" font-size="7" fill="#94A3B8">scaled_size = capped_size x kelly_fraction (from ML confidence)</text>
  </g>
  <g filter="url(#psShadow)">
    <rect x="550" y="254" width="210" height="38" rx="8" fill="#16213E" stroke="#FF6B35" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="565" y="270" font-family="monospace" font-size="7" fill="#94A3B8">62.5K x 0.78 (78% conf):</text>
    <text x="565" y="286" font-family="monospace" font-size="11" fill="#FF6B35" font-weight="700">48,750 units</text>
  </g>

  <line x1="400" y1="298" x2="400" y2="312" stroke="#00D4FF" stroke-width="1" marker-end="url(#psArrow)" opacity="0.3"/>

  <!-- ===== LAYER 5: IV Regime Adjustment ===== -->
  <g filter="url(#psShadow)">
    <rect x="100" y="314" width="420" height="48" rx="10" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="124" cy="338" r="14" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="124" y="342" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FBBF24" font-weight="700">5</text>
    <text x="155" y="333" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">IV Regime Adjustment (70-100%)</text>
    <text x="155" y="352" font-family="monospace" font-size="7" fill="#94A3B8">COMPLACENT=100% | FEARFUL=85% | PRICED=70% | SURPRISE=WS Filter</text>
  </g>
  <g filter="url(#psShadow)">
    <rect x="550" y="318" width="210" height="38" rx="8" fill="#16213E" stroke="#FBBF24" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="565" y="334" font-family="monospace" font-size="7" fill="#94A3B8">48.75K x 0.85 (FEARFUL):</text>
    <text x="565" y="350" font-family="monospace" font-size="11" fill="#FBBF24" font-weight="700">41,437 units</text>
  </g>

  <line x1="400" y1="362" x2="400" y2="376" stroke="#00D4FF" stroke-width="1" marker-end="url(#psArrow)" opacity="0.3"/>

  <!-- ===== LAYER 6: White Swan Filter ===== -->
  <g filter="url(#psShadow)">
    <rect x="100" y="378" width="420" height="48" rx="10" fill="#16213E" stroke="#F87171" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="124" cy="402" r="14" fill="#F87171" fill-opacity="0.1" stroke="#F87171" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="124" y="406" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#F87171" font-weight="700">6</text>
    <text x="155" y="397" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0" font-weight="700">White Swan Filter (PASS/REJECT)</text>
    <text x="155" y="416" font-family="monospace" font-size="7" fill="#94A3B8">binary gate: shock_detected ? REJECT (size=0) : PASS (unchanged)</text>
  </g>
  <g filter="url(#psShadow)">
    <rect x="550" y="382" width="210" height="38" rx="8" fill="#16213E" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="0.8"/>
    <text x="565" y="398" font-family="monospace" font-size="7" fill="#4ADE80">PASS - No shock detected:</text>
    <text x="565" y="414" font-family="monospace" font-size="11" fill="#4ADE80" font-weight="700">41,437 units</text>
  </g>

  <!-- Final output badge -->
  <g filter="url(#psGlow)">
    <rect x="550" y="428" width="210" height="18" rx="9" fill="#0A1628" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1"/>
    <text x="655" y="441" text-anchor="middle" font-family="monospace" font-size="8" fill="#00D4FF" font-weight="700">FINAL POSITION SIZE</text>
  </g>

  <!-- Cascade arrow on far left -->
  <g>
    <line x1="80" y1="75" x2="80" y2="410" stroke="#00D4FF" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="72" y="240" text-anchor="middle" font-family="monospace" font-size="7" fill="#00D4FF" opacity="0.3" transform="rotate(-90 72 240)">CASCADE FLOW</text>
  </g>

  <!-- Border -->
</svg>