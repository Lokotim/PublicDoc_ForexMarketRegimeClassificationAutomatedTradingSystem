<svg xmlns="http://www.w3.org/2000/svg" width="950" height="250" viewBox="0 0 950 250">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; }
      .year-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #667788; }
      .block-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #ffffff; }
      .block-sublabel { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #ffffff; opacity: 0.85; }
      .footer-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #00BCD4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="950" height="250" fill="#0f1923" rx="8"/>

  <!-- Title -->
  <text x="475" y="32" text-anchor="middle" class="title">THE SEVEN CRUCIBLES -- TIMELINE</text>

  <!-- Timeline horizontal line -->
  <line x1="60" y1="145" x2="900" y2="145" stroke="#445566" stroke-width="2"/>

  <!-- Year markers: 2007 to 2025, spaced across 60..900 = 840px for 18 years -->
  <!-- Each year = 840/18 = 46.67px. 2007=60, 2009=153.3, 2011=246.7, 2013=340, 2015=433.3, 2017=526.7, 2019=620, 2021=713.3, 2023=806.7, 2025=900 -->
  <line x1="60" y1="145" x2="60" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="60" y="170" text-anchor="middle" class="year-label">2007</text>

  <line x1="153" y1="145" x2="153" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="153" y="170" text-anchor="middle" class="year-label">2009</text>

  <line x1="247" y1="145" x2="247" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="247" y="170" text-anchor="middle" class="year-label">2011</text>

  <line x1="340" y1="145" x2="340" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="340" y="170" text-anchor="middle" class="year-label">2013</text>

  <line x1="433" y1="145" x2="433" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="433" y="170" text-anchor="middle" class="year-label">2015</text>

  <line x1="527" y1="145" x2="527" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="527" y="170" text-anchor="middle" class="year-label">2017</text>

  <line x1="620" y1="145" x2="620" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="620" y="170" text-anchor="middle" class="year-label">2019</text>

  <line x1="713" y1="145" x2="713" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="713" y="170" text-anchor="middle" class="year-label">2021</text>

  <line x1="807" y1="145" x2="807" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="807" y="170" text-anchor="middle" class="year-label">2023</text>

  <line x1="900" y1="145" x2="900" y2="155" stroke="#445566" stroke-width="1"/>
  <text x="900" y="170" text-anchor="middle" class="year-label">2025</text>

  <!-- OOS Blocks above the timeline -->
  <!-- Each year ~46.67px. 2007=60 baseline -->
  <!-- OOS1: 2007-2008 (cyan #00BCD4) x=60 w=93 -->
  <rect x="60" y="75" width="93" height="58" rx="5" fill="#00BCD4" opacity="0.85"/>
  <text x="106" y="100" text-anchor="middle" class="block-label">OOS1</text>
  <text x="106" y="115" text-anchor="middle" class="block-sublabel">Pre-GFC</text>

  <!-- OOS2: 2008-2009 (red #F44336) x=107 w=46 -->
  <rect x="107" y="75" width="93" height="58" rx="5" fill="#F44336" opacity="0.85"/>
  <text x="153" y="100" text-anchor="middle" class="block-label">OOS2</text>
  <text x="153" y="115" text-anchor="middle" class="block-sublabel">GFC</text>

  <!-- OOS3: 2011-2012 (orange #FF9800) x=247 w=93 -->
  <rect x="247" y="75" width="93" height="58" rx="5" fill="#FF9800" opacity="0.85"/>
  <text x="293" y="100" text-anchor="middle" class="block-label">OOS3</text>
  <text x="293" y="115" text-anchor="middle" class="block-sublabel">Euro</text>

  <!-- OOS4: 2015-2016 (purple #9C27B0) x=433 w=93 -->
  <rect x="433" y="75" width="93" height="58" rx="5" fill="#9C27B0" opacity="0.85"/>
  <text x="479" y="100" text-anchor="middle" class="block-label">OOS4</text>
  <text x="479" y="115" text-anchor="middle" class="block-sublabel">Brexit</text>

  <!-- OOS5: 2018 (green #4CAF50) x=573 w=47 -->
  <rect x="573" y="75" width="47" height="58" rx="5" fill="#4CAF50" opacity="0.85"/>
  <text x="596" y="100" text-anchor="middle" class="block-label">OOS5</text>
  <text x="596" y="115" text-anchor="middle" class="block-sublabel">Trade</text>

  <!-- OOS6: 2020-2021 (blue #2196F3) x=667 w=93 -->
  <rect x="667" y="75" width="93" height="58" rx="5" fill="#2196F3" opacity="0.85"/>
  <text x="713" y="100" text-anchor="middle" class="block-label">OOS6</text>
  <text x="713" y="115" text-anchor="middle" class="block-sublabel">COVID</text>

  <!-- OOS7: 2022-2023 (yellow #FFC107, wider block) x=760 w=93 -->
  <rect x="760" y="75" width="93" height="58" rx="5" fill="#FFC107" opacity="0.85"/>
  <text x="807" y="100" text-anchor="middle" class="block-label" fill="#1a1a2e">OOS7</text>
  <text x="807" y="115" text-anchor="middle" class="block-sublabel" fill="#1a1a2e">Inflation</text>

  <!-- Footer -->
  <text x="475" y="210" text-anchor="middle" class="footer-text">Total OOS: 33% of data reserved across 7 distinct market regimes</text>
</svg>